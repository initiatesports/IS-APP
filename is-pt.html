<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IS 私人訓練 · Personal Training</title>

<link rel="manifest" href="is-pt.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IS 私訓">
<link rel="apple-touch-icon" href="img/is-mark-512.png">
<link rel="icon" href="img/is-mark-96.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#0f1a28; --panel:#16243a; --panel2:#1c2e48; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --text:#eaf1f8; --mut:#8fa3bb; --teal:#3ecfcf; --teal2:#24a9ad; --gold:#c9a15c; --red:#ff7a7a; --green:#5fd39a;
  --r:16px; --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans HK',-apple-system,BlinkMacSystemFont,sans-serif;font-size:15px;line-height:1.55}
body{min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.num{font-family:'Archivo','Noto Sans HK',sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(96px + var(--safe-b))}
/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(15,26,40,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-family:'Archivo',sans-serif;font-weight:900;letter-spacing:.06em;font-size:14px}
.brand img{width:26px;height:26px;border-radius:7px}
.brand .tag{display:inline-block;transform:skewX(-6deg);background:var(--teal);color:#062426;padding:1px 7px;font-size:11px;letter-spacing:.08em}
.top .sp{flex:1}
.pill{border:1px solid var(--line2);background:transparent;border-radius:999px;padding:5px 11px;font-size:12px;color:var(--mut);min-height:36px;min-width:36px}
.pill.on{background:var(--teal);border-color:var(--teal);color:#062426;font-weight:700}
/* cards */
.h1{font-size:22px;font-weight:900;margin:18px 2px 4px;letter-spacing:.01em}
.sub{color:var(--mut);font-size:13px;margin:0 2px 14px}
.sec{font-size:13px;font-weight:700;color:var(--mut);letter-spacing:.08em;margin:22px 2px 10px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.sec::before{content:"";width:10px;height:3px;background:var(--teal);transform:skewX(-20deg)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.tap{cursor:pointer;transition:transform .12s,border-color .12s}
.card.tap:active{transform:scale(.985)}
.card.tap:hover{border-color:var(--line2)}
.row{display:flex;align-items:center;gap:10px}
.row .sp{flex:1}
.muted{color:var(--mut)}
.small{font-size:12.5px}
.big{font-size:34px;font-weight:900;line-height:1}
.hero{background:linear-gradient(135deg,#17344a 0%,#123047 45%,#0f2436 100%);border:1px solid rgba(62,207,207,.25);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-30px;width:160px;height:160px;background:radial-gradient(circle,rgba(62,207,207,.18),transparent 70%)}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--teal2),var(--teal));border-radius:99px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:22px;font-weight:900}
.stat span{font-size:12px;color:var(--mut)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(62,207,207,.14);color:var(--teal)}
.badge.gold{background:rgba(201,161,92,.18);color:var(--gold)}
.badge.red{background:rgba(255,122,122,.15);color:var(--red)}
.badge.grey{background:rgba(255,255,255,.07);color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:12px;padding:12px 16px;font-weight:800;background:var(--teal);color:#062426}
.btn.skew{transform:skewX(-6deg);border-radius:6px}
.btn.skew>span{display:inline-block;transform:skewX(6deg)}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--text)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.lnk{background:none;border:none;color:var(--teal);font-weight:700;padding:0;font-size:13px}
input.in,select.in,textarea.in{width:100%;background:#0c1622;border:1px solid var(--line2);border-radius:11px;padding:11px 12px;outline:none;transition:border-color .15s;font-size:16px}   /* <16px iPhone 會自動放大 */
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--teal)}
label.lb{display:block;font-size:12px;color:var(--mut);margin:0 0 5px 2px}
.empty{text-align:center;color:var(--mut);padding:30px 16px;font-size:14px}
.empty .ic{font-size:34px;margin-bottom:6px;opacity:.8}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(13,22,34,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b))}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.nav button{background:none;border:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:700}
.nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--teal)}
/* sets table */
.exb{padding:14px 0;border-top:1px solid var(--line)}
.exb:first-child{border-top:none;padding-top:4px}
.exname{font-weight:800;font-size:15.5px;background:none;border:none;padding:0;text-align:left;color:var(--text)}
.exname:after{content:" ›";color:var(--teal)}
.sets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.set{background:#0c1622;border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:13px;min-width:74px}
.set .k{font-weight:800;font-size:15px}
.set.pr{border-color:rgba(201,161,92,.6);background:rgba(201,161,92,.08)}
.set .n{font-size:11.5px;color:var(--mut);display:block}
.xbtn{background:none;border:none;color:var(--mut);font-size:16px;padding:10px;margin:-6px -6px -6px 0;min-width:40px;min-height:40px}
/* homework */
.hwi{padding:12px 0;border-top:1px solid var(--line)}
.hwi:first-of-type{border-top:none}
.days{display:flex;gap:6px;margin-top:9px}
.day{flex:1;min-width:0;border:1px solid var(--line2);background:transparent;border-radius:10px;padding:5px 0 4px;display:flex;flex-direction:column;align-items:center;font-size:10.5px;color:var(--mut)}
.day b{font-size:13px;font-family:'Archivo',sans-serif;color:var(--text)}
.day.done{background:var(--teal);border-color:var(--teal);color:#063033}
.day.done b{color:#062426}
.day.today{box-shadow:0 0 0 2px rgba(62,207,207,.45)}
.day:disabled{opacity:.35}
/* thread */
.thread{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line2)}
.msg{display:flex;margin:6px 0}
.msg .bub{max-width:82%;padding:8px 11px;border-radius:14px;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.msg.me{justify-content:flex-end}
.msg.me .bub{background:rgba(62,207,207,.16);border-bottom-right-radius:4px}
.msg.co .bub{background:var(--panel2);border-bottom-left-radius:4px}
.msg .who{display:block;font-size:10.5px;color:var(--mut);margin-bottom:2px}
.tin{display:flex;gap:8px;margin-top:8px}
.tin input{flex:1}
/* chips */
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line2);background:transparent;border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--mut);white-space:nowrap}
.chip.on{background:var(--teal);border-color:var(--teal);color:#062426;font-weight:800}
/* list rows */
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:none}
.li .d{width:46px;text-align:center;flex:none}
.li .d b{display:block;font-size:19px;font-weight:900;font-family:'Archivo',sans-serif;line-height:1.1}
.li .d span{font-size:10.5px;color:var(--mut)}
/* modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(3,8,14,.66);display:flex;align-items:flex-end;justify-content:center;animation:fi .15s}
.sheet{background:var(--panel);width:100%;max-width:560px;max-height:88vh;max-height:88dvh;overscroll-behavior:contain;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + var(--safe-b));border:1px solid var(--line2);animation:su .2s}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line2);margin:0 auto 12px}
@keyframes fi{from{opacity:0}}
@keyframes su{from{transform:translateY(30px);opacity:.4}}
.toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translateX(-50%);background:#e9f7f7;color:#082628;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:88vw;text-align:center}
/* login */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 22px;max-width:420px;margin:0 auto}
.login .logo{width:62px;height:62px;border-radius:16px;margin-bottom:16px}
.login h1{font-size:28px;font-weight:900;margin:0;line-height:1.2}
.login h1 em{font-style:normal;color:var(--teal)}
.login .en{font-family:'Archivo',sans-serif;font-weight:800;letter-spacing:.14em;font-size:12px;color:var(--gold);margin:6px 0 26px}
.fld{margin-bottom:14px}
.spin{width:22px;height:22px;border:3px solid rgba(62,207,207,.25);border-top-color:var(--teal);border-radius:50%;animation:sp .8s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{height:92px;border-radius:var(--r);background:linear-gradient(90deg,var(--panel) 0%,var(--panel2) 50%,var(--panel) 100%);background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:12px}
@keyframes sk{to{background-position:-200% 0}}
.chart{width:100%;height:auto;display:block}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:none;color:var(--teal);font-weight:700;padding:14px 0 0;font-size:14px}
</style>

const pad = n => ('0'+n).slice(-2);
function isoToday(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseISO(s){ const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m?new Date(+m[1],+m[2]-1,+m[3]):null; }
function isoOf(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function addDays(s,n){ const d=parseISO(s); d.setDate(d.getDate()+n); return isoOf(d); }
function fmtD(s){ const d=parseISO(s); return d?pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear():esc(s||''); }   // 日/月/年
function fmtDM(s){ const d=parseISO(s); return d?pad(d.getDate())+'/'+pad(d.getMonth()+1):''; }
function wkName(s){ const d=parseISO(s); return d?t('wk')[d.getDay()]:''; }
function fmtN(v){ const n=Number(v); if(!isFinite(n)) return ''; return (Math.round(n*10)/10).toString(); }
function toast(msg){ const el=document.createElement('div'); el.className='toast'; el.textContent=msg; document.body.appendChild(el); setTimeout(()=>el.remove(),2600); }

/* ───────── API（POST text/plain 免 CORS 預檢；個資唔入網址）─────────
   讀取：任何失敗都重試；寫入：回應唔係 JSON 先重試，並帶 rid（後端同一 rid 只執行一次——實測 POST 可能已執行但回應甩咗）。 */
let AUTH = lsGet('ispt_auth');
async function api(action, p, write){
  const body = Object.assign({action}, p||{});
  if(AUTH){ body.name = AUTH.name; body.code = AUTH.code; }
  if(write) body.rid = Date.now().toString(36)+Math.random().toString(36).slice(2,10);   // 冪等：重試沿用同一 rid，後端唔會重複寫
  const tries = write ? 5 : 3;
  for(let i=0;i<tries;i++){
    let txt = null;
    try{
      const c=new AbortController(), tm=setTimeout(()=>c.abort(), write?45000:40000);
      const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),signal:c.signal});
      clearTimeout(tm); txt = await r.text();
      if(txt.charAt(0)==='{'){ const j=JSON.parse(txt); if(write && j.pending){ await new Promise(r=>setTimeout(r,3000)); continue; }
        if(j.err==='unknown action'){ await new Promise(r=>setTimeout(r,1500)); continue; }   // 慢請求（>30 秒）連線斷咗、瀏覽器改用冇參數 GET 再送 → 當網絡問題重試（2026-09-30 正式環境實測）
        if(j.err) j.errZh=j.err, j.err=errT(j.err);   // 英文模式翻譯後端錯誤（程式判斷用 errZh）
        return j; }
    }catch(e){}
    // 寫入斷線：可能已經執行咗 → 用同一個 rid 再送（後端見到同一 rid 會回第一次嘅結果／話仲處理緊），唔會重複寫
    await new Promise(r=>setTimeout(r, 1000*(i+1)+(write?2000:0)));
  }
  return {ok:false, err:t('net'), unsure:!!write};
}

let D = null;                      // apiMe 回應
const S = { tab:'home', ses:null, bodyMetric:'weight', exCat:'', exQ:'', bodyForm:false, hwNote:null, dDate:'' };
const EXM = () => { const m={}; (D&&D.exercises||[]).forEach(e=>m[e.id]=e); return m; };
function exName(id){ const e=EXM()[id]; if(!e) return '—'; return LANG==='en' ? (e.en||e.zh) : e.zh; }
function exSub(id){ const e=EXM()[id]; if(!e) return ''; return LANG==='en' ? e.zh : (e.en||''); }
function mySets(s){ return (s.sets||[]).filter(x=>!x.acct || x.acct===D.me.id); }
/* 破紀錄組（同後端 prsFor_ 一致，運動科學團隊 2026-09-30）：每堂每個動作只取最好一組，同「之前幾堂」比；
   負重（有 kg＋次數）比重量再比次數；自重（冇 kg 有次數）比次數；計時（冇 kg 有秒）比秒數；第一次做唔算 */
function setKind(x){ const kg=Number(x.kg)||0, r=Number(x.reps)||0, sec=Number(x.sec)||0; return kg>0&&r>0?'w':(kg<=0&&r>0&&!sec?'bw':(kg<=0&&sec>0?'t':'')); }
function setBetter(k,a,b){ if(!b) return true; if(k==='w') return a.kg>b.kg||(a.kg===b.kg&&a.reps>b.reps); if(k==='bw') return a.reps>b.reps; return a.sec>b.sec; }
function prSets(){ const best={}, hit=new WeakSet();
  (D.sessions||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).forEach(s=>{ const top={};
    mySets(s).forEach(x=>{ const k=setKind(x); if(!k) return; const v={kg:Number(x.kg)||0, reps:Number(x.reps)||0, sec:Number(x.sec)||0, x}; const key=x.ex+'|'+k; if(setBetter(k,v,top[key])) top[key]=Object.assign({k},v); });
    Object.keys(top).forEach(key=>{ const tp=top[key], b=best[key]; if(!b){ best[key]=tp; return; } if(setBetter(tp.k,tp,b)){ best[key]=tp; hit.add(tp.x); } }); });
  return hit; }
function prTxt(b){ return b.kind==='bw' ? `${b.reps} ${LANG==='en'?'reps':'下'}` : b.kind==='t' ? `${fmtN(b.sec)} ${LANG==='en'?'s':'秒'}` : `${fmtN(b.kg)} kg × ${b.reps}`; }
function groupSets(sets){ const out=[], idx={}; sets.forEach(x=>{ const k=x.order+'|'+x.ex; if(idx[k]==null){ idx[k]=out.length; out.push({ex:x.ex, sets:[]}); } out[idx[k]].sets.push(x); }); return out; }
function volOf(sets){ return sets.reduce((a,x)=>a+(Number(x.kg)||0)*(Number(x.reps)||0),0); }

async function boot(){
  document.documentElement.lang = LANG==='en'?'en':'zh-HK';
  checkVersion();
  if(!AUTH){ renderLogin(); return; }
  const cached = lsGet('ispt_cache');
  if(cached && cached.me){ D = cached; render(); }
  else renderShell(true);
  await refresh(!cached);
  if(AUTH){ loadPlan(); loadDiet(); }
}
async function refresh(showErr){
  const r = await api('me');
  if(r.ok){ D = r; S.meErr=''; lsSet('ispt_cache', r); render(); return true; }
  if(/試太多/.test(r.errZh||r.err||'')){ if(!D) renderLogin(r.err); else toast(r.err); return false; }
  if(/唔啱/.test(r.errZh||r.err||'')){ AUTH=null; lsDel('ispt_auth'); lsDel('ispt_cache'); lsDel('ispt_diet'); lsDel('ispt_plan'); D=null; DT=null; PL=null; renderLogin(r.err); return false; }
  if(!D){ S.meErr=r.err||t('net'); render();   // 首次載入失敗：固定顯示重試（背景飲食／預約載完唔會蓋過），8 秒後自動再試一次
    if(!S.meRetried){ S.meRetried=true; setTimeout(()=>{ if(!D) refresh(false); }, 8000); } }
  else if(showErr) toast(r.err||t('net'));
  return false;
}
async function checkVersion(){
  try{
    const r = await fetch(location.pathname+'?_ck='+Date.now(), {cache:'no-store'}); if(!r.ok) return;
    const m = (await r.text()).match(/FRONTEND_VERSION\s*=\s*'([^']+)'/);
    if(m && m[1]!==FRONTEND_VERSION){
      let tried=null; try{ tried=sessionStorage.getItem('ispt_upd'); }catch(e){}
      if(tried===m[1]) return;
      try{ sessionStorage.setItem('ispt_upd', m[1]); }catch(e){}
      toast(t('newVer')); setTimeout(()=>location.replace(location.pathname+'?v='+encodeURIComponent(m[1])), 900);
    }
  }catch(e){}
}

function pkgSummary(){
  const pt=D.pt||{}; if(!pt.ok) return {err:true};
  const pk=(pt.packages||[]).filter(p=>!p.free || Number(p.remaining)>0);
  const active=pk.filter(p=>Number(p.remaining)>0 && !(Number(p.daysToExp)<0));
  if(!pk.length) return {none:true};
  const cur = active[0] || pk[pk.length-1];
  const totalLeft = active.reduce((a,p)=>a+Number(p.remaining||0),0);
  return {cur, totalLeft, active};
}
function vPkgCard(){
  const s=pkgSummary();
  if(s.err) return `<div class="card"><div class="muted small">${t('ptErr')}</div></div>`;
  if(s.none) return `<div class="card"><div class="muted small">${t('noPkg')}</div></div>`;
  const p=s.cur, used=Number(p.used)||0, tot=Number(p.sessions)||0, left=Number(p.remaining)||0, dte=Number(p.daysToExp);
  const exp = p.expiry ? `${t('expire')} ${fmtD(p.expiry)}` : '';

function hwProgress(h){ const days=Array.from({length:7},(_,i)=>addDays(h.week,i)); let done=0; const total=(h.items||[]).length||1;
  (h.items||[]).forEach((it,i)=>{ if((h.logs||[]).some(l=>l.idx===i && l.done && days.includes(l.date))) done++; });
  if(!(h.items||[]).length) done=(h.logs||[]).some(l=>l.done)?1:0;
  return {done, total}; }

async function hwTick(hwId, idx, date, done){
  const hw=(D.homework||[]).find(h=>h.id===hwId); if(!hw) return;
  // 樂觀更新
  const old=(hw.logs||[]).find(l=>l.idx===idx && l.date===date);

  render();
  const r=await api('hwLog',{hwId, idx, date, done:done?'1':'0', note:old?old.note:''}, true);
  if(!r.ok){ toast(r.err||t('net')); if(old) old.done=!done; else hw.logs.pop(); render(); return; }
  lsSet('ispt_cache', D);
}

  const hw=(D.homework||[]).find(h=>h.id===hwId); const el=document.getElementById('hwn-'+hwId+'_'+idx); const note=(el.value||'').trim();

  if(!r.ok){ el.disabled=false; toast(r.err||t('net')); return; }
  const old=(hw.logs||[]).find(l=>l.idx===idx && l.date===date);
  if(old){ old.done=true; old.note=note; old.at=new Date().toISOString(); } else (hw.logs=hw.logs||[]).push({acct:D.me.id, idx, date, done:true, note, at:new Date().toISOString()});
  S.hwNote=null; lsSet('ispt_cache', D); toast(t('saved')); render();
}

const METRICS = [['weight','unitKg'],['fat','unitPct'],['muscle','unitKg'],['waist','unitCm'],['hip','unitCm'],['chest','unitCm'],['arm','unitCm'],['thigh','unitCm']];
function chartSVG(pts, unit){
  if(pts.length<2) return `<div class="small muted" style="padding:18px 0;text-align:center">${pts.length?`${fmtN(pts[0].v)} ${unit} · ${fmtD(pts[0].d)}`:'—'}</div>`;
  const W=340,H=170,L=34,R=12,T=16,B=26;
  const vs=pts.map(p=>p.v), mn=Math.min(...vs), mx=Math.max(...vs), pad=(mx-mn)*0.15||1, lo=mn-pad, hi=mx+pad;
  const t0=parseISO(pts[0].d).getTime(), t1=parseISO(pts[pts.length-1].d).getTime(), span=(t1-t0)||1;
  const X=p=>L+(parseISO(p.d).getTime()-t0)/span*(W-L-R), Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const path=pts.map((p,i)=>(i?'L':'M')+X(p).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  const area=path+` L${X(pts[pts.length-1]).toFixed(1)} ${H-B} L${X(pts[0]).toFixed(1)} ${H-B} Z`;
  const ticks=[hi-pad, (hi+lo)/2, lo+pad];
  const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">
    <defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#3ecfcf" stop-opacity=".35"/><stop offset="1" stop-color="#3ecfcf" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="rgba(255,255,255,.07)"/><text x="${L-6}" y="${(Y(v)+4).toFixed(1)}" fill="#8fa3bb" font-size="10" text-anchor="end" font-family="Archivo">${fmtN(v)}</text>`).join('')}
    <path d="${area}" fill="url(#ga)"/><path d="${path}" fill="none" stroke="#3ecfcf" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>

function ring(val, tgt, size){

/* 相片：客戶端壓縮（最長邊 1080px JPEG），存私密 Drive；縮圖經 route 讀 */
async function loadPhotos(){
  for(const el of document.querySelectorAll('img[data-ph]')){
    const id=el.dataset.ph; if(PH[id]){ el.src=PH[id]; continue; } if(PH['_'+id]) continue; PH['_'+id]=1;
    const r=await api('photo',{id}); delete PH['_'+id];
    if(r.ok){ PH[id]=r.data; document.querySelectorAll(`img[data-ph="${id}"]`).forEach(x=>x.src=r.data); }
  }
}
function viewPhoto(id){ if(!PH[id]) return; const ov=document.createElement('div'); ov.className='ov'; ov.style.alignItems='center'; ov.onclick=()=>ov.remove();
  ov.innerHTML=`<img src="${PH[id]}" style="max-width:96vw;max-height:88vh;border-radius:14px" alt="">`; document.body.appendChild(ov); }
function compressImg(file){ return new Promise((res,rej)=>{ const url=URL.createObjectURL(file), img=new Image();
  img.onload=()=>{ const M=1080, k=Math.min(1, M/Math.max(img.width,img.height)), c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); let q=.72, d=c.toDataURL('image/jpeg',q); while(d.length>600000 && q>.35){ q-=.12; d=c.toDataURL('image/jpeg',q); } res(d); };
  img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('img')); }; img.src=url; }); }
function pickPhoto(meal){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';   // 唔加 capture：iPhone 可以揀「相片圖庫」或即影
  inp.onchange=async()=>{ const f=inp.files&&inp.files[0]; if(!f) return; let data; try{ data=await compressImg(f); }catch(e){ toast(t('photoErr')); return; }
    const ov=sheet(`<div class="row"><b style="font-size:18px">📷 ${mealName(meal)} · ${fmtD(S.dDate)}</b><span class="sp"></span><button class="pill" data-x>✕</button></div>
      <img src="${data}" style="width:100%;border-radius:14px;margin:12px 0;max-height:46vh;object-fit:contain;background:#0c1622" alt="">
      <input class="in" id="ph-note" maxlength="200" placeholder="${t('photoNote')}"><button class="btn skew block" style="margin-top:12px" id="ph-go"><span>${t('upload')}</span></button>`);
    ov.querySelector('#ph-go').onclick=async()=>{ const b=ov.querySelector('#ph-go'); b.disabled=true; b.innerHTML=`<span>${t('uploading')}</span>`;
      const r=await api('mealPhoto',{date:S.dDate, meal, data, note:ov.querySelector('#ph-note').value.trim()}, true);
      if(!r.ok){ b.disabled=false; b.innerHTML=`<span>${t('upload')}</span>`; toast(r.err||t('net')); return; }
      PH[r.entry.id]=data; ov.remove(); toast(t('saved')); addEntry(r.entry); };
  };
  inp.click();

function sheet(inner){ const ov=document.createElement('div'); ov.className='ov'; ov.onclick=e=>{ if(e.target===ov) ov.remove(); };

/* 條碼：有 BarcodeDetector（Android Chrome）就用原生，否則（iPhone Safari）載 ZXing；兩者都唔得就手動輸入 */
function loadScript(src){ return new Promise((res,rej)=>{ if(document.querySelector(`script[src="${src}"]`) && window.ZXing) return res(); const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
function scanBarcode(onCode){
  const ov=sheet(`<div class="row"><b style="font-size:18px">▥ ${t('scan')}</b><span class="sp"></span><button class="pill" id="sc-x">✕</button></div>
    <div style="position:relative;margin:12px 0;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:4/3"><video id="sc-v" playsinline muted autoplay style="width:100%;height:100%;object-fit:cover"></video>
      <div style="position:absolute;left:10%;right:10%;top:50%;height:2px;background:var(--teal);box-shadow:0 0 12px var(--teal)"></div></div>
    <div class="small muted" id="sc-msg">${t('scanHint')}</div>
    <div class="tin"><input class="in num" id="sc-code" inputmode="numeric" maxlength="14" placeholder="${t('typeCode')}"><button class="btn sm" id="sc-go">${t('find')}</button></div>`);
  let stream=null, stopped=false, zx=null;
  const stop=()=>{ stopped=true; try{ zx&&zx.reset(); }catch(e){} if(stream) stream.getTracks().forEach(x=>x.stop()); };
  const close=()=>{ stop(); ov.remove(); };
  const done=code=>{ if(stopped) return; code=String(code||'').replace(/\D/g,''); if(code.length<6) return; if(navigator.vibrate) navigator.vibrate(60); close(); onCode(code); };
  ov.querySelector('#sc-x').onclick=close; ov.onclick=e=>{ if(e.target===ov) close(); };
  ov.querySelector('#sc-go').onclick=()=>done(ov.querySelector('#sc-code').value);
  const video=ov.querySelector('#sc-v'), msg=ov.querySelector('#sc-msg');
  (async()=>{
    try{
      if('BarcodeDetector' in window){
        const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});
        stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false}); if(stopped){ stop(); return; }
        video.srcObject=stream; await video.play();
        const tick=async()=>{ if(stopped) return; try{ const r=await det.detect(video); if(r&&r[0]) return done(r[0].rawValue); }catch(e){} setTimeout(tick, 220); }; tick();
      } else {
        await loadScript(ZXING_URL); if(stopped) return;
        const hints=new Map(); hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E, ZXing.BarcodeFormat.CODE_128]);
        zx=new ZXing.BrowserMultiFormatReader(hints, 250);
        await zx.decodeFromConstraints({video:{facingMode:'environment'}, audio:false}, video, res=>{ if(res) done(res.getText()); });
      }
    }catch(e){ msg.textContent=t('camErr'); msg.style.color='var(--gold)'; }

function renderLib(){
  const exs=D.exercises||[], q=S.exQ.trim().toLowerCase();
  const shown=exs.filter(e=>(!S.exCat||e.cat===S.exCat) && (!q || (e.zh+' '+e.en+' '+e.cat+' '+e.eq).toLowerCase().includes(q)));
  $('#exlist').innerHTML=libRows(shown);
  document.querySelectorAll('.chips .chip').forEach(c=>{ const cat=c.getAttribute('onclick').match(/S\.exCat='([^']*)'/); if(cat) c.classList.toggle('on', cat[1]===S.exCat); });
}
async function setPin(){
  const v=$('#newpin').value.replace(/\D/g,''); if(v.length!==4){ toast(LANG==='en'?'Enter 4 digits':'請輸入 4 位數字'); return; }
  const r=await api('setPin',{newPin:v}, true);
  if(!r.ok){ toast(r.err||t('net')); return; }
  AUTH.code=v; lsSet('ispt_auth', AUTH); $('#newpin').value=''; toast(t('pinOk'));
}

/* ───────── 動作詳情 ───────── */
function showEx(id){
  const e=EXM()[id]; if(!e) return;
  const best=(D.prs&&D.prs.best||[]).filter(b=>b.ex===id).sort((a,b)=>(a.kind==='w'?0:1)-(b.kind==='w'?0:1))[0];
  const hist=[]; (D.sessions||[]).forEach(s=>{ const xs=mySets(s).filter(x=>x.ex===id); if(xs.length){ const top=xs.reduce((a,x)=>(Number(x.kg)||0)>(Number(a.kg)||0)?x:a, xs[0]); hist.push({d:s.date, n:xs.length, kg:top.kg, reps:top.reps}); } });
  const cue = LANG==='en' ? (e.cueEn||e.cue) : e.cue;
  const ov=document.createElement('div'); ov.className='ov'; ov.onclick=ev=>{ if(ev.target===ov) ov.remove(); };
  const pts=hist.filter(x=>Number(x.kg)>0).map(x=>({d:x.d, v:Number(x.kg)})).reverse();
  ov.innerHTML=`<div class="sheet"><div class="grab"></div>
    <div class="row"><div><div style="font-weight:900;font-size:20px">${esc(LANG==='en'?(e.en||e.zh):e.zh)}</div><div class="small muted">${esc(LANG==='en'?e.zh:(e.en||''))}</div></div><span class="sp"></span><button class="pill" onclick="this.closest('.ov').remove()">✕</button></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin:10px 0">${e.cat?`<span class="badge">${esc(e.cat)}</span>`:''}${e.eq?`<span class="badge grey">${t('equip')}：${esc(e.eq)}</span>`:''}</div>
    ${cue?`<div class="card" style="background:var(--panel2);margin:10px 0"><div class="small muted" style="margin-bottom:4px">${t('cue')}</div><div>${esc(cue)}</div></div>`:''}
    ${e.video?`<a class="btn skew block" style="text-decoration:none;margin:6px 0 4px" href="${esc(e.video)}" target="_blank" rel="noopener"><span>▶ ${t('video')}</span></a>`:''}
    ${best?`<div class="sec">🏆 ${t('yourBest')}</div><div class="card"><span class="big num" style="font-size:26px">${prTxt(best)}</span><div class="small muted">${fmtD(best.date)}${best.e1rm?` · ${t('e1rm')} ${fmtN(best.e1rm)} kg`:''}</div></div>`:''}
    ${pts.length>1?`<div class="card">${chartSVG(pts,'kg')}</div>`:''}
    ${hist.length?`<div class="sec">${t('yourHist')}</div><div class="card">${hist.slice(0,12).map(x=>`<div class="li"><div style="flex:1">${fmtD(x.d)}</div><div class="num small">${x.n} ${t('sets')}${Number(x.kg)>0?` · ${fmtN(x.kg)} kg × ${esc(x.reps)}`:''}</div></div>`).join('')}</div>`:''}
  </div>`;
  document.body.appendChild(ov);
}

boot();
</script>
