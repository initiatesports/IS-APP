<!doctype html><html lang="zh-HK"><head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>特別活動報名 · INITIATE SPORTS</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="robots" content="noindex">
<style>
:root{
  --bg:#eef2f4; --card:#ffffff; --navy:#223a4d; --navy2:#2c4a60;
  --teal:#1bafbd; --teal-d:#0f8996; --teal-w:rgba(27,175,189,.10);
  --gold:#c79a3e; --ink:#16242f; --ink2:#3f4d55; --mut:#6b7b86;
  --line:#e2e8ec; --line2:#eef2f4; --err:#d9534f; --ok:#2e9e6b;
  --r:16px; --sh:0 10px 30px rgba(20,36,47,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0f1720; --card:#18222e; --navy:#7fd3dd; --navy2:#9fdfe7;
  --teal:#2fb9c9; --teal-d:#48c7d6; --teal-w:rgba(47,185,201,.14);
  --gold:#e6b84c; --ink:#eef3f8; --ink2:#c3d0da; --mut:#8ca0b0;
  --line:#2a3a4d; --line2:#233140; --sh:0 10px 30px rgba(0,0,0,.4);
}}
:root[data-theme=dark]{
  --bg:#0f1720; --card:#18222e; --navy:#7fd3dd; --navy2:#9fdfe7;
  --teal:#2fb9c9; --teal-d:#48c7d6; --teal-w:rgba(47,185,201,.14);
  --gold:#e6b84c; --ink:#eef3f8; --ink2:#c3d0da; --mut:#8ca0b0;
  --line:#2a3a4d; --line2:#233140; --sh:0 10px 30px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang HK","Noto Sans HK","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 60px}
.pvbanner{background:#fff7ed;border:1px solid #fb923c;color:#9a3412;font-size:12.5px;font-weight:700;padding:9px 14px;border-radius:11px;margin-bottom:14px;line-height:1.6}
.pvskip{display:block;width:100%;margin-top:10px;background:none;border:1.5px dashed var(--gold);color:var(--gold);border-radius:11px;padding:11px;font-size:13px;font-weight:800;font-family:inherit;cursor:pointer}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));border-radius:var(--r);padding:26px 22px;color:#fff;text-align:center;box-shadow:var(--sh)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .hero{background:linear-gradient(135deg,#14303c,#1b3f4e);color:#eaf6f8}}
:root[data-theme=dark] .hero{background:linear-gradient(135deg,#14303c,#1b3f4e);color:#eaf6f8}
.hero .yr{letter-spacing:.3em;font-size:11px;font-weight:700;opacity:.8}
.hero h1{margin:8px 0 6px;font-size:24px;font-weight:900;letter-spacing:.02em}
.hero p{margin:0;font-size:13.5px;opacity:.92;line-height:1.7}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:14px;box-shadow:var(--sh)}
.card h2{margin:0 0 4px;font-size:16px;font-weight:900;color:var(--navy);display:flex;align-items:center;gap:8px}
.card .sub{color:var(--mut);font-size:12.5px;margin:0 0 14px}
.sec{font-size:12px;font-weight:800;color:var(--teal-d);letter-spacing:.05em;margin:18px 0 8px}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:5px}
.req{color:var(--err);margin-left:2px}
input,select{width:100%;background:var(--bg);border:1.5px solid var(--line);color:var(--ink);border-radius:11px;padding:12px 13px;font-size:16px;font-family:inherit;outline:none;transition:.12s}
input:focus,select:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-w)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.seg{display:flex;gap:8px}.seg label{flex:1;margin:0}.seg input{display:none}
.seg span{display:block;text-align:center;padding:11px;border:1.5px solid var(--line);border-radius:11px;font-size:14px;font-weight:700;color:var(--mut);cursor:pointer;background:var(--bg)}
.seg input:checked+span{border-color:var(--teal);background:var(--teal-w);color:var(--teal-d)}
.chk{display:flex;align-items:flex-start;gap:9px;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;background:var(--bg);margin-bottom:7px}
.chk input{width:18px;height:18px;flex:none;accent-color:var(--teal-d);margin-top:1px}
.chk.on{border-color:var(--teal);background:var(--teal-w);color:var(--teal-d)}
.chk span{flex:1}
.terms{max-height:160px;overflow:auto;border:1px solid var(--line);border-radius:11px;padding:10px 13px;background:var(--bg);font-size:12.5px;color:var(--ink2);margin-bottom:8px}
.terms p{margin:0 0 7px}
.btn{width:100%;border:none;border-radius:13px;padding:15px;font-size:16px;font-weight:900;font-family:inherit;cursor:pointer;background:linear-gradient(120deg,var(--teal),var(--teal-d));color:#04252a;box-shadow:0 6px 18px rgba(27,175,189,.35)}
.btn:active{transform:scale(.99)}
.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink2);box-shadow:none;font-weight:700}
.hint{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.6}
.err{color:var(--err);font-size:12.5px;margin-top:6px;min-height:14px;font-weight:600}
.feebox{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:14px;padding:18px 20px;text-align:center}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .feebox{background:linear-gradient(135deg,#14303c,#1b3f4e)}}
:root[data-theme=dark] .feebox{background:linear-gradient(135deg,#14303c,#1b3f4e)}
.feebox .amt{font-size:40px;font-weight:900;letter-spacing:-1px;line-height:1.1}
.feebox .lbl{font-size:12.5px;opacity:.85;margin-top:4px}
.pay-opt{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;background:var(--bg)}
.pay-opt b{color:var(--navy);font-size:14px}
.copy{padding:3px 9px;font-size:12px;font-weight:800;border:1px solid var(--teal);color:var(--teal-d);background:none;border-radius:8px;cursor:pointer;font-family:inherit}
.up{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--mut);font-size:13px;background:var(--bg);cursor:pointer;margin-top:6px}
.done{text-align:center;padding:8px 4px}
.done .tick{width:70px;height:70px;border-radius:50%;background:var(--teal-w);color:var(--teal-d);font-size:38px;display:grid;place-items:center;margin:6px auto 14px}
.sumrow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.sumrow .k{color:var(--mut);flex:none}.sumrow .v{font-weight:700;text-align:right}
.foot{text-align:center;color:var(--mut);font-size:11.5px;margin-top:20px;line-height:1.7}
.steps{display:flex;gap:6px;justify-content:center;margin:2px 0 4px}
.steps i{width:22px;height:4px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--teal)}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.pp{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--bg)}
.pp .hd{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13.5px;color:var(--navy);margin-bottom:8px}
.pp .rm{border:none;background:none;color:var(--err);font-weight:800;font-size:13px;cursor:pointer;font-family:inherit}
.left{display:inline-block;background:var(--teal-w);color:var(--teal-d);font-weight:800;border-radius:999px;padding:4px 12px;font-size:13px;margin-top:10px}
.left.full{background:rgba(217,83,79,.12);color:var(--err)}
.info{text-align:left;margin-top:14px;font-size:13.5px}
.info div{display:flex;gap:10px;padding:7px 0;border-top:1px solid rgba(255,255,255,.18)}
.info b{flex:none;width:52px;opacity:.85;font-weight:700}
</style><script src="is-loading.js?v=1"></script>
</head><body>
<div class="wrap">
  <div id="app"><div class="card"><div class="hint">載入中…</div></div></div>
  <div class="foot">INITIATE SPORTS · 特別活動報名<br>查詢 WhatsApp 6331 7403　·　<span id="ver"></span></div>
</div>
<script>
const FRONTEND_VERSION='event-2026-10-15b';
const API='https://script.google.com/macros/s/AKfycbyjbxx2aH8g94W6ChIbaunglPw3G7WL4qe99ZyJKYsZgWNivmZzS2T8kn6ObrSVTZI/exec';   // 報名獨立後端（enroll-backend）
const $=s=>document.querySelector(s);
try{ document.getElementById('ver').textContent=FRONTEND_VERSION; }catch(e){}
const QS=new URLSearchParams(location.search);
const PREVIEW=QS.get('preview')==='1';
async function fetchT(u,o,ms){ const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||45000); try{ const r=await fetch(u,Object.assign({signal:c.signal},o||{})); return await r.json(); } finally{ clearTimeout(t); } }
async function apiGet(p){ let e; for(let i=0;i<3;i++){ try{ return await fetchT(API+'?'+new URLSearchParams(p)); }catch(x){ e=x; await new Promise(r=>setTimeout(r,600*(i+1))); } } throw e; }
async function apiPost(body,ms){ return fetchT(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)},ms); }
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const HEALTH=['氣喘或呼吸相關疾病','心臟病','關節或活動問題','肌肉或骨骼狀況','以前受傷或手術','目前正在服用的長期藥物','任何身體限制','以上不適用'];
const DECL='本人謹此聲明本人及同行參加者的健康及體能良好，適合參加上述活動；如有任何疾病、受傷或身體狀況（例如哮喘等醫生不建議運動的疾病，或身體有扭傷、骨折等情況），會事先如實告知教練。如因隱瞞或未有告知上述狀況而引致受傷，本機構毋須就該等後果負責；惟本聲明並不免除本機構因疏忽而須承擔之法律責任。';
let EV=null, FPS='';
let S={student:'',adults:1,kids:1,pname:'',phone:'',email:'',emgName:'',emgPhone:'',health:[],special:'',declAgree:false,termsAgree:false,enName:'',source:'',payImg:'',rid:''};
const nPeople=()=>(+S.adults||0)+(+S.kids||0);
const total=()=>nPeople()*(EV?EV.fee:0);
function steps(n){return `<div class="steps">${[1,2,3].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</div>`;}

async function boot(){
  try{ const cfg=await apiGet({action:'eventConfig'});
    if(cfg&&cfg.ok){ FPS=cfg.fps||''; const want=QS.get('ev'); const evs=cfg.events||[];
      EV=evs.find(e=>e.id===want) || evs.filter(e=>e.open).slice(-1)[0] || null; }
  }catch(e){}
  if(!EV){ $('#app').innerHTML=`<div class="card"><h2>暫時冇開放報名嘅特別活動</h2><p class="sub">如有查詢請 WhatsApp 6331 7403。</p><button class="btn ghost" onclick="location.href='is-enroll.html'">← 返回報名系統</button></div>`; return; }
  renderIntro();
}
function renderIntro(){
  const full=EV.left<=0, closed=!EV.open;
  $('#app').innerHTML=`
  ${PREVIEW?'<div class="pvbanner">👁 預覽模式：每頁底有「⏭ 免填直接睇下一頁」；<b>唔會真提交</b>。</div>':''}
  <div class="hero">
    <div class="yr">SPECIAL CLASS</div>
    <h1>🎉 ${esc(EV.title)}</h1>
    ${EV.subtitle?`<p style="font-size:16px;font-weight:800;margin:0 0 8px">副題：${esc(EV.subtitle)}</p>`:''}
    <p>${esc(EV.blurb||'')}</p>
    <div class="info">
      <div><b>日期</b><span>${esc(EV.dateLabel||EV.date)}</span></div>
      <div><b>時間</b><span>${esc(EV.time)}</span></div>
      <div><b>地點</b><span>${esc(EV.venue)}</span></div>
      <div><b>費用</b><span>每位參加者 $${EV.fee}（大人、小朋友一樣）</span></div>
    </div>
  </div>
  <div class="card">
    <h2>報名須知</h2>
    ${EV.terms?`<div class="pvbanner" style="margin:6px 0 10px">⚠️ ${esc(EV.terms)}</div>`:''}
    <p class="sub" style="margin-bottom:6px">一個家庭可以報幾多位都得（例如一位家長＋兩位小朋友＝3 位）。名額按總人數計，額滿即止。小朋友年齡不限。</p>
    <span class="left ${full||closed?'full':''}">${closed?'報名已截止':(full?'名額已滿':'尚餘 '+EV.left+' / '+EV.cap+' 位')}</span>
    ${full||closed?'':`<button class="btn" style="margin-top:16px" onclick="renderForm()">開始報名　›</button>`}
    ${(full||closed)&&PREVIEW?`<button class="pvskip" onclick="renderForm()">⏭ 預覽表格</button>`:''}
    <button class="btn ghost" style="margin-top:9px" onclick="location.href='is-enroll.html'">← 返回報名系統</button>
  </div>`;
}
function stepper(k,label,min){ return `<div class="fld"><label>${label}<span class="req">＊</span></label>
    <div style="display:flex;align-items:center;gap:10px"><button type="button" class="copy" style="width:44px;height:44px;font-size:22px" onclick="collect();S.${k}=Math.max(${min},(+S.${k}||0)-1);renderForm()" aria-label="減少${label}">−</button>
    <b style="font-size:22px;min-width:36px;text-align:center" id="n_${k}">${S[k]}</b>
    <button type="button" class="copy" style="width:44px;height:44px;font-size:22px" onclick="collect();if(nPeople()<8)S.${k}=(+S.${k}||0)+1;renderForm()" aria-label="增加${label}">＋</button>
    <span class="hint" style="margin:0">位</span></div></div>`; }
function renderForm(){
  $('#app').innerHTML=`
  <div class="card">
    ${steps(1)}
    <h2>📝 ${esc(EV.title)}・報名表</h2>
    <p class="sub">＊為必填。資料只用於安排活動同聯絡。</p>
    <div class="sec">參加者（每位 $${EV.fee}）</div>
    <div class="fld"><label>學生姓名<span class="req">＊</span></label><input id="f_student" value="${esc(S.student)}" placeholder="例：陳大文"></div>
    <div class="row">${stepper('adults','大人',0)}${stepper('kids','小朋友',1)}</div>
    <div class="hint" style="margin-top:-4px">合共 <b>${nPeople()}</b> 位 × $${EV.fee} ＝ <b>$${total()}</b>（一次最多 8 位）</div>
    <div class="sec">聯絡人</div>
    <div class="fld"><label>聯絡人姓名<span class="req">＊</span></label><input id="f_pname" value="${esc(S.pname)}" placeholder="例：陳小姐"></div>
    <div class="fld"><label>聯絡電話（WhatsApp・8 位）<span class="req">＊</span></label><input id="f_phone" inputmode="numeric" value="${esc(S.phone)}" placeholder="例：91234567"></div>
    <div class="fld"><label>電郵（收確認）</label><input id="f_email" inputmode="email" value="${esc(S.email)}" placeholder="example@email.com"></div>
    <div class="row">
      <div class="fld"><label>緊急聯絡人<span class="req">＊</span></label><input id="f_emgName" value="${esc(S.emgName)}" placeholder="例：陳先生"></div>
      <div class="fld"><label>緊急電話<span class="req">＊</span></label><input id="f_emgPhone" inputmode="numeric" value="${esc(S.emgPhone)}" placeholder="8 位"></div>
    </div>
    <div class="sec">健康狀況（任何一位參加者；可多選）<span class="req">＊</span></div>
    <div id="f_health">${HEALTH.map(h=>`<label class="chk ${S.health.includes(h)?'on':''}"><input type="checkbox" value="${esc(h)}" ${S.health.includes(h)?'checked':''} onchange="hToggle(this)"><span>${h}</span></label>`).join('')}</div>
    <div class="fld"><label>有冇任何特殊需要或想教練留意嘅地方？<span class="req">＊</span></label><input id="f_special" value="${esc(S.special)}" placeholder="例：小朋友扁平足、膝頭痛；如無請填「沒有」"></div>
    <div class="sec">身體狀況聲明</div>
    <div class="terms">${DECL}</div>
    <label class="chk ${S.declAgree?'on':''}"><input type="checkbox" id="f_decl" ${S.declAgree?'checked':''} onchange="this.closest('.chk').classList.toggle('on',this.checked)"><span>本人已閱讀並<b>同意以上身體狀況聲明</b>（不同意不能參加）。</span></label>
    ${EV.terms?`<div class="sec">Special Class 須知</div>
    <label class="chk ${S.termsAgree?'on':''}"><input type="checkbox" id="f_terms" ${S.termsAgree?'checked':''} onchange="this.closest('.chk').classList.toggle('on',this.checked)"><span>本人明白呢個係<b>一次性 Special Class</b>，${esc(EV.terms.replace(/^.*?：/,''))}</span></label>`:''}
    <div class="fld"><label>聲明人英文全名<span class="req">＊</span></label><input id="f_enName" value="${esc(S.enName)}" placeholder="e.g. CHAN TAI MAN"></div>
    <div class="err" id="ferr"></div>
    <button class="btn" onclick="submitForm()">下一步：付款　›</button>
    ${PREVIEW?'<button class="pvskip" onclick="collect();renderPay()">⏭ 免填直接睇下一頁（預覽）</button>':''}
    <button class="btn ghost" style="margin-top:9px" onclick="collect();renderIntro()">← 返回</button>
  </div>`;
}
function hToggle(el){ el.closest('.chk').classList.toggle('on',el.checked);
  const all=[...document.querySelectorAll('#f_health input')], none=all.find(x=>x.value==='以上不適用');
  if(el.checked && el===none) all.forEach(x=>{ if(x!==el){x.checked=false;x.closest('.chk').classList.remove('on');} });
  else if(el.checked && none){ none.checked=false; none.closest('.chk').classList.remove('on'); } }
function collect(){
  const st=$('#f_student'); if(st) S.student=st.value.trim();
  const v=id=>{ const el=$('#'+id); return el?el.value.trim():null; };
  for(const [id,k] of [['f_pname','pname'],['f_phone','phone'],['f_email','email'],['f_emgName','emgName'],['f_emgPhone','emgPhone'],['f_special','special'],['f_enName','enName']]){ const x=v(id); if(x!==null) S[k]=x; }
  if($('#f_health')) S.health=[...document.querySelectorAll('#f_health input:checked')].map(x=>x.value);
  const dc=$('#f_decl'); if(dc) S.declAgree=dc.checked;
  const tm=$('#f_terms'); if(tm) S.termsAgree=tm.checked;
}
function submitForm(){
  collect(); const err=m=>{ $('#ferr').textContent=m; };
  if(!S.student) return err('請填寫：學生姓名');
  if(nPeople()>EV.left) return err('名額不足：尚餘 '+EV.left+' 位');
  for(const [k,l] of [['pname','聯絡人姓名'],['phone','聯絡電話'],['emgName','緊急聯絡人'],['emgPhone','緊急電話'],['special','特殊需要（如無填「沒有」）'],['enName','聲明人英文全名']]) if(!S[k]) return err('請填寫：'+l);
  if(!/^\d{8}$/.test(S.phone.replace(/\D/g,''))) return err('聯絡電話要 8 位數字');
  if(!S.health.length) return err('請剔選健康狀況（如全部沒有，請剔「以上不適用」）');
  if(!S.declAgree) return err('請剔選同意身體狀況聲明（不同意不能參加）');
  if(EV.terms && !S.termsAgree) return err('請剔選同意：一次性課堂不設補堂及退款');
  renderPay();
}
function renderPay(){
  const n=nPeople(), amt=total();
  $('#app').innerHTML=`
  <div class="card">
    ${steps(2)}
    <h2>💳 付款</h2>
    <p class="sub">付款後上載截圖，我哋核實即 WhatsApp 確認。</p>
    <div class="feebox"><div class="amt">$${amt||'—'}</div><div class="lbl">${n} 位 × $${EV.fee}　·　${esc(EV.title)}</div></div>
    <div class="sec">付款方法（FPS 轉數快 / PayMe）</div>
    <div class="pay-opt"><b>FPS 轉數快 / PayMe</b>
      <div class="hint">號碼：<b>${FPS?esc(FPS):'（載入中…請重新整理）'}</b> ${FPS?`<button class="copy" onclick="copyFps(this)">複製</button>`:''}<br>金額：<b>$${amt||'—'}</b>　·　備註請填：<b>${esc(S.student||'學生姓名')}・親子班</b></div></div>
    <div class="sec">上載付款截圖<span class="req">＊</span></div>
    <div class="up" onclick="document.getElementById('f_pay').click()">📷 撳呢度上載付款截圖<div class="hint" id="paylbl" style="margin-top:4px">${S.payImg?'已揀相':'支援相片'}</div></div>
    <input type="file" id="f_pay" accept="image/*" style="display:none" onchange="pickPay(this)">
    <div class="err" id="perr"></div>
    <button class="btn" id="pbtn" style="margin-top:14px" onclick="doSubmit()">提交報名　›</button>
    ${PREVIEW?'<button class="pvskip" onclick="renderDone()">⏭ 免填直接睇下一頁（預覽）</button>':''}
    <button class="btn ghost" style="margin-top:9px" onclick="renderForm()">← 返回改資料</button>
  </div>`;
}
function copyFps(btn){ try{ navigator.clipboard.writeText(String(FPS).replace(/\s/g,'')); btn.textContent='已複製'; setTimeout(()=>btn.textContent='複製',1500); }catch(e){} }
function pickPay(inp){ const f=inp.files[0]; if(!f) return; $('#paylbl').textContent='處理中…';
  shrinkImage(f,(data,e)=>{ if(e){ S.payImg=''; $('#paylbl').textContent=e; return; } S.payImg=data||''; $('#paylbl').textContent='已揀：'+f.name; }); }
function shrinkImage(file, cb){
  if(!/^image\//.test(file.type)){ cb(null,'請上載相片'); return; }
  const rd=new FileReader();
  rd.onload=function(){ const img=new Image();
    img.onload=function(){ const MAX=1600; let w=img.width, h=img.height;
      if(w>MAX||h>MAX){ if(w>=h){ h=Math.round(h*MAX/w); w=MAX; } else { w=Math.round(w*MAX/h); h=MAX; } }
      try{ const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); cb(cv.toDataURL('image/jpeg',0.82)); }catch(err){ cb(rd.result); } };
    img.onerror=function(){ cb(rd.result); }; img.src=rd.result; };
  rd.onerror=function(){ cb(null,'讀取圖片失敗'); }; rd.readAsDataURL(file);
}
async function doSubmit(){
  if(PREVIEW){ renderDone(); return; }
  if(!S.payImg){ $('#perr').textContent='請先上載付款截圖'; return; }
  const btn=$('#pbtn'); btn.disabled=true; btn.innerHTML='<span class="spin"></span>提交中…'; $('#perr').textContent='';
  const body={action:'eventSubmit', ev:EV.id, student:S.student, adults:+S.adults||0, kids:+S.kids||0, pname:S.pname, phone:S.phone.replace(/\D/g,''), email:S.email,
    emgName:S.emgName, emgPhone:S.emgPhone, health:S.health, special:S.special, declAgree:S.declAgree, termsAgree:S.termsAgree, enName:S.enName, payImg:S.payImg};
  try{ const r=await apiPost(body,90000);
    if(r&&r.ok){ S.rid=r.id||''; renderDone(); }
    else { $('#perr').textContent=(r&&r.err)||'提交失敗，請重試，或 WhatsApp 6331 7403'; btn.disabled=false; btn.innerHTML='提交報名　›'; if(r&&r.left!=null) EV.left=r.left; }
  }catch(e){ $('#perr').textContent='網絡問題，未能提交，請重試（資料未清除）。如已扣錢請 WhatsApp 6331 7403，唔好重複付款。'; btn.disabled=false; btn.innerHTML='提交報名　›'; }
}
function renderDone(){
  $('#app').innerHTML=`
  <div class="card done">
    ${steps(3)}
    <div class="tick">✓</div>
    <h2 style="justify-content:center">報名已提交！</h2>
    <p class="sub" style="text-align:center">多謝報名，我哋核實付款後會 WhatsApp 你確認。</p>
    <div style="text-align:left;margin-top:8px">
      ${S.rid?`<div class="sumrow"><span class="k">記錄編號</span><span class="v">${esc(S.rid)}</span></div>`:''}
      <div class="sumrow"><span class="k">活動</span><span class="v">${esc(EV.title)}</span></div>
      <div class="sumrow"><span class="k">日期時間</span><span class="v">${esc(EV.dateLabel||EV.date)} ${esc(EV.time)}</span></div>
      <div class="sumrow"><span class="k">地點</span><span class="v">${esc(EV.venue)}</span></div>
      <div class="sumrow"><span class="k">學生</span><span class="v">${esc(S.student||'—')}</span></div>
      <div class="sumrow"><span class="k">人數</span><span class="v">大人 ${+S.adults||0} 位・小朋友 ${+S.kids||0} 位</span></div>
      <div class="sumrow"><span class="k">金額</span><span class="v">$${total()}（待核實）</span></div>
    </div>
    ${EV.terms?`<div class="hint" style="margin-top:10px">${esc(EV.terms)}</div>`:''}
    <div class="hint" style="margin-top:14px;background:var(--teal-w);padding:11px 13px;border-radius:11px">📱 當日請穿運動服＋運動鞋、帶水，提早 5–10 分鐘到 ${esc(EV.venue)}。</div>
    <button class="btn ghost" style="margin-top:16px" onclick="location.href='is-enroll.html'">返回報名系統</button>
  </div>`;
  window.scrollTo(0,0);
}
boot();
</script></body></html>
