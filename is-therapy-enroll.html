<script>

const money=n=>'$'+(Number(n)||0).toLocaleString();
const HEALTH=['氣喘或呼吸相關疾病','糖尿病或血糖相關疾病','關節或活動問題','心臟病','運動誘發的病症','肌肉或骨骼狀況','目前正在服用的長期藥物','任何身體限制','以前受傷或手術','以上不適用'];
const PARQ=['醫生曾否話你心臟有問題、只可做醫生建議嘅運動？','你做運動時會否感到胸口痛？','過去一個月，你有冇喺冇做運動時都感到胸口痛？','你曾否因暈眩失去平衡、或失去知覺？','你嘅骨骼或關節（如脊骨、膝、髖）有冇毛病，會因運動而惡化？','醫生現時有冇開血壓或心臟藥畀你？','有冇其他理由令你唔應該做運動？'];
let CFG=null, S={visitType:'首次', health:[], parqok:false, parqnote:'', signImg:'', payImg:''};

async function fetchT(u,o,ms){ const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||45000); try{ const r=await fetch(u,Object.assign({signal:c.signal},o||{})); return await r.json(); } finally{ clearTimeout(t); } }
async function apiGet(action){ return fetchT(API+'?action='+encodeURIComponent(action)); }
async function apiPost(body,ms){ return fetchT(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)},ms); }

/* ─── 圖片壓縮（付款截圖）─── */
function shrinkImage(file, cb){
  if(!file){ cb(''); return; }
  var MAXBYTES=8*1024*1024;
  if(!/^image\//.test(file.type)){ if(file.size>MAXBYTES){ cb(null,'檔案太大，請壓到 8MB 以內'); return; }
    var rd0=new FileReader(); rd0.onload=()=>cb(rd0.result); rd0.onerror=()=>cb(null,'讀取失敗'); rd0.readAsDataURL(file); return; }
  var rd=new FileReader();
  rd.onload=function(){ var img=new Image();
    img.onload=function(){ var MAX=1600,w=img.width,h=img.height;
      if(w>MAX||h>MAX){ if(w>=h){ h=Math.round(h*MAX/w); w=MAX; } else { w=Math.round(w*MAX/h); h=MAX; } }
      try{ var cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); cb(cv.toDataURL('image/jpeg',0.82)); }
      catch(err){ cb(rd.result); } };
    img.onerror=()=>cb(rd.result); img.src=rd.result; };
  rd.onerror=()=>cb(null,'讀取圖片失敗'); rd.readAsDataURL(file);
}
/* ─── 簽名 ─── */
let _sig={draw:false,has:false,ctx:null,cv:null};
function setupSigPad(_retry){
  const cv=$('#sigpad'); if(!cv) return;
  const rect=cv.getBoundingClientRect(); const ratio=window.devicePixelRatio||1;
  if(rect.width<50){ if(!_retry) requestAnimationFrame(()=>setupSigPad(true)); return; }
  cv.width=Math.round(rect.width*ratio); cv.height=Math.round(rect.height*ratio);
  const ctx=cv.getContext('2d'); ctx.scale(ratio,ratio); ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#0f2233';
  _sig={draw:false,has:false,ctx,cv};
  const pos=e=>{ const r=cv.getBoundingClientRect(); const t=(e.touches&&e.touches[0])?e.touches[0]:e; return {x:t.clientX-r.left,y:t.clientY-r.top}; };
  const start=e=>{ e.preventDefault(); _sig.draw=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); };
  const move=e=>{ if(!_sig.draw) return; e.preventDefault(); const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); _sig.has=true; };
  const end=()=>{ _sig.draw=false; };
  cv.addEventListener('mousedown',start); cv.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
  cv.addEventListener('touchstart',start,{passive:false}); cv.addEventListener('touchmove',move,{passive:false}); cv.addEventListener('touchend',end);
}
function clearSig(){ if(_sig.ctx&&_sig.cv) _sig.ctx.clearRect(0,0,_sig.cv.width,_sig.cv.height); _sig.has=false; }
function sigDataUrl(){ return (_sig.has&&_sig.cv)?_sig.cv.toDataURL('image/png'):''; }

function steps(n){ return '<div class="steps">'+[1,2,3].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')+'</div>'; }
function fee_(){ return S.visitType==='覆診' ? (CFG.followupFee||700) : (CFG.firstFee||600); }

/* ═══ 首頁 ═══ */
function renderIntro(){
  $('#app').innerHTML=`
  <div class="card hero">
    <h1>運動治療 ＋ 痛症處理</h1>
    <p style="opacity:.92">結合運動科學與徒手治療 —— 由具運動科學背景、<b>前香港隊運動員</b>之教練，運用 <b>NKT 神經動能療法</b>、<b>SCS 拮抗鬆弛術</b>及 <b>DNS 動態神經肌肉穩定術</b>，由神經肌肉控制嘅根源處理痛症、姿勢及動作問題，令改善更持久、復發更少。</p>
    <div>
      <span class="pill">🩺 徒手評估</span><span class="pill">🎯 痛症根源處理</span><span class="pill">🧭 動作矯正</span><span class="pill">🧘 姿勢與呼吸</span>
    </div>
  </div>
  <div class="card">
    <h2>邊啲情況啱？</h2>
    <p class="mut">肩頸腰背痛 · 舊患反覆 · 姿勢不良（圓肩寒背）· 動作代償 · 運動表現受限 · 想安全重新開始運動。</p>
    <p class="mut" style="margin-top:8px"><b style="color:var(--teal-d)">NKT</b> 由神經層面揾出肌肉失衡嘅真正源頭　<b style="color:var(--teal-d)">SCS</b> 溫和放鬆繃緊肌肉、即場紓緩痛點　<b style="color:var(--teal-d)">DNS</b> 重建核心穩定與呼吸模式，改善姿勢與動作效率。</p>
  </div>
  <div class="card">
    <h2>收費</h2>
    <div class="fee">
      <div class="fx"><b>${money(CFG.firstFee||600)}</b><span>首次看診（含詳細評估）</span></div>
      <div class="fx"><b>${money(CFG.followupFee||700)}</b><span>其後每次</span></div>
    </div>
    <button class="btn" style="margin-top:14px" onclick="renderForm()">開始預約看診 →</button>
    <div style="text-align:center;margin-top:10px"><a class="wa" href="${WA}" target="_blank">或 WhatsApp 6331 7403 查詢</a></div>
    <div class="mut" style="text-align:center;margin-top:10px;font-size:12px">＊運動治療不能取代醫療診斷；如涉嚴重痛症或病理，請先求醫。</div>
  </div>`;
}
/* ═══ 步驟 1：資料 + 主訴 + 健康 ═══ */
function renderForm(){
  $('#app').innerHTML=`
  <div class="card">
    ${steps(1)}
    <h2>預約資料</h2>
    <div class="fld"><label class="lb">看診類型 <span class="req">*</span></label>
      <div class="vt">
        <div class="v ${S.visitType==='首次'?'on':''}" data-v="首次" onclick="pickVt('首次')"><b>首次看診</b><span>${money(CFG.firstFee||600)}</span><div class="hint">含詳細評估</div></div>
        <div class="v ${S.visitType==='覆診'?'on':''}" data-v="覆診" onclick="pickVt('覆診')"><b>覆診</b><span>${money(CFG.followupFee||700)}</span><div class="hint">其後每次</div></div>
      </div></div>
    <div class="fld"><label class="lb">姓名 <span class="req">*</span></label><input id="f_name" type="text" placeholder="你的中文或英文全名" value="${esc(S.name||'')}"></div>
    <div class="fld"><label class="lb">聯絡電話 <span class="req">*</span></label><input id="f_phone" type="tel" inputmode="numeric" placeholder="8 位數字" value="${esc(S.phone||'')}"></div>
    <div class="fld"><label class="lb">電郵 <span class="req">*</span> <span class="hint">預約確認信會寄到此電郵</span></label><input id="f_email" type="email" placeholder="you@example.com" value="${esc(S.email||'')}"></div>
    <div class="fld"><label class="lb">主訴／痛症描述 <span class="req">*</span> <span class="hint">邊度痛、幾耐、點樣痛、想改善咩</span></label>
      <textarea id="f_complaint" placeholder="例：右膊頭痛半年，抬手／瞓覺時痛，想搵出原因處理">${esc(S.complaint||'')}</textarea></div>
    <div class="fld"><label class="lb">方便時段 <span class="hint">（選填，教練會 WhatsApp 同你落實）</span></label>
      <textarea id="f_times" placeholder="例：平日晚上、星期六下午">${esc(S.times||'')}</textarea></div>
    <div class="fld"><label class="lb">最近半個月睡眠質素 <span class="req">*</span> <span class="hint">1＝很差、5＝很好</span></label>
      <div class="chips" id="f_sleep">${[1,2,3,4,5].map(n=>`<div class="chip ${String(S.sleep)===String(n)?'on':''}" data-v="${n}" onclick="pickSleep(${n})">${n}</div>`).join('')}</div></div>
    <div class="fld"><label class="lb">健康狀況（可多選；如全部沒有請剔「以上不適用」）<span class="req">*</span></label>
      <div id="f_health">${HEALTH.map(h=>`<label class="chk ${S.health.includes(h)?'on':''}"><input type="checkbox" class="hh" value="${esc(h)}" ${S.health.includes(h)?'checked':''} onchange="this.closest('.chk').classList.toggle('on',this.checked)"><span>${esc(h)}</span></label>`).join('')}</div></div>
    <div class="fld"><label class="lb">健康篩查 PAR-Q <span class="req">*</span></label>
      <div class="terms" style="max-height:170px">${PARQ.map((q,i)=>`<p>${i+1}. ${esc(q)}</p>`).join('')}</div>
      <label class="chk ${S.parqok?'on':''}"><input type="checkbox" id="f_parqok" ${S.parqok?'checked':''} onchange="this.closest('.chk').classList.toggle('on',this.checked)"><span>以上 7 項我全部答「否」，健康良好、適合參加運動。</span></label>
      <input id="f_parqnote" type="text" style="margin-top:6px" placeholder="如有任何一項為「是」，請喺此註明（並先徵詢醫生）" value="${esc(S.parqnote||'')}"></div>
    <div class="msg" id="m1"></div>
    <div class="nav"><button class="btn g" onclick="renderIntro()">‹ 返回</button><button class="btn" onclick="toTerms()">下一步（條款）→</button></div>
  </div>`;
}
function pickVt(v){ S.visitType=v; document.querySelectorAll('.vt .v').forEach(el=>el.classList.toggle('on',el.dataset.v===v)); }
function pickSleep(n){ S.sleep=n; document.querySelectorAll('#f_sleep .chip').forEach(el=>el.classList.toggle('on',String(el.dataset.v)===String(n))); }
function grab1(){
  S.name=($('#f_name').value||'').trim(); S.phone=($('#f_phone').value||'').replace(/\D/g,'');
  S.email=($('#f_email').value||'').trim(); S.complaint=($('#f_complaint').value||'').trim();
  S.times=($('#f_times').value||'').trim();
  S.health=[...document.querySelectorAll('.hh:checked')].map(c=>c.value);
  S.parqok=$('#f_parqok').checked; S.parqnote=($('#f_parqnote').value||'').trim();
}
function toTerms(){
  grab1(); const m=$('#m1');
  if(!PREVIEW){
    if(!S.name){ m.className='msg err'; m.textContent='請填寫姓名。'; return; }
    if(S.phone.length<8){ m.className='msg err'; m.textContent='請填寫正確聯絡電話（8 位數字）。'; return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(S.email)){ m.className='msg err'; m.textContent='請填寫有效電郵地址。'; return; }
    if(!S.complaint){ m.className='msg err'; m.textContent='請填寫主訴／痛症描述。'; return; }
    if(!S.sleep){ m.className='msg err'; m.textContent='請選擇最近半個月睡眠質素（1–5 分）。'; return; }
    if(!S.health.length){ m.className='msg err'; m.textContent='請剔選健康狀況（如全部沒有，請剔「以上不適用」）。'; return; }
    if(!S.parqok && !S.parqnote){ m.className='msg err'; m.textContent='請完成健康篩查 PAR-Q：全部答「否」請剔選；如有「是」請註明。'; return; }
    if(!S.parqok){ if(!confirm('你喺 PAR-Q 有項答「是」。為安全起見，本機構建議先諮詢醫生。你已了解並確定繼續？')) return; }
  } else {
    if(!S.name) S.name='Preview User'; if(S.phone.length<8) S.phone='90000000'; if(!/@/.test(S.email)) S.email='preview@example.com';
    if(!S.complaint) S.complaint='（預覽）右膊頭痛'; if(!S.health.length) S.health=['以上不適用']; if(!S.sleep) S.sleep=3;
  }
  S.parq = S.parqok ? '全部否（適合運動）' : (S.parqnote?('有項為是：'+S.parqnote):'未完成');
  renderTerms();
}
/* ═══ 步驟 2：條款 + 簽名 ═══ */
function renderTerms(){
  const notes=(CFG.notes||[]);   // 只用運動治療專屬條款（THERAPY_NOTES）；唔用課程通用條款（開班/補堂/服飾/器材等對看診完全不適用）。老闆 2026-09-23
  $('#app').innerHTML=`
  <div class="card">
    ${steps(2)}
    <h2>注意事項及條款</h2>
    <div class="terms">${notes.map((s,i)=>`<p><b>${i+1}.</b> ${esc(s)}</p>`).join('')}</div>
    <label class="chk ${S.agree?'on':''}"><input type="checkbox" id="t_agree" ${S.agree?'checked':''} onchange="this.closest('.chk').classList.toggle('on',this.checked)"><span>本人已閱讀並<b>同意以上注意事項及條款</b>，並明白運動治療不能取代醫療診斷。</span></label>
    <div class="fld"><label class="lb">英文全名 <span class="req">*</span> <span class="hint">Same as HKID／Passport</span></label><input id="t_en" type="text" placeholder="Chan Tai Man" value="${esc(S.signEn||'')}"></div>
    <div class="fld"><label class="lb">證件號碼首 4 位 <span class="req">*</span></label><input id="t_id" type="text" maxlength="8" placeholder="A123" value="${esc(S.signId||'')}"></div>
    <div class="fld"><label class="lb">簽名 <span class="req">*</span></label>
      <canvas id="sigpad"></canvas>
      <div style="display:flex;justify-content:space-between;margin-top:6px"><span class="hint">請喺上面用手指或滑鼠簽名。</span><button type="button" class="btn g" style="width:auto;padding:4px 12px;font-size:12px" onclick="clearSig()">清除重簽</button></div></div>
    <div class="msg" id="m2"></div>
    <div class="nav"><button class="btn g" onclick="renderForm()">‹ 返回</button><button class="btn" onclick="toPay()">下一步（付款）→</button></div>
  </div>`;
  setTimeout(setupSigPad,30);
}
function toPay(){
  const m=$('#m2'); S.agree=$('#t_agree').checked; S.signEn=($('#t_en').value||'').trim(); S.signId=($('#t_id').value||'').trim(); S.signImg=sigDataUrl();
  if(!PREVIEW){
    if(!S.agree){ m.className='msg err'; m.textContent='請剔選同意注意事項及條款。'; return; }
    if(!S.signEn){ m.className='msg err'; m.textContent='請填寫英文全名。'; return; }
    if(!S.signId){ m.className='msg err'; m.textContent='請填寫證件號碼首 4 位。'; return; }
    if(!S.signImg){ m.className='msg err'; m.textContent='請喺簽名格簽名。'; $('#sigpad').scrollIntoView({block:'center'}); return; }
  } else { S.agree=true; if(!S.signId) S.signId='A123'; if(!S.signEn) S.signEn='Preview User'; }
  renderPay();
}
/* ═══ 步驟 3：付款 ═══ */
async function renderPay(){
  const fee=fee_(); const fps=CFG.fps||'請 WhatsApp 6331 7403 查詢收款';
  $('#app').innerHTML=`
  <div class="card">
    ${steps(3)}
    <h2>付款</h2>
    <div class="sum"><span>姓名</span><span>${esc(S.name)}</span></div>
    <div class="sum"><span>看診類型</span><span>${esc(S.visitType)}</span></div>
    <div class="sum"><span><b>應繳費用</b></span><span><b class="big">${money(fee)}</b></span></div>
    <p class="mut" style="margin-top:10px">請以 <b>FPS 或 PayMe</b> 轉數後上載轉賬截圖；提交後即有記錄編號。教練核實付款後會 WhatsApp 你落實睇診時間及地點。</p>
    <div class="sum"><span>FPS／PayMe 號碼</span><span><b>${esc(fps)}</b> <button class="btn g" style="width:auto;padding:3px 10px;font-size:12px" onclick="copyFps('${esc(fps).replace(/\\s/g,'')}',this)">複製</button></span></div>
    <div class="fld" style="margin-top:12px"><label class="lb">上載付款截圖 ${PREVIEW?'<span class="hint">（預覽可略過）</span>':'<span class="req">*</span>'}</label>
      <input id="p_file" type="file" accept="image/*"><div id="p_thumb" class="hint" style="margin-top:6px"></div></div>
    ${PREVIEW?'<div class="pv">🔎 <b>預覽模式</b>：唔會真提交，亦唔使真過數。真實預約時流程一模一樣。</div>':''}
    <div class="msg" id="m3"></div>
    <div class="nav"><button class="btn g" onclick="renderTerms()">‹ 返回</button><button class="btn" id="p_go">確認提交預約</button></div>
  </div>`;
  $('#p_file').onchange=e=>{ const f=e.target.files[0]; if(!f) return;
    shrinkImage(f,(data,err)=>{ const th=$('#p_thumb'); if(err){ th.textContent='⚠ '+err; S.payImg=''; return; }
      S.payImg=data; th.innerHTML='✓ 已附上截圖（'+esc(f.name)+'）· 可重新選擇'; }); };
  $('#p_go').onclick=submitTherapy;
}
function copyFps(t,el){ try{ navigator.clipboard.writeText(t); el.textContent='已複製'; setTimeout(()=>el.textContent='複製',1500);}catch(e){} }
async function submitTherapy(){
  const m=$('#m3');
  if(PREVIEW){ m.className='msg'; m.textContent='（預覽模式）唔會真提交預約。'; return; }
  if(!S.payImg){ m.className='msg err'; m.textContent='請先上載付款截圖。'; return; }
  m.className='msg'; m.textContent='提交中…⏳'; const btn=$('#p_go'); btn.disabled=true;
  const body={ action:'therapyBook', name:S.name, phone:S.phone, email:S.email, visitType:S.visitType,
    complaint:S.complaint, times:S.times, sleep:S.sleep, health:(S.health||[]).join('、'), parq:S.parq, parqnote:S.parqnote,
    signEn:S.signEn, signId:S.signId, signImg:S.signImg||'', payImg:S.payImg||'', agree:'1',
    clientToken:(S._tok||(S._tok='th_'+Date.now()+Math.random().toString(36).slice(2))) };
  let res; try{ res=await apiPost(body,45000); }catch(e){ res=null; }
  if(res&&res.ok){ renderDone(res); }
  else { m.className='msg err'; m.textContent=(res&&res.err)||'提交失敗，可能網絡問題。如已扣款請 WhatsApp 6331 7403 確認，唔好重複提交。'; btn.disabled=false; }
}
function renderDone(res){
  $('#app').innerHTML=`
  <div class="card" style="text-align:center">
    <div style="font-size:44px">🩺</div>
    <h1>預約已收到！</h1>
    <p class="mut">記錄編號 <b>${esc(res.id||'')}</b></p>
    <div class="sum" style="justify-content:center;border:0"><span>看診類型：<b>${esc(S.visitType)}</b>　·　費用：<b>${money(res.fee||fee_())}</b></span></div>
    <p style="margin-top:10px">我哋已收到你嘅付款截圖，正核實中。<br><b>核實後教練會 WhatsApp 你確認睇診時間及地點。</b></p>
    <p class="mut" style="margin-top:8px">確認信已寄到 ${esc(S.email)}。查詢：<a class="wa" href="${WA}" target="_blank">WhatsApp 6331 7403</a></p>
  </div>`;
}
/* ═══ 啟動 ═══ */
async function boot(){
  if(PREVIEW) $('#pvtag').textContent=' · 預覽模式';
  $('#ver').textContent='v'+FRONTEND_VERSION;
  let _try=0;
  while(true){ _try++;
    try{ CFG=await apiGet('therapyConfig'); if(CFG&&CFG.ok) break; throw new Error('bad'); }
    catch(e){ if(_try>=6){ $('#app').innerHTML='<div class="card"><div class="msg err">連線失敗，請稍後再試。</div><button class="btn" style="margin-top:10px" onclick="boot()">🔄 重試</button></div>'; return; }
      $('#app').innerHTML='<div class="card"><div class="msg">連線中…⏳（首次載入需喚醒伺服器，約 30 秒，第 '+_try+' 次）</div></div>'; await new Promise(r=>setTimeout(r,1500)); }
  }
  renderIntro();
}
boot();
</script>
</body>
</html>
