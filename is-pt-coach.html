<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IS 私訓教練記錄</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f4efe6">
<link rel="icon" href="img/is-mark-96.png">
<link rel="apple-touch-icon" href="img/is-mark-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Noto+Sans+HK:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f4efe6;--panel:#fbf8f2;--panel2:#efe8dc;--line:rgba(29,27,23,.08);--line2:rgba(29,27,23,.16);--text:#1d1b17;--mut:#7a7368;--teal:#1f4d3a;--teal2:#2f6b52;--gold:#c96a3d;--red:#b3402a;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans HK',-apple-system,sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.num{font-family:'Archivo','Noto Sans HK',sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin:0 auto;padding:0 14px calc(110px + var(--safe-b))}
.top{position:sticky;top:0;z-index:20;background:rgba(244,239,230,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 0}
.top-in{max-width:720px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;font-family:'Archivo',sans-serif;font-weight:900;letter-spacing:.05em;font-size:14px}
.brand img{width:24px;height:24px;border-radius:6px}
.brand .tag{transform:skewX(-6deg);background:var(--gold);color:#fbf8f2;padding:1px 7px;font-size:11px}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.chips{display:flex;gap:7px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line2);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--mut);white-space:nowrap}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fbf8f2;font-weight:800}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin:0 -2px}   /* 8 個分頁 4×2，唔使橫掃 */
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;background:none;border:none;border-bottom:3px solid transparent;color:var(--mut);padding:9px 2px 8px;font-weight:700;font-size:12.5px;white-space:nowrap}
.tabs button.on{color:var(--teal);border-bottom-color:var(--teal)}
.card{box-shadow:0 1px 2px rgba(29,27,23,.05);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.h2{font-size:18px;font-weight:900;margin:16px 2px 6px}
.muted{color:var(--mut)}
.small{font-size:12.5px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(31,77,58,.14);color:var(--teal)}
.badge.gold{background:rgba(201,106,61,.18);color:var(--gold)}
.badge.red{background:rgba(179,64,42,.15);color:var(--red)}
.badge.grey{background:rgba(29,27,23,.06);color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:11px;padding:11px 15px;font-weight:800;background:var(--teal);color:#fbf8f2}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--text)}
.btn.warn{background:transparent;border:1px solid rgba(179,64,42,.4);color:var(--red)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn.xs{padding:8px 11px;font-size:12.5px;border-radius:9px;min-height:36px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.lnk{background:none;border:none;color:var(--teal);font-weight:700;padding:0;font-size:13px}
.in{width:100%;background:#ffffff;border:1px solid var(--line2);border-radius:10px;padding:10px 11px;outline:none;font-size:16px}   /* <16px iPhone 會自動放大 */
.in:focus{border-color:var(--teal)}
textarea.in{resize:vertical;min-height:70px}
.lb{display:block;font-size:12px;color:var(--mut);margin:0 0 4px 2px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{margin-bottom:10px}
/* logger */
.blk{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin:12px 0}
.blk-h{display:flex;align-items:flex-start;gap:8px}
.blk-h .nm{font-weight:900;font-size:16px;line-height:1.3}
.last{font-size:12px;color:var(--gold);margin:4px 0 2px}
.srow{display:grid;gap:6px;align-items:center;margin-top:7px}
.srow .no{width:22px;text-align:center;font-family:Archivo;font-weight:800;color:var(--mut)}
.srow input,.srow select{background:#ffffff;border:1px solid var(--line2);border-radius:9px;padding:9px 6px;text-align:center;width:100%;min-width:0;outline:none;font-size:16px}
.srow input:focus{border-color:var(--teal)}
.srow .x{background:none;border:none;color:var(--mut);font-size:16px;padding:8px 4px;min-height:40px}
.unitbtn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:1px 6px;font:inherit;font-weight:800;color:var(--teal);cursor:pointer}
.shead{display:grid;gap:6px;font-size:11px;color:var(--mut);text-align:center;margin-top:8px}
.ib{background:none;border:1px solid var(--line2);border-radius:8px;color:var(--mut);padding:8px 11px;font-size:13px;min-height:36px}
.qr{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:6px}.qr::-webkit-scrollbar{display:none}.qr button{flex:none;border:1px dashed var(--line2);background:transparent;color:var(--mut);border-radius:99px;padding:6px 10px;font-size:12.5px}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(251,248,242,.97);border-top:1px solid var(--line);padding:10px 14px calc(10px + var(--safe-b))}
.savebar .in2{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:center}
/* lists */
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:none}
.sline{font-size:13.5px;margin:3px 0}
.sline b{font-weight:800}
.msg{display:flex;margin:5px 0}
.msg .bub{max-width:85%;padding:7px 10px;border-radius:13px;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.msg.st .bub{background:var(--panel2);border-bottom-left-radius:4px}
.msg.co{justify-content:flex-end}
.msg.co .bub{background:rgba(201,106,61,.16);border-bottom-right-radius:4px}
.msg .who{display:block;font-size:10.5px;color:var(--mut)}
.tin{display:flex;gap:8px;margin-top:8px}
.tin input{flex:1}
.ov{position:fixed;inset:0;z-index:50;background:rgba(29,27,23,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:720px;height:86vh;display:flex;flex-direction:column;border-radius:20px 20px 0 0;border:1px solid var(--line2);padding:14px 14px 0}
.sheet .body{flex:1;overflow:auto;padding-bottom:calc(20px + var(--safe-b))}
.pick{display:flex;align-items:center;gap:10px;padding:11px 4px;border-top:1px solid var(--line);cursor:pointer}
.pick:hover{background:rgba(29,27,23,.03)}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:#1d1b17;color:#fbf8f2;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(29,27,23,.16);max-width:90vw;text-align:center}
.spin{width:22px;height:22px;border:3px solid rgba(31,77,58,.25);border-top-color:var(--teal);border-radius:50%;animation:sp .8s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.chart{width:100%;height:auto;display:block}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.mem{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border-radius:10px;padding:6px 10px;font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const FRONTEND_VERSION = 'ptc-2026-10-05-b';
const API = 'https://script.google.com/macros/s/AKfycbz34SLDFmVISrW4_QinGwxzHVfZOshGFVZE8mAPaxppJdR4fo3c4Z6PrdzR8nnralhp/exec';
const STUDENT_URL = 'https://www.initiatesportshk.com/is-pt.html';

/* ───────── 工具 ───────── */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => ('0'+n).slice(-2);
const isoOf = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const isoToday = () => isoOf(new Date());
function parseISO(s){ const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m?new Date(+m[1],+m[2]-1,+m[3]):null; }
function addDays(s,n){ const d=parseISO(s); d.setDate(d.getDate()+n); return isoOf(d); }
function mondayOf(s){ const d=parseISO(s); const w=(d.getDay()+6)%7; d.setDate(d.getDate()-w); return isoOf(d); }
function fmtD(s){ const d=parseISO(s); return d?pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear():esc(s||''); }
function fmtDM(s){ const d=parseISO(s); return d?pad(d.getDate())+'/'+pad(d.getMonth()+1):''; }
const WK=['日','一','二','三','四','五','六'];
function fmtN(v){ const n=Number(v); return isFinite(n)&&String(v)!==''?(Math.round(n*10)/10).toString():''; }
function toast(m){ const e=document.createElement('div'); e.className='toast'; e.textContent=m; document.body.appendChild(e); setTimeout(()=>e.remove(),2600); }
/* 可還原刪除：提示＋「復原」（8 秒） */
function toastUndo(msg, onUndo){ document.querySelectorAll('.toast.undo').forEach(x=>x.remove());
  const el=document.createElement('div'); el.className='toast undo'; el.style.cssText+='display:flex;align-items:center;gap:12px';
  el.innerHTML=`<span>${esc(msg)}</span><button style="background:#fbf8f2;color:#1d1b17;border:none;border-radius:9px;padding:7px 12px;font-weight:800;min-height:36px">復原</button>`;
  el.querySelector('button').onclick=async()=>{ el.remove(); await onUndo(); }; document.body.appendChild(el); setTimeout(()=>el.remove(),8000); }
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

/* 教練密碼：同 coach.html 共用 sessionStorage is_cpass（只存本分頁，唔持久）*/
let PASS = (()=>{ try{ return sessionStorage.getItem('isptc_pass')||sessionStorage.getItem('is_cpass')||''; }catch(e){ return ''; } })();   // 分家後私訓 App 密碼可以同恆常班唔同（isptc_pass）
async function api(action, p, write, rid){
  const body=Object.assign({action, coachPass:PASS}, p||{});
  if(write) body.rid=rid||(Date.now().toString(36)+Math.random().toString(36).slice(2,10));   // 冪等：重試沿用同一 rid，後端唔會重複寫
  const tries=write?5:3;
  for(let i=0;i<tries;i++){
    try{ const c=new AbortController(), tm=setTimeout(()=>c.abort(), write?50000:30000);
      const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),signal:c.signal});
      clearTimeout(tm); const txt=await r.text();
      if(txt.charAt(0)==='{'){ const j=JSON.parse(txt); if(write && j.pending){ await new Promise(r=>setTimeout(r,3000)); continue; }
        if(j.err==='unknown action'){ await new Promise(r=>setTimeout(r,1500)); continue; }   // 慢請求斷線後瀏覽器改用冇參數 GET → 當網絡問題重試
        return j; }
    }catch(e){}
    await new Promise(r=>setTimeout(r,1000*(i+1)+(write?2000:0)));   // 寫入斷線：同一 rid 再送，後端只會執行一次
  }
  return {ok:false, err:write?'連線中斷，未肯定儲存咗未——請睇返記錄先':'網絡唔穩定，請再試', unsure:!!write};
}

/* ───────── 狀態 ───────── */
let L=null;            // cLoad
let G=null;            // cGroup
const C={ group:lsGet('isptc_group')||'', tab:'log', bodyMem:'', bodyMetric:'weight', hwEdit:null, acctEdit:null, exEdit:null, exQ:'', recOpen:null, dietMem:'', dDate:'', dietEdit:false, foodEdit:null, foodQ:'', slotForm:{}, habEdit:null, attEdit:null, pkgEdit:null };
const EXM=()=>{ const m={}; (L&&L.exercises||[]).forEach(e=>m[e.id]=e); return m; };
const exName=id=>{ const e=EXM()[id]; return e?e.zh:'（已刪動作）'; };
const exEn=id=>{ const e=EXM()[id]; return e?e.en||'':''; };
const memName=id=>{ const a=(L&&L.accounts||[]).find(x=>x.id===id); return a?(a.en||a.name):''; };
const members=()=>G&&G.members||[];

/* ───────── 啟動／登入 ───────── */
async function boot(){
  checkVersion();
  // 教練頁待辦箱直達：is-pt-coach.html#分頁[/私訓名]（例：#book、#hw/Keith%20%26%20Elaine）
  try{ const hs=decodeURIComponent(location.hash.slice(1)); if(hs){ const [tb,gp]=hs.split('/'); if(TABS.some(x=>x[0]===tb)) C.tab=tb; if(gp) C.group=gp; history.replaceState(null,'',location.pathname); } }catch(e){}
  if(!PASS){ renderLogin(); return; }
  $('#app').innerHTML='<div class="spin"></div>';
  const r=await api('cLoad');
  if(!r.ok){ if(/密碼/.test(r.err||'')){ PASS=''; try{ sessionStorage.removeItem('isptc_pass'); }catch(e){} renderLogin(r.err); } else $('#app').innerHTML=`<div class="empty" style="padding-top:30vh">${esc(r.err)}<br><br><button class="btn sm" onclick="boot()">↻ 重試</button></div>`; return; }
  L=r;
  if(!C.group || !L.groups.includes(C.group)) C.group=L.groups[0]||'';
  if(!C.group) C.tab='set';
  await loadGroup();
}
function renderLogin(err){
  $('#app').innerHTML=`<div style="max-width:380px;margin:0 auto;padding:22vh 22px 0">
    <div class="brand" style="font-size:18px;margin-bottom:18px"><img src="img/is-mark-96.png" style="width:36px;height:36px">INITIATE <span class="tag">PT 教練</span></div>
    <form onsubmit="doLogin(event)"><label class="lb">教練密碼</label><input class="in" type="password" id="pw" autocomplete="current-password">
    <div style="color:var(--red);font-size:13px;min-height:20px;margin:6px 2px">${esc(err||'')}</div>
    <button class="btn block">登入</button></form>
    <p class="small muted" style="margin-top:14px">由恆常班教練頁「⭐ 私訓」撳入嚟就唔使再輸入。</p></div>`;
}
async function doLogin(e){ e.preventDefault(); PASS=$('#pw').value.trim(); if(!PASS) return; try{ sessionStorage.setItem('isptc_pass',PASS); }catch(x){} boot(); }
async function checkVersion(){
  try{ const r=await fetch(location.pathname+'?_ck='+Date.now(),{cache:'no-store'}); if(!r.ok) return;
    const m=(await r.text()).match(/FRONTEND_VERSION\s*=\s*'([^']+)'/);
    if(m && m[1]!==FRONTEND_VERSION){ let tr=null; try{ tr=sessionStorage.getItem('isptc_upd'); }catch(e){} if(tr===m[1]) return; try{ sessionStorage.setItem('isptc_upd',m[1]); }catch(e){}
      const busy=()=>C.hwEdit||C.acctEdit||C.habEdit||C.exEdit||C.foodEdit||C.dietEdit||[...document.querySelectorAll('#main input,#main textarea')].some(el=>el.value&&el.type!=='date'&&!el.dataset.f&&!el.dataset.b);
      const go=()=>{ if(busy()){ setTimeout(go, 20000); return; } toast('🔄 有新版本，更新中…'); setTimeout(()=>location.replace(location.pathname+'?v='+encodeURIComponent(m[1])),900); }; go(); } }catch(e){}
}
async function loadGroup(){
  if(!C.group){ G=null; render(); return; }
  lsSet('isptc_group', C.group);
  if(!G || G.group!==C.group){ G=null; render(); }
  const want=C.group, r=await api('cGroup',{group:want});
  if(want!==C.group) return;   // 期間切咗組：唔好用舊組資料（否則儲存今堂會寫錯人）
  if(!r.ok){ toast(r.err); return; }
  G=r; if(!C.bodyMem || !members().some(m=>m.id===C.bodyMem)) C.bodyMem=(members()[0]||{}).id||'';
  render();
}
async function reloadAll(){ const r=await api('cLoad'); if(r.ok){ L=r; } await loadGroup(); }
function pickGroup(g){ C.group=g; C.hwEdit=null; C.recOpen=null; C.dietEdit=false; C.habEdit=null; C.dietMem=''; C.dDate=''; C.bodyMem=''; loadGroup(); }

/* ───────── 外殼 ───────── */
const TABS=[['log','📝 今堂'],['book','📅 預約'],['att','🎫 出席'],['rec','📚 記錄'],['hw','📋 功課'],['body','📈 身體'],['diet','🍽 飲食'],['cm','📥 總覽'],['set','⚙️ 設定']];
function render(){
  if(!L){ return; }
  const unread=(L.recentComments||[]).length;
  const y=window.scrollY, keep={}, ae=document.activeElement, focusId=ae&&ae.id&&ae.closest&&ae.closest('#main')?ae.id:'';
  document.querySelectorAll('#main input[id],#main textarea[id]').forEach(el=>{ if(el.type!=='checkbox' && el.value) keep[el.id]=el.value; });
  $('#app').innerHTML=`<header class="top"><div class="top-in">
    <div class="row"><div class="brand"><img src="img/is-mark-96.png">INITIATE <span class="tag">PT 教練</span></div><span class="sp"></span>
      <a class="lnk" href="coach.html" style="text-decoration:none">‹ 教練頁</a></div>
    <div class="chips">${L.groups.map(g=>`<button class="chip ${g===C.group?'on':''}" onclick="pickGroup('${esc(g).replace(/'/g,"\\'")}')">${esc(g)}</button>`).join('')||'<span class="small muted">未有學員帳戶 → 去「設定」開帳戶</span>'}</div>
    <div class="tabs">${TABS.map(t=>`<button class="${C.tab===t[0]?'on':''}" onclick="C.tab='${t[0]}';render();window.scrollTo(0,0)">${t[1]}${t[0]==='cm'&&unread?` <span class="badge gold">${unread}</span>`:''}</button>`).join('')}</div>
  </div></header>
  <main class="wrap" id="main"></main>`;
  const needG = ['log','att','rec','hw','body','diet'].includes(C.tab);
  if(needG && !C.group){ $('#main').innerHTML='<div class="empty">未有學員帳戶。去「⚙️ 設定」開帳戶先（私訓名要同 #4 私訓記錄一樣，出席／套票先會自動連上）。</div>'; return; }
  if(needG && !G){ $('#main').innerHTML='<div class="spin"></div>'; return; }
  $('#main').innerHTML=({log:vLog, book:vBook, att:vAtt, rec:vRec, hw:()=>vHw()+(C.hwEdit?'':vPlanC()), body:vBody, diet:vDiet, cm:vCm, set:vSet}[C.tab])();
  Object.keys(keep).forEach(id=>{ const el=document.getElementById(id); if(el && !el.value) el.value=keep[id]; });
  if(focusId){ const el=document.getElementById(focusId); if(el) try{ el.focus({preventScroll:true}); }catch(e){} }
  window.scrollTo(0,y);
  if(C.tab==='log') bindDraftInputs();
}
function groupHeader(){
  const pk=(G.pt&&G.pt.packages)||[], act=pk.filter(p=>Number(p.remaining)>0 && !(Number(p.daysToExp)<0)), left=act.reduce((a,p)=>a+Number(p.remaining||0),0);
  const cur=act[0];
  return `<div class="row" style="flex-wrap:wrap;margin-top:12px">${members().map(m=>`<span class="mem">👤 ${esc(m.name)}${m.en?` <span class="muted small">${esc(m.en)}</span>`:''}</span>`).join('')}<span class="sp"></span>
    ${G.pt&&G.pt.ok?`<span class="badge ${left<=1?'red':''}">套票剩 ${left} 節${cur&&cur.expiry?` · 到期 ${fmtD(cur.expiry)}`:''}</span>`:'<span class="badge grey">#4 套票未連上</span>'}</div>`;
}

/* ───────── 記錄今堂（draft 自動存本機，上堂途中斷線唔會失）───────── */
const dKey=()=>'isptc_draft_'+C.group;
function getDraft(){ let d=lsGet(dKey()); if(!d) d={id:'', date:isoToday(), title:'', note:'', blocks:[]}; return d; }
function putDraft(d){ lsSet(dKey(), d); }
function lastSetsFor(ex, beforeDate, excludeId){
  const s=(G.sessions||[]).filter(x=>x.id!==excludeId && (!beforeDate || x.date<=beforeDate)).find(x=>x.sets.some(y=>y.ex===ex));
  if(!s) return null; return {date:s.date, sets:s.sets.filter(y=>y.ex===ex)};
}

  const sets=[]; d.blocks.forEach((b,bi)=>{ let n=0; b.sets.forEach(x=>{ if(String(x.kg).trim()===''&&String(x.reps).trim()===''&&String(x.sec||'').trim()==='') return; n++; sets.push({order:bi, ex:b.ex, set:n, kg:x.kg, unit:b.unit==='lb'?'lb':'', raw:b.unit==='lb'?x.kg:'', reps:x.reps, sec:b.timed?x.sec:'', rpe:b.rpe?(x.rpe||''):'', acct:x.acct||''}); }); });
  if(!sets.length){ toast('未有任何組數'); return; }
  const D0=LG[C.group], a=d.att, doAtt=!!(a && a.on && D0 && d.date<=isoToday() && !(D0.sessions||[]).some(x=>x.date===d.date));
  if(doAtt && (!okTime(a.time) || !a.centre)){ toast('「同時記出席」要填時間同地點（或者剔走唔記）'); return; }
  const btn=$('#sv'); if(btn.disabled) return; btn.disabled=true; btn.textContent='儲存中…';
  if(!d.rid){ d.rid='ses'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); putDraft(d); }   // 同一份草稿重按都用同一個 rid → 後端唔會變兩堂
  const r=await api('cSessionSave',{id:d.id, group:C.group, date:d.date, title:d.title, note:d.note, sets:JSON.stringify(sets)}, true, d.rid);
  if(!r.ok){ btn.disabled=false; btn.textContent='💾 儲存'; toast(r.err); return; }
  lsDel(dKey());
  if(doAtt){ const pa=attPeopleArgs(a.people), label=nextPkgLabel(D0, d.date).replace('會扣','已扣');
    const ar=await api('cAttSave',{group:C.group, date:d.date, time:a.time.replace(/\s/g,''), venue:[a.centre, a.room, a.time.replace(/\s/g,'')].join('｜'), people:pa.people, note:pa.note, ses:r.id, src:'今堂'}, true, d.rid+'-att');
    if(ar.ok) toast('✓ 已儲存＋記咗出席（'+label+'）'); else if(ar.dup) toast('✓ 已儲存（'+fmtD(d.date)+' 之前已記出席，冇重複扣）'); else toast('⚠️ 訓練已儲存，但出席未記：'+ar.err+'——去 🎫 出席補記');
    delete LG[C.group]; LGALL=null; }
  else toast('✓ 已儲存，學員即刻睇到');
  C.tab='rec'; C.recOpen=r.id; await loadGroup();
}

/* ───────── 動作揀選器 ───────── */
function openPicker(cb){
  const ov=document.createElement('div'); ov.className='ov'; ov.onclick=e=>{ if(e.target===ov) ov.remove(); };
  const cats=[...new Set((L.exercises||[]).map(e=>e.cat).filter(Boolean))];
  let cat='', q='';
  const used={}; (G&&G.sessions||[]).forEach(s=>s.sets.forEach(x=>used[x.ex]=(used[x.ex]||0)+1));
  ov.innerHTML=`<div class="sheet"><div class="row"><b style="font-size:17px">揀動作</b><span class="sp"></span><button class="btn ghost xs" onclick="this.closest('.ov').remove()">✕</button></div>
    <input class="in" id="pq" placeholder="🔍 搜尋（中／英）" style="margin-top:10px">
    <div class="chips" id="pc"></div><div class="body" id="pl"></div></div>`;
  document.body.appendChild(ov);
  const draw=()=>{
    ov.querySelector('#pc').innerHTML=[['','全部'],['__used','⭐ 常用']].concat(cats.map(c=>[c,c])).map(c=>`<button class="chip ${cat===c[0]?'on':''}" data-c="${esc(c[0])}">${esc(c[1])}</button>`).join('');
    ov.querySelectorAll('#pc .chip').forEach(b=>b.onclick=()=>{ cat=b.dataset.c; draw(); });
    const ql=q.toLowerCase();
    let list=(L.exercises||[]).filter(e=>(cat===''||(cat==='__used'?used[e.id]:e.cat===cat)) && (!ql||(e.zh+' '+e.en+' '+e.cat+' '+e.eq).toLowerCase().includes(ql)));
    if(cat==='__used') list.sort((a,b)=>(used[b.id]||0)-(used[a.id]||0));
    ov.querySelector('#pl').innerHTML=list.map(e=>`<div class="pick" data-id="${e.id}"><div style="flex:1;min-width:0"><b>${esc(e.zh)}</b> <span class="small muted">${esc(e.en)}</span><div class="small muted">${esc(e.cat)}${e.eq?' · '+esc(e.eq):''}</div></div>${used[e.id]?`<span class="badge grey">${used[e.id]}</span>`:''}</div>`).join('')
      + (q?`<div class="pick" id="pnew"><b style="color:var(--teal)">＋ 新增動作「${esc(q)}」</b></div>`:'')
      + (!list.length&&!q?'<div class="empty">冇動作</div>':'');
    ov.querySelectorAll('#pl .pick[data-id]').forEach(el=>el.onclick=()=>{ ov.remove(); cb(el.dataset.id); });
    const pn=ov.querySelector('#pnew'); if(pn) pn.onclick=async()=>{ pn.innerHTML='新增中…'; const r=await api('cExerciseSave',{zh:q.trim()}, true); if(!r.ok){ toast(r.err); draw(); return; }
      L.exercises.push({id:r.id, zh:q.trim(), en:'', cat:'', eq:'', cue:'', cueEn:'', video:''}); ov.remove(); cb(r.id); toast('已加入動作庫（之後可喺設定補英文名／片）'); };
  };
  ov.querySelector('#pq').oninput=e=>{ q=e.target.value.trim(); draw(); };
  draw(); setTimeout(()=>ov.querySelector('#pq').focus(),60);
}

/* ───────── 訓練記錄 ───────── */
function sesLines(s){
  const by={}, order=[]; s.sets.forEach(x=>{ const k=x.order+'|'+x.ex; if(!by[k]){ by[k]={ex:x.ex, sets:[]}; order.push(k); } by[k].sets.push(x); });
  return order.map(k=>{ const b=by[k]; return `<div class="sline"><b>${esc(exName(b.ex))}</b> <span class="muted num">${b.sets.map(x=>setTxt(x)+(x.acct?`<span class="small">(${esc(memName(x.acct))})</span>`:'')).join(' · ')}</span></div>`; }).join('');
}
function vRec(){
  const list=G.sessions||[];
  let h=groupHeader()+vPhaseC()+vBalanceC()+`<div class="h2">訓練記錄（${list.length} 堂）</div>`;
  const att=(G.pt&&G.pt.sessions||[]).map(x=>x.date), logged=new Set(list.map(s=>s.date));
  const miss=att.filter(d=>!logged.has(d)).sort().reverse().slice(0,5);
  if(miss.length) h+=`<div class="card" style="border-color:rgba(201,106,61,.35)"><div class="small" style="color:var(--gold);font-weight:700">有出席但未記訓練內容：</div><div class="row" style="flex-wrap:wrap;margin-top:6px">${miss.map(d=>`<button class="chip" onclick="startFor('${d}')">${fmtD(d)} ＋記錄</button>`).join('')}</div></div>`;
  if(!list.length) return h+'<div class="empty">未有記錄。去「📝 今堂」開始。</div>';
  list.forEach(s=>{
    const open=C.recOpen===s.id, cms=(G.comments||[]).filter(c=>c.type==='session'&&c.target===s.id);
    const fl=(G.feels||[]).filter(f=>f.sid===s.id), fx=fl.map(f=>{ const m=members().find(x=>x.id===f.acct)||{}; return `${esc(m.en||m.name||'')} RPE ${f.rpe}${f.enjoy?' '+['😣','🙁','😐','🙂','😄'][f.enjoy-1]:''}`; }).join(' · ');   // 第二期：學員堂後感受
    h+=`<div class="card"><div class="row" style="cursor:pointer" onclick="C.recOpen=${open?'null':`'${s.id}'`};render()"><div><b>${fmtD(s.date)}（${WK[parseISO(s.date).getDay()]}）</b>${s.title?` · ${esc(s.title)}`:''}<div class="small muted">${new Set(s.sets.map(x=>x.order+'|'+x.ex)).size} 個動作 · ${s.sets.length} 組${cms.length?` · 💬 ${cms.length}`:''}${fx?` · 💪 ${fx}`:''}</div></div><span class="sp"></span><span class="muted">${open?'▾':'▸'}</span></div>
      ${open?`<div style="margin-top:10px">${sesLines(s)}</div>${s.note?`<div class="small muted" style="margin-top:6px">📝 ${esc(s.note)}</div>`:''}
        <div class="row" style="margin-top:10px"><button class="btn ghost sm" onclick="editSes('${s.id}')">✎ 修改</button><button class="btn warn sm" onclick="delSes('${s.id}')">刪除</button></div>
        ${thread('session', s.id, '')}`:''}</div>`;
  });
  return h;
}
function startFor(date){ const d=getDraft(); if(d.blocks.length && !confirm('記錄今堂有未儲存內容，要覆蓋？')) return; putDraft({id:'', date, title:'', note:'', blocks:[]}); C.tab='log'; render(); window.scrollTo(0,0); }
function editSes(id){
  const s=G.sessions.find(x=>x.id===id); if(!s) return;
  const d=getDraft(); if(d.blocks.length && d.id!==id && !confirm('記錄今堂有未儲存內容，要覆蓋？')) return;
  const by={}, order=[]; s.sets.forEach(x=>{ const k=x.order+'|'+x.ex; if(!by[k]){ by[k]={ex:x.ex, timed:false, unit:'kg', sets:[]}; order.push(k); } by[k].sets.push({kg:wIn(x), reps:x.reps, sec:x.sec, rpe:x.rpe||'', acct:x.acct||''}); if(x.unit==='lb') by[k].unit='lb'; if(x.sec!=='') by[k].timed=true; if(x.rpe) by[k].rpe=true; });
  putDraft({id:s.id, date:s.date, title:s.title||'', note:s.note||'', blocks:order.map(k=>by[k])}); C.tab='log'; render(); window.scrollTo(0,0);
}
async function delSes(id){ const s=G.sessions.find(x=>x.id===id); if(!confirm(`刪除 ${fmtD(s.date)} 嘅訓練記錄？學員會睇唔到。`)) return;
  const r=await api('cSessionDelete',{id}, true); if(!r.ok){ toast(r.err); return; } loadGroup();
  toastUndo('已刪除訓練記錄', async()=>{ const u=await api('cSessionRestore',{id}, true); if(!u.ok){ toast(u.err); return; } toast('已復原'); loadGroup(); }); }

function thread(type, target, acct){
  const cms=(G.comments||[]).filter(c=>c.type===type && c.target===target).sort((a,b)=>String(a.at).localeCompare(String(b.at)));
  const id='r-'+type+'-'+target;

    ${qr(id)}<div class="tin"><input class="in" id="${id}" placeholder="寫俾學員…" maxlength="500"><button class="btn sm" onclick="reply('${type}','${target}','${acct||''}','${id}')">送出</button></div></div>`;
}
async function reply(type, target, acct, inputId){
  const el=document.getElementById(inputId), text=(el.value||'').trim(); if(!text) return; el.disabled=true;
  const r=await api('cComment',{type, target, acct, text}, true); el.disabled=false;

  el.value=''; if(G) G.comments=(G.comments||[]).concat([r.comment]);
  if(L.recentComments) L.recentComments=L.recentComments.filter(c=>!(c.type===type&&c.target===target));
  toast('已回覆'); render();
}

/* ───────── 身體數據 ───────── */
const METRICS=[['weight','體重','kg'],['fat','體脂','%'],['muscle','肌肉量','kg'],['waist','腰圍','cm'],['hip','臀圍','cm'],['chest','胸圍','cm'],['arm','手臂','cm'],['thigh','大腿','cm']];
function chartSVG(pts){
  if(pts.length<2) return '';
  const W=340,H=150,L0=34,R=10,T=12,B=22, vs=pts.map(p=>p.v), mn=Math.min(...vs), mx=Math.max(...vs), pd=(mx-mn)*.15||1, lo=mn-pd, hi=mx+pd;
  const t0=parseISO(pts[0].d).getTime(), sp=(parseISO(pts[pts.length-1].d).getTime()-t0)||1;
  const X=p=>L0+(parseISO(p.d).getTime()-t0)/sp*(W-L0-R), Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const path=pts.map((p,i)=>(i?'L':'M')+X(p).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${[hi-pd,lo+pd].map(v=>`<line x1="${L0}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(29,27,23,.06)"/><text x="${L0-5}" y="${Y(v)+4}" fill="#7a7368" font-size="10" text-anchor="end">${fmtN(v)}</text>`).join('')}
    <path d="${path}" fill="none" stroke="#1f4d3a" stroke-width="2.4"/>${pts.map(p=>`<circle cx="${X(p)}" cy="${Y(p.v)}" r="3" fill="#f4efe6" stroke="#1f4d3a" stroke-width="2"/>`).join('')}
    <text x="${L0}" y="${H-5}" fill="#7a7368" font-size="10">${fmtDM(pts[0].d)}</text><text x="${W-R}" y="${H-5}" fill="#7a7368" font-size="10" text-anchor="end">${fmtDM(pts[pts.length-1].d)}</text></svg>`;
}

  const list=m.body||[], avail=METRICS.filter(k=>list.some(b=>b[k[0]]!==''&&b[k[0]]!=null));
  if(avail.length && !avail.some(k=>k[0]===C.bodyMetric)) C.bodyMetric=avail[0][0];
  const k=METRICS.find(x=>x[0]===C.bodyMetric)||METRICS[0], pts=list.filter(b=>b[k[0]]!==''&&b[k[0]]!=null).map(b=>({d:b.date, v:Number(b[k[0]])}));

  if(avail.length) h+=`<div class="chips">${avail.map(x=>`<button class="chip ${x[0]===k[0]?'on':''}" onclick="C.bodyMetric='${x[0]}';render()">${x[1]}</button>`).join('')}</div>
    <div class="card"><div class="row"><b>${k[1]}</b><span class="sp"></span><span class="num" style="font-size:22px;font-weight:900">${pts.length?fmtN(pts[pts.length-1].v):'—'}</span><span class="muted">${k[2]}</span></div>${chartSVG(pts)}</div>`;
  h+=vTestsC(m)+vAssessC(m);

function once(key, fn){ if(LOADING[key]) return LOADING[key]; LOADING[key]=fn().finally(()=>{ delete LOADING[key]; }); return LOADING[key]; }
async function loadDietC(acct, force){

async function loadPhotosC(){
  const ids=[...new Set([...document.querySelectorAll('img[data-phc]')].map(el=>el.dataset.phc))];
  ids.forEach(id=>{ if(PHC[id]) document.querySelectorAll(`img[data-phc="${id}"]`).forEach(x=>x.src=PHC[id]); });
  const todo=ids.filter(id=>!PHC[id] && !PHC['_'+id]); todo.forEach(id=>PHC['_'+id]=1);
  const worker=async()=>{ while(todo.length){ const id=todo.shift(); const r=await api('cPhoto',{id}); delete PHC['_'+id];
    if(r.ok){ PHC[id]=r.data; document.querySelectorAll(`img[data-phc="${id}"]`).forEach(x=>x.src=r.data); } } };
  await Promise.all([worker(),worker(),worker(),worker()]);   // 4 張並行

/* ───────── 第三階段：預約時段管理 ───────── */
let SL=null;   // cSlots
async function loadSlots(){ return once('slots', async()=>{ const from=C.weekStart&&C.weekStart<addDays(isoToday(),-7)?C.weekStart:''; const r=await api('cSlots', from?{from}:{}); if(!r.ok){ toast(r.err); return; } SL=r; SL._from=from; if(C.tab==='book'||C.tab==='log') render(); }); }
/* 週曆：7 日 × 時間，一眼睇邊個約咗（撳空格代約、撳已約取消） */
function weekCal(){
  const ws=C.weekStart||mondayOf(isoToday()), days=Array.from({length:7},(_,i)=>addDays(ws,i)), bk={}; (SL.bookings||[]).forEach(b=>{ if(b.status==='已約') bk[b.slot]=b; });
  const sl=(SL.slots||[]).filter(s=>s.date>=days[0] && s.date<=days[6]), times=[...new Set(sl.map(s=>s.start))].sort();
  const nowKey=isoToday()+' '+pad(new Date().getHours())+':'+pad(new Date().getMinutes());
  let h=`<div class="card" style="padding:10px 8px"><div class="row" style="margin-bottom:8px"><button class="btn ghost xs" onclick="C.weekStart=addDays('${ws}',-7);if(C.weekStart<addDays(isoToday(),-7))SL=null;render()">‹</button><span class="sp"></span><b>${fmtD(days[0])} – ${fmtDM(days[6])}</b><span class="sp"></span><button class="btn ghost xs" onclick="C.weekStart=addDays('${ws}',7);render()">›</button></div>`;
  if(!times.length) return h+'<div class="small muted" style="padding:10px 4px">呢個星期未有時段</div></div>';
  h+=`<div style="display:grid;grid-template-columns:40px repeat(7,1fr);gap:3px;font-size:11px">`+['',...days.map(d=>`<div style="text-align:center;color:${d===isoToday()?'var(--teal)':'var(--mut)'};font-weight:800">${WK[parseISO(d).getDay()]}<br>${parseISO(d).getDate()}</div>`)].map(x=>x===''?'<div></div>':x).join('');
  times.forEach(t=>{ h+=`<div class="num muted" style="align-self:center">${t}</div>`;
    days.forEach(d=>{ const s=sl.find(x=>x.date===d && x.start===t); if(!s){ h+='<div></div>'; return; } const b=bk[s.id], past=(d+' '+t)<=nowKey;
      h+= b ? `<button onclick="${past?'':`coachCancelBk('${b.id}')`}" style="border:none;border-radius:7px;padding:6px 2px;background:${past?'rgba(31,77,58,.25)':'var(--teal)'};color:#fbf8f2;font-weight:800;font-size:10.5px;line-height:1.2;overflow:hidden;min-height:38px">${esc(String(b.group).slice(0,6))}</button>`
        : `<button ${past?'disabled':''} onclick="coachBook('${s.id}')" style="border:1px dashed var(--line2);border-radius:7px;background:transparent;color:var(--mut);font-size:10.5px;min-height:38px;${past?'opacity:.35':''}">空</button>`; }); });
  return h+`</div><div class="small muted" style="margin-top:8px">撳「空」代約；撳名取消預約。</div></div>`;
}
function vBook(){
  if(!SL){ loadSlots(); return '<div class="spin"></div>'; }
  const today=isoToday(), f=C.slotForm, groups=(L.groups||[]);
  const bkBy={}; (SL.bookings||[]).forEach(b=>{ (bkBy[b.slot]=bkBy[b.slot]||[]).push(b); });
  const venues=[...new Set((SL.slots||[]).map(s=>s.venue).filter(Boolean))];
  let h=`<div class="row" style="margin-top:14px"><div class="h2" style="margin:0">預約時段</div><span class="sp"></span><button class="chip ${C.bookView!=='list'?'on':''}" onclick="C.bookView='week';render()">週曆</button><button class="chip ${C.bookView==='list'?'on':''}" onclick="C.bookView='list';render()">列表</button><button class="btn ghost xs" onclick="SL=null;render()">↻</button></div>
    <div class="small muted" style="margin:4px 2px 0">學員開課前 ${SL.rules.cutoffH} 小時截止預約；${SL.rules.cancelH} 小時前可自己取消。預約只係預留，出席照舊喺教練頁私訓記錄。</div>`;
  const hasFuture=(SL.slots||[]).some(x=>x.date>=today); if(C.slotOpen==null) C.slotOpen=!hasFuture;   // 冇時段先預設打開
  if(!C.slotOpen) h+=`<button class="btn ghost block" style="margin-top:12px;border-style:dashed" onclick="C.slotOpen=true;render()">＋ 開時段</button>`;
  else h+=`<div class="card"><div class="row"><b>＋ 開時段</b><span class="sp"></span><button class="btn ghost xs" onclick="C.slotOpen=false;render()">收起</button></div>
    <div class="fgrid" style="margin-top:8px"><div><label class="lb">第一日</label><input class="in" type="date" id="sf-date" value="${esc(f.date||today)}" min="${today}"></div>
      <div><label class="lb">重複（每週）</label><select class="in" id="sf-rep">${[1,2,3,4,6,8,12].map(n=>`<option value="${n}" ${Number(f.repeat)===n?'selected':''}>${n===1?'只呢日':n+' 週'}</option>`).join('')}</select></div>
      <div><label class="lb">開始時間（逗號分隔）</label><input class="in num" id="sf-st" value="${esc(f.starts||'')}" placeholder="18:00, 19:00"></div>
      <div><label class="lb">每堂</label><select class="in" id="sf-dur">${[45,60,75,90,120].map(n=>`<option value="${n}" ${Number(f.dur||60)===n?'selected':''}>${n} 分鐘</option>`).join('')}</select></div>
      <div><label class="lb">地點</label><input class="in" id="sf-ven" list="venl" value="${esc(f.venue||'')}"><datalist id="venl">${venues.map(v=>`<option value="${esc(v)}">`).join('')}</datalist></div>
      <div><label class="lb">只開俾（可留空＝所有學員）</label><select class="in" id="sf-only" onchange="document.getElementById('sf-bkrow').style.display=this.value?'':'none'"><option value="">所有學員</option>${groups.map(g=>`<option ${f.only===g?'selected':''}>${esc(g)}</option>`).join('')}</select></div></div>
    <label class="row small" id="sf-bkrow" style="margin-top:10px;gap:8px;${f.only?'':'display:none'}"><input type="checkbox" id="sf-bk" ${f.bookFor?'checked':''} style="width:22px;height:22px"> 同時代約晒俾呢位學員（固定學員一次過約好；代約唔扣堂）</label>
    <label class="lb" style="margin-top:10px">每週邊幾日（唔揀＝只係第一日嗰個星期幾）</label>
    <div class="row" id="sf-wd" style="gap:6px">${['一','二','三','四','五','六','日'].map((w,i)=>`<button type="button" class="chip ${(f.wd||[]).includes(i+1)?'on':''}" style="flex:1;justify-content:center;padding:8px 0" onclick="C.slotForm.wd=C.slotForm.wd||[];const k=${i+1},a=C.slotForm.wd,j=a.indexOf(k);j<0?a.push(k):a.splice(j,1);this.classList.toggle('on')">${w}</button>`).join('')}</div>
    <button class="btn block" style="margin-top:10px" id="sf-go" onclick="addSlots()">開時段</button></div>`;
  if(C.bookView!=='list') return h+weekCal();
  const list=(SL.slots||[]).filter(s=>s.date>=today), byD={}; list.forEach(s=>(byD[s.date]=byD[s.date]||[]).push(s));
  const ds=Object.keys(byD).sort();
  if(!ds.length) h+='<div class="empty">未有將來時段</div>';
  const nowKey=isoToday()+' '+pad(new Date().getHours())+':'+pad(new Date().getMinutes());
  ds.forEach(d=>{ h+=`<div class="card"><b>${fmtD(d)}（${WK[parseISO(d).getDay()]}）</b>${byD[d].map(s=>{ const bs=bkBy[s.id]||[], act=bs.find(b=>b.status==='已約'), cx=bs.filter(b=>b.status!=='已約'), past=(s.date+' '+s.start)<=nowKey;
      return `<div class="li"><div style="width:96px"><b class="num">${s.start}</b><span class="small muted">–${s.end}</span></div><div style="flex:1;min-width:0">
        ${act?`<span class="badge">✓ ${esc(act.group)}</span>${act.note?` <span class="small muted">${esc(act.note)}</span>`:''}`:`<span class="small muted">空</span>`}
        <div class="small muted">${esc(s.venue||'')}${s.only?' · 只開俾 '+esc(s.only):''}${cx.length?` · 曾取消 ${cx.map(b=>esc(b.group)+(b.status==='教練取消'?'(教練)':'')).join('、')}`:''}</div></div>
        ${past?'<span class="small muted">已過</span>':act?`<button class="btn warn xs" onclick="coachCancelBk('${act.id}')">取消預約</button>`:`<button class="btn ghost xs" onclick="coachBook('${s.id}')">代約</button><button class="btn warn xs" style="margin-left:4px" onclick="delSlot('${s.id}')">刪</button>`}</div>`; }).join('')}</div>`; });
  return h;
}
async function addSlots(){
  const v=id=>$(id).value.trim(), wd=(C.slotForm.wd||[]).slice().sort(); C.slotForm={date:v('#sf-date'), repeat:v('#sf-rep'), starts:v('#sf-st'), dur:v('#sf-dur'), venue:v('#sf-ven'), only:v('#sf-only'), wd:wd, weekdays:wd.join(','), bookFor:($('#sf-bk')&&$('#sf-bk').checked&&v('#sf-only'))?v('#sf-only'):''};
  if(!C.slotForm.starts){ toast('要填開始時間'); return; }
  $('#sf-go').disabled=true;
  const r=await api('cSlotAdd', C.slotForm, true);
  if(!r.ok){ $('#sf-go').disabled=false; toast(r.err); return; }
  toast(`已開 ${r.added} 個時段${r.skipped?`（${r.skipped} 個重複／過咗略過）`:''}${r.booked!=null?`，代約 ${r.booked} 個${r.bookErr?'（有啲約唔到：'+r.bookErr+'）':''}`:''}`); C.slotForm.starts=''; C.slotOpen=false; SL=null; render();
}
function coachBook(slotId){
  const s=(SL.slots||[]).find(x=>x.id===slotId), gs=(L.groups||[]).filter(g=>!s.only||g===s.only); if(!gs.length) return;
  let pick=s.only||(gs.includes(C.group)?C.group:'');
  const ov=document.createElement('div'); ov.className='ov'; ov.onclick=e=>{ if(e.target===ov) ov.remove(); };
  ov.innerHTML=`<div class="sheet" style="height:auto;max-height:80vh;padding-bottom:calc(18px + var(--safe-b))"><div class="row"><b style="font-size:17px">📅 代約</b><span class="sp"></span><button class="btn ghost xs" id="cb-x">✕</button></div>
    <div class="small muted" style="margin:6px 0 10px">${fmtD(s.date)}（${WK[parseISO(s.date).getDay()]}）${s.start}–${s.end} ${esc(s.venue||'')}</div>
    <div class="body"><div style="display:flex;flex-wrap:wrap;gap:8px" id="cb-g">${gs.map(g=>`<button class="chip" data-g="${esc(g)}">${esc(g)}</button>`).join('')}</div></div>
    <button class="btn block" style="margin-top:14px" id="cb-go">確認代約</button></div>`;
  document.body.appendChild(ov);
  const paint=()=>ov.querySelectorAll('#cb-g .chip').forEach(b=>b.classList.toggle('on', b.dataset.g===pick));
  ov.querySelectorAll('#cb-g .chip').forEach(b=>b.onclick=()=>{ pick=b.dataset.g; paint(); }); paint();
  ov.querySelector('#cb-x').onclick=()=>ov.remove();
  ov.querySelector('#cb-go').onclick=async()=>{ if(!pick){ toast('揀學員先'); return; } const b=ov.querySelector('#cb-go'); if(b.disabled) return; b.disabled=true; b.textContent='代約中…';
    const r=await api('cBook',{slotId, group:pick}, true); if(!r.ok){ b.disabled=false; b.textContent='確認代約'; toast(r.err); return; } ov.remove(); toast('已代約 '+pick); SL=null; render(); };
}
async function coachCancelBk(id){
  const reason=prompt('取消原因（學員會睇到，可留空）：',''); if(reason===null) return;
  const r=await api('cBookCancel',{id, reason}, true); if(!r.ok){ toast(r.err); return; } toast('已取消，時段重新開放'); SL=null; render();
}
async function delSlot(id){
  if(!confirm('刪除呢個時段？')) return;
  const r=await api('cSlotDel',{id}, true); if(!r.ok){ toast(r.err); return; } toast('已刪除'); SL=null; render();
}

/* ───────── 第三階段：習慣＋每週回顧（功課分頁下面）───────── */
const PLC={};   // group → cPlan
const CK_LB={'睡眠':'睡眠','精神':'精神','壓力':'壓力(5=輕鬆)','恢復':'恢復','訓練':'跟訓練','飲食':'跟飲食','饑餓感':'飽足(5=唔餓)','酸痛':'酸痛(舊)'};
async function loadPlanC(g, force){ if(PLC[g] && !force) return; return once('plan'+g, async()=>{ const r=await api('cPlan',{group:g}); if(!r.ok){ toast(r.err); return; } PLC[g]=r; if(C.tab==='log'||C.tab==='hw') render(); }); }
function vPlanC(){
  const P=PLC[C.group]; if(!P){ loadPlanC(C.group); return '<div class="spin"></div>'; }
  const today=isoToday(), days=Array.from({length:7},(_,i)=>addDays(today,i-6));
  let h=`<div class="h2" style="margin-top:24px">📝 每週回顧</div>`;
  P.members.forEach(m=>{ const nm=memName(m.id)||'';
    if(!m.checkins.length){ h+=`<div class="card small muted">${esc(nm)}：未交過回顧</div>`; return; }
    m.checkins.slice(0,4).forEach(c=>{ const low=P.keys.filter(k=>Number(c[k])&&Number(c[k])<=2), high=[];   // 全部 5＝好：≤2 就要留意
      h+=`<div class="card"><div class="row"><b>${esc(nm)}</b><span class="small muted">週 ${fmtD(c.week)}</span><span class="sp"></span>${c.pain==='是'?`<span class="badge red">🩹 ${esc(c.painWhere||'關節痛')}</span>`:''}${low.length?'<span class="badge red">要留意</span>':''}</div>
        <div class="small" style="margin-top:6px">${P.keys.filter(k=>c[k]).map(k=>`${CK_LB[k]||k} <b class="num" style="color:${(low.includes(k)||high.includes(k))?'var(--red)':'var(--text)'}">${c[k]}</b>`).join(' · ')}${c.weight?` · 體重 <b class="num">${fmtN(c.weight)}</b>kg`:''}</div>
        ${c.text?`<div style="white-space:pre-wrap;margin-top:6px">${esc(c.text)}</div>`:''}${threadCk(c.id, m.id)}</div>`; }); });
  h+=`<div class="h2">✅ 每日習慣（近 7 日）</div>`;
  P.members.forEach(m=>{ const nm=memName(m.id)||'', ed=C.habEdit&&C.habEdit.acct===m.id;
    h+=`<div class="card"><div class="row"><b>${esc(nm)}</b>${m.custom?'':'<span class="badge grey">預設</span>'}<span class="sp"></span><button class="btn ghost xs" onclick="editHab('${m.id}')">${ed?'收起':'✎ 改項目'}</button></div>
      ${ed?habForm():m.habits.map(hb=>`<div class="small" style="margin-top:5px">${esc(hb.zh)}：<span style="letter-spacing:2px">${days.map(d=>(m.habitLog[d]||[]).includes(hb.id)?'<span style="color:var(--teal)">●</span>':'<span class="muted">○</span>').join('')}</span> <b>${days.filter(d=>(m.habitLog[d]||[]).includes(hb.id)).length}</b>/7</div>`).join('')}</div>`; });
  return h;
}
function threadCk(id, acct){
  const cms=(PLC[C.group].comments||[]).filter(c=>c.target===id).sort((a,b)=>String(a.at).localeCompare(String(b.at)));
  return `<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--line2)">${cms.map(c=>`<div class="msg ${c.by==='coach'?'co':'st'}"><div class="bub"><span class="who">${c.by==='coach'?'教練':esc(memName(c.acct)||'學員')} · ${fmtDM(c.at)}</span>${esc(c.text)}</div></div>`).join('')}
    ${qr('ckr-'+id)}<div class="tin"><input class="in" id="ckr-${id}" placeholder="回覆…" maxlength="500"><button class="btn sm" onclick="replyCk('${id}','${acct}')">送出</button></div></div>`;
}
async function replyCk(id, acct){
  const el=document.getElementById('ckr-'+id), text=(el.value||'').trim(); if(!text) return; el.disabled=true;
  const r=await api('cComment',{type:'checkin', target:id, acct, text}, true); el.disabled=false; if(!r.ok){ toast(r.err); return; }
  el.value=''; PLC[C.group].comments=(PLC[C.group].comments||[]).concat([r.comment]);
  if(L.recentComments) L.recentComments=L.recentComments.filter(c=>!(c.type==='checkin'&&c.target===id));
  toast('已回覆'); render();
}
function editHab(acct){ if(C.habEdit&&C.habEdit.acct===acct){ C.habEdit=null; render(); return; } const m=PLC[C.group].members.find(x=>x.id===acct); C.habEdit={acct, items:JSON.parse(JSON.stringify(m.habits))}; render(); }
function habForm(){ const f=C.habEdit;
  return `<div style="margin-top:8px">${f.items.map((it,i)=>`<div class="row" style="margin-top:6px"><input class="in" value="${esc(it.zh)}" oninput="C.habEdit.items[${i}].zh=this.value" placeholder="中文"><input class="in" value="${esc(it.en||'')}" oninput="C.habEdit.items[${i}].en=this.value" placeholder="English"><button class="ib" onclick="C.habEdit.items.splice(${i},1);render()">✕</button></div>`).join('')}
    <div class="row" style="margin-top:8px"><button class="btn ghost sm" onclick="C.habEdit.items.push({zh:'',en:''});render()" ${f.items.length>=8?'disabled':''}>＋ 項目</button><span class="sp"></span><button class="btn sm" id="hbsv" onclick="saveHab()">儲存</button></div>
    <div class="small muted" style="margin-top:6px">最多 8 項；改名唔會影響舊打卡（同一項保留）。</div></div>`; }
async function saveHab(){ const f=C.habEdit; $('#hbsv').disabled=true;
  const r=await api('cHabitSave',{acct:f.acct, items:JSON.stringify(f.items)}, true); if(!r.ok){ $('#hbsv').disabled=false; toast(r.err); return; }

/* ───────── 🎫 出席＋套票（2026-09-30 由 #4 抽離：成人私訓喺度記，唔再喺恆常班教練頁）───────── */
const LG={};            // group → cLedger
let LGALL=null;         // 全部（每月小結）
async function loadLG(g, force){ if(LG[g] && !force) return; return once('lg'+g, async()=>{ const r=await api('cLedger',{group:g}); if(!r.ok){ toast(r.err); return; } LG[g]=r; if(C.tab==='att'||C.tab==='log') render(); }); }
async function loadLGAll(force){ if(LGALL && !force) return; return once('lgall', async()=>{ const r=await api('cLedger',{}); if(!r.ok) return; LGALL=r; if(C.tab==='att') render(); }); }
const money=n=>'$'+Math.round(Number(n)||0).toLocaleString();
function vAtt(){
  const g=C.group, D=LG[g]; if(!D){ loadLG(g); return groupHeader()+'<div class="spin"></div>'; }
  let h=groupHeader();
  if(!D.on) h+=`<div class="card" style="border-color:rgba(201,106,61,.5)"><b style="color:var(--gold)">未切換：出席／套票仲係讀恆常班系統（#4）</b>
    <div class="small muted" style="margin:6px 0 10px">步驟：① 由 #4 匯入（先預覽）→ ② 核對剩餘節數一致 → ③ 切換。切換之後成人私訓喺呢度記出席；#4 只留鄧可澄、甘卓熹。</div>
    <div class="row" style="flex-wrap:wrap"><button class="btn sm" onclick="import4()">① 由 #4 匯入（預覽）</button>${D.packages.length?`<button class="btn sm" onclick="ledgerSwitch()">③ 切換</button>`:''}</div></div>`;
  // 今日／過去預約 → 一撳記出席
  const bkT=(SL&&SL.bookings||[]).filter(b=>b.status==='已約' && b.group===g), sl={}; (SL&&SL.slots||[]).forEach(s=>sl[s.id]=s);
  const done=new Set(D.sessions.map(s=>s.booking).filter(Boolean)), doneD=new Set(D.sessions.map(s=>s.date)), nowKey=isoToday()+' '+pad(new Date().getHours())+':'+pad(new Date().getMinutes());
  const due=bkT.map(b=>({b, s:sl[b.slot]})).filter(x=>x.s && (x.s.date+' '+x.s.start)<=nowKey && x.s.date>=addDays(isoToday(),-14) && !done.has(x.b.id) && !doneD.has(x.s.date));
  if(!SL) loadSlots();
  if(due.length) h+=`<div class="card"><div class="small muted" style="margin-bottom:6px">📅 已上堂嘅預約（未記出席）</div>${due.map(x=>`<div class="li"><div style="flex:1"><b>${fmtD(x.s.date)} ${x.s.start}</b> <span class="small muted">${esc(x.s.venue||'')}</span></div><button class="btn sm" onclick="attFromBk('${x.b.id}')">✓ 記出席</button></div>`).join('')}</div>`;
  // 套票
  const act=D.packages.filter(p=>p.remaining>0 && !(p.daysToExp<0)), left=act.reduce((a,p)=>a+p.remaining,0);
  h+=`<div class="row" style="margin-top:14px"><div class="h2" style="margin:0">🎫 套票（剩 ${left} 節）</div><span class="sp"></span><button class="btn sm" onclick="C.pkgEdit={id:'',sessions:'10',amount:'',buyDate:isoToday(),expiry:addMonthsI(isoToday(),6),pay:'',note:'',preUsed:'0'};render()">＋ 新套票</button></div>`;
  if(C.pkgEdit) h+=pkgForm();

function vSet(){
  let h=`<div class="card row"><div style="flex:1"><b>🔑 私訓 App 教練密碼</b><div class="small muted">${L.ledgerOn?'已同恆常班分家：呢個密碼只用喺私訓 App':'切換前跟恆常班密碼'}</div></div><button class="btn ghost sm" onclick="setCoachPass()">改密碼</button></div>`;
  h+=`<div class="h2">學員帳戶</div><div class="small muted" style="margin:0 2px 8px">「私訓名」要同 #4 私訓記錄一樣（例：Keith & Elaine），出席同套票先會自動顯示。1 對 2 就開兩個帳戶，私訓名填同一個。</div>`;
  if(C.acctEdit) h+=acctForm();
  else h+=`<button class="btn sm" onclick="C.acctEdit={id:'',name:'',en:'',last4:'',group:C.group||'',goal:'',status:'啟用'};render()">＋ 新帳戶</button>`;
  h+=`<div class="card">${(L.accounts||[]).map(a=>`<div class="li"><div style="flex:1;min-width:0"><b>${esc(a.name)}</b> ${a.en?`<span class="muted small">${esc(a.en)}</span>`:''} ${a.status==='停用'?'<span class="badge red">停用</span>':''}<div class="small muted">${esc(a.group)} · 電話尾 ${esc(a.last4)}${a.goal?' · 🎯 '+esc(a.goal):''}</div></div><button class="btn ghost xs" onclick="editAcct('${a.id}')">✎</button></div>`).join('')||'<div class="small muted">未有帳戶</div>'}</div>`;
  h+=`<div class="card"><b>📲 學員 app 網址</b><div class="small muted" style="margin:4px 0 8px;word-break:break-all">${STUDENT_URL}</div><div class="small muted">學員用登記姓名（中文或英文）＋電話後 4 位登入，可加到主畫面當 app 用。</div><button class="btn ghost sm" style="margin-top:8px" onclick="copyTxt('${STUDENT_URL}')">複製網址</button> <a class="btn ghost sm" style="text-decoration:none;margin-top:8px" href="is-pt.html" target="_blank">預覽</a></div>`;
  h+=`<div class="small muted" style="margin:4px 4px 0">#4 私訓出席／套票連線：${L.ptOk?'<span style="color:var(--teal)">✓ 正常</span>':'<span style="color:var(--red)">未連上</span>'}</div>`;
  // 動作庫
  h+=`<div class="h2" style="margin-top:24px">動作庫（${(L.exercises||[]).length}）</div><div class="small muted" style="margin:0 2px 8px">示範片而家係 YouTube 搜尋連結；之後影咗自己條片，貼連結入「影片」就會換。</div>`;
  if(C.exEdit) h+=exForm();
  else h+=`<div class="row"><input class="in" placeholder="🔍 搜尋" value="${esc(C.exQ)}" oninput="C.exQ=this.value;drawExList()"><button class="btn sm" onclick="C.exEdit={id:'',zh:'',en:'',cat:'',eq:'',cue:'',cueEn:'',video:''};render()">＋</button></div><div class="card" id="exl"></div>`;
  setTimeout(drawExList,0);
  if(!C.exEdit) h+=vFoodLib();
  return h;
}
function drawExList(){ const el=$('#exl'); if(!el) return; const q=C.exQ.trim().toLowerCase();
  el.innerHTML=(L.exercises||[]).filter(e=>!q||(e.zh+' '+e.en+' '+e.cat).toLowerCase().includes(q)).map(e=>`<div class="li"><div style="flex:1;min-width:0"><b>${esc(e.zh)}</b> <span class="small muted">${esc(e.en)}</span><div class="small muted">${esc(e.cat)}${e.video&&!/results\?search_query/.test(e.video)?' · 🎬 自家片':''}</div></div><button class="btn ghost xs" onclick="editEx('${e.id}')">✎</button></div>`).join(''); }
function editAcct(id){ const a=L.accounts.find(x=>x.id===id); C.acctEdit=Object.assign({},a); render(); window.scrollTo(0,0); }
function acctForm(){
  const f=C.acctEdit, names=[...new Set((L.ptNames||[]).concat(L.groups||[]))];
  return `<div class="card"><div class="fgrid"><div><label class="lb">中文姓名</label><input class="in" value="${esc(f.name)}" oninput="C.acctEdit.name=this.value"></div><div><label class="lb">英文名</label><input class="in" value="${esc(f.en)}" oninput="C.acctEdit.en=this.value"></div>
    <div><label class="lb">電話後 4 位</label><input class="in num" inputmode="numeric" maxlength="4" value="${esc(f.last4)}" oninput="C.acctEdit.last4=this.value"></div>
    <div><label class="lb">私訓名（#4）</label><input class="in" list="ptn" value="${esc(f.group)}" oninput="C.acctEdit.group=this.value"><datalist id="ptn">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist></div></div>
    <div class="fld" style="margin-top:10px"><label class="lb">目標（學員睇到）</label><input class="in" value="${esc(f.goal)}" oninput="C.acctEdit.goal=this.value" placeholder="例：減脂 5kg、硬拉 100kg"></div>
    <div class="fld"><label class="lb">狀態</label><select class="in" onchange="C.acctEdit.status=this.value"><option ${f.status!=='停用'?'selected':''}>啟用</option><option ${f.status==='停用'?'selected':''}>停用</option></select></div>
    ${f.id?`<label class="row small" style="margin-bottom:10px;gap:8px"><input type="checkbox" onchange="C.acctEdit.clearPin=this.checked?'1':''"> 清除學員自設 PIN（學員唔記得 PIN 時用；之後返用電話後 4 位登入）</label>`:''}
    <div class="row"><button class="btn ghost" onclick="C.acctEdit=null;render()">取消</button><span class="sp"></span><button class="btn" id="acsv" onclick="saveAcct()">儲存帳戶</button></div></div>`;
}
async function saveAcct(force){ const f=C.acctEdit; $('#acsv').disabled=true;
  const r=await api('cAccountSave',{id:f.id, name:f.name, en:f.en, last4:f.last4, group:f.group, goal:f.goal, status:f.status, clearPin:f.clearPin||'', force:force?'1':''}, true);
  if(!r.ok){ $('#acsv').disabled=false; if(r.dupCode && confirm(r.err+'\n\n撳「確定」照樣儲存。')) return saveAcct(true); toast(r.err); return; }
  if(!C.group) C.group=f.group.trim();
  const isNew=!f.id; C.acctEdit=null; toast('已儲存帳戶'); reloadAll();
  if(isNew) welcomeSheet(f); }
function editEx(id){ C.exEdit=Object.assign({}, L.exercises.find(e=>e.id===id)); render(); }
function exForm(){ const f=C.exEdit;
  return `<div class="card"><div class="fgrid"><div><label class="lb">中文名</label><input class="in" value="${esc(f.zh)}" oninput="C.exEdit.zh=this.value"></div><div><label class="lb">英文名</label><input class="in" value="${esc(f.en)}" oninput="C.exEdit.en=this.value"></div>
    <div><label class="lb">類別</label><input class="in" value="${esc(f.cat)}" oninput="C.exEdit.cat=this.value"></div><div><label class="lb">器材</label><input class="in" value="${esc(f.eq)}" oninput="C.exEdit.eq=this.value"></div></div>
    <div class="fld" style="margin-top:10px"><label class="lb">要點（中）</label><textarea class="in" oninput="C.exEdit.cue=this.value">${esc(f.cue)}</textarea></div>
    <div class="fld"><label class="lb">要點（英）</label><textarea class="in" oninput="C.exEdit.cueEn=this.value">${esc(f.cueEn)}</textarea></div>
    <div class="fld"><label class="lb">示範片連結（https）</label><input class="in" value="${esc(f.video)}" oninput="C.exEdit.video=this.value"></div>
    <div class="row"><button class="btn ghost" onclick="C.exEdit=null;render()">取消</button><span class="sp"></span><button class="btn" id="exsv" onclick="saveEx()">儲存</button></div></div>`; }
async function saveEx(){ const f=C.exEdit; $('#exsv').disabled=true; const r=await api('cExerciseSave',f,true); if(!r.ok){ $('#exsv').disabled=false; toast(r.err); return; }
  C.exEdit=null; toast('已儲存'); const r2=await api('cLoad'); if(r2.ok) L=r2; render(); }
function copyTxt(t){ try{ navigator.clipboard.writeText(t); toast('已複製'); }catch(e){ prompt('複製：',t); } }

boot();
</script>
</body>
</html>
