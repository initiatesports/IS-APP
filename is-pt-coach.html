<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IS 私訓教練記錄</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f1a28">
<link rel="icon" href="img/is-mark-96.png">
<link rel="apple-touch-icon" href="img/is-mark-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Noto+Sans+HK:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1a28;--panel:#16243a;--panel2:#1c2e48;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.15);--text:#eaf1f8;--mut:#8fa3bb;--teal:#3ecfcf;--teal2:#24a9ad;--gold:#c9a15c;--red:#ff7a7a;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans HK',-apple-system,sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.num{font-family:'Archivo','Noto Sans HK',sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin:0 auto;padding:0 14px calc(110px + var(--safe-b))}
.top{position:sticky;top:0;z-index:20;background:rgba(15,26,40,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 0}
.top-in{max-width:720px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;font-family:'Archivo',sans-serif;font-weight:900;letter-spacing:.05em;font-size:14px}
.brand img{width:24px;height:24px;border-radius:6px}
.brand .tag{transform:skewX(-6deg);background:var(--gold);color:#241a08;padding:1px 7px;font-size:11px}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.chips{display:flex;gap:7px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line2);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--mut);white-space:nowrap}
.chip.on{background:var(--teal);border-color:var(--teal);color:#062426;font-weight:800}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -2px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;background:none;border:none;border-bottom:3px solid transparent;color:var(--mut);padding:9px 6px 8px;font-weight:700;font-size:13.5px}
.tabs button.on{color:var(--teal);border-bottom-color:var(--teal)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.h2{font-size:18px;font-weight:900;margin:16px 2px 6px}
.muted{color:var(--mut)}
.small{font-size:12.5px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(62,207,207,.14);color:var(--teal)}
.badge.gold{background:rgba(201,161,92,.18);color:var(--gold)}
.badge.red{background:rgba(255,122,122,.15);color:var(--red)}
.badge.grey{background:rgba(255,255,255,.07);color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:11px;padding:11px 15px;font-weight:800;background:var(--teal);color:#062426}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--text)}
.btn.warn{background:transparent;border:1px solid rgba(255,122,122,.4);color:var(--red)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn.xs{padding:4px 9px;font-size:12px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.lnk{background:none;border:none;color:var(--teal);font-weight:700;padding:0;font-size:13px}
.in{width:100%;background:#0c1622;border:1px solid var(--line2);border-radius:10px;padding:10px 11px;outline:none}
.in:focus{border-color:var(--teal)}
textarea.in{resize:vertical;min-height:70px}
.lb{display:block;font-size:12px;color:var(--mut);margin:0 0 4px 2px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{margin-bottom:10px}
/* logger */
.blk{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin:12px 0}
.blk-h{display:flex;align-items:flex-start;gap:8px}
.blk-h .nm{font-weight:900;font-size:16px;line-height:1.3}
.last{font-size:12px;color:var(--gold);margin:4px 0 2px}
.srow{display:grid;gap:6px;align-items:center;margin-top:7px}
.srow .no{width:22px;text-align:center;font-family:Archivo;font-weight:800;color:var(--mut)}
.srow input,.srow select{background:#0c1622;border:1px solid var(--line2);border-radius:9px;padding:9px 6px;text-align:center;width:100%;min-width:0;outline:none}
.srow input:focus{border-color:var(--teal)}
.srow .x{background:none;border:none;color:var(--mut);font-size:16px;padding:4px}
.shead{display:grid;gap:6px;font-size:11px;color:var(--mut);text-align:center;margin-top:8px}
.ib{background:none;border:1px solid var(--line2);border-radius:8px;color:var(--mut);padding:3px 8px;font-size:13px}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(13,22,34,.97);border-top:1px solid var(--line);padding:10px 14px calc(10px + var(--safe-b))}
.savebar .in2{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:center}
/* lists */
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:none}
.sline{font-size:13.5px;margin:3px 0}
.sline b{font-weight:800}
.msg{display:flex;margin:5px 0}
.msg .bub{max-width:85%;padding:7px 10px;border-radius:13px;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.msg.st .bub{background:var(--panel2);border-bottom-left-radius:4px}
.msg.co{justify-content:flex-end}
.msg.co .bub{background:rgba(201,161,92,.16);border-bottom-right-radius:4px}
.msg .who{display:block;font-size:10.5px;color:var(--mut)}
.tin{display:flex;gap:8px;margin-top:8px}
.tin input{flex:1}
.ov{position:fixed;inset:0;z-index:50;background:rgba(3,8,14,.7);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);width:100%;max-width:720px;height:86vh;display:flex;flex-direction:column;border-radius:20px 20px 0 0;border:1px solid var(--line2);padding:14px 14px 0}
.sheet .body{flex:1;overflow:auto;padding-bottom:calc(20px + var(--safe-b))}
.pick{display:flex;align-items:center;gap:10px;padding:11px 4px;border-top:1px solid var(--line);cursor:pointer}
.pick:hover{background:rgba(255,255,255,.03)}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:#e9f7f7;color:#082628;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:90vw;text-align:center}
.spin{width:22px;height:22px;border:3px solid rgba(62,207,207,.25);border-top-color:var(--teal);border-radius:50%;animation:sp .8s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.chart{width:100%;height:auto;display:block}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.mem{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border-radius:10px;padding:6px 10px;font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const FRONTEND_VERSION = 'ptc-2026-09-30-b';
const API = 'https://script.google.com/macros/s/AKfycbz34SLDFmVISrW4_QinGwxzHVfZOshGFVZE8mAPaxppJdR4fo3c4Z6PrdzR8nnralhp/exec';
const STUDENT_URL = 'https://www.initiatesportshk.com/is-pt.html';

/* ───────── 工具 ───────── */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => ('0'+n).slice(-2);
const isoOf = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const isoToday = () => isoOf(new Date());
function parseISO(s){ const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m?new Date(+m[1],+m[2]-1,+m[3]):null; }
function addDays(s,n){ const d=parseISO(s); d.setDate(d.getDate()+n); return isoOf(d); }
function mondayOf(s){ const d=parseISO(s); const w=(d.getDay()+6)%7; d.setDate(d.getDate()-w); return isoOf(d); }
function fmtD(s){ const d=parseISO(s); return d?pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear():esc(s||''); }
function fmtDM(s){ const d=parseISO(s); return d?pad(d.getDate())+'/'+pad(d.getMonth()+1):''; }
const WK=['日','一','二','三','四','五','六'];
function fmtN(v){ const n=Number(v); return isFinite(n)&&String(v)!==''?(Math.round(n*10)/10).toString():''; }
function toast(m){ const e=document.createElement('div'); e.className='toast'; e.textContent=m; document.body.appendChild(e); setTimeout(()=>e.remove(),2600); }
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

/* 教練密碼：同 coach.html 共用 sessionStorage is_cpass（只存本分頁，唔持久）*/
let PASS = (()=>{ try{ return sessionStorage.getItem('is_cpass')||''; }catch(e){ return ''; } })();
async function api(action, p, write){
  const body=Object.assign({action, coachPass:PASS}, p||{});
  if(write) body.rid=Date.now().toString(36)+Math.random().toString(36).slice(2,10);   // 冪等：重試沿用同一 rid，後端唔會重複寫
  for(let i=0;i<3;i++){
    let txt=null;
    try{ const c=new AbortController(), tm=setTimeout(()=>c.abort(),50000);
      const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),signal:c.signal});
      clearTimeout(tm); txt=await r.text(); if(txt.charAt(0)==='{') return JSON.parse(txt);
    }catch(e){ if(write && txt===null) return {ok:false, err:'連線中斷，未肯定儲存咗未——請睇返記錄先，唔好即刻重按', unsure:true}; }
    await new Promise(r=>setTimeout(r,1000*(i+1)));
  }
  return {ok:false, err:'網絡唔穩定，請再試'};
}

/* ───────── 狀態 ───────── */
let L=null;            // cLoad
let G=null;            // cGroup
const C={ group:lsGet('isptc_group')||'', tab:'log', bodyMem:'', bodyMetric:'weight', hwEdit:null, acctEdit:null, exEdit:null, exQ:'', recOpen:null, dietMem:'', dDate:'', dietEdit:false, foodEdit:null, foodQ:'', slotForm:{}, habEdit:null };
const EXM=()=>{ const m={}; (L&&L.exercises||[]).forEach(e=>m[e.id]=e); return m; };
const exName=id=>{ const e=EXM()[id]; return e?e.zh:'（已刪動作）'; };
const exEn=id=>{ const e=EXM()[id]; return e?e.en||'':''; };
const memName=id=>{ const a=(L&&L.accounts||[]).find(x=>x.id===id); return a?(a.en||a.name):''; };
const members=()=>G&&G.members||[];

/* ───────── 啟動／登入 ───────── */
async function boot(){
  checkVersion();
  if(!PASS){ renderLogin(); return; }
  $('#app').innerHTML='<div class="spin"></div>';
  const r=await api('cLoad');
  if(!r.ok){ if(/密碼/.test(r.err||'')){ PASS=''; try{ sessionStorage.removeItem('is_cpass'); }catch(e){} renderLogin(r.err); } else $('#app').innerHTML=`<div class="empty" style="padding-top:30vh">${esc(r.err)}<br><br><button class="btn sm" onclick="boot()">↻ 重試</button></div>`; return; }
  L=r;
  if(!C.group || !L.groups.includes(C.group)) C.group=L.groups[0]||'';
  if(!C.group) C.tab='set';
  await loadGroup();
}
function renderLogin(err){
  $('#app').innerHTML=`<div style="max-width:380px;margin:0 auto;padding:22vh 22px 0">
    <div class="brand" style="font-size:18px;margin-bottom:18px"><img src="img/is-mark-96.png" style="width:36px;height:36px">INITIATE <span class="tag">PT 教練</span></div>
    <form onsubmit="doLogin(event)"><label class="lb">教練密碼</label><input class="in" type="password" id="pw" autocomplete="current-password">
    <div style="color:var(--red);font-size:13px;min-height:20px;margin:6px 2px">${esc(err||'')}</div>
    <button class="btn block">登入</button></form>
    <p class="small muted" style="margin-top:14px">由恆常班教練頁「⭐ 私訓」撳入嚟就唔使再輸入。</p></div>`;
}
async function doLogin(e){ e.preventDefault(); PASS=$('#pw').value.trim(); if(!PASS) return; try{ sessionStorage.setItem('is_cpass',PASS); }catch(x){} boot(); }
async function checkVersion(){
  try{ const r=await fetch(location.pathname+'?_ck='+Date.now(),{cache:'no-store'}); if(!r.ok) return;
    const m=(await r.text()).match(/FRONTEND_VERSION\s*=\s*'([^']+)'/);
    if(m && m[1]!==FRONTEND_VERSION){ let tr=null; try{ tr=sessionStorage.getItem('isptc_upd'); }catch(e){} if(tr===m[1]) return; try{ sessionStorage.setItem('isptc_upd',m[1]); }catch(e){}
      toast('🔄 有新版本，更新中…'); setTimeout(()=>location.replace(location.pathname+'?v='+encodeURIComponent(m[1])),900); } }catch(e){}
}
async function loadGroup(){
  if(!C.group){ G=null; render(); return; }
  lsSet('isptc_group', C.group);
  if(!G || G.group!==C.group){ G=null; render(); }
  const r=await api('cGroup',{group:C.group});
  if(!r.ok){ toast(r.err); return; }
  G=r; if(!C.bodyMem || !members().some(m=>m.id===C.bodyMem)) C.bodyMem=(members()[0]||{}).id||'';
  render();
}
async function reloadAll(){ const r=await api('cLoad'); if(r.ok){ L=r; } await loadGroup(); }
function pickGroup(g){ C.group=g; C.hwEdit=null; C.recOpen=null; loadGroup(); }

/* ───────── 外殼 ───────── */
const TABS=[['log','📝 今堂'],['book','📅 預約'],['rec','📚 記錄'],['hw','📋 功課'],['body','📈 身體'],['diet','🍽 飲食'],['cm','💬 留言'],['set','⚙️ 設定']];
function render(){
  if(!L){ return; }
  const unread=(L.recentComments||[]).length;
  const y=window.scrollY;
  $('#app').innerHTML=`<header class="top"><div class="top-in">
    <div class="row"><div class="brand"><img src="img/is-mark-96.png">INITIATE <span class="tag">PT 教練</span></div><span class="sp"></span>
      <a class="lnk" href="coach.html" style="text-decoration:none">‹ 教練頁</a></div>
    <div class="chips">${L.groups.map(g=>`<button class="chip ${g===C.group?'on':''}" onclick="pickGroup('${esc(g).replace(/'/g,"\\'")}')">${esc(g)}</button>`).join('')||'<span class="small muted">未有學員帳戶 → 去「設定」開帳戶</span>'}</div>
    <div class="tabs">${TABS.map(t=>`<button class="${C.tab===t[0]?'on':''}" onclick="C.tab='${t[0]}';render();window.scrollTo(0,0)">${t[1]}${t[0]==='cm'&&unread?` <span class="badge gold">${unread}</span>`:''}</button>`).join('')}</div>
  </div></header>
  <main class="wrap" id="main"></main>`;
  const needG = ['log','rec','hw','body','diet'].includes(C.tab);
  if(needG && !C.group){ $('#main').innerHTML='<div class="empty">未有學員帳戶。去「⚙️ 設定」開帳戶先（私訓名要同 #4 私訓記錄一樣，出席／套票先會自動連上）。</div>'; return; }
  if(needG && !G){ $('#main').innerHTML='<div class="spin"></div>'; return; }
  $('#main').innerHTML=({log:vLog, book:vBook, rec:vRec, hw:()=>vHw()+(C.hwEdit?'':vPlanC()), body:vBody, diet:vDiet, cm:vCm, set:vSet}[C.tab])();
  window.scrollTo(0,y);
  if(C.tab==='log') bindDraftInputs();
}
function groupHeader(){
  const pk=(G.pt&&G.pt.packages)||[], act=pk.filter(p=>Number(p.remaining)>0 && !(Number(p.daysToExp)<0)), left=act.reduce((a,p)=>a+Number(p.remaining||0),0);
  const cur=act[0];
  return `<div class="row" style="flex-wrap:wrap;margin-top:12px">${members().map(m=>`<span class="mem">👤 ${esc(m.name)}${m.en?` <span class="muted small">${esc(m.en)}</span>`:''}</span>`).join('')}<span class="sp"></span>
    ${G.pt&&G.pt.ok?`<span class="badge ${left<=1?'red':''}">套票剩 ${left} 節${cur&&cur.expiry?` · 到期 ${fmtD(cur.expiry)}`:''}</span>`:'<span class="badge grey">#4 套票未連上</span>'}</div>`;
}

/* ───────── 記錄今堂（draft 自動存本機，上堂途中斷線唔會失）───────── */
const dKey=()=>'isptc_draft_'+C.group;
function getDraft(){ let d=lsGet(dKey()); if(!d) d={id:'', date:isoToday(), title:'', note:'', blocks:[]}; return d; }
function putDraft(d){ lsSet(dKey(), d); }
function lastSetsFor(ex, beforeDate, excludeId){
  const s=(G.sessions||[]).filter(x=>x.id!==excludeId && (!beforeDate || x.date<=beforeDate)).find(x=>x.sets.some(y=>y.ex===ex));
  if(!s) return null; return {date:s.date, sets:s.sets.filter(y=>y.ex===ex)};
}
function setTxt(x){ const kg=fmtN(x.kg), r=x.reps, sec=x.sec; let t=kg?kg+(r!==''&&r!=null?'×'+r:'kg'):(r!==''&&r!=null?r+'下':''); if(sec!==''&&sec!=null) t+=(t?' ':'')+sec+'s'; return t||'—'; }
function vLog(){
  const d=getDraft(), ms=members(), multi=ms.length>1;
  const cols = b => '22px 1fr 1fr'+(b.timed?' 1fr':'')+(multi?' 1.2fr':'')+' 26px';
  let h=groupHeader();
  h+=`<div class="card">${d.id?`<div class="row" style="margin-bottom:8px"><span class="badge gold">✎ 修改緊 ${fmtD(d.date)} 嗰堂</span><span class="sp"></span><button class="lnk" onclick="newDraft()">改為開新一堂</button></div>`:''}
    <div class="fgrid"><div><label class="lb">日期</label><input class="in" type="date" data-f="date" value="${esc(d.date)}"></div>
    <div><label class="lb">標題（可留空）</label><input class="in" data-f="title" value="${esc(d.title)}" placeholder="例：下肢力量"></div></div>
    <div style="margin-top:10px"><label class="lb">備註（學員睇到）</label><input class="in" data-f="note" value="${esc(d.note)}" placeholder="例：今日深蹲姿勢進步好多"></div>
    ${!d.blocks.length && (G.sessions||[]).length ? `<button class="btn ghost sm" style="margin-top:10px" onclick="copyLast()">⎘ 用上一堂（${fmtD(G.sessions[0].date)}）做底</button>`:''}</div>`;
  d.blocks.forEach((b,bi)=>{
    const last=lastSetsFor(b.ex, d.date, d.id);
    h+=`<div class="blk"><div class="blk-h"><div style="flex:1;min-width:0"><div class="nm">${bi+1}. ${esc(exName(b.ex))}</div><div class="small muted">${esc(exEn(b.ex))}</div></div>
      <button class="ib" onclick="mvBlock(${bi},-1)" ${bi?'':'disabled'}>↑</button><button class="ib" onclick="mvBlock(${bi},1)" ${bi<d.blocks.length-1?'':'disabled'}>↓</button><button class="ib" onclick="rmBlock(${bi})">✕</button></div>
      ${last?`<div class="last">上次 ${fmtDM(last.date)}：${last.sets.map(x=>setTxt(x)+(x.acct?`(${esc(memName(x.acct))})`:'')).join('、')}</div>`:''}
      <div class="shead" style="grid-template-columns:${cols(b)}"><span>組</span><span>kg</span><span>次數</span>${b.timed?'<span>秒</span>':''}${multi?'<span>對象</span>':''}<span></span></div>
      ${b.sets.map((x,si)=>`<div class="srow" style="grid-template-columns:${cols(b)}"><span class="no">${si+1}</span>
        <input class="num" inputmode="decimal" data-b="${bi}" data-s="${si}" data-k="kg" value="${esc(x.kg)}" placeholder="—">
        <input class="num" inputmode="numeric" data-b="${bi}" data-s="${si}" data-k="reps" value="${esc(x.reps)}" placeholder="—">
        ${b.timed?`<input class="num" inputmode="numeric" data-b="${bi}" data-s="${si}" data-k="sec" value="${esc(x.sec)}" placeholder="—">`:''}
        ${multi?`<select data-b="${bi}" data-s="${si}" data-k="acct"><option value="">全組</option>${ms.map(m=>`<option value="${m.id}" ${x.acct===m.id?'selected':''}>${esc(m.en||m.name)}</option>`).join('')}</select>`:''}
        <button class="x" onclick="rmSet(${bi},${si})">✕</button></div>`).join('')}

  });

}
function bindDraftInputs(){

function mutate(fn){ const d=getDraft(); fn(d); putDraft(d); render(); }
function newDraft(){ if(!confirm('開一堂新記錄？（修改緊嘅內容唔會儲存）')) return; lsDel(dKey()); render(); }
function clearDraft(){ if(!confirm('清除今堂未儲存嘅記錄？')) return; lsDel(dKey()); render(); }
function addBlock(ex){ mutate(d=>{ const last=lastSetsFor(ex, d.date, d.id); const s0=last&&last.sets.filter(x=>!x.acct)[0]||last&&last.sets[0];
  d.blocks.push({ex, timed:!!(last&&last.sets.some(x=>x.sec!=='')), sets:[{kg:s0?s0.kg:'', reps:s0?s0.reps:'', sec:s0?s0.sec:'', acct:''}]}); }); setTimeout(()=>window.scrollTo(0,document.body.scrollHeight),50); }
function addSet(bi){ mutate(d=>{ const b=d.blocks[bi], p=b.sets[b.sets.length-1]||{}; b.sets.push({kg:p.kg||'', reps:p.reps||'', sec:p.sec||'', acct:p.acct||''}); }); }
function rmSet(bi,si){ mutate(d=>{ d.blocks[bi].sets.splice(si,1); if(!d.blocks[bi].sets.length) d.blocks.splice(bi,1); }); }
function rmBlock(bi){ if(!confirm('刪除「'+exName(getDraft().blocks[bi].ex)+'」？')) return; mutate(d=>d.blocks.splice(bi,1)); }
function mvBlock(bi,dir){ mutate(d=>{ const j=bi+dir; if(j<0||j>=d.blocks.length) return; const t=d.blocks[bi]; d.blocks[bi]=d.blocks[j]; d.blocks[j]=t; }); }
function toggleTimed(bi){ mutate(d=>{ d.blocks[bi].timed=!d.blocks[bi].timed; }); }
function useLast(bi){ mutate(d=>{ const b=d.blocks[bi], last=lastSetsFor(b.ex, d.date, d.id); if(!last) return; b.sets=last.sets.map(x=>({kg:x.kg, reps:x.reps, sec:x.sec, acct:x.acct||''})); if(last.sets.some(x=>x.sec!=='')) b.timed=true; }); }
function splitSets(bi){ mutate(d=>{ const b=d.blocks[bi], ms=members(); const out=[]; b.sets.forEach(x=>{ if(x.acct) out.push(x); else ms.forEach(m=>out.push(Object.assign({},x,{acct:m.id}))); }); b.sets=out; }); }
function copyLast(){ const s=G.sessions[0]; if(!s) return; mutate(d=>{ const by={}, order=[]; s.sets.forEach(x=>{ const k=x.order+'|'+x.ex; if(!by[k]){ by[k]={ex:x.ex, timed:false, sets:[]}; order.push(k); } by[k].sets.push({kg:x.kg, reps:x.reps, sec:x.sec, acct:x.acct||''}); if(x.sec!=='') by[k].timed=true; }); d.blocks=order.map(k=>by[k]); if(!d.title) d.title=s.title||''; }); }
async function saveSession(){

/* ───────── 身體數據 ───────── */
const METRICS=[['weight','體重','kg'],['fat','體脂','%'],['muscle','肌肉量','kg'],['waist','腰圍','cm'],['hip','臀圍','cm'],['chest','胸圍','cm'],['arm','手臂','cm'],['thigh','大腿','cm']];
function chartSVG(pts){
  if(pts.length<2) return '';
  const W=340,H=150,L0=34,R=10,T=12,B=22, vs=pts.map(p=>p.v), mn=Math.min(...vs), mx=Math.max(...vs), pd=(mx-mn)*.15||1, lo=mn-pd, hi=mx+pd;
  const t0=parseISO(pts[0].d).getTime(), sp=(parseISO(pts[pts.length-1].d).getTime()-t0)||1;
  const X=p=>L0+(parseISO(p.d).getTime()-t0)/sp*(W-L0-R), Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const path=pts.map((p,i)=>(i?'L':'M')+X(p).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${[hi-pd,lo+pd].map(v=>`<line x1="${L0}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(255,255,255,.07)"/><text x="${L0-5}" y="${Y(v)+4}" fill="#8fa3bb" font-size="10" text-anchor="end">${fmtN(v)}</text>`).join('')}
    <path d="${path}" fill="none" stroke="#3ecfcf" stroke-width="2.4"/>${pts.map(p=>`<circle cx="${X(p)}" cy="${Y(p.v)}" r="3" fill="#0f1a28" stroke="#3ecfcf" stroke-width="2"/>`).join('')}
    <text x="${L0}" y="${H-5}" fill="#8fa3bb" font-size="10">${fmtDM(pts[0].d)}</text><text x="${W-R}" y="${H-5}" fill="#8fa3bb" font-size="10" text-anchor="end">${fmtDM(pts[pts.length-1].d)}</text></svg>`;
}
function vBody(){

  let h=`<div class="row" style="margin-top:14px"><div class="h2" style="margin:0">預約時段</div><span class="sp"></span><button class="btn ghost xs" onclick="SL=null;render()">↻</button></div>
    <div class="small muted" style="margin:4px 2px 0">學員開課前 ${SL.rules.cutoffH} 小時截止預約；${SL.rules.cancelH} 小時前可自己取消。預約只係預留，出席照舊喺教練頁私訓記錄。</div>`;
  h+=`<div class="card"><b>＋ 開時段</b>
    <div class="fgrid" style="margin-top:8px"><div><label class="lb">第一日</label><input class="in" type="date" id="sf-date" value="${esc(f.date||today)}" min="${today}"></div>
      <div><label class="lb">重複（每週）</label><select class="in" id="sf-rep">${[1,2,3,4,6,8,12].map(n=>`<option value="${n}" ${Number(f.repeat)===n?'selected':''}>${n===1?'只呢日':n+' 週'}</option>`).join('')}</select></div>
      <div><label class="lb">開始時間（逗號分隔）</label><input class="in num" id="sf-st" value="${esc(f.starts||'')}" placeholder="18:00, 19:00"></div>
      <div><label class="lb">每堂</label><select class="in" id="sf-dur">${[45,60,75,90,120].map(n=>`<option value="${n}" ${Number(f.dur||60)===n?'selected':''}>${n} 分鐘</option>`).join('')}</select></div>
      <div><label class="lb">地點</label><input class="in" id="sf-ven" list="venl" value="${esc(f.venue||'')}"><datalist id="venl">${venues.map(v=>`<option value="${esc(v)}">`).join('')}</datalist></div>
      <div><label class="lb">只開俾（可留空＝所有學員）</label><select class="in" id="sf-only"><option value="">所有學員</option>${groups.map(g=>`<option ${f.only===g?'selected':''}>${esc(g)}</option>`).join('')}</select></div></div>
    <button class="btn block" style="margin-top:10px" id="sf-go" onclick="addSlots()">開時段</button></div>`;
  const list=(SL.slots||[]).filter(s=>s.date>=today), byD={}; list.forEach(s=>(byD[s.date]=byD[s.date]||[]).push(s));
  const ds=Object.keys(byD).sort();
  if(!ds.length) h+='<div class="empty">未有將來時段</div>';
  const nowKey=isoToday()+' '+pad(new Date().getHours())+':'+pad(new Date().getMinutes());
  ds.forEach(d=>{ h+=`<div class="card"><b>${fmtD(d)}（${WK[parseISO(d).getDay()]}）</b>${byD[d].map(s=>{ const bs=bkBy[s.id]||[], act=bs.find(b=>b.status==='已約'), cx=bs.filter(b=>b.status!=='已約'), past=(s.date+' '+s.start)<=nowKey;
      return `<div class="li"><div style="width:96px"><b class="num">${s.start}</b><span class="small muted">–${s.end}</span></div><div style="flex:1;min-width:0">
        ${act?`<span class="badge">✓ ${esc(act.group)}</span>${act.note?` <span class="small muted">${esc(act.note)}</span>`:''}`:`<span class="small muted">空</span>`}
        <div class="small muted">${esc(s.venue||'')}${s.only?' · 只開俾 '+esc(s.only):''}${cx.length?` · 曾取消 ${cx.map(b=>esc(b.group)+(b.status==='教練取消'?'(教練)':'')).join('、')}`:''}</div></div>
        ${past?'<span class="small muted">已過</span>':act?`<button class="btn warn xs" onclick="coachCancelBk('${act.id}')">取消預約</button>`:`<button class="btn ghost xs" onclick="coachBook('${s.id}')">代約</button><button class="btn warn xs" style="margin-left:4px" onclick="delSlot('${s.id}')">刪</button>`}</div>`; }).join('')}</div>`; });
  return h;
}
async function addSlots(){
  const v=id=>$(id).value.trim(); C.slotForm={date:v('#sf-date'), repeat:v('#sf-rep'), starts:v('#sf-st'), dur:v('#sf-dur'), venue:v('#sf-ven'), only:v('#sf-only')};
  if(!C.slotForm.starts){ toast('要填開始時間'); return; }
  $('#sf-go').disabled=true;
  const r=await api('cSlotAdd', C.slotForm, true);
  if(!r.ok){ $('#sf-go').disabled=false; toast(r.err); return; }
  toast(`已開 ${r.added} 個時段${r.skipped?`（${r.skipped} 個重複／過咗略過）`:''}`); C.slotForm.starts=''; SL=null; render();
}
async function coachBook(slotId){
  const gs=(L.groups||[]); if(!gs.length) return;
  const g=prompt('代邊位學員約？輸入私訓名：\n'+gs.map((x,i)=>(i+1)+'. '+x).join('\n'), C.group||gs[0]); if(!g) return;
  const grp=gs[Number(g)-1]||g.trim(); if(!gs.includes(grp)){ toast('搵唔到呢個私訓名'); return; }
  const r=await api('cBook',{slotId, group:grp}, true); if(!r.ok){ toast(r.err); return; } toast('已代約 '+grp); SL=null; render();
}
async function coachCancelBk(id){
  const reason=prompt('取消原因（學員會睇到，可留空）：',''); if(reason===null) return;
  const r=await api('cBookCancel',{id, reason}, true); if(!r.ok){ toast(r.err); return; } toast('已取消，時段重新開放'); SL=null; render();
}
async function delSlot(id){
  if(!confirm('刪除呢個時段？')) return;
  const r=await api('cSlotDel',{id}, true); if(!r.ok){ toast(r.err); return; } toast('已刪除'); SL=null; render();
}

/* ───────── 第三階段：習慣＋每週回顧（功課分頁下面）───────── */
const PLC={};   // group → cPlan
const CK_LB={'睡眠':'睡眠','精神':'精神','壓力':'壓力','酸痛':'酸痛','訓練':'跟訓練','飲食':'跟飲食'};
async function loadPlanC(g, force){ if(PLC[g] && !force) return; const r=await api('cPlan',{group:g}); if(!r.ok){ toast(r.err); return; } PLC[g]=r; if(C.tab==='hw') render(); }
function vPlanC(){
  const P=PLC[C.group]; if(!P){ loadPlanC(C.group); return '<div class="spin"></div>'; }
  const today=isoToday(), days=Array.from({length:7},(_,i)=>addDays(today,i-6));
  let h=`<div class="h2" style="margin-top:24px">📝 每週回顧</div>`;
  P.members.forEach(m=>{ const nm=memName(m.id)||'';
    if(!m.checkins.length){ h+=`<div class="card small muted">${esc(nm)}：未交過回顧</div>`; return; }
    m.checkins.slice(0,4).forEach(c=>{ const low=['睡眠','精神','訓練','飲食'].filter(k=>Number(c[k])&&Number(c[k])<=2), high=['壓力','酸痛'].filter(k=>Number(c[k])>=4);
      h+=`<div class="card"><div class="row"><b>${esc(nm)}</b><span class="small muted">週 ${fmtD(c.week)}</span><span class="sp"></span>${low.concat(high).length?'<span class="badge red">要留意</span>':''}</div>
        <div class="small" style="margin-top:6px">${P.keys.filter(k=>c[k]).map(k=>`${CK_LB[k]||k} <b class="num" style="color:${(low.includes(k)||high.includes(k))?'var(--red)':'var(--text)'}">${c[k]}</b>`).join(' · ')}${c.weight?` · 體重 <b class="num">${fmtN(c.weight)}</b>kg`:''}</div>
        ${c.text?`<div style="white-space:pre-wrap;margin-top:6px">${esc(c.text)}</div>`:''}${threadCk(c.id, m.id)}</div>`; }); });
  h+=`<div class="h2">✅ 每日習慣（近 7 日）</div>`;
  P.members.forEach(m=>{ const nm=memName(m.id)||'', ed=C.habEdit&&C.habEdit.acct===m.id;
    h+=`<div class="card"><div class="row"><b>${esc(nm)}</b>${m.custom?'':'<span class="badge grey">預設</span>'}<span class="sp"></span><button class="btn ghost xs" onclick="editHab('${m.id}')">${ed?'收起':'✎ 改項目'}</button></div>
      ${ed?habForm():m.habits.map(hb=>`<div class="small" style="margin-top:5px">${esc(hb.zh)}：<span style="letter-spacing:2px">${days.map(d=>(m.habitLog[d]||[]).includes(hb.id)?'<span style="color:var(--teal)">●</span>':'<span class="muted">○</span>').join('')}</span> <b>${days.filter(d=>(m.habitLog[d]||[]).includes(hb.id)).length}</b>/7</div>`).join('')}</div>`; });
  return h;
}
function threadCk(id, acct){
  const cms=(PLC[C.group].comments||[]).filter(c=>c.target===id).sort((a,b)=>String(a.at).localeCompare(String(b.at)));
  return `<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--line2)">${cms.map(c=>`<div class="msg ${c.by==='coach'?'co':'st'}"><div class="bub"><span class="who">${c.by==='coach'?'教練':esc(memName(c.acct)||'學員')} · ${fmtDM(c.at)}</span>${esc(c.text)}</div></div>`).join('')}
    <div class="tin"><input class="in" id="ckr-${id}" placeholder="回覆…" maxlength="500"><button class="btn sm" onclick="replyCk('${id}','${acct}')">送出</button></div></div>`;
}
async function replyCk(id, acct){
  const el=document.getElementById('ckr-'+id), text=(el.value||'').trim(); if(!text) return; el.disabled=true;
  const r=await api('cComment',{type:'checkin', target:id, acct, text}, true); el.disabled=false; if(!r.ok){ toast(r.err); return; }
  PLC[C.group].comments=(PLC[C.group].comments||[]).concat([r.comment]);
  if(L.recentComments) L.recentComments=L.recentComments.filter(c=>!(c.type==='checkin'&&c.target===id));
  toast('已回覆'); render();
}
function editHab(acct){ if(C.habEdit&&C.habEdit.acct===acct){ C.habEdit=null; render(); return; } const m=PLC[C.group].members.find(x=>x.id===acct); C.habEdit={acct, items:JSON.parse(JSON.stringify(m.habits))}; render(); }
function habForm(){ const f=C.habEdit;
  return `<div style="margin-top:8px">${f.items.map((it,i)=>`<div class="row" style="margin-top:6px"><input class="in" value="${esc(it.zh)}" oninput="C.habEdit.items[${i}].zh=this.value" placeholder="中文"><input class="in" value="${esc(it.en||'')}" oninput="C.habEdit.items[${i}].en=this.value" placeholder="English"><button class="ib" onclick="C.habEdit.items.splice(${i},1);render()">✕</button></div>`).join('')}
    <div class="row" style="margin-top:8px"><button class="btn ghost sm" onclick="C.habEdit.items.push({zh:'',en:''});render()" ${f.items.length>=8?'disabled':''}>＋ 項目</button><span class="sp"></span><button class="btn sm" id="hbsv" onclick="saveHab()">儲存</button></div>
    <div class="small muted" style="margin-top:6px">最多 8 項；改名唔會影響舊打卡（同一項保留）。</div></div>`; }
async function saveHab(){ const f=C.habEdit; $('#hbsv').disabled=true;
  const r=await api('cHabitSave',{acct:f.acct, items:JSON.stringify(f.items)}, true); if(!r.ok){ $('#hbsv').disabled=false; toast(r.err); return; }
  C.habEdit=null; toast('已儲存，學員即刻睇到'); loadPlanC(C.group, true); }

/* ───────── 留言（全部組）───────── */
function vCm(){
  const list=L.recentComments||[], acc={}; (L.accounts||[]).forEach(a=>acc[a.id]=a);
  let h=`<div class="h2">學員留言（最近 30 條）</div>`;
  if(!list.length) return h+'<div class="empty">暫時冇新留言</div>';
  const TY={session:'訓練記錄', homework:'功課', body:'身體數據', diet:'飲食', checkin:'每週回顧'};
  list.forEach((c,i)=>{ const a=acc[c.acct]||{};
    h+=`<div class="card"><div class="row"><b>${esc(a.name||'學員')}</b><span class="badge grey">${esc(a.group||'')}</span><span class="badge">${TY[c.type]||c.type}</span><span class="sp"></span><span class="small muted">${fmtDM(c.at)} ${esc(String(c.at).slice(11,16))}</span></div>
      <div style="margin:8px 0;white-space:pre-wrap">${c.type==='diet'?`<span class="small muted">${fmtD(c.target)}：</span>`:''}${esc(c.text)}</div>
      <div class="tin"><input class="in" id="rc-${i}" placeholder="回覆…" maxlength="500"><button class="btn sm" onclick="replyFromList(${i})">送出</button></div>
      ${a.group?`<button class="lnk" style="margin-top:8px" onclick="gotoCm(${i})">開啟 ${esc(a.group)} ›</button>`:''}</div>`; });
  return h;
}
async function replyFromList(i){ const c=L.recentComments[i], el=$('#rc-'+i), text=el.value.trim(); if(!text) return; el.disabled=true;
  const r=await api('cComment',{type:c.type, target:c.target, acct:c.acct, text}, true); el.disabled=false; if(!r.ok){ toast(r.err); return; }
  L.recentComments.splice(i,1); if(G) G.comments=(G.comments||[]).concat([r.comment]); toast('已回覆'); render(); }
function gotoCm(i){ const c=L.recentComments[i], a=(L.accounts||[]).find(x=>x.id===c.acct); if(!a) return; C.group=a.group; C.tab=c.type==='session'?'rec':(c.type==='homework'||c.type==='checkin')?'hw':c.type==='diet'?'diet':'body'; if(c.type==='checkin') delete PLC[a.group]; if(c.type==='session') C.recOpen=c.target; if(c.type==='body') C.bodyMem=a.id; if(c.type==='diet'){ C.dietMem=a.id; C.dDate=c.target; delete DIETC[a.id]; } loadGroup(); }

/* ───────── 設定：帳戶＋動作庫 ───────── */
function vSet(){
  let h=`<div class="h2">學員帳戶</div><div class="small muted" style="margin:0 2px 8px">「私訓名」要同 #4 私訓記錄一樣（例：Keith & Elaine），出席同套票先會自動顯示。1 對 2 就開兩個帳戶，私訓名填同一個。</div>`;
  if(C.acctEdit) h+=acctForm();
  else h+=`<button class="btn sm" onclick="C.acctEdit={id:'',name:'',en:'',last4:'',group:C.group||'',goal:'',status:'啟用'};render()">＋ 新帳戶</button>`;
  h+=`<div class="card">${(L.accounts||[]).map(a=>`<div class="li"><div style="flex:1;min-width:0"><b>${esc(a.name)}</b> ${a.en?`<span class="muted small">${esc(a.en)}</span>`:''} ${a.status==='停用'?'<span class="badge red">停用</span>':''}<div class="small muted">${esc(a.group)} · 電話尾 ${esc(a.last4)}${a.goal?' · 🎯 '+esc(a.goal):''}</div></div><button class="btn ghost xs" onclick="editAcct('${a.id}')">✎</button></div>`).join('')||'<div class="small muted">未有帳戶</div>'}</div>`;
  h+=`<div class="card"><b>📲 學員 app 網址</b><div class="small muted" style="margin:4px 0 8px;word-break:break-all">${STUDENT_URL}</div><div class="small muted">學員用登記姓名（中文或英文）＋電話後 4 位登入，可加到主畫面當 app 用。</div><button class="btn ghost sm" style="margin-top:8px" onclick="copyTxt('${STUDENT_URL}')">複製網址</button> <a class="btn ghost sm" style="text-decoration:none;margin-top:8px" href="is-pt.html" target="_blank">預覽</a></div>`;
  h+=`<div class="small muted" style="margin:4px 4px 0">#4 私訓出席／套票連線：${L.ptOk?'<span style="color:var(--teal)">✓ 正常</span>':'<span style="color:var(--red)">未連上</span>'}</div>`;
  // 動作庫
  h+=`<div class="h2" style="margin-top:24px">動作庫（${(L.exercises||[]).length}）</div><div class="small muted" style="margin:0 2px 8px">示範片而家係 YouTube 搜尋連結；之後影咗自己條片，貼連結入「影片」就會換。</div>`;
  if(C.exEdit) h+=exForm();
  else h+=`<div class="row"><input class="in" placeholder="🔍 搜尋" value="${esc(C.exQ)}" oninput="C.exQ=this.value;drawExList()"><button class="btn sm" onclick="C.exEdit={id:'',zh:'',en:'',cat:'',eq:'',cue:'',cueEn:'',video:''};render()">＋</button></div><div class="card" id="exl"></div>`;
  setTimeout(drawExList,0);
  if(!C.exEdit) h+=vFoodLib();
  return h;
}
function drawExList(){ const el=$('#exl'); if(!el) return; const q=C.exQ.trim().toLowerCase();
  el.innerHTML=(L.exercises||[]).filter(e=>!q||(e.zh+' '+e.en+' '+e.cat).toLowerCase().includes(q)).map(e=>`<div class="li"><div style="flex:1;min-width:0"><b>${esc(e.zh)}</b> <span class="small muted">${esc(e.en)}</span><div class="small muted">${esc(e.cat)}${e.video&&!/results\?search_query/.test(e.video)?' · 🎬 自家片':''}</div></div><button class="btn ghost xs" onclick="editEx('${e.id}')">✎</button></div>`).join(''); }
function editAcct(id){ const a=L.accounts.find(x=>x.id===id); C.acctEdit=Object.assign({},a); render(); window.scrollTo(0,0); }
function acctForm(){
  const f=C.acctEdit, names=[...new Set((L.ptNames||[]).concat(L.groups||[]))];
  return `<div class="card"><div class="fgrid"><div><label class="lb">中文姓名</label><input class="in" value="${esc(f.name)}" oninput="C.acctEdit.name=this.value"></div><div><label class="lb">英文名</label><input class="in" value="${esc(f.en)}" oninput="C.acctEdit.en=this.value"></div>
    <div><label class="lb">電話後 4 位</label><input class="in num" inputmode="numeric" maxlength="4" value="${esc(f.last4)}" oninput="C.acctEdit.last4=this.value"></div>
    <div><label class="lb">私訓名（#4）</label><input class="in" list="ptn" value="${esc(f.group)}" oninput="C.acctEdit.group=this.value"><datalist id="ptn">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist></div></div>
    <div class="fld" style="margin-top:10px"><label class="lb">目標（學員睇到）</label><input class="in" value="${esc(f.goal)}" oninput="C.acctEdit.goal=this.value" placeholder="例：減脂 5kg、硬拉 100kg"></div>
    <div class="fld"><label class="lb">狀態</label><select class="in" onchange="C.acctEdit.status=this.value"><option ${f.status!=='停用'?'selected':''}>啟用</option><option ${f.status==='停用'?'selected':''}>停用</option></select></div>
    <div class="row"><button class="btn ghost" onclick="C.acctEdit=null;render()">取消</button><span class="sp"></span><button class="btn" id="acsv" onclick="saveAcct()">儲存帳戶</button></div></div>`;
}
async function saveAcct(){ const f=C.acctEdit; $('#acsv').disabled=true;
  const r=await api('cAccountSave',{id:f.id, name:f.name, en:f.en, last4:f.last4, group:f.group, goal:f.goal, status:f.status}, true);
  if(!r.ok){ $('#acsv').disabled=false; toast(r.err); return; }
  if(!C.group) C.group=f.group.trim();
  C.acctEdit=null; toast('已儲存帳戶'); reloadAll(); }
function editEx(id){ C.exEdit=Object.assign({}, L.exercises.find(e=>e.id===id)); render(); }
function exForm(){ const f=C.exEdit;
  return `<div class="card"><div class="fgrid"><div><label class="lb">中文名</label><input class="in" value="${esc(f.zh)}" oninput="C.exEdit.zh=this.value"></div><div><label class="lb">英文名</label><input class="in" value="${esc(f.en)}" oninput="C.exEdit.en=this.value"></div>
    <div><label class="lb">類別</label><input class="in" value="${esc(f.cat)}" oninput="C.exEdit.cat=this.value"></div><div><label class="lb">器材</label><input class="in" value="${esc(f.eq)}" oninput="C.exEdit.eq=this.value"></div></div>
    <div class="fld" style="margin-top:10px"><label class="lb">要點（中）</label><textarea class="in" oninput="C.exEdit.cue=this.value">${esc(f.cue)}</textarea></div>
    <div class="fld"><label class="lb">要點（英）</label><textarea class="in" oninput="C.exEdit.cueEn=this.value">${esc(f.cueEn)}</textarea></div>
    <div class="fld"><label class="lb">示範片連結（https）</label><input class="in" value="${esc(f.video)}" oninput="C.exEdit.video=this.value"></div>
    <div class="row"><button class="btn ghost" onclick="C.exEdit=null;render()">取消</button><span class="sp"></span><button class="btn" id="exsv" onclick="saveEx()">儲存</button></div></div>`; }
async function saveEx(){ const f=C.exEdit; $('#exsv').disabled=true; const r=await api('cExerciseSave',f,true); if(!r.ok){ $('#exsv').disabled=false; toast(r.err); return; }
  C.exEdit=null; toast('已儲存'); const r2=await api('cLoad'); if(r2.ok) L=r2; render(); }
function copyTxt(t){ try{ navigator.clipboard.writeText(t); toast('已複製'); }catch(e){ prompt('複製：',t); } }

boot();
</script>
</body>
</html>
