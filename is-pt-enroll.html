      <div class="chips" id="g_freq">${['每週 1 次','每週 2 次','每週 3 次或以上','未定'].map(x=>`<span class="chip ${gg.freq===x?'on':''}" data-v="${esc(x)}" data-cls="freq">${esc(x)}</span>`).join('')}</div></div>

  app.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{

    S.goals={goals:sel.goals, times:sel.times, freq:sel.freq, note:(document.getElementById('g_note').value||'').trim()};

  };

/* ══ 簽名板 ══ */
let _sig={cv:null,ctx:null,has:false};
function initSig(){ const cv=document.getElementById('sigpad'); if(!cv) return;
  const ratio=window.devicePixelRatio||1; const r=cv.getBoundingClientRect();
  cv.width=r.width*ratio; cv.height=r.height*ratio;
  const ctx=cv.getContext('2d'); ctx.scale(ratio,ratio); ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#0f2233';
  _sig={cv,ctx,has:false}; let drawing=false,px=0,py=0;
  const pos=e=>{ const b=cv.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return [t.clientX-b.left,t.clientY-b.top]; };
  const start=e=>{ e.preventDefault(); drawing=true; [px,py]=pos(e); };
  const move=e=>{ if(!drawing)return; e.preventDefault(); const [x,y]=pos(e); ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(x,y); ctx.stroke(); [px,py]=[x,y]; _sig.has=true; S.signImg=cv.toDataURL('image/png'); };
  const end=()=>{ drawing=false; };
  cv.addEventListener('mousedown',start); cv.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
  cv.addEventListener('touchstart',start,{passive:false}); cv.addEventListener('touchmove',move,{passive:false}); cv.addEventListener('touchend',end);
}
function clearSig(){ if(_sig.ctx&&_sig.cv) _sig.ctx.clearRect(0,0,_sig.cv.width,_sig.cv.height); _sig.has=false; S.signImg=''; }

/* ══ 提交 ══ */
async function submitPt(){
  const msg=document.getElementById('tm_msg'), btn=document.getElementById('tm_go');
  const consentEls=[...document.querySelectorAll('.pt_consent')];
  const allConsent=consentEls.every(c=>c.checked);
  const ops=document.getElementById('pt_ops').checked;
  const en=(document.getElementById('tm_en').value||'').trim();
  const id=(document.getElementById('tm_id').value||'').trim();
  const photo=document.getElementById('pt_photo')?document.getElementById('pt_photo').checked:true;
  if(PREVIEW){ msg.className='msg'; msg.textContent='（預覽模式）唔會真提交報名。'; return; }
  if(!allConsent){ msg.className='msg err'; msg.textContent='請逐項剔選同意健康聲明、緊急醫療授權、私隱及資料屬實。'; return; }
  if(!ops){ msg.className='msg err'; msg.textContent='請剔選同意私人訓練條款。'; return; }
  if(!en){ msg.className='msg err'; msg.textContent='請填家長英文全名。'; return; }
  if(!/^[A-Za-z]\d{3}$/.test(id.replace(/\s/g,''))){ msg.className='msg err'; msg.textContent='證件號碼首 4 位格式：1 個英文字母 + 3 個數字（e.g. A123）。'; return; }
  if(!S.signImg){ msg.className='msg err'; msg.textContent='請喺簽名格簽上家長／監護人簽名。'; document.getElementById('sigpad').scrollIntoView({block:'center'}); return; }
  btn.disabled=true; btn.textContent='提交中…';
  if(!S.clientToken) S.clientToken='pt_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
  let res;
  try{
    res=await apiPost({ action:'ptEnroll',
      name:S.stu.name, age:S.stu.age, parent:S.stu.parent, phone:S.stu.phone, email:S.stu.email,
      forWho:(S.stu.forWho==='adult'?'成人自行報名':'為小朋友／青少年報名'),
      parq:(S.stu.parqok?'全部否（適合運動）':('有需要注意：'+(S.stu.parqnote||''))),
      health:((S.stu.health||[]).join('、')+((S.stu.healthnote)?('；其他：'+S.stu.healthnote):''))||'—',
      goals:(S.goals.goals||[]).join('、'), goalNote:S.goals.note||'',
      times:(S.goals.times||[]).join('、'), freq:S.goals.freq||'',
      packSize:S.pack.size||'', packWho:S.pack.who||'', referrer:S.referrer||'',
      signEn:en, signId:id, signImg:S.signImg||'', photoConsent:(photo?'1':'0'),
      clientToken:S.clientToken, agree:'同意' }, 30000);
  }catch(e){ btn.disabled=false; btn.textContent='確認提交報名'; msg.className='msg err'; msg.innerHTML='網絡逾時／中斷。你嘅報名<b>可能已提交</b>，請 WhatsApp 6331 7403 確認，切勿以為失敗而重複提交。'; return; }
  btn.disabled=false; btn.textContent='確認提交報名';
  if(!res||res.ok===false){ msg.className='msg err'; msg.textContent=(res&&res.err)||'提交失敗，請再試或 WhatsApp 6331 7403。'; return; }
  renderDone(res);
}

/* ════ 完成 ════ */
function renderDone(res){
  app.innerHTML=`
  <div class="card">
    <div class="ptbanner" style="background:linear-gradient(135deg,#1a9e6a,#12805a)"><span class="pte">✅</span><h2 style="margin:6px 0 4px">已收到你嘅報名！</h2>
      <p class="hint" style="color:#e8f7fa">${res&&res.id?('報名編號：<b>'+esc(res.id)+'</b>'):''}</p></div>
    <div class="banner" style="margin-top:14px">📱 教練會盡快 <b>WhatsApp 你</b>夾上課時間、地點同<b>報價</b>；確認後先開始，唔使即時付款。</div>
    <div class="fld" style="margin-top:10px"><label>你提交嘅內容</label>
      <div class="cbox"><span>${S.stu.forWho==='adult'?'報名者（本人）':'學員'}：<b>${esc(S.stu.name)}</b>（${esc(S.stu.age)}）</span></div>
      <div class="cbox"><span>聯絡：${S.stu.forWho==='adult'?'':esc(S.stu.parent)+'　'}${esc(S.stu.phone)}</span></div>
      ${S.pack.size?`<div class="cbox"><span>套票意向：${esc(S.pack.size)}${S.pack.who?('　'+esc(S.pack.who)):''}</span></div>`:''}
      ${(S.goals.goals||[]).length?`<div class="cbox"><span>目標：${esc((S.goals.goals||[]).join('、'))}</span></div>`:''}
    </div>
    <a class="btn" href="${WA('我啱啱交咗私人訓練報名：'+esc(S.stu.name))}" target="_blank" rel="noopener" style="margin-top:12px;display:block;text-align:center;text-decoration:none">💬 WhatsApp 教練</a>
    <button class="btn ghost" style="margin-top:10px" onclick="location.reload()">再報一位</button>
  </div>`;
}

/* ══ 啟動 ══ */
renderHome();
</script>
