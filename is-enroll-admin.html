<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#28B8C8">
<title>INITIATE SPORTS 報名管理</title>
<style>
:root{ --teal:#28B8C8; --teal-dark:#1F9DAC; --teal-dim:rgba(40,184,200,0.10); --ink:#1f2a30; --mut:#66757c; --line:#e3e9ec; --bg:#f5f8f9; --ok:#1a9e6a; --warn:#c47f00; --err:#c0392b; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:-apple-system,"PingFang HK","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 60px;}
header.top{display:flex;align-items:center;gap:10px;padding:6px 2px 12px;}
header.top .dot{width:10px;height:10px;border-radius:50%;background:var(--teal);}
header.top h1{font-size:16px;margin:0;font-weight:800;}
header.top .rf{margin-left:auto;font-size:13px;color:var(--teal);background:none;border:1px solid var(--teal);border-radius:8px;padding:5px 10px;cursor:pointer;}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:13px;}
.card h2{font-size:15px;margin:0 0 10px;font-weight:800;}
.fld label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:5px;}
.fld input{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;}
.btn{background:var(--teal);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;padding:10px 14px;cursor:pointer;}
.btn:active{background:var(--teal-dark);} .btn.sm{padding:6px 10px;font-size:12.5px;}
.btn.gray{background:#eef2f3;color:var(--mut);} .btn.ok{background:var(--ok);} .btn.err{background:var(--err);}
.stats{display:flex;flex-wrap:wrap;gap:8px;}
.stat{flex:1;min-width:90px;background:var(--teal-dim);border-radius:10px;padding:10px;text-align:center;}
.stat .n{font-size:20px;font-weight:800;color:var(--teal-dark);} .stat .l{font-size:11.5px;color:var(--mut);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top;}
th{font-size:11.5px;color:var(--mut);font-weight:700;}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:20px;}
.tag.full{background:#fdecea;color:var(--err);} .tag.ok{background:#e8f7ef;color:var(--ok);} .tag.warn{background:#fff6e0;color:var(--warn);}
.names{font-size:12px;color:#3a464c;}
.st{font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;}
.st.待核實{background:#fff6e0;color:var(--warn);} .st.已核實{background:#e8f7ef;color:var(--ok);} .st.候補{background:#eef2f3;color:var(--mut);} .st.取消{background:#fdecea;color:var(--err);}
a.lnk{color:var(--teal-dark);text-decoration:none;font-size:12px;}
.msg{font-size:13px;padding:9px 11px;border-radius:9px;margin-top:8px;display:none;}
.msg.err{background:#fdecea;color:var(--err);display:block;} .msg.ok{background:#e8f7ef;color:var(--ok);display:block;}
.scroll{overflow-x:auto;} .mut{color:var(--mut);font-size:12px;} .load{text-align:center;color:var(--mut);padding:30px;}
.rowact{display:flex;gap:5px;flex-wrap:wrap;}
.barrow{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px;}
.barrow .bl{width:150px;flex-shrink:0;color:#3a464c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.barrow .bt{flex:1;background:#eef2f3;border-radius:5px;height:15px;overflow:hidden;min-width:60px;}
.barrow .bf{display:block;height:100%;background:var(--teal);border-radius:5px;}
.barrow .bf.full{background:var(--warn);}
.barrow .bn{width:48px;text-align:right;font-weight:700;color:var(--teal-dark);flex-shrink:0;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><span class="dot"></span><h1>INITIATE SPORTS 報名管理</h1><button class="rf" id="rfbtn" style="display:none" onclick="loadAll()">🔄 重新整理</button></header>
  <div id="app"><div class="load">…</div></div>
</div>
<script>
const API='https://script.google.com/macros/s/AKfycbyNhVCIVKrK4QxRf2jS8xWzH-ST-7hkbcqF-zwLjxQN6b-YWnyJW1aDwQlQWwJfgJPS/exec';
const app=document.getElementById('app');
let CP='';
async function fetchT(u,o){ const c=new AbortController(),t=setTimeout(()=>c.abort(),45000); try{ const r=await fetch(u,Object.assign({signal:c.signal},o||{})); return await r.json(); } finally{ clearTimeout(t); } }
async function apiGet(p){ return fetchT(API+'?'+new URLSearchParams(p)); }
async function apiPost(b){ return fetchT(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)}); }
// C2：付款截圖/確認PDF 已改私有 → 用教練密碼經 getSecureFile 攞 base64 再開,唔直連 Drive。
async function viewSecureFile(ref){
  if(!ref) return;
  try{
    const r=await apiPost({action:'getSecureFile',coachPass:CP,id:ref});
    if(!r||!r.ok||!r.b64){ alert((r&&r.err)||'讀取檔案失敗'); return; }
    const bin=atob(r.b64), bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([bytes],{type:r.mime||'application/octet-stream'}));
    window.open(url,'_blank'); setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(e){ alert('讀取檔案失敗，請再試'); }
}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'$'+(Number(n)||0).toLocaleString();

function renderLogin(err){
  app.innerHTML=`<div class="card"><h2>教練登入</h2>
    <div class="fld"><label>教練密碼</label><input id="cp" type="password" placeholder="密碼"></div>
    <button class="btn" id="go">登入</button>
    <div class="msg ${err?'err':''}" style="${err?'display:block':''}">${esc(err||'')}</div></div>`;
  document.getElementById('go').onclick=async()=>{
    CP=document.getElementById('cp').value.trim();
    const r=await apiPost({action:'enrollSummary',coachPass:CP});
    if(!r||r.ok===false){ renderLogin('密碼錯誤'); CP=''; return; }
    document.getElementById('rfbtn').style.display='';
    render(r,null);
    loadRecords();
  };
}
async function loadAll(){ const r=await apiPost({action:'enrollSummary',coachPass:CP}); render(r, window._recs); loadRecords(); }
async function loadRecords(){ const r=await apiPost({action:'enrollRecords',coachPass:CP}); window._recs=(r&&r.records)||[]; render(window._sum, window._recs); }

function num(x){ x=parseFloat(String(x==null?'':x).replace(/[^0-9.\-]/g,'')); return isNaN(x)?0:x; }
// 由備註抽制服/器材金額（學費淨額以外，另加落實付）
function feeAddon(note){ note=String(note||''); let a=0;
  let m=note.match(/制服[^$]*\$(\d+)/); if(m) a+=+m[1];
  let g=note.match(/器材[^$]*?\$(\d+)/); if(g) a+=+g[1];
  return a;
}
function render(sum, recs){
  window._sum=sum||window._sum; recs=recs||window._recs||[];
  const s=window._sum; if(!s) return;
  const st=s.stat||{};
  const openBadge = s.open ? '<span class="tag ok">已開放</span>' : '<span class="tag warn">預覽（未開放）</span>';
  // 課程表
  const courseRows=(s.courses||[]).map(c=>{
    const seat = c.full?'<span class="tag full">滿</span>':(c.enrolled>=4?'<span class="tag ok">可開班</span>':'<span class="tag warn">未夠4</span>');
    const names = c.active.length?`<div class="names">${c.active.map(esc).join('、')}</div>`:'<span class="mut">—</span>';
    const wl = c.waitlist.length?`<div class="names" style="color:var(--warn)">候補：${c.waitlist.map(esc).join('、')}</div>`:'';
    return `<tr><td><b>${esc(c.sport)}</b><div class="mut">${esc(c.day)} ${esc(c.time)}</div></td>
      <td>${c.enrolled}/${c.cap} ${seat}</td><td>${money(c.price)}</td><td>${names}${wl}</td></tr>`;
  }).join('');
  // 報名逐筆 —— 同一個人（相同學生姓名）合併一組，顯示完整學費明細；每筆仍各有核實掣
  const nonTest=recs.filter(r=>String(r['備註']||'').indexOf('測試')<0 && String(r['學生姓名']||'').trim()!=='示範學員');
  const byName={}, nameOrder=[];
  nonTest.forEach(r=>{ const nm=String(r['學生姓名']||'').trim(); if(!byName[nm]){ byName[nm]=[]; nameOrder.push(nm); } byName[nm].push(r); });
  // 排序：未核實（待核實/待付款/候補）排前，已核實排後，取消最尾；同組保持原順序
  const stPri=st=>(st==='已核實'?1:(st==='取消'?2:0));
  const origIdx={}; nameOrder.forEach((n,i)=>origIdx[n]=i);
  nameOrder.sort((a,b)=>{
    const pa=Math.min(...byName[a].map(r=>stPri(String(r['狀態']||''))));
    const pb=Math.min(...byName[b].map(r=>stPri(String(r['狀態']||''))));
    return pa-pb || origIdx[a]-origIdx[b];
  });
  let pendGrand=0, pendNet=0;
  const personBlocks=nameOrder.map(nm=>{
    const rs=byName[nm];
    // 合計（取消嗰筆唔計入金額）
    let base=0,vou=0,ref=0,promo=0,net=0,addon=0, anyPending=false;
    rs.forEach(r=>{ if(String(r['狀態']||'')==='取消') return;
      base+=num(r['原價']); vou+=num(r['代金券']); ref+=num(r['推薦']); promo+=num(r['優惠碼']); net+=num(r['實收']); addon+=feeAddon(r['備註']);
      if(String(r['狀態']||'')!=='已核實') anyPending=true;
    });
    const grand=net+addon;
    if(anyPending){ pendGrand+=grand; pendNet+=net; }
    // 明細一句
    const feeLine=`原價 ${money(base)}`+(vou?` − 券 ${money(vou)}`:'')+(promo?` − 碼 ${money(promo)}`:'')+(ref?` − 推薦 ${money(ref)}`:'')
      +` → 學費 <b>${money(net)}</b>`+(addon?` ＋ 制服/器材 ${money(addon)}`:'')+` ＝ 實付 <b style="color:var(--ok,#0a7d3c)">${money(grand)}</b>`;
    // 逐筆（各自核實/取消）
    const regRows=rs.map(r=>{
      const id=r['記錄編號'], stt=String(r['狀態']||''), note=String(r['備註']||'');
      const pay=r['付款截圖']&&String(r['付款截圖']).indexOf('http')===0?`<a class="lnk" href="#" onclick="viewSecureFile('${esc(r['付款截圖'])}');return false" style="cursor:pointer">截圖</a>`:'<span class="mut">無截圖</span>';
      const pdf=r['確認PDF']&&String(r['確認PDF']).indexOf('http')===0?` · <a class="lnk" href="#" onclick="viewSecureFile('${esc(r['確認PDF'])}');return false" style="cursor:pointer">PDF</a>`:'';
      let act='';
      if(stt!=='已核實') act+=`<button class="btn ok sm" onclick="setStatus('${id}','已核實')">核實</button>`;
      if(stt==='候補') act+=`<button class="btn sm" onclick="setStatus('${id}','待核實')">轉正取</button>`;
      if(stt!=='取消') act+=`<button class="btn err sm" onclick="setStatus('${id}','取消')">取消</button>`;
      if(stt==='取消') act+=`<button class="btn err sm" onclick="delRec('${id}','${esc(nm)}')" title="永久刪除呢筆記錄">🗑 刪除</button>`;
      const warn=note?`<div style="color:var(--warn);font-size:12px;margin-top:2px">⚠️ ${esc(note)}</div>`:'';
      return `<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px dashed var(--line)">
        <div style="flex:1;min-width:0">
          <div><span class="mut">${esc(id)}</span> <span class="st ${stt}">${esc(stt)}</span> · ${esc(r['報名課程'])} · 實收 ${money(r['實收'])}</div>
          <div style="margin-top:2px">${pay}${pdf}</div>${warn}
        </div>
        <div class="rowact" style="flex-shrink:0">${act}</div>
      </div>`;
    }).join('');
    return `<div style="border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap">
        <b style="font-size:15px">${esc(nm)}</b>${rs.length>1?`<span class="tag warn">${rs.length} 次報名合併</span>`:''}
      </div>
      <div style="font-size:13px;color:var(--ink,#333);margin:4px 0 2px">${feeLine}</div>
      ${regRows}
    </div>`;
  }).join('') || '<div class="mut">未有報名記錄</div>';

  app.innerHTML=`
  <div class="card">
    <h2>${esc(s.period)} 報名概況 ${openBadge}</h2>
    <div class="stats">
      <div class="stat"><div class="n">${st.total||0}</div><div class="l">總報名</div></div>
      <div class="stat"><div class="n">${st.verified||0}</div><div class="l">已核實</div></div>
      <div class="stat"><div class="n">${st.pending||0}</div><div class="l">待核實</div></div>
      <div class="stat"><div class="n">${st.waitlist||0}</div><div class="l">候補</div></div>
      <div class="stat"><div class="n">${money(st.revenue||0)}</div><div class="l">已收入</div></div>
    </div>
    <div class="rowact" style="margin-top:12px">
      <button class="btn sm" onclick="exportRoster()">📋 匯出 9 月名冊</button>
      <button class="btn sm gray" onclick="exportCSV()">⬇️ 匯出 CSV</button>
    </div>
    <div class="msg" id="msg"></div>
    <textarea id="exp" style="display:none;width:100%;height:180px;margin-top:10px;font-size:12px;font-family:monospace;border:1px solid var(--line);border-radius:8px;padding:8px"></textarea>
  </div>
  ${dashboardHtml(s)}
  <div class="card"><h2>逐課程名額（最低 4 人開班）</h2>
    <div class="scroll"><table><tr><th>課程</th><th>名額</th><th>學費</th><th>正取學生 / 候補</th></tr>${courseRows}</table></div>
  </div>
  <div class="card"><h2>逐筆報名審核（同一人已合併）</h2>
    <div class="mut" style="margin:-4px 0 10px">學費淨額 = 原價 − 券 − 優惠碼 − 推薦 ＋ 帶入調整/加操；實付 = 學費 ＋ 制服/器材。⚠️ 標示＝重複收費／帶入調整等要核對。</div>
    <div class="msg ok" style="margin-bottom:10px">未核實合計：學費 <b>${money(pendNet)}</b> ｜ 連制服器材實付 <b>${money(pendGrand)}</b></div>
    ${personBlocks}
  </div>`;
}
function exportRoster(){
  const s=window._sum; if(!s) return;
  let out='INITIATE SPORTS '+s.period+' 報名名冊（正取學生，可貼入班別 CLASSES）\n';
  out+='※ 只列已核實/待核實正取學生（唔含候補/取消/測試）\n\n';
  (s.courses||[]).forEach(c=>{
    if(!c.active.length && !c.waitlist.length) return;
    out+=`【${c.sport} ${c.day} ${c.time}】 正取 ${c.enrolled}/${c.cap}${c.enrolled>=4?'（可開班）':'（未夠4人）'}\n`;
    out+='  正取：'+(c.active.length?c.active.join('、'):'—')+'\n';
    if(c.waitlist.length) out+='  候補：'+c.waitlist.join('、')+'\n';
    out+='\n';
  });
  const ta=document.getElementById('exp'); ta.style.display='block'; ta.value=out; ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  const msg=document.getElementById('msg'); msg.className='msg ok'; msg.textContent='名冊已生成（已嘗試複製到剪貼簿）。';
}
function exportCSV(){
  const recs=(window._recs||[]).filter(r=>String(r['備註']).indexOf('測試')<0);
  if(!recs.length){ const m=document.getElementById('msg'); m.className='msg err'; m.textContent='未有記錄。'; return; }
  const cols=['記錄編號','時間戳','學生姓名','家長電話','報名課程','實收','狀態','付款截圖','確認PDF'];
  let csv=cols.join(',')+'\n';
  recs.forEach(r=>{ csv+=cols.map(c=>'"'+String(r[c]==null?'':r[c]).replace(/"/g,'""')+'"').join(',')+'\n'; });
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='報名記錄_'+(window._sum?window._sum.period:'')+'.csv'; a.click();
}
function dashboardHtml(s){
  const cs=(s.courses||[]);
  const bySport={}; cs.forEach(c=>{ bySport[c.sport]=(bySport[c.sport]||0)+c.enrolled; });
  const spKeys=Object.keys(bySport).filter(k=>bySport[k]>0);
  const maxSp=Math.max(1,...spKeys.map(k=>bySport[k]));
  const sportBars = spKeys.length ? spKeys.map(sp=>`<div class="barrow"><span class="bl">${esc(sp)}</span><span class="bt"><span class="bf" style="width:${Math.round(bySport[sp]/maxSp*100)}%"></span></span><span class="bn">${bySport[sp]} 人</span></div>`).join('') : '<div class="mut">未有報名</div>';
  const fillCs=cs.filter(c=>c.enrolled>0);
  const fillBars = fillCs.length ? fillCs.map(c=>{const pct=Math.round(c.enrolled/c.cap*100);return `<div class="barrow"><span class="bl">${esc(c.sport)} ${esc(c.time)}</span><span class="bt"><span class="bf ${pct>=100?'full':''}" style="width:${Math.min(100,pct)}%"></span></span><span class="bn">${c.enrolled}/${c.cap}</span></div>`;}).join('') : '<div class="mut">未有報名</div>';
  return `<div class="card"><h2>📊 報名儀表板</h2>
    <div class="mut" style="margin:2px 0 6px;font-weight:700">各運動報名人數</div>${sportBars}
    <div class="mut" style="margin:14px 0 6px;font-weight:700">各班滿額率</div>${fillBars}
  </div>`;
}
async function setStatus(id,status){
  const msg=document.getElementById('msg');
  const r=await apiPost({action:'enrollSetStatus',coachPass:CP,id,status});
  if(msg){ if(r&&r.ok){ msg.className='msg ok'; msg.textContent=id+' → '+status; } else { msg.className='msg err'; msg.textContent=(r&&r.err)||'失敗'; } }
  loadAll();
}
async function delRec(id,nm){
  if(!confirm('永久刪除報名記錄「'+nm+'」（'+id+'）？此動作不可還原。')) return;
  const msg=document.getElementById('msg');
  const r=await apiPost({action:'enrollDelete',coachPass:CP,id});
  if(msg){ if(r&&r.ok){ msg.className='msg ok'; msg.textContent='已刪除 '+id; } else { msg.className='msg err'; msg.textContent=(r&&r.err)||'刪除失敗'; } }
  loadAll();
}
renderLogin();
</script>
</body>
</html>
