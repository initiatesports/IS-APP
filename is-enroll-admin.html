a.lnk{color:var(--teal-dark);text-decoration:none;font-size:12px;cursor:pointer;}

.msg.err{background:#fdecea;color:var(--err);display:block;} .msg.ok{background:#e8f7ef;color:var(--ok);display:block;}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;} .mut{color:var(--mut);font-size:12px;} .load{text-align:center;color:var(--mut);padding:30px;}
.rowact{display:flex;gap:5px;flex-wrap:wrap;}

.barrow .bl{width:150px;flex-shrink:0;color:#3a464c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.barrow .bt{flex:1;background:#eef2f3;border-radius:5px;height:15px;overflow:hidden;min-width:60px;}

/* tab bar */

/* ── 共用 fetch：45s timeout + 2 次重試（Apps Script 偶爾 cold start / 回 HTML 非 JSON）── */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function rawFetch(url,opt){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),45000);
  try{
    const r=await fetch(url,Object.assign({signal:c.signal},opt||{}));
    const txt=await r.text();
    try{ return JSON.parse(txt); }
    catch(e){ throw new Error('後端回應唔係 JSON（可能 cold start），請再試'); }
  } finally{ clearTimeout(t); }
}
async function apiPost(api,body){
  if(PREVIEW){ await sleep(120); const a=(body&&body.action)||''; if(DEMO[a]) return JSON.parse(JSON.stringify(DEMO[a])); return {ok:false, err:'🔎 預覽模式：唔會真改動（'+a+'）。實際使用請登入。'}; }
  let last;
  for(let i=0;i<3;i++){
    try{ return await rawFetch(api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({coachPass:CP},body||{}))}); }
    catch(e){ last=e; if(i<2) await sleep(700*(i+1)); }
  }
  throw last;
}
async function apiGet(api,params){
  if(PREVIEW){ await sleep(120); const a=(params&&params.action)||''; if(DEMO[a]) return JSON.parse(JSON.stringify(DEMO[a])); return {ok:false, err:'預覽模式'}; }
  let last;
  for(let i=0;i<3;i++){
    try{ return await rawFetch(api+'?'+new URLSearchParams(Object.assign({coachPass:CP},params||{}))); }
    catch(e){ last=e; if(i<2) await sleep(700*(i+1)); }
  }
  throw last;
}
/* C2：付款截圖/確認PDF 已私有 → 用教練密碼經 getSecureFile 攞 base64 再開,唔直連 Drive。*/
async function viewSecureFile(ref){
  if(!ref) return;
  try{
    const r=await apiPost(API4,{action:'getSecureFile',id:ref});
    if(!r||!r.ok||!r.b64){ alert((r&&r.err)||'讀取檔案失敗'); return; }
    const bin=atob(r.b64), bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([bytes],{type:r.mime||'application/octet-stream'}));
    window.open(url,'_blank'); setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(e){ alert('讀取檔案失敗，請再試'); }
}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'$'+(Number(n)||0).toLocaleString();
function num(x){ x=parseFloat(String(x==null?'':x).replace(/[^0-9.\-]/g,'')); return isNaN(x)?0:x; }
function todayIso(){ const d=new Date(),z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
// 由備註抽制服/器材金額（學費淨額以外，另加落實付）
function feeAddon(note){ note=String(note||''); let a=0;
  let m=note.match(/制服[^$]*\$(\d+)/); if(m) a+=+m[1];
  let gseg=note.match(/器材[^ ]*/); if(gseg){ (gseg[0].match(/\$(\d+)/g)||[]).forEach(x=>a+=+x.slice(1)); }
  return a;
}

/* ══════════ 登入 ══════════ */
function renderLogin(err){
  document.getElementById('rfbtn').style.display='none';
  app.innerHTML=`<div class="card"><h2>教練登入</h2>

  document.getElementById('foot').textContent='版本 '+FRONTEND_VERSION;
  const go=document.getElementById('go');
  const doLogin=async()=>{
    CP=document.getElementById('cp').value.trim();
    if(!CP){ return; }
    go.disabled=true; go.textContent='登入中…';
    let r; try{ r=await apiPost(API4,{action:'enrollSummary'}); }catch(e){ r=null; }
    go.disabled=false; go.textContent='登入';
    if(!r||r.ok===false){ renderLogin(r&&r.err?r.err:'密碼錯誤或連線失敗'); CP=''; return; }
    ST.sum=r; ST.enrollPeriod=r.period||r.curPeriod||'';
    document.getElementById('rfbtn').style.display='';
    renderShell(); switchTab('enroll');
  };
  go.onclick=doLogin;
  document.getElementById('cp').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
}

function renderShell(){

}
function setActive(){ document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('active', b.dataset.tab===CUR)); }
function tc(){ return document.getElementById('tabc'); }
function loading(msg){ const c=tc(); if(c) c.innerHTML=`<div class="load">${esc(msg||'載入中…')}</div>`; }
function errBox(e){ return `<div class="card"><div class="msg err">${esc(e||'載入失敗，請按重新整理再試')}</div></div>`; }
function switchTab(name){ CUR=name; setActive();
  if(name==='enroll') renderEnroll();
  else if(name==='transfer') renderTransfer();
  else if(name==='gear') renderGear();
  else if(name==='profile') renderProfile();
  else if(name==='fee') renderFee();
  else if(name==='receipt') renderReceipt();
  else if(name==='ptenroll') renderPtEnroll();
  else if(name==='ptpreset') renderPtPreset();
}
function refreshCur(){
  if(CUR==='enroll'){ ST.sum=null; ST.recs=null; renderEnroll(); }
  else if(CUR==='transfer'){ ST.roster={}; ST.xfers={}; renderTransfer(); }
  else if(CUR==='gear'){ ST.gear=null; renderGear(); }
  else if(CUR==='profile'){ renderProfile(); }
  else if(CUR==='fee'){ ST.feeRecs=null; renderFee(); }
}

/* ════════════════════ TAB 1 報名審核 ════════════════════
   route: enrollSummary(period) + enrollRecords(period) + enrollSetStatus + enrollDelete + getSecureFile */
async function renderEnroll(){
  loading('載入報名概況…');
  try{
    if(!ST.sum) ST.sum=await apiPost(API4,{action:'enrollSummary',period:ST.enrollPeriod||undefined});
    if(!ST.sum||ST.sum.ok===false) throw new Error((ST.sum&&ST.sum.err)||'讀取失敗');
    ST.enrollPeriod=ST.sum.period||ST.enrollPeriod;
    if(!ST.recs) { const rr=await apiPost(API4,{action:'enrollRecords',period:ST.enrollPeriod||undefined}); ST.recs=(rr&&rr.records)||[]; }
    if(!ST.enrollCourses){ try{ const cc=await apiPost(API4,{action:'enrollConfig'}); ST.enrollCourses=(cc&&cc.courses)||[]; }catch(e){ ST.enrollCourses=[]; } }  // 核實前調班用嘅課程清單
  }catch(e){ tc().innerHTML=errBox(e.message); return; }
  drawEnroll();
}
async function changeEnrollPeriod(v){ ST.enrollPeriod=v; ST.sum=null; ST.recs=null; renderEnroll(); }

/* 核實前 inline 調班（老闆 2026-09-04）：改記錄嘅課程 → 核實時發嘅確認電郵就係新課堂時間。route: enrollSwapCourse */
function courseLbl(c){ return `${c.sport}｜${c.day} ${c.time}`; }
function courseOpts(selId){ return (ST.enrollCourses||[]).map(c=>`<option value="${esc(c.id)}"${c.id===selId?' selected':''}>${esc(courseLbl(c))}</option>`).join(''); }
function cidLbl(cid){ const c=(ST.enrollCourses||[]).find(x=>x.id===cid); return c?courseLbl(c):cid; }
function toggleSwap(id){ const el=document.getElementById('sw_'+CSS.escape(id)); if(el) el.style.display = (el.style.display==='none'||!el.style.display) ? 'block' : 'none'; }
async function doSwap(id){
  const msg=document.getElementById('msg');
  const fe=document.getElementById('swf_'+CSS.escape(id)), te=document.getElementById('swt_'+CSS.escape(id));
  const fromCid=fe?fe.value:'', toCid=te?te.value:'';
  if(!fromCid||!toCid){ if(msg){msg.className='msg err';msg.textContent='請揀課程';} return; }
  if(fromCid===toCid){ if(msg){msg.className='msg err';msg.textContent='目標課程同原本一樣';} return; }
  if(!confirm(`確認調班？\n\n由：${cidLbl(fromCid)}\n去：${cidLbl(toCid)}\n\n改完之後，核實時發嘅確認電郵就會用新課堂時間。`)) return;
  try{
    const r=await apiPost(API4,{action:'enrollSwapCourse',id,fromCid,toCid});
    if(msg){ if(r&&r.ok){ msg.className='msg ok'; msg.textContent=`✅ 已調班：${r.name||''} → ${cidLbl(toCid)}（核實時電郵會用新時間）`; } else { msg.className='msg err'; msg.textContent=(r&&r.err)||'調班失敗'; } }
  }catch(e){ if(msg){msg.className='msg err';msg.textContent='連線失敗';} }
  ST.sum=null; ST.recs=null; renderEnroll();
}

function periodSelector(sel, list, cur, onchange){
  const opts=(list||[]).map(p=>`<option value="${esc(p)}" ${p===cur?'selected':''}>${esc(p)}</option>`).join('');
  return `<div class="fld" style="max-width:260px;margin-bottom:12px"><label>選擇期數</label><select id="${sel}" onchange="${onchange}(this.value)">${opts||`<option>${esc(cur||'')}</option>`}</select></div>`;
}

function drawEnroll(){
  const s=ST.sum, recs=ST.recs||[];
  const st=s.stat||{};
  const openBadge = s.open ? '<span class="tag ok">已開放</span>' : '<span class="tag warn">預覽（未開放）</span>';
  const courseRows=(s.courses||[]).map(c=>{
    const seat = c.full?'<span class="tag full">滿</span>':(c.enrolled>=4?'<span class="tag ok">可開班</span>':'<span class="tag warn">未夠4</span>');
    const names = c.active.length?`<div class="names">${c.active.map(esc).join('、')}</div>`:'<span class="mut">—</span>';
    const wl = c.waitlist.length?`<div class="names" style="color:var(--warn)">候補：${c.waitlist.map(esc).join('、')}</div>`:'';
    return `<tr><td><b>${esc(c.sport)}</b><div class="mut">${esc(c.day)} ${esc(c.time)}</div></td>
      <td>${c.enrolled}/${c.cap} ${seat}</td><td>${money(c.price)}</td><td>${names}${wl}</td></tr>`;
  }).join('');
  const nonTest=recs.filter(r=>String(r['備註']||'').indexOf('測試')<0 && String(r['學生姓名']||'').trim()!=='示範學員');
  const byName={}, nameOrder=[];
  nonTest.forEach(r=>{ const nm=String(r['學生姓名']||'').trim(); if(!byName[nm]){ byName[nm]=[]; nameOrder.push(nm); } byName[nm].push(r); });
  const stPri=st=>(st==='已核實'?1:(st==='取消'?2:0));
  const origIdx={}; nameOrder.forEach((n,i)=>origIdx[n]=i);
  nameOrder.sort((a,b)=>{
    const pa=Math.min(...byName[a].map(r=>stPri(String(r['狀態']||''))));
    const pb=Math.min(...byName[b].map(r=>stPri(String(r['狀態']||''))));
    return pa-pb || origIdx[a]-origIdx[b];
  });
  let pendGrand=0, pendNet=0;
  const personBlocks=nameOrder.map(nm=>{
    const rs=byName[nm];
    let base=0,vou=0,ref=0,promo=0,net=0,addon=0, anyPending=false;
    rs.forEach(r=>{ if(String(r['狀態']||'')==='取消') return;
      base+=num(r['原價']); vou+=num(r['代金券']); ref+=num(r['推薦']); promo+=num(r['優惠碼']); net+=num(r['實收']); addon+=feeAddon(r['備註']);
      if(String(r['狀態']||'')!=='已核實') anyPending=true;
    });
    const grand=net+addon;
    if(anyPending){ pendGrand+=grand; pendNet+=net; }
    const feeLine=`原價 ${money(base)}`+(vou?` − 券 ${money(vou)}`:'')+(promo?` − 碼 ${money(promo)}`:'')+(ref?` − 推薦 ${money(ref)}`:'')
      +` → 學費 <b>${money(net)}</b>`+(addon?` ＋ 制服/器材 ${money(addon)}`:'')+` ＝ 實付 <b style="color:var(--ok)">${money(grand)}</b>`;
    const regRows=rs.map(r=>{
      const id=r['記錄編號'], stt=String(r['狀態']||''), note=String(r['備註']||'');
      const cids=String(r['課程編號']||'').split(',').map(s=>s.trim()).filter(Boolean);
      const pay=r['付款截圖']&&String(r['付款截圖']).indexOf('http')===0?`<a class="lnk" onclick="viewSecureFile('${esc(r['付款截圖'])}')">截圖</a>`:'<span class="mut">無截圖</span>';
      const pdf=r['確認PDF']&&String(r['確認PDF']).indexOf('http')===0?` · <a class="lnk" onclick="viewSecureFile('${esc(r['確認PDF'])}')">PDF</a>`:'';
      let act='';
      if(stt!=='已核實') act+=`<button class="btn ok sm" onclick="setStatus('${esc(id)}','已核實')">核實</button>`;
      if(stt==='候補') act+=`<button class="btn sm" onclick="setStatus('${esc(id)}','待核實')">轉正取</button>`;
      if(stt!=='取消' && cids.length) act+=`<button class="btn gray sm" onclick="toggleSwap('${esc(id)}')" title="核實前改課堂／時間，確認電郵就會用新時間">調班</button>`;
      if(stt!=='取消') act+=`<button class="btn err sm" onclick="setStatus('${esc(id)}','取消')">取消</button>`;
      if(stt==='取消') act+=`<button class="btn err sm" onclick="delRec('${esc(id)}','${esc(nm)}')" title="永久刪除呢筆記錄">🗑 刪除</button>`;
      const warn=note?`<div style="color:var(--warn);font-size:12px;margin-top:2px">⚠️ ${esc(note)}</div>`:'';
      let swPanel='';
      if(stt!=='取消' && cids.length){
        const fromSel = cids.length>1
          ? `<select id="swf_${esc(id)}" style="width:100%;padding:6px;margin-bottom:6px">${cids.map(cid=>`<option value="${esc(cid)}">${esc(cidLbl(cid))}</option>`).join('')}</select>`
          : `<input type="hidden" id="swf_${esc(id)}" value="${esc(cids[0])}">`;
        swPanel=`<div id="sw_${esc(id)}" style="display:none;margin-top:7px;padding:9px 11px;background:var(--soft,#f4f7f9);border:1px solid var(--line);border-radius:9px">
          <div class="mut" style="font-size:12px;margin-bottom:6px">改咗之後，核實時發畀家長嘅確認電郵就會用<b>新課堂時間</b>（就算家長報錯時段，你改完先核實就啱）。${cids.length>1?'呢個記錄有多過一個課程，請先揀由邊個轉。':''}</div>
          ${cids.length>1?`<div style="font-size:12px;margin-bottom:3px">由：</div>`+fromSel:fromSel}
          <div style="font-size:12px;margin:2px 0 3px">轉去：</div>
          <select id="swt_${esc(id)}" style="width:100%;padding:6px;margin-bottom:8px">${courseOpts(cids[0])}</select>
          <button class="btn ok sm" onclick="doSwap('${esc(id)}')">確認調班</button>
          <button class="btn gray sm" onclick="toggleSwap('${esc(id)}')">收起</button>
        </div>`;
      }
      return `<div style="padding:7px 0;border-top:1px dashed var(--line)">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
          <div style="flex:1;min-width:0">
            <div><span class="mut">${esc(id)}</span> <span class="st ${esc(stt)}">${esc(stt)}</span> · ${esc(r['報名課程'])} · 實收 ${money(r['實收'])}</div>
            <div style="margin-top:2px">${pay}${pdf}</div>${warn}
          </div>
          <div class="rowact" style="flex-shrink:0">${act}</div>
        </div>
        ${swPanel}
      </div>`;
    }).join('');
    return `<div style="border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap">
        <b style="font-size:15px">${esc(nm)}</b>${rs.length>1?`<span class="tag warn">${rs.length} 次報名合併</span>`:''}
      </div>
      <div style="font-size:13px;color:var(--ink);margin:4px 0 2px">${feeLine}</div>
      ${regRows}
    </div>`;
  }).join('') || '<div class="mut">未有報名記錄</div>';

  tc().innerHTML=`
  ${periodSelector('enrPeriod', s.periods, ST.enrollPeriod, 'changeEnrollPeriod')}
  <div class="card">
    <h2>${esc(s.period)} 報名概況 ${openBadge}</h2>
    <div class="stats">
      <div class="stat"><div class="n">${st.total||0}</div><div class="l">總報名</div></div>
      <div class="stat"><div class="n">${st.verified||0}</div><div class="l">已核實</div></div>
      <div class="stat"><div class="n">${st.pending||0}</div><div class="l">待核實</div></div>
      <div class="stat"><div class="n">${st.waitlist||0}</div><div class="l">候補</div></div>
      <div class="stat"><div class="n">${money(st.revenue||0)}</div><div class="l">已收入</div></div>
    </div>
    <div class="rowact" style="margin-top:12px">
      <button class="btn sm" onclick="exportRoster()">📋 匯出名冊</button>
      <button class="btn sm gray" onclick="exportCSV()">⬇️ 匯出 CSV</button>
    </div>
    <div class="msg" id="msg"></div>
    <textarea id="exp" style="display:none;width:100%;height:180px;margin-top:10px;font-size:12px;font-family:monospace;border:1px solid var(--line);border-radius:8px;padding:8px"></textarea>
  </div>
  ${dashboardHtml(s)}
  <div class="card"><h2>逐課程名額（最低 4 人開班）</h2>
    <div class="scroll"><table><tr><th>課程</th><th>名額</th><th>學費</th><th>正取學生 / 候補</th></tr>${courseRows}</table></div>
  </div>
  <div class="card"><h2>逐筆報名審核（同一人已合併）</h2>
    <div class="mut" style="margin:-4px 0 10px">學費淨額 = 原價 − 券 − 優惠碼 − 推薦 ＋ 帶入調整；實付 = 學費 ＋ 制服/器材。⚠️ 標示＝重複收費／帶入調整等要核對。</div>
    <div class="msg ok" style="margin-bottom:10px">未核實合計：學費 <b>${money(pendNet)}</b> ｜ 連制服器材實付 <b>${money(pendGrand)}</b></div>
    ${personBlocks}
  </div>`;
}
function exportRoster(){
  const s=ST.sum; if(!s) return;
  let out='INITIATE SPORTS '+s.period+' 報名名冊（正取學生，可貼入班別 CLASSES）\n';
  out+='※ 只列已核實/待核實正取學生（唔含候補/取消/測試）\n\n';
  (s.courses||[]).forEach(c=>{
    if(!c.active.length && !c.waitlist.length) return;
    out+=`【${c.sport} ${c.day} ${c.time}】 正取 ${c.enrolled}/${c.cap}${c.enrolled>=4?'（可開班）':'（未夠4人）'}\n`;
    out+='  正取：'+(c.active.length?c.active.join('、'):'—')+'\n';
    if(c.waitlist.length) out+='  候補：'+c.waitlist.join('、')+'\n';
    out+='\n';
  });
  const ta=document.getElementById('exp'); ta.style.display='block'; ta.value=out; ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  const msg=document.getElementById('msg'); msg.className='msg ok'; msg.textContent='名冊已生成（已嘗試複製到剪貼簿）。';
}
function exportCSV(){
  const recs=(ST.recs||[]).filter(r=>String(r['備註']).indexOf('測試')<0);
  if(!recs.length){ const m=document.getElementById('msg'); m.className='msg err'; m.textContent='未有記錄。'; return; }
  const cols=['記錄編號','時間戳','學生姓名','家長電話','報名課程','實收','制服器材','實付','狀態','付款截圖','確認PDF'];
  let csv=cols.join(',')+'\n';
  recs.forEach(r=>{ const addon=feeAddon(r['備註']); const row=Object.assign({}, r, {'制服器材':addon, '實付':num(r['實收'])+addon});
    csv+=cols.map(c=>'"'+String(row[c]==null?'':row[c]).replace(/"/g,'""')+'"').join(',')+'\n'; });
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='報名記錄_'+(ST.sum?ST.sum.period:'')+'.csv'; a.click();
}
function dashboardHtml(s){
  const cs=(s.courses||[]);
  const bySport={}; cs.forEach(c=>{ bySport[c.sport]=(bySport[c.sport]||0)+c.enrolled; });
  const spKeys=Object.keys(bySport).filter(k=>bySport[k]>0);
  const maxSp=Math.max(1,...spKeys.map(k=>bySport[k]));
  const sportBars = spKeys.length ? spKeys.map(sp=>`<div class="barrow"><span class="bl">${esc(sp)}</span><span class="bt"><span class="bf" style="width:${Math.round(bySport[sp]/maxSp*100)}%"></span></span><span class="bn">${bySport[sp]} 人</span></div>`).join('') : '<div class="mut">未有報名</div>';
  const fillCs=cs.filter(c=>c.enrolled>0);
  const fillBars = fillCs.length ? fillCs.map(c=>{
    const pct=Math.round(c.enrolled/c.cap*100);
    const nm = c.active.length?`<div class="names" style="margin:1px 0 9px 2px;font-size:13px;line-height:1.5">${c.active.map(esc).join('、')}${c.waitlist.length?`　<span style="color:var(--warn)">候補：${c.waitlist.map(esc).join('、')}</span>`:''}</div>`:'';
    return `<div class="barrow"><span class="bl">${esc(c.sport)} ${esc(c.time)}</span><span class="bt"><span class="bf ${pct>=100?'full':''}" style="width:${Math.min(100,pct)}%"></span></span><span class="bn">${c.enrolled}/${c.cap}</span></div>${nm}`;
  }).join('') : '<div class="mut">未有報名</div>';
  return `<div class="card"><h2>📊 報名儀表板</h2>
    <div class="mut" style="margin:2px 0 6px;font-weight:700">各運動報名人數</div>${sportBars}
    <div class="mut" style="margin:14px 0 6px;font-weight:700">各班滿額率</div>${fillBars}
  </div>`;
}
async function setStatus(id,status){
  const msg=document.getElementById('msg');
  try{
    const r=await apiPost(API4,{action:'enrollSetStatus',id,status});
    if(msg){ if(r&&r.ok){ msg.className='msg ok'; msg.textContent=id+' → '+status; } else { msg.className='msg err'; msg.textContent=(r&&r.err)||'失敗'; } }
  }catch(e){ if(msg){ msg.className='msg err'; msg.textContent='連線失敗'; } }
  ST.sum=null; ST.recs=null; renderEnroll();
}
async function delRec(id,nm){
  if(!confirm('永久刪除報名記錄「'+nm+'」（'+id+'）？此動作不可還原。')) return;
  const msg=document.getElementById('msg');
  try{
    const r=await apiPost(API4,{action:'enrollDelete',id});
    if(msg){ if(r&&r.ok){ msg.className='msg ok'; msg.textContent='已刪除 '+id; } else { msg.className='msg err'; msg.textContent=(r&&r.err)||'刪除失敗'; } }
  }catch(e){ if(msg){ msg.className='msg err'; msg.textContent='連線失敗'; } }
  ST.sum=null; ST.recs=null; renderEnroll();
}

/* ════════════════════ TAB 2 調班／轉班 ════════════════════
   route: rosterList + transfer + transfersList + undoTransfer（跳繩#4 或 運動班#SA）*/
async function renderTransfer(){
  const sys=ST.xferSys;
  loading('載入名冊…');
  try{
    if(!ST.roster[sys]){ const r=await apiGet(apiOf(sys==='sa'?'sa':'4'),{action:'rosterList'}); if(!r||r.ok===false) throw new Error((r&&r.err)||'讀取名冊失敗'); ST.roster[sys]=r.classes||[]; }
    if(!ST.xfers[sys]){ const r=await apiGet(apiOf(sys==='sa'?'sa':'4'),{action:'transfersList'}); ST.xfers[sys]=(r&&r.transfers)||[]; }
  }catch(e){ tc().innerHTML=xferSeg()+errBox(e.message); return; }
  drawTransfer();
}
function xferSeg(){
  return `<div class="seg">
    <button class="${ST.xferSys==='rope'?'active':''}" onclick="setXferSys('rope')">跳繩恆常班</button>
    <button class="${ST.xferSys==='sa'?'active':''}" onclick="setXferSys('sa')">運動班</button>
  </div>`;
}
function setXferSys(s){ if(ST.xferSys===s) return; ST.xferSys=s; renderTransfer(); }

function drawTransfer(){
  const sys=ST.xferSys, api=sys==='sa'?'sa':'4';
  const classes=ST.roster[sys]||[], xfers=ST.xfers[sys]||[];
  // 學生下拉：name|fromCid，顯示「姓名（班別）」
  const studOpts=['<option value="">— 揀學生 —</option>'];
  classes.forEach(c=>{ (c.students||[]).forEach(nm=>{ studOpts.push(`<option value="${esc(nm)}|${esc(c.cid)}">${esc(nm)}（${esc(c.label)}）</option>`); }); });
  const clsOpts=classes.map(c=>`<option value="${esc(c.cid)}">${esc(c.label)}（現 ${(c.students||[]).length} 人）</option>`).join('');
  const xferRows = xfers.length ? xfers.map(t=>`<tr>
      <td><b>${esc(t.name)}</b></td>
      <td>${esc(t.from)} → ${esc(t.to)}</td>
      <td>${esc(t.date)}</td>
      <td><button class="btn err sm" onclick="undoXfer(${t.row})">撤銷</button></td>
    </tr>`).join('') : '<tr><td colspan="4" class="mut">未有調班紀錄</td></tr>';

  tc().innerHTML=`
  ${xferSeg()}
  <div class="card">
    <h2>新增調班</h2>
    <div class="mut" style="margin:-4px 0 10px">選擇學生同目標班，生效日起計。⚠️ 學費唔會自動改，記得人手檢視。</div>
    <div class="fld"><label>學生（顯示現時班別）</label><select id="xStud" onchange="onXferStud()">${studOpts.join('')}</select></div>
    <div class="fld"><label>目前班別</label><input id="xFromLbl" readonly placeholder="揀學生後自動顯示"></div>
    <div class="fld"><label>轉去邊班</label><select id="xTo">${clsOpts}</select></div>
    <div class="fld"><label>生效日期</label><input id="xDate" type="date" value="${todayIso()}"></div>
    <div class="fld"><label>備註（可選）</label><input id="xNote" placeholder="例：家長要求轉時段"></div>
    <button class="btn" id="xGo" onclick="doTransfer()">確認調班</button>
    <div class="msg" id="xmsg"></div>
  </div>
  <div class="card"><h2>現有調班紀錄</h2>
    <div class="scroll"><table><tr><th>學生</th><th>由 → 去</th><th>生效日</th><th>操作</th></tr>${xferRows}</table></div>
  </div>`;
}
function onXferStud(){
  const v=document.getElementById('xStud').value;
  const lbl=document.getElementById('xFromLbl');
  if(!v){ lbl.value=''; return; }
  const cid=v.split('|')[1];
  const c=(ST.roster[ST.xferSys]||[]).find(x=>x.cid===cid);
  lbl.value=c?c.label:cid;
}
async function doTransfer(){
  const sys=ST.xferSys, api=apiOf(sys==='sa'?'sa':'4');
  const v=document.getElementById('xStud').value, msg=document.getElementById('xmsg');
  const toCid=document.getElementById('xTo').value, date=document.getElementById('xDate').value, note=document.getElementById('xNote').value.trim();
  if(!v){ msg.className='msg err'; msg.textContent='請揀學生'; return; }
  const [name,fromCid]=v.split('|');
  if(!toCid){ msg.className='msg err'; msg.textContent='請揀目標班'; return; }
  if(fromCid===toCid){ msg.className='msg err'; msg.textContent='目標班同現時班相同'; return; }
  if(!date){ msg.className='msg err'; msg.textContent='請揀生效日期'; return; }
  const toC=(ST.roster[sys]||[]).find(x=>x.cid===toCid);
  if(!confirm(`確認調班？\n\n學生：${name}\n由：${document.getElementById('xFromLbl').value}\n去：${toC?toC.label:toCid}\n生效：${date}\n\n⚠️ 會即時影響出席名冊；學費唔會自動改。`)) return;
  const go=document.getElementById('xGo'); go.disabled=true; go.textContent='處理中…';
  try{
    const r=await apiPost(api,{action:'transfer',name,fromCid,toCid,date,note});
    if(r&&r.ok){
      if(r.dup){ msg.className='msg ok'; msg.textContent='此調班已存在（未重複加）。'; }
      else{ msg.className='msg ok'; msg.textContent=`✅ 已調班：${r.name} ${r.from} → ${r.to}（${r.date}）。${r.feeNote||''}`; }
      ST.roster[sys]=null; ST.xfers[sys]=null; setTimeout(renderTransfer,900);
    } else { msg.className='msg err'; msg.textContent=(r&&r.err)||'調班失敗'; }
  }catch(e){ msg.className='msg err'; msg.textContent='連線失敗，請再試'; }
  go.disabled=false; go.textContent='確認調班';
}
async function undoXfer(row){
  const sys=ST.xferSys, api=apiOf(sys==='sa'?'sa':'4');
  if(!confirm('確認撤銷此調班？學生會還原返原班（影響出席名冊）。')) return;
  try{

}

/* ════════════════════ TAB 3 器材派發 ════════════════════
   route: gearOrdersList + gearDispatch（#4）*/
async function renderGear(){
  loading('載入器材訂單…');
  try{
    if(!ST.gear){ const r=await apiPost(API4,{action:'gearOrdersList'}); if(!r||r.ok===false) throw new Error((r&&r.err)||'讀取失敗'); ST.gear=r.orders||[]; }
  }catch(e){ tc().innerHTML=errBox(e.message); return; }
  drawGear();
}
function setGearFilter(f){ ST.gearFilter=f; drawGear(); }
function drawGear(){
  const all=ST.gear||[];
  const total=all.length, undis=all.filter(o=>!o.dispatched).length, dis=total-undis;
  const f=ST.gearFilter;
  const list=all.filter(o=> f==='all'?true : (f==='undis'? !o.dispatched : o.dispatched));
  const rows = list.length ? list.map(o=>`<tr>
      <td><b>${esc(o.name||'—')}</b>${o.classInfo?`<div class="mut">${esc(o.classInfo)}</div>`:''}</td>
      <td>${esc(o.items||'—')}</td>
      <td>${money(o.amount)}</td>
      <td><span class="pill">${esc(o.src||'')}</span>${o.payLink?` <a class="lnk" onclick="viewSecureFile('${esc(o.payLink)}')">📎 睇截圖</a>`:(o.hasPay?' <span class="mut" title="截圖喺報名記錄，可去報名審核 tab 開">📎</span>':'')}<div class="mut">${esc(o.status||'')}</div></td>
      <td>${o.dispatched?'<span class="tag ok">已派</span>':'<span class="tag warn">未派</span>'}</td>
      <td>${o.dispatched
        ? `<button class="btn gray sm" onclick="dispatch('${esc(o.id)}',0)">取消已派</button>`
        : `<button class="btn ok sm" onclick="dispatch('${esc(o.id)}',1)">標記已派</button>`}</td>
    </tr>`).join('') : '<tr><td colspan="6" class="mut">未有訂單</td></tr>';
  tc().innerHTML=`
  <div class="card">
    <h2>🎒 器材／制服派發追蹤</h2>
    <div class="stats" style="margin-bottom:12px">
      <div class="stat"><div class="n">${total}</div><div class="l">總訂單</div></div>
      <div class="stat"><div class="n" style="color:var(--warn)">${undis}</div><div class="l">未派</div></div>
      <div class="stat"><div class="n" style="color:var(--ok)">${dis}</div><div class="l">已派</div></div>
    </div>
    <div class="seg">
      <button class="${f==='all'?'active':''}" onclick="setGearFilter('all')">全部</button>
      <button class="${f==='undis'?'active':''}" onclick="setGearFilter('undis')">未派</button>
      <button class="${f==='dis'?'active':''}" onclick="setGearFilter('dis')">已派</button>
    </div>
    <div class="msg" id="gmsg"></div>
    <div class="scroll"><table><tr><th>學生 / 班別</th><th>器材／制服</th><th>金額</th><th>來源</th><th>派發</th><th>操作</th></tr>${rows}</table></div>
  </div>`;
}
async function dispatch(id,to){
  const label=to?'標記為「已派」':'改回「未派」';
  if(!confirm(`確認${label}？（訂單 ${id}）`)) return;
  const msg=document.getElementById('gmsg');
  try{
    const r=await apiPost(API4,{action:'gearDispatch',id,dispatched:to});
    if(r&&r.ok){ ST.gear=null; renderGear(); }
    else if(msg){ msg.className='msg err'; msg.textContent=(r&&r.err)||'失敗'; }
  }catch(e){ if(msg){ msg.className='msg err'; msg.textContent='連線失敗'; } }
}

async function doProfile(){
  const q=document.getElementById('pq').value.trim();
  const msg=document.getElementById('pmsg'), pres=document.getElementById('pres');
  if(!q){ msg.className='msg err'; msg.textContent='請輸入姓名'; return; }
  msg.className='msg'; msg.style.display='none';
  pres.innerHTML='<div class="load">搜尋中…</div>';
  try{
    const [recR, r4, rsa, gearR]=await Promise.all([
      apiPost(API4,{action:'enrollRecords'}),                       // 全期
      apiGet(API4,{action:'rosterList'}),
      apiGet(APISA,{action:'rosterList'}),
      apiPost(API4,{action:'gearOrdersList'})
    ]);
    const recs=((recR&&recR.records)||[]).filter(r=>String(r['學生姓名']||'').trim()===q);
    const inClasses=[];
    ((r4&&r4.classes)||[]).forEach(c=>{ if((c.students||[]).includes(q)) inClasses.push('跳繩｜'+c.label); });
    ((rsa&&rsa.classes)||[]).forEach(c=>{ if((c.students||[]).includes(q)) inClasses.push('運動班｜'+c.label); });

    if(!recs.length && !inClasses.length && !gears.length){
      pres.innerHTML=`<div class="card"><div class="mut">搵唔到「${esc(q)}」嘅任何報名／名冊／器材記錄。請確認中文全名。</div></div>`;
      return;
    }
    // 報名記錄
    let paid=0, pend=0;
    const recRows=recs.map(r=>{
      const stt=String(r['狀態']||''); const net=num(r['實收']), addon=feeAddon(r['備註']);
      if(stt==='已核實') paid+=net+addon; else if(stt!=='取消') pend+=net+addon;
      const note=String(r['備註']||'');
      return `<tr><td>${esc(r['期數']||'—')}</td><td>${esc(r['報名課程']||'')}</td>
        <td>${money(r['實收'])}${addon?`<div class="mut">+器材/制服 ${money(addon)}</div>`:''}</td>
        <td><span class="st ${esc(stt)}">${esc(stt)}</span></td>

    }).join('') || '<tr><td colspan="5" class="mut">冇報名記錄</td></tr>';
    // 器材
    const gearRows=gears.map(o=>`<tr><td>${esc(o.items||'')}</td><td>${money(o.amount)}</td>
      <td><span class="pill">${esc(o.src||'')}</span></td><td>${o.dispatched?'<span class="tag ok">已派</span>':'<span class="tag warn">未派</span>'}</td></tr>`).join('')
      || '<tr><td colspan="4" class="mut">冇器材訂單</td></tr>';

    pres.innerHTML=`
    <div class="card">
      <h2>${esc(q)}</h2>
      <div class="stats">
        <div class="stat"><div class="n">${inClasses.length}</div><div class="l">現有班數</div></div>
        <div class="stat"><div class="n">${recs.length}</div><div class="l">報名次數</div></div>
        <div class="stat"><div class="n">${money(paid)}</div><div class="l">已核實實付</div></div>
        <div class="stat"><div class="n" style="color:var(--warn)">${money(pend)}</div><div class="l">待付</div></div>
      </div>
      <div class="mut" style="margin-top:12px;font-weight:700">現時所屬班別</div>
      <div class="names" style="margin-top:4px">${inClasses.length?inClasses.map(esc).join('<br>'):'<span class="mut">冇（未入任何名冊）</span>'}</div>
    </div>
    <div class="card"><h2>報名記錄（全期）</h2>
      <div class="scroll"><table><tr><th>期數</th><th>課程</th><th>實收</th><th>狀態</th><th>備註</th></tr>${recRows}</table></div>
    </div>
    <div class="card"><h2>器材訂單</h2>
      <div class="scroll"><table><tr><th>器材</th><th>金額</th><th>來源</th><th>派發</th></tr>${gearRows}</table></div>
    </div>`;
  }catch(e){ pres.innerHTML=errBox('搜尋失敗，請再試'); }

/* ════════════════════ TAB 5 收費總覽 ════════════════════
   route: enrollRecords(period) + enrollAdjustFee(dryRun→確認)*/
async function renderFee(){
  loading('載入收費資料…');
  try{
    if(!ST.feePeriod) ST.feePeriod=ST.enrollPeriod||(ST.sum&&ST.sum.curPeriod)||'';
    if(!ST.feeRecs){ const r=await apiPost(API4,{action:'enrollRecords',period:ST.feePeriod||undefined});
      if(!r||r.ok===false) throw new Error((r&&r.err)||'讀取失敗');
      ST.feeRecs=r.records||[]; ST._feePeriods=r.periods||[]; if(!ST.feePeriod) ST.feePeriod=r.curPeriod||''; }
  }catch(e){ tc().innerHTML=errBox(e.message); return; }
  drawFee();
}
async function changeFeePeriod(v){ ST.feePeriod=v; ST.feeRecs=null; renderFee(); }
function drawFee(){
  const recs=(ST.feeRecs||[]).filter(r=>String(r['備註']||'').indexOf('測試')<0 && String(r['學生姓名']||'').trim()!=='示範學員' && String(r['狀態']||'')!=='取消');
  let revenue=0, verified=0, pending=0;
  const rows=recs.map(r=>{
    const stt=String(r['狀態']||''), net=num(r['實收']), addon=feeAddon(r['備註']), base=num(r['原價']);
    if(stt==='已核實'){ revenue+=net+addon; verified++; } else pending++;
    const id=r['記錄編號'];
    return `<tr>
      <td><b>${esc(r['學生姓名'])}</b></td>
      <td>${esc(r['報名課程']||'')}</td>
      <td>${money(base)}</td>
      <td><b>${money(net)}</b>${addon?`<div class="mut">+${money(addon)} 制服/器材</div>`:''}</td>
      <td><span class="st ${esc(stt)}">${esc(stt)}</span></td>
      <td><button class="btn sm gray" onclick="adjustFee('${esc(id)}','${esc(r['學生姓名'])}',${net})">調整</button></td>
    </tr>`;
  }).join('') || '<tr><td colspan="6" class="mut">此期未有報名記錄</td></tr>';
  tc().innerHTML=`
  ${periodSelector('feePeriod', ST._feePeriods, ST.feePeriod, 'changeFeePeriod')}
  <div class="card">
    <h2>💰 收費總覽</h2>
    <div class="stats" style="margin-bottom:12px">
      <div class="stat"><div class="n">${money(revenue)}</div><div class="l">已核實收入</div></div>
      <div class="stat"><div class="n" style="color:var(--ok)">${verified}</div><div class="l">已核實人數</div></div>
      <div class="stat"><div class="n" style="color:var(--warn)">${pending}</div><div class="l">待付/待核實</div></div>
    </div>
    <div class="mut" style="margin:-2px 0 8px">「已核實收入」= 已核實記錄嘅實收 ＋ 制服/器材。調整實收前有預覽同確認。</div>
    <div class="msg" id="fmsg"></div>
    <div class="scroll"><table><tr><th>學生</th><th>課程</th><th>原價</th><th>實收</th><th>狀態</th><th>操作</th></tr>${rows}</table></div>
  </div>`;
}
async function adjustFee(id,nm,curNet){
  const msg=document.getElementById('fmsg');
  const ds=prompt(`調整「${nm}」實收（${id}）。\n目前實收 $${curNet}。\n輸入增減金額（正數加、負數減，例：-100）：`,'');
  if(ds===null) return;
  const delta=Number(String(ds).replace(/[^0-9.\-]/g,''));
  if(!delta){ if(msg){ msg.className='msg err'; msg.textContent='金額無效（需非零數字）'; } return; }
  const note=prompt('調整原因／備註（會寫入記錄）：','')||'';
  try{
    const dry=await apiPost(API4,{action:'enrollAdjustFee',id,delta,note,dryRun:1});
    if(!dry||dry.ok===false){ if(msg){ msg.className='msg err'; msg.textContent=(dry&&dry.err)||'預覽失敗'; } return; }
    if(!confirm(`確認調整？\n\n學生：${dry.name}\n實收：$${dry.oldNet} → $${dry.newNet}（${delta>0?'+':''}${delta}）\n備註：${dry.note}`)) return;
    const r=await apiPost(API4,{action:'enrollAdjustFee',id,delta,note});
    if(r&&r.ok){ if(msg){ msg.className='msg ok'; msg.textContent=`✅ ${r.name}：$${r.oldNet} → $${r.newNet}`; } ST.feeRecs=null; ST.sum=null; setTimeout(renderFee,700); }
    else if(msg){ msg.className='msg err'; msg.textContent=(r&&r.err)||'調整失敗'; }
  }catch(e){ if(msg){ msg.className='msg err'; msg.textContent='連線失敗，請再試'; } }
}

/* ════════════════════ TAB 6 出收據 ════════════════════
   route: receiptCreate + receiptList（#4）。教練填收款對象+項目+繳費方式(現金/銀行過帳)+簽名→PDF→下載自行WhatsApp。老闆 2026-08-29 整合入報名管理，唔想咁多網址。*/
let RC_ITEMS=[], RC_PAY='現金繳付', RC_SIG={cv:null,ctx:null,has:false,px:0,py:0,drawing:false};
function rcToday(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
async function renderReceipt(){
  loading('載入收據…');
  let recs=[];
  try{ const r=await apiPost(API4,{action:'receiptList'}); if(r&&r.ok) recs=r.receipts||[]; }catch(e){}
  RC_PAY='現金繳付'; RC_ITEMS=[{desc:'',amt:''}];
  tc().innerHTML=`
  <div class="card">
    <h2>🧾 出收據</h2>
    <p class="mut" style="margin:-4px 0 12px">填收款對象、項目同繳費方式，簽名後生成 PDF，可下載自行 WhatsApp 畀學員。</p>
    <div class="fld"><label>收款對象姓名 *</label><input id="rc_name" placeholder="學員／家長姓名"></div>
    <div class="fld"><label>項目及金額 *</label><div id="rc_items"></div>
      <button class="btn gray" style="width:100%;margin-top:2px" onclick="rcAddItem()">＋ 加多一項</button>
      <div style="display:flex;justify-content:space-between;font-weight:800;font-size:16px;padding:10px 2px 2px;border-top:1px solid var(--line);margin-top:8px"><span>總額</span><span id="rc_tot">$0</span></div></div>
    <div class="fld"><label>繳費方式 *</label>
      <div class="seg" id="rc_pay">${['現金繳付','銀行過帳'].map(x=>`<button data-v="${x}" class="${RC_PAY===x?'active':''}">${x}</button>`).join('')}</div></div>
    <div class="fld"><label>日期</label><input id="rc_date" type="date" value="${rcToday()}"></div>
    <div class="fld"><label>備註（選填）</label><input id="rc_note" placeholder="如：私訓 10 節套票、期數等"></div>
    <div class="fld"><label>收款人簽名（可留空）</label>
      <canvas id="rc_sig" style="width:100%;height:160px;border:1.5px dashed var(--line);border-radius:10px;background:#fff;touch-action:none;display:block"></canvas>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><span class="mut">可留空 — 收據靠 QR 核實真偽，唔簽名亦有效（免簽名被盜用）。</span><button class="btn gray sm" onclick="rcClearSig()">清除</button></div></div>
    <div class="msg" id="rc_msg"></div>
    <button class="btn" id="rc_gen" onclick="rcGen()" style="width:100%">生成收據 PDF</button>
  </div>
  <div id="rc_result"></div>
  ${recs.length?`<div class="card"><h2>🗂️ 最近收據（${recs.length}）</h2><div class="scroll"><table><tr><th>收款對象</th><th>金額</th><th>繳費</th><th>日期／編號</th><th></th></tr>${recs.slice(0,30).map(r=>`<tr><td><b>${esc(r.name)}</b><div class="mut">${esc(r.items)}</div></td><td>$${r.total}</td><td>${esc(r.pay)}</td><td class="mut">${esc(String(r.ts).slice(0,10))}<br>${esc(r.id)}</td><td><button class="btn err sm" onclick="rcDel('${esc(r.id)}','${esc(r.name)}')">刪</button></td></tr>`).join('')}</table></div></div>`:''}`;
  rcDrawItems();
  tc().querySelectorAll('#rc_pay button').forEach(b=>b.onclick=()=>{ RC_PAY=b.getAttribute('data-v'); tc().querySelectorAll('#rc_pay button').forEach(x=>x.classList.toggle('active',x.getAttribute('data-v')===RC_PAY)); });
  rcInitSig();
}
function rcAddItem(){ RC_ITEMS.push({desc:'',amt:''}); rcDrawItems(); }
function rcDelItem(i){ RC_ITEMS.splice(i,1); if(!RC_ITEMS.length) RC_ITEMS.push({desc:'',amt:''}); rcDrawItems(); }
function rcDrawItems(){
  const box=document.getElementById('rc_items'); if(!box) return;
  box.innerHTML=RC_ITEMS.map((it,i)=>`<div style="display:flex;gap:8px;margin-bottom:8px;align-items:center">
    <input style="flex:1" data-i="${i}" data-k="desc" placeholder="項目描述（如：私訓 10 節套票）" value="${esc(it.desc)}">
    <input style="width:100px" data-i="${i}" data-k="amt" inputmode="numeric" placeholder="金額" value="${esc(it.amt)}">
    ${RC_ITEMS.length>1?`<button class="btn err sm" style="flex-shrink:0" onclick="rcDelItem(${i})">✕</button>`:''}</div>`).join('');
  box.querySelectorAll('input').forEach(inp=>inp.oninput=()=>{ const i=+inp.getAttribute('data-i'),k=inp.getAttribute('data-k'); RC_ITEMS[i][k]=inp.value; if(k==='amt') rcUpdTot(); });
  rcUpdTot();
}
function rcUpdTot(){ const t=RC_ITEMS.reduce((s,x)=>s+(Number(x.amt)||0),0); const el=document.getElementById('rc_tot'); if(el) el.textContent='$'+t; }
function rcInitSig(){
  const cv=document.getElementById('rc_sig'); if(!cv) return;
  const rect=cv.getBoundingClientRect(); cv.width=rect.width*2; cv.height=rect.height*2;
  const ctx=cv.getContext('2d'); ctx.scale(2,2); ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.strokeStyle='#1f2a30';
  RC_SIG={cv,ctx,has:false,px:0,py:0,drawing:false};
  const pos=e=>{ const r=cv.getBoundingClientRect(); const p=e.touches?e.touches[0]:e; return [p.clientX-r.left,p.clientY-r.top]; };
  const start=e=>{ e.preventDefault(); RC_SIG.drawing=true; [RC_SIG.px,RC_SIG.py]=pos(e); };
  const move=e=>{ if(!RC_SIG.drawing)return; e.preventDefault(); const [x,y]=pos(e); ctx.beginPath(); ctx.moveTo(RC_SIG.px,RC_SIG.py); ctx.lineTo(x,y); ctx.stroke(); [RC_SIG.px,RC_SIG.py]=[x,y]; RC_SIG.has=true; };
  const end=()=>{ RC_SIG.drawing=false; };
  cv.onmousedown=start; cv.onmousemove=move; window.addEventListener('mouseup',end);
  cv.ontouchstart=start; cv.ontouchmove=move; cv.ontouchend=end;
}
function rcClearSig(){ if(RC_SIG.cv){ RC_SIG.ctx.clearRect(0,0,RC_SIG.cv.width,RC_SIG.cv.height); RC_SIG.has=false; } }
async function rcGen(){
  const g=id=>(document.getElementById(id).value||'').trim();
  const msg=document.getElementById('rc_msg'), btn=document.getElementById('rc_gen');
  const name=g('rc_name');
  const items=RC_ITEMS.map(x=>({desc:(x.desc||'').trim(),amt:Number(x.amt)||0})).filter(x=>x.desc||x.amt>0);
  if(!name){ msg.className='msg err'; msg.textContent='請填收款對象姓名。'; return; }
  if(!items.length){ msg.className='msg err'; msg.textContent='請至少填一個項目及金額。'; return; }
  const sig=RC_SIG.has?RC_SIG.cv.toDataURL('image/png'):'';
  msg.className='msg'; msg.style.cssText='display:block;background:var(--teal-dim);color:var(--teal-dark)'; msg.textContent='生成中…'; btn.disabled=true; btn.textContent='生成中…';
  let r; try{ r=await apiPost(API4,{action:'receiptCreate',name,items,payMethod:RC_PAY,date:g('rc_date'),note:g('rc_note'),signImg:sig}); }catch(e){ r=null; }
  btn.disabled=false; btn.textContent='生成收據 PDF'; msg.style.cssText='';
  if(!r||r.ok===false){ msg.className='msg err'; msg.textContent=(r&&r.err)||'生成失敗'; return; }
  msg.className='msg ok'; msg.textContent='收據 '+r.id+' 已生成並存底 ✓（下方可預覽／下載）';
  const dataUri='data:application/pdf;base64,'+r.pdfBase64;
  document.getElementById('rc_result').innerHTML=`<div class="card"><h2>✅ ${esc(r.id)}　$${r.total}</h2>
    <a class="btn" href="${dataUri}" download="${esc(r.filename)}" style="display:block;text-align:center;text-decoration:none">⬇️ 下載 PDF（再 WhatsApp 畀學員）</a>
    <iframe src="${dataUri}" style="width:100%;height:420px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:10px"></iframe></div>`;
  document.getElementById('rc_result').scrollIntoView({behavior:'smooth'});
}

async function rcDel(id,name){
  if(!confirm('確定刪除收據「'+name+'」（'+id+'）？收據 PDF 亦會移入垃圾桶。')) return;
  const r=await apiPost(API4,{action:'receiptDelete',id});
  if(!r||r.ok===false){ alert((r&&r.err)||'刪除失敗'); return; }
  renderReceipt();
}

/* ════════════════════ TAB 7 私訓預設 ════════════════════
   route: ptPresetList/Set/Delete（#4）。教練預設學員首課日/1對1或1對2/特別價 → 學員填私訓報名表按姓名+電話套用。老闆 2026-08-29 整合入報名管理，唔想咁多網址。*/
let PP_EDIT=null, PP_SEL={mode:'1對1',priceMode:'標準'};
async function renderPtPreset(){
  loading('載入私訓預設…');
  let ps=[];
  try{ const r=await apiPost(API4,{action:'ptPresetList'}); if(r&&r.ok) ps=r.presets||[]; else if(!PREVIEW){ tc().innerHTML=errBox(r&&r.err); return; } }catch(e){ tc().innerHTML=errBox(); return; }
  PP_EDIT=null; PP_SEL={mode:'1對1',priceMode:'標準'};
  tc().innerHTML=ppForm()+ppList(ps);
  ppBind();
}
function ppSeg(id,opts,cur){ return `<div class="seg" id="${id}">${opts.map(o=>`<button data-v="${o[0]}" class="${cur===o[0]?'active':''}">${o[1]}</button>`).join('')}</div>`; }
function ppForm(){
  const e=PP_EDIT||{};
  PP_SEL.mode=e.mode||PP_SEL.mode||'1對1'; PP_SEL.priceMode=e.priceMode||PP_SEL.priceMode||'標準';
  return `
  <div class="card">
    <h2>${PP_EDIT?'✏️ 編輯私訓預設':'➕ 新增學員私訓預設'}</h2>
    <p class="mut" style="margin:-4px 0 12px">按<b>姓名＋電話</b>認人；學員之後填私訓報名表，姓名＋電話夾到即刻套用（首課日／形式／自訂價）。</p>
    <div class="fld"><label>學員姓名 *</label><input id="pp_name" value="${esc(e.name||'')}" placeholder="中文姓名"></div>
    <div class="fld"><label>聯絡電話 *（8 位或後 4 位）</label><input id="pp_phone" inputmode="numeric" value="${esc(e.phone4||'')}" placeholder="認人用"></div>
    <div class="fld"><label>訓練形式</label>${ppSeg('pp_mode',[['1對1','1 對 1'],['1對2','1 對 2']],PP_SEL.mode)}</div>
    <div class="fld"><label>首課生效日期</label><input id="pp_date" type="date" value="${esc(e.startDate||'')}"></div>
    <div class="fld"><label>價格</label>${ppSeg('pp_pmode',[['標準','跟標準價表'],['自訂','自訂價格']],PP_SEL.priceMode)}</div>
    <div class="fld" id="pp_pnwrap" style="${PP_SEL.priceMode==='自訂'?'':'display:none'}"><label>自訂價格說明（會顯示畀學員）</label>
      <textarea id="pp_pnote" placeholder="例：1 對 2 每人 $450/堂（10 節 $4,500）">${esc(e.priceNote||'')}</textarea></div>
    <div class="fld"><label>備註（只教練睇）</label><input id="pp_note" value="${esc(e.note||'')}" placeholder="內部備註"></div>
    <div class="msg" id="pp_msg"></div>
    <button class="btn" onclick="ppSave()">${PP_EDIT?'儲存修改':'新增預設'}</button>
    ${PP_EDIT?'<button class="btn gray" style="margin-left:8px" onclick="renderPtPreset()">取消</button>':''}
  </div>`;
}
function ppList(ps){
  const rows=(ps||[]).map(p=>{
    const used=(p.status==='已用');
    return `<tr>
      <td><b>${esc(p.name)}</b> <span class="mut">·${esc(p.phone4)}</span> ${used?'<span class="tag" style="background:#eef2f3;color:var(--mut)">已用</span>':'<span class="tag ok">生效</span>'}
        <div class="mut">形式 ${esc(p.mode)}${p.startDate?('・首課 '+esc(p.startDate)):''}${p.priceMode==='自訂'?('・💰 '+esc(p.priceNote||'')):'・標準價'}${p.note?('・📝 '+esc(p.note)):''}</div></td>
      <td><div class="rowact"><button class="btn gray sm" onclick='ppEdit(${JSON.stringify(p).replace(/</g,"&lt;").replace(/'/g,"&#39;")})'>編輯</button><button class="btn err sm" onclick="ppDel('${esc(p.id)}','${esc(p.name)}')">刪</button></div></td>
    </tr>`;
  }).join('')||'<tr><td class="mut">未有預設。</td></tr>';
  return `<div class="card"><h2>📋 現有預設（${(ps||[]).length}）</h2><div class="scroll"><table>${rows}</table></div></div>`;
}
function ppBind(){
  tc().querySelectorAll('#pp_mode button').forEach(b=>b.onclick=()=>{ PP_SEL.mode=b.getAttribute('data-v'); tc().querySelectorAll('#pp_mode button').forEach(x=>x.classList.toggle('active',x.getAttribute('data-v')===PP_SEL.mode)); });
  tc().querySelectorAll('#pp_pmode button').forEach(b=>b.onclick=()=>{ PP_SEL.priceMode=b.getAttribute('data-v'); tc().querySelectorAll('#pp_pmode button').forEach(x=>x.classList.toggle('active',x.getAttribute('data-v')===PP_SEL.priceMode)); document.getElementById('pp_pnwrap').style.display=(PP_SEL.priceMode==='自訂')?'':'none'; });
}
function ppEdit(p){ PP_EDIT=p; PP_SEL={mode:p.mode||'1對1',priceMode:p.priceMode||'標準'}; tc().innerHTML=ppForm()+ppList([]); ppBind(); window.scrollTo(0,0); apiPost(API4,{action:'ptPresetList'}).then(r=>{ tc().innerHTML=ppForm()+ppList((r&&r.presets)||[]); ppBind(); }); }
async function ppSave(){
  const g=id=>(document.getElementById(id).value||'').trim();
  const m=document.getElementById('pp_msg'); const name=g('pp_name'), phone=g('pp_phone');
  if(!name||!phone){ m.className='msg err'; m.textContent='請填學員姓名及電話。'; return; }
  m.className='msg'; m.style.cssText='display:block;background:var(--teal-dim);color:var(--teal-dark)'; m.textContent='儲存中…';
  const r=await apiPost(API4,{action:'ptPresetSet',name,phone,mode:PP_SEL.mode,startDate:g('pp_date'),priceMode:PP_SEL.priceMode,priceNote:(PP_SEL.priceMode==='自訂'?g('pp_pnote'):''),note:g('pp_note')});
  m.style.cssText='';
  if(!r||r.ok===false){ m.className='msg err'; m.textContent=(r&&r.err)||'儲存失敗'; return; }
  m.className='msg ok'; m.textContent=(r.updated?'已更新':'已新增')+'預設 ✓'; setTimeout(renderPtPreset,700);
}
async function ppDel(id,name){ if(!confirm('確定刪除「'+name+'」嘅私訓預設？')) return; const r=await apiPost(API4,{action:'ptPresetDelete',id}); if(!r||r.ok===false){ alert((r&&r.err)||'刪除失敗'); return; } renderPtPreset(); }

/* ════════════════════ TAB 私訓報名 ════════════════════
   route: ptEnrollList + ptEnrollSetStatus（#4）。學員經 is-pt-enroll 提交嘅私訓報名資料。老闆 2026-08-29。*/
const PTE_STATUSES=['待跟進','跟進中','已確認','已取消'];
async function renderPtEnroll(){
  loading('載入私訓報名…');
  let rows=[];
  try{ const r=await apiPost(API4,{action:'ptEnrollList'}); if(r&&r.ok) rows=r.rows||[]; else if(!PREVIEW){ tc().innerHTML=errBox(r&&r.err); return; } }catch(e){ tc().innerHTML=errBox(); return; }
  const card=r=>`<div class="card" style="border-left:3px solid var(--teal)">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap">
      <div><b style="font-size:15px">${esc(r.name)}</b> <span class="mut">${esc(r.birthYear)}年 · ${esc(r.who||'')}</span>
        <div class="mut">${esc(r.id)} · ${esc(String(r.ts).slice(0,16))}</div></div>
      <select class="pte-st" data-id="${esc(r.id)}" style="padding:5px 8px;border:1.5px solid var(--line);border-radius:8px;font-size:12.5px;background:#fff">${PTE_STATUSES.map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}</select>
    </div>
    <div class="scroll"><table><tbody>
      <tr><td class="mut" style="width:82px">聯絡</td><td>${esc(r.parent||'—')}　📞 ${esc(r.phone||'—')}${r.email?('　✉️ '+esc(r.email)):''}</td></tr>
      <tr><td class="mut">套票意向</td><td><b>${esc(r.packSize||'—')}</b></td></tr>
      <tr><td class="mut">訓練目標</td><td>${esc(r.goals||'—')}${r.goalNote?('（'+esc(r.goalNote)+'）'):''}</td></tr>
      <tr><td class="mut">方便時段</td><td>${esc(r.times||'—')}　·　${esc(r.freq||'—')}</td></tr>
      <tr><td class="mut">健康</td><td>PAR-Q：${esc(r.parq||'—')}<br>狀況：${esc(r.health||'—')}</td></tr>
      ${(r.mode||r.startDate||r.priceNote)?`<tr><td class="mut">教練預設</td><td>${esc(r.mode||'')}${r.startDate?('　首課 '+esc(r.startDate)):''}${r.priceNote?('　💰 '+esc(r.priceNote)):''}</td></tr>`:''}
      ${r.referrer?`<tr><td class="mut">推薦人</td><td>${esc(r.referrer)}</td></tr>`:''}
      <tr><td class="mut">簽署</td><td>${esc(r.signEn||'—')} · ${esc(r.signId||'—')} ${r.signLink?`<a class="lnk" onclick="viewSecureFile('${esc(r.signLink)}')">📎 睇簽名</a>`:''}</td></tr>
    </tbody></table></div>
  </div>`;
  tc().innerHTML=`<div class="card"><h2>⭐ 私訓報名（${rows.length}）</h2>
    <p class="mut" style="margin:-4px 0 0">學員經私訓報名表提交嘅資料。收費面議 → WhatsApp 夾時間報價；右上角可更新跟進狀態。</p></div>
    ${rows.length?rows.map(card).join(''):'<div class="card"><div class="mut">未有私訓報名。</div></div>'}`;
  tc().querySelectorAll('.pte-st').forEach(sel=>sel.onchange=async()=>{
    const id=sel.getAttribute('data-id'), st=sel.value; sel.disabled=true;
    const r=await apiPost(API4,{action:'ptEnrollSetStatus',id,status:st}); sel.disabled=false;
    if(!r||r.ok===false){ alert((r&&r.err)||'更新失敗'); }
  });
}

if(PREVIEW){ CP='(預覽)'; ST.sum=JSON.parse(JSON.stringify(DEMO.enrollSummary)); ST.enrollPeriod='2026 9-10月'; document.getElementById('rfbtn').style.display=''; renderShell(); switchTab('enroll'); }
else renderLogin();
</script>
</body>
</html>
