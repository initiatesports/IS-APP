<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>INITIATE 會計</title>
<style>
/* 老闆 2026-09-25 簡化版：收入 4 大類（團體班／私人訓練／Drop-in＆治療／器材）＋ 支出淨係場地 → 淨利。電腦優先。 */
:root{
  --bg:#0f1720; --surface:#18222e; --surface2:#1f2b39; --border:#2a3a4d; --border2:#35485e;
  --ink:#eef3f8; --ink2:#aebccb; --muted:#7d8ea0;
  --teal:#2fb9c9; --teal-d:#1b8d9b; --teal-dim:rgba(47,185,201,.16);
  --green:#3fcf8e; --green-dim:rgba(63,207,142,.14);
  --red:#ff6b6b; --red-dim:rgba(255,107,107,.14);
  --amber:#f5c451; --amber-dim:rgba(245,196,81,.14);
  --g1:#2fb9c9; --g2:#a78bfa; --g3:#f5a35b; --g4:#3fcf8e; --g5:#7d8ea0;
  --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang HK","Noto Sans HK","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:40px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.num,td.n{font-variant-numeric:tabular-nums}
button{font-family:inherit}
/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(15,23,32,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:11px 0}
.top .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{font-size:17px;font-weight:800;margin-right:auto;white-space:nowrap}
.top h1 span{color:var(--teal)}
.tbtn{background:var(--surface2);border:1px solid var(--border2);color:var(--ink2);border-radius:10px;min-height:40px;padding:8px 12px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.tbtn:hover{border-color:var(--teal);color:var(--ink)}
.tbtn.pri{background:linear-gradient(120deg,var(--teal),var(--teal-d));border:none;color:#04252a}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--border2);border-radius:11px;padding:3px}
.seg button{background:none;border:none;color:var(--ink2);font-size:14px;font-weight:700;padding:7px 14px;border-radius:8px;cursor:pointer;min-height:34px}
.seg button.on{background:var(--teal);color:#04252a}
.pick{background:var(--surface);border:1px solid var(--border2);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:14px;font-weight:700;min-height:40px;outline:none}
/* login */
.login{max-width:360px;margin:16vh auto 0;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:30px 26px;text-align:center}
.login .logo{font-size:34px;margin-bottom:6px}
.login h2{font-size:20px;font-weight:900;margin-bottom:4px}
.login p{color:var(--muted);font-size:13px;margin-bottom:20px}
.login input{width:100%;background:var(--surface2);border:1.5px solid var(--border2);color:var(--ink);border-radius:11px;padding:13px 14px;font-size:16px;text-align:center;letter-spacing:.15em;outline:none}
.login input:focus{border-color:var(--teal)}
.login button{width:100%;margin-top:12px;background:linear-gradient(120deg,var(--teal),var(--teal-d));color:#04252a;border:none;border-radius:11px;padding:14px;font-size:15px;font-weight:800;cursor:pointer}
.login .err{color:var(--red);font-size:12.5px;margin-top:10px;min-height:16px}
/* summary */
.ttl{margin:20px 0 12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ttl h2{font-size:22px;font-weight:900}
.ttl .mut{font-size:13px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px 17px}
.box .lab{font-size:12.5px;color:var(--muted);font-weight:700}
.box .val{font-size:30px;font-weight:900;letter-spacing:-.8px;margin-top:6px;line-height:1.05}
.box .sub{font-size:12px;color:var(--ink2);margin-top:7px}
.box.net .val{color:var(--green)} .box.net.neg .val{color:var(--red)}
.grps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.gcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;cursor:pointer;position:relative;overflow:hidden;text-align:left;color:inherit;font-size:inherit}
.gcard:hover{border-color:var(--border2)}
.gcard.on{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset}
.gcard .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
.gcard .nm{font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:6px}
.gcard .amt{font-size:24px;font-weight:900;margin:8px 0 5px;letter-spacing:-.5px}
.gcard .sub{font-size:11.5px;color:var(--muted);line-height:1.5}
.gcard .pct{position:absolute;right:14px;top:14px;font-size:11.5px;font-weight:800;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 17px;margin-bottom:14px}
.card h3{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .tag{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted)}
.exrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px;gap:10px}
.exrow:last-child{border-bottom:none}
.exrow .s{font-size:11.5px;color:var(--muted);margin-top:2px}
/* table */
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--muted);font-size:12px;font-weight:700;padding:8px;border-bottom:1px solid var(--border2);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--border);color:var(--ink2);vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap}
tr.tot td{font-weight:900;color:var(--ink);border-top:2px solid var(--border2);border-bottom:none}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface2)}
td .d{color:var(--muted);font-size:11.5px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.pos{color:var(--green)} .neg{color:var(--red)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:var(--surface2);border:1px solid var(--border2);color:var(--ink2);border-radius:18px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;min-height:34px}
.chip.on{background:var(--teal-dim);border-color:var(--teal);color:var(--teal)}
.act{background:none;border:1px solid var(--border2);color:var(--ink2);border-radius:8px;font-size:12px;font-weight:700;padding:5px 9px;cursor:pointer;white-space:nowrap;min-height:30px}
.act:hover{border-color:var(--teal);color:var(--ink)}
.act.del:hover{border-color:var(--red);color:var(--red)}
.badge{display:inline-block;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:5px;background:var(--surface2);color:var(--muted);margin-left:5px}
.badge.m{background:var(--amber-dim);color:var(--amber)}
.empty{color:var(--muted);text-align:center;padding:22px;font-size:13px}
.foot{color:var(--muted);font-size:12px;margin-top:16px;line-height:1.7}
.mut{color:var(--muted)}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--border2);border-top-color:var(--teal);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
/* modal */
#scrim{position:fixed;inset:0;background:rgba(4,8,13,.6);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
#scrim.on{display:flex}
.sheet{width:100%;max-width:460px;background:var(--surface);border:1px solid var(--border2);border-radius:18px;padding:20px;max-height:92vh;overflow-y:auto}
.sheet h3{font-size:17px;font-weight:800;margin-bottom:14px}
.sheet .hint{color:var(--muted);font-size:12px;margin-top:6px;line-height:1.5}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}
.fld input,.fld select{width:100%;background:var(--surface2);border:1.5px solid var(--border2);color:var(--ink);border-radius:10px;padding:11px 12px;font-size:15px;font-family:inherit;outline:none}
.fld input:focus,.fld select:focus{border-color:var(--teal)}
.opts{display:flex;gap:7px;flex-wrap:wrap}
.opts button{background:var(--surface2);border:1.5px solid var(--border2);color:var(--ink2);border-radius:18px;padding:8px 13px;font-size:13.5px;font-weight:700;cursor:pointer;min-height:38px}
.opts button.on{background:var(--teal);border-color:var(--teal);color:#04252a}
.srow{display:flex;gap:9px;margin-top:14px}
.srow button{flex:1;border:none;border-radius:11px;padding:13px;font-size:15px;font-weight:800;cursor:pointer;min-height:46px}
.srow .no{flex:0 0 auto;background:none;border:1px solid var(--border2);color:var(--muted)}
.srow .yes{background:linear-gradient(120deg,var(--teal),var(--teal-d));color:#04252a}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#25384d;border:1px solid var(--border2);color:var(--ink);padding:11px 18px;border-radius:24px;font-size:14px;z-index:60;opacity:0;transition:.25s;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:900px){ .grps{grid-template-columns:repeat(2,1fr)} }
@media(max-width:620px){ .sum{grid-template-columns:1fr} .box .val{font-size:26px} .gcard .amt{font-size:20px} .top h1{width:100%} .hide-sm{display:none} }
@media print{ .noprint{display:none!important} body{background:#fff;color:#000} .box,.card,.gcard{background:#fff;border:1px solid #ccc;color:#000} td,th{color:#000} }
</style>
</head>
<body>
<div id="app"></div>

<script>
const CFG={ API:'https://script.google.com/macros/s/AKfycbxBTLCdxWx5JzwaC4qQPKo8-fz0f0QXdZb_3zXuoK89ZVvpDaKi-_XI8RqPJ8YdBb8/exec' };
const START='2026-09';   // 老闆：所有計算由 2026 年 9 月開始（甘卓熹 8/29 一節係例外，後端已處理）
// 收入 4 大類（後端 acctIncomeGroup_ 派 grp；呢度同一規則做後備）
const GROUPS=[
  {k:'團體班',       ic:'👟', c:'var(--g1)', note:'運動班＋跳繩班；報名學費按課程期月份攤分'},
  {k:'私人訓練',     ic:'🏋️', c:'var(--g2)', note:'套票每上一節記一次＋按堂'},
  {k:'Drop-in＆治療', ic:'🩺', c:'var(--g3)', note:'每次自己記金額'},
  {k:'器材',         ic:'🎽', c:'var(--g4)', note:'器材店訂單＋現金售賣'}];
const OTHER={k:'其他', ic:'•', c:'var(--g5)', note:''};
const IN_CATS=['Drop-in 私訓','運動治療','器材','其他收入'];   // 可手動記嘅收入類別
const FIX_CATS=['Drop-in 私訓','運動治療','私訓按堂','器材','其他收入'];   // 改類別（同後端 apiAcctManualIncomeFix 白名單一致）
let FP='', DATA=null, MODE='month', MON='', YR='', FILTER='all', ADD=null, TOASTt=null;
const $=id=>document.getElementById(id);
const fmt=n=>'$'+Math.round(n||0).toLocaleString('en-US');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dmy=s=>{ const m=String(s||'').match(/(\d{4})-(\d{2})-(\d{2})/); return m?`${m[3]}/${m[2]}/${m[1]}`:(s||'—'); };
const monLabel=k=>{ const m=String(k).match(/(\d{4})-(\d{2})/); return m?`${m[1]} 年 ${+m[2]} 月`:k; };
function todayISO(){ return (DATA&&DATA.today)||new Date().toISOString().slice(0,10); }

function grpOf(r){
  if(r.grp && (GROUPS.some(g=>g.k===r.grp)||r.grp==='其他')) return r.grp;
  const cat=String(r.cat||''), src=String(r.src||'');
  if(cat==='器材'||cat==='制服') return '器材';
  if(src==='PT'||src==='PTpkg'||/^私訓/.test(cat)||cat==='PT加收') return '私人訓練';
  if(cat==='Drop-in 私訓'||cat==='運動治療') return 'Drop-in＆治療';
  if(/^EN/.test(src)) return '團體班';
  if(/^G/.test(src)) return '器材';
  return '其他';
}
/* 課程期（例「2026 9-10月」）→ 月份清單 */
function periodMonths(p){ const m=String(p||'').match(/(\d{4})\s*(\d{1,2})\s*[-–]\s*(\d{1,2})/); if(!m) return [];
  const y=+m[1], a=+m[2], b=+m[3], out=[]; for(let x=a;x<=b&&x<=12;x++) out.push(y+'-'+String(x).padStart(2,'0')); return out; }

/* 攤分：每筆收入/支出 → 若干 {mon, amt} 份。報名學費(src EN…)同場租按課程期月份平均攤；其餘按實際日期。 */
function ledger(){
  const inc=[], exp=[];
  (DATA.income||[]).forEach(r=>{
    if(String(r.status||'')==='void') return;
    const g=grpOf(r), paid=(r.status||'已收')==='已收';
    const ms=/^EN/.test(String(r.src||''))?periodMonths(r.period):[];
    if(ms.length){ ms.forEach(m=>inc.push({mon:m, amt:r.amt/ms.length, g, paid, r, split:ms.length})); }
    else { const m=String(r.date||'').slice(0,7); if(/^\d{4}-\d{2}$/.test(m)) inc.push({mon:m, amt:r.amt, g, paid, r, split:1}); }
  });
  (DATA.expense||[]).forEach(r=>{ const m=String(r.date||'').slice(0,7); if(!/^\d{4}-\d{2}$/.test(m)) return;
    exp.push({mon:m, amt:+r.amt||0, venue:/場地|場租/.test(String(r.cat||'')), r, auto:false}); });
  Object.keys(DATA.venueByPeriod||{}).forEach(p=>{ const v=+DATA.venueByPeriod[p]||0, ms=periodMonths(p); if(!v||!ms.length) return;
    ms.forEach(m=>exp.push({mon:m, amt:v/ms.length, venue:true, auto:true, r:{period:p, amt:v}, split:ms.length})); });
  return {inc, exp};
}
function monthsAvail(L){ const s=new Set(); L.inc.concat(L.exp).forEach(x=>s.add(x.mon)); s.add(todayISO().slice(0,7));
  return [...s].filter(m=>m>=START||L.inc.some(x=>x.mon===m)).sort(); }
function totals(L, test){
  const t={inc:0, due:0, venue:0, other:0, g:{}, n:{}, pkg:0, pkgN:0, per:0, perN:0};
  L.inc.filter(x=>test(x.mon)).forEach(x=>{ if(!x.paid){ t.due+=x.amt; return; } t.inc+=x.amt; t.g[x.g]=(t.g[x.g]||0)+x.amt; t.n[x.g]=(t.n[x.g]||0)+1;
    if(x.g==='私人訓練'){ if(x.r.src==='PTpkg'){ t.pkg+=x.amt; t.pkgN++; } else { t.per+=x.amt; t.perN++; } } });
  L.exp.filter(x=>test(x.mon)).forEach(x=>{ if(x.venue) t.venue+=x.amt; else t.other+=x.amt; });
  t.exp=t.venue+t.other; t.net=t.inc-t.exp; return t;
}

/* ── login ── */
function renderLogin(msg){
  $('app').innerHTML=`<div class="login"><div class="logo">📊</div><h2>會計</h2><p>INITIATE SPORTS · 收入／支出／淨利</p>
    <input id="pw" type="password" inputmode="numeric" placeholder="財務密碼" autocomplete="off">
    <button onclick="doLogin()" id="lgbtn">登入</button><div class="err" id="lgerr">${msg||''}</div>
    <div style="margin-top:14px"><a href="#" onclick="renderSetup(0);return false" style="font-size:12.5px;color:var(--muted)">🔑 首次設定 / 修改財務密碼</a></div></div>`;
  const pw=$('pw'); pw.focus(); pw.onkeydown=e=>{ if(e.key==='Enter') doLogin(); };
}
async function doLogin(){
  const pw=$('pw').value.trim(); if(!pw){ $('lgerr').textContent='請輸入財務密碼'; return; }
  const b=$('lgbtn'); b.disabled=true; b.innerHTML='<span class="spin"></span> 載入中…'; $('lgerr').textContent='';
  const r=await fetchData(pw);
  if(!r||r.ok===false){ b.disabled=false; b.textContent='登入'; if(r&&r.needSetup){ renderSetup(1); return; } $('lgerr').textContent=(r&&r.err)||'密碼錯誤或載入失敗'; return; }
  FP=pw; try{ sessionStorage.setItem('acct_fp',pw); }catch(e){} DATA=r; render();
}
function renderSetup(firstTime){
  $('app').innerHTML=`<div class="login"><div class="logo">🔑</div><h2>${firstTime?'首次設定財務密碼':'設定 / 修改財務密碼'}</h2>
    <p>用教練密碼授權，設定一個獨立嘅財務密碼</p>
    <input id="cpw" type="password" inputmode="numeric" placeholder="教練密碼（授權用）" autocomplete="off" style="margin-bottom:10px">
    <input id="npw" type="password" inputmode="numeric" placeholder="新財務密碼（至少 4 位）" autocomplete="off">
    <button onclick="doSetup()" id="stbtn">設定</button><div class="err" id="sterr"></div>
    <div style="margin-top:12px"><a href="#" onclick="renderLogin('');return false" style="font-size:12.5px;color:var(--muted)">← 返回登入</a></div></div>`;
  $('cpw').focus();
}
async function doSetup(){
  const cp=$('cpw').value.trim(), np=$('npw').value.trim();
  if(!cp||!np){ $('sterr').textContent='請填教練密碼同新財務密碼'; return; }
  if(np.length<4){ $('sterr').textContent='財務密碼至少 4 位'; return; }
  const b=$('stbtn'); b.disabled=true; b.innerHTML='<span class="spin"></span> 設定中…'; $('sterr').textContent='';
  const r=await post({action:'setAcctPass',coachPass:cp,newPass:np});
  if(!r||r.ok===false){ b.disabled=false; b.textContent='設定'; $('sterr').textContent=(r&&r.err)||'設定失敗（教練密碼啱唔啱？）'; return; }
  renderLogin('✅ 財務密碼已設定，請用新密碼登入');
}
async function post(body, tries){ for(let i=0;i<(tries||4);i++){ try{ const res=await fetch(CFG.API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}); const t=(await res.text()).trim();
  if(t.startsWith('{')){ const j=JSON.parse(t); if(!/unknown action/i.test(String(j.err||j.error||''))) return j; } }catch(e){} await new Promise(x=>setTimeout(x,700*(i+1))); } return {ok:false,err:'網絡問題，請再試'}; }
function fetchData(pw){ return post({action:'acctData',acctPass:pw}); }
async function refresh(){ const b=$('rfbtn'); if(b) b.innerHTML='<span class="spin"></span>'; const r=await fetchData(FP); if(r&&r.ok){ DATA=r; render(); } else { if(b) b.textContent='↻ 刷新'; toast((r&&r.err)||'刷新失敗'); } }
function logout(){ FP=''; DATA=null; try{ sessionStorage.removeItem('acct_fp'); }catch(e){} renderLogin(''); }

/* ── main ── */
function render(){
  const L=ledger(), months=monthsAvail(L), years=[...new Set(months.map(m=>m.slice(0,4)))];
  if(!MON||months.indexOf(MON)<0) MON=months.indexOf(todayISO().slice(0,7))>=0?todayISO().slice(0,7):months[months.length-1];
  if(!YR||years.indexOf(YR)<0) YR=MON.slice(0,4);
  const head=`<div class="top noprint"><div class="wrap">
    <h1>INITIATE <span>會計</span></h1>
    <div class="seg"><button class="${MODE==='month'?'on':''}" onclick="MODE='month';render()">月</button><button class="${MODE==='year'?'on':''}" onclick="MODE='year';render()">年</button></div>
    ${MODE==='month'?`<select class="pick" onchange="MON=this.value;render()">${months.slice().reverse().map(m=>`<option value="${m}" ${m===MON?'selected':''}>${monLabel(m)}</option>`).join('')}</select>`
      :`<select class="pick" onchange="YR=this.value;render()">${years.slice().reverse().map(y=>`<option ${y===YR?'selected':''}>${y}</option>`).join('')}</select>`}
    <button class="tbtn pri" onclick="openAdd('in')">＋ 記一筆</button>
    <button class="tbtn" id="rfbtn" onclick="refresh()">↻ 刷新</button>
    ${DATA.sheetUrl?`<a class="tbtn hide-sm" href="${esc(DATA.sheetUrl)}" target="_blank" rel="noopener">📄 Sheet</a>`:''}
    <button class="tbtn hide-sm" onclick="renderSetup(0)">🔑</button>
    <button class="tbtn" onclick="logout()">登出</button></div></div>`;
  $('app').innerHTML=head+`<div class="wrap">`+(MODE==='year'?yearView(L,months):monthView(L))+`
    <div class="foot">由 2026 年 9 月開始計（甘卓熹 29/08/2026 一節除外）。團體班學費同場租按課程期月份平均攤分；私人訓練、Drop-in、器材按實際日期。
    私訓套票同按堂私訓喺教練頁撳出席（按堂填金額）自動入帳；Drop-in 私訓／運動治療喺呢度「＋ 記一筆」。</div></div>`;
}
function groupCards(t, total, clickable){
  const list=GROUPS.concat((t.g['其他']||0)?[OTHER]:[]);
  return `<div class="grps">`+list.map(g=>{ const a=t.g[g.k]||0, n=t.n[g.k]||0, pct=total?Math.round(a/total*100):0;
    let sub=g.note;
    if(g.k==='私人訓練') sub=`套票 ${t.pkgN} 節 ${fmt(t.pkg)} · 按堂 ${t.perN} 節 ${fmt(t.per)}`;
    else if(g.k==='團體班') sub=`${n} 筆報名（按月攤分）`;
    else sub=`${n} 筆`;
    return `<button class="gcard ${clickable&&FILTER===g.k?'on':''}" ${clickable?`onclick="FILTER=FILTER==='${g.k}'?'all':'${g.k}';render()"`:''}>
      <i class="bar" style="background:${g.c}"></i><div class="nm">${g.ic} ${esc(g.k)}</div><span class="pct">${pct}%</span>
      <div class="amt num">${fmt(a)}</div><div class="sub">${esc(sub)}</div></button>`; }).join('')+`</div>`;
}
function sumBoxes(t, lab){
  return `<div class="sum">
    <div class="box"><div class="lab">收入（${lab}）</div><div class="val num">${fmt(t.inc)}</div><div class="sub">${t.due>0?`另有未收／待核實 ${fmt(t.due)}（未計入）`:'全部已收'}</div></div>
    <div class="box"><div class="lab">支出</div><div class="val num">${fmt(t.exp)}</div><div class="sub">場地 ${fmt(t.venue)}${t.other?` · 其他 ${fmt(t.other)}`:''}</div></div>
    <div class="box net ${t.net<0?'neg':''}"><div class="lab">淨利</div><div class="val num">${t.net<0?'−':''}${fmt(Math.abs(t.net))}</div><div class="sub">${t.inc?`利潤率 ${Math.round(t.net/t.inc*100)}%`:'—'}</div></div></div>`;
}
function monthView(L){
  const t=totals(L, m=>m===MON);
  const inc=L.inc.filter(x=>x.mon===MON), exp=L.exp.filter(x=>x.mon===MON);
  let h=`<div class="ttl"><h2>${monLabel(MON)}</h2><span class="mut">撳分類卡睇明細</span></div>`+sumBoxes(t,'已收')+groupCards(t, t.inc, true);
  // 支出
  const venAuto=exp.filter(x=>x.auto), exMan=exp.filter(x=>!x.auto);
  h+=`<div class="card"><h3>🏟️ 支出<span class="tag">${fmt(t.exp)}</span></h3>`+
    venAuto.map(x=>`<div class="exrow"><div><div>場地租金（自動估算）</div><div class="s">${esc(x.r.period)} 全期 ${fmt(x.r.amt)} ÷ ${x.split} 個月 · 按已開班逐堂計</div></div><b class="num">${fmt(x.amt)}</b></div>`).join('')+
    exMan.map(x=>`<div class="exrow"><div><div>${esc(x.r.cat||'支出')}${x.r.desc?` · <span class="mut">${esc(x.r.desc)}</span>`:''}</div><div class="s">${dmy(x.r.date)}</div></div>
      <div style="display:flex;gap:8px;align-items:center"><b class="num">${fmt(x.amt)}</b>${x.r.id?`<button class="act del noprint" onclick="voidExp('${esc(x.r.id)}')">作廢</button>`:''}</div></div>`).join('')+
    (exp.length?'':'<div class="empty">呢個月冇支出</div>')+`</div>`;
  // 收入明細
  const rows=inc.filter(x=>FILTER==='all'||x.g===FILTER).sort((a,b)=>String(b.r.date||'').localeCompare(String(a.r.date||'')));
  h+=`<div class="card"><h3>🧾 收入明細${FILTER!=='all'?` · ${esc(FILTER)}`:''}<span class="tag">${rows.length} 筆 · ${fmt(rows.filter(x=>x.paid).reduce((a,x)=>a+x.amt,0))}</span></h3>
    <div class="chips noprint">${['all'].concat(GROUPS.map(g=>g.k)).concat((t.g['其他']||0)?['其他']:[]).map(k=>`<button class="chip ${FILTER===k?'on':''}" onclick="FILTER='${k}';render()">${k==='all'?'全部':esc(k)}</button>`).join('')}</div>`;
  if(!rows.length) h+='<div class="empty">冇記錄</div>';
  else h+=`<div class="tbl-scroll"><table><thead><tr><th>日期</th><th>分類</th><th>學生／對象</th><th>說明</th><th class="n">本月金額</th><th class="noprint"></th></tr></thead><tbody>`+
    rows.map(x=>{ const r=x.r, g=GROUPS.find(y=>y.k===x.g)||OTHER, man=/^MI/.test(String(r.src||'')), mid=man?String(r.id||r.src):'';
      return `<tr><td class="num">${dmy(r.date)}</td><td><span class="dot" style="background:${g.c}"></span>${esc(r.cat||x.g)}${man?'<span class="badge m">手動</span>':''}${x.paid?'':'<span class="badge">未收</span>'}</td>
        <td>${esc(r.name||'—')}</td><td>${esc(r.desc||'')}${x.split>1?` <span class="d">（${esc(r.period)} 全期 ${fmt(r.amt)} ÷ ${x.split}）</span>`:''}</td>
        <td class="n ${x.paid?'':'mut'}">${fmt(x.amt)}</td>
        <td class="n noprint">${mid?`<button class="act" onclick="openFix('${esc(mid)}')">改類別</button> <button class="act del" onclick="voidInc('${esc(mid)}')">作廢</button>`:''}</td></tr>`; }).join('')+`</tbody></table></div>`;
  return h+`</div>`;
}
function yearView(L, months){
  const ms=months.filter(m=>m.slice(0,4)===YR), t=totals(L, m=>m.slice(0,4)===YR);
  let h=`<div class="ttl"><h2>${YR} 年</h2><span class="mut">${monLabel(ms[0]||'')} – ${monLabel(ms[ms.length-1]||'')} · 撳月份睇明細</span></div>`+sumBoxes(t,'已收')+groupCards(t, t.inc, false);
  h+=`<div class="card"><h3>📅 逐月</h3><div class="tbl-scroll"><table><thead><tr><th>月份</th>${GROUPS.map(g=>`<th class="n"><span class="dot" style="background:${g.c}"></span>${esc(g.k)}</th>`).join('')}${(t.g['其他']||0)?'<th class="n">其他</th>':''}<th class="n">收入</th><th class="n">場地</th>${t.other?'<th class="n">其他支出</th>':''}<th class="n">淨利</th></tr></thead><tbody>`;
  const cols=GROUPS.map(g=>g.k).concat((t.g['其他']||0)?['其他']:[]);
  const row=(lab,x,cls,click)=>`<tr class="${cls||''}" ${click?`onclick="${click}"`:''}><td>${lab}</td>${cols.map(k=>`<td class="n">${x.g[k]?fmt(x.g[k]):'<span class="mut">—</span>'}</td>`).join('')}<td class="n"><b>${fmt(x.inc)}</b></td><td class="n">${fmt(x.venue)}</td>${t.other?`<td class="n">${fmt(x.other)}</td>`:''}<td class="n ${x.net<0?'neg':'pos'}"><b>${x.net<0?'−':''}${fmt(Math.abs(x.net))}</b></td></tr>`;
  ms.forEach(m=>{ h+=row(monLabel(m).replace(/^\d{4} 年 /,''), totals(L, k=>k===m), 'click', `MODE='month';MON='${m}';render()`); });
  h+=row('全年', t, 'tot')+`</tbody></table></div></div>`;
  return h;
}

/* ── 記一筆（收入：Drop-in 私訓／運動治療／器材／其他；支出：場地／其他）── */
function openAdd(kind){ ADD={kind, cat:kind==='in'?'Drop-in 私訓':'場地租金', amt:'', name:'', date:todayISO(), note:''}; renderAdd(); }
function scrim(){ let s=$('scrim'); if(!s){ s=document.createElement('div'); s.id='scrim'; s.onclick=e=>{ if(e.target===s) closeSheet(); }; document.body.appendChild(s); } return s; }
function closeSheet(){ const s=$('scrim'); if(s) s.classList.remove('on'); }
function renderAdd(){
  const s=scrim(), cats=ADD.kind==='in'?IN_CATS:['場地租金','其他支出'];
  s.innerHTML=`<div class="sheet"><h3>${ADD.kind==='in'?'💰 記一筆收入':'🧾 記一筆支出'}</h3>
    <div class="fld"><div class="opts"><button class="${ADD.kind==='in'?'on':''}" onclick="openAdd('in')">收入</button><button class="${ADD.kind==='ex'?'on':''}" onclick="openAdd('ex')">支出</button></div></div>
    <div class="fld"><label>類別</label><div class="opts">${cats.map(c=>`<button class="${ADD.cat===c?'on':''}" onclick="ADD.cat='${c}';renderAdd()">${esc(c)}</button>`).join('')}</div>
      ${ADD.kind==='in'?'<div class="hint">私訓套票／按堂私訓（例：甘卓熹、Keith &amp; Elaine、鄧可澄）喺教練頁撳出席就自動入帳，唔使喺度記。</div>'
        :(ADD.cat==='場地租金'?'<div class="hint">⚠️ 場租系統會按開班自動估算。某課程期記咗實際場租，嗰期自動估算就會停用（免雙計）——要記就記齊成期。</div>':'')}</div>
    <div class="fld"><label>金額（$）</label><input id="ad-amt" type="number" inputmode="numeric" min="1" value="${esc(ADD.amt)}" oninput="ADD.amt=this.value" placeholder="例：450"></div>
    ${ADD.kind==='in'?`<div class="fld"><label>學生／對象</label><input value="${esc(ADD.name)}" oninput="ADD.name=this.value" placeholder="例：Sandy"></div>`:''}
    <div class="fld"><label>日期</label><input type="date" value="${esc(ADD.date)}" onchange="ADD.date=this.value"></div>
    <div class="fld"><label>備註（可選）</label><input value="${esc(ADD.note)}" oninput="ADD.note=this.value"></div>
    <div class="srow"><button class="no" onclick="closeSheet()">取消</button><button class="yes" id="adbtn" onclick="saveAdd()">儲存</button></div></div>`;
  s.classList.add('on'); setTimeout(()=>{ const a=$('ad-amt'); if(a&&!ADD.amt) a.focus(); },30);
}
async function saveAdd(){
  const amt=parseInt(ADD.amt||'0',10); if(!(amt>0)){ toast('請輸入金額'); return; }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(ADD.date)){ toast('請揀日期'); return; }
  if(ADD.kind==='in' && !ADD.name.trim()){ toast('請填學生／對象'); return; }
  const b=$('adbtn'); b.disabled=true; b.innerHTML='<span class="spin"></span>';
  const ctx='c'+Date.now()+Math.floor(Math.random()*1000);
  const body=ADD.kind==='in'
    ? {action:'acctIncomeAdd',acctPass:FP,amount:amt,category:ADD.cat,name:ADD.name.trim(),date:ADD.date,note:ADD.note,status:'已收',clientTxnId:ctx}
    : {action:'acctExpenseAdd',acctPass:FP,amount:amt,category:ADD.cat==='其他支出'?'其他':ADD.cat,date:ADD.date,note:ADD.note,clientTxnId:ctx};
  const r=await post(body);
  if(r&&(r.ok||r.dup)){ closeSheet(); toast('已記 '+ADD.cat+' '+fmt(amt)); MODE='month'; MON=ADD.date.slice(0,7); await refresh(); }
  else { b.disabled=false; b.textContent='儲存'; toast((r&&r.err)||'記賬失敗，請再試'); }
}
function openFix(id){ const r=(DATA.income||[]).find(x=>(x.id||x.src)===id); if(!r) return;
  const s=scrim(); s.innerHTML=`<div class="sheet"><h3>改類別</h3><div class="mut" style="font-size:13px;margin-bottom:12px">${dmy(r.date)} · ${esc(r.name||'')} · ${fmt(r.amt)}（而家：${esc(r.cat)}）</div>
    <div class="fld"><div class="opts">${FIX_CATS.map(c=>`<button class="${r.cat===c?'on':''}" onclick="doFix('${esc(id)}','${c}')">${esc(c)}</button>`).join('')}</div></div>
    <div class="srow"><button class="no" onclick="closeSheet()">取消</button></div></div>`; s.classList.add('on'); }
async function doFix(id,cat){ closeSheet(); toast('更改中…'); const r=await post({action:'acctManualIncomeFix',acctPass:FP,id,op:'recat',category:cat},3);
  if(r&&r.ok){ toast('已改為 '+cat); refresh(); } else toast((r&&r.err)||'更改失敗'); }
async function voidInc(id){ if(!confirm('確定作廢呢筆收入？會保留審計記錄，但唔再計入。')) return; toast('作廢中…');
  const r=await post({action:'acctIncomeVoid',acctPass:FP,id},3); if(r&&r.ok){ toast('已作廢'); refresh(); } else toast((r&&r.err)||'作廢失敗'); }
async function voidExp(id){ if(!confirm('確定作廢呢筆支出？')) return; toast('作廢中…');
  const r=await post({action:'acctExpenseVoid',acctPass:FP,id},3); if(r&&r.ok){ toast('已作廢'); refresh(); } else toast((r&&r.err)||'作廢失敗'); }
function toast(msg){ let el=$('toast'); if(!el){ el=document.createElement('div'); el.id='toast'; document.body.appendChild(el); }
  el.textContent=msg; el.classList.add('on'); clearTimeout(TOASTt); TOASTt=setTimeout(()=>el.classList.remove('on'),2600); }

/* boot */
(function(){ let p=''; try{ p=sessionStorage.getItem('acct_fp')||''; }catch(e){}
  if(p){ FP=p; renderLogin('載入中…'); fetchData(p).then(r=>{ if(r&&r.ok){ DATA=r; render(); } else renderLogin(''); }); }
  else renderLogin('');
})();
</script>
</body>
</html>
