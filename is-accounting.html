<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>INITIATE 會計</title>
<style>
:root{
  --bg:#0f1720; --surface:#18222e; --surface2:#1f2b39; --border:#2a3a4d; --border2:#35485e;
  --ink:#eef3f8; --ink2:#aebccb; --muted:#7d8ea0;
  --teal:#2fb9c9; --teal-d:#1b8d9b; --teal-dim:rgba(47,185,201,.16); --navy:#25384d;
  --green:#3fcf8e; --green-dim:rgba(63,207,142,.14);
  --red:#ff6b6b; --red-dim:rgba(255,107,107,.14);
  --amber:#f5c451; --amber-dim:rgba(245,196,81,.14);
  --purple:#a78bfa; --gold:#e6b84c;
  --r:15px; --r-sm:11px;
  --nav-h:60px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang HK","Noto Sans HK","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(var(--nav-h) + 26px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
a{color:var(--teal)}
.num{font-variant-numeric:tabular-nums}
/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(15,23,32,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:12px 0}
.top .wrap{display:flex;align-items:center;gap:10px}
.top h1{font-size:16px;font-weight:800;letter-spacing:.2px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 span{color:var(--teal)}
.tbtn{background:var(--surface2);border:1px solid var(--border2);color:var(--ink2);border-radius:10px;min-width:40px;min-height:40px;padding:8px 11px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.tbtn:hover{border-color:var(--teal);color:var(--ink)}
/* menu dropdown */
.menu{position:fixed;top:54px;right:14px;z-index:70;background:var(--surface2);border:1px solid var(--border2);border-radius:13px;padding:6px;display:flex;flex-direction:column;min-width:190px;box-shadow:0 14px 36px rgba(0,0,0,.55)}
.menu a,.menu button{background:none;border:none;color:var(--ink);font-family:inherit;font-size:14px;font-weight:700;text-align:left;padding:12px 12px;border-radius:9px;cursor:pointer;text-decoration:none;display:block}
.menu a:hover,.menu button:hover{background:var(--surface)}
/* login */
.login{max-width:360px;margin:16vh auto 0;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:30px 26px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.login .logo{font-size:34px;margin-bottom:6px}
.login h2{font-size:20px;font-weight:900;margin-bottom:4px}
.login p{color:var(--muted);font-size:13px;margin-bottom:20px}
.login input{width:100%;background:var(--surface2);border:1.5px solid var(--border2);color:var(--ink);border-radius:11px;padding:13px 14px;font-size:16px;text-align:center;letter-spacing:.15em;font-family:inherit;outline:none}
.login input:focus{border-color:var(--teal)}
.login button{width:100%;margin-top:12px;background:linear-gradient(120deg,var(--teal),var(--teal-d));color:#04252a;border:none;border-radius:11px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
.login .err{color:var(--red);font-size:12.5px;margin-top:10px;min-height:16px}
/* scope tabs (sticky) */
.scope{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.scope.sticky{position:sticky;top:45px;z-index:14;background:var(--bg);margin:0 -16px 12px;padding:12px 16px 10px;border-bottom:1px solid var(--border)}
.chip{background:var(--surface);border:1.5px solid var(--border2);color:var(--ink2);border-radius:20px;padding:9px 15px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;min-height:40px}
.chip.on{background:var(--teal);border-color:var(--teal);color:#04252a}
.scope select{background:var(--surface);border:1.5px solid var(--border2);color:var(--ink);border-radius:20px;padding:9px 14px;font-size:13.5px;font-weight:700;font-family:inherit;outline:none;min-height:40px}
.scope .sp{flex:1}
/* health band */
.health{display:flex;gap:8px;overflow-x:auto;padding:2px 0 5px;margin:2px 0 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.health::-webkit-scrollbar{display:none}
.hchip{flex:0 0 auto;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:9px 13px;min-width:104px}
.hchip .hl{font-size:10.5px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:5px;white-space:nowrap}
.hchip .hl .dot{width:7px;height:7px;border-radius:50%;flex:none}
.hchip .hv{font-size:16px;font-weight:900;margin-top:4px;white-space:nowrap}
.summary{background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:11px 13px;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:16px;line-height:1.55}
/* hero */
.hero{background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid var(--border2);border-radius:var(--r);padding:18px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.hero-l{min-width:0}
.hero-lab{font-size:12px;color:var(--muted);font-weight:700}
.hero-net{font-size:40px;font-weight:900;letter-spacing:-1.5px;line-height:1.05;margin:4px 0 7px}
.hero-net.pos{color:var(--green)} .hero-net.neg{color:var(--red)}
.hero-sub{font-size:13px;font-weight:800;display:flex;gap:12px;flex-wrap:wrap}
.hero-note{font-size:11.5px;color:var(--muted);margin-top:7px}
.hero-r{flex:none}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px 16px;position:relative;overflow:hidden}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:8px}
.kpi .val{font-size:24px;font-weight:900;letter-spacing:-.5px;line-height:1}
.kpi .val small{font-size:15px;font-weight:800;color:var(--muted)}
.kpi .sub{font-size:11.5px;color:var(--ink2);margin-top:7px}
.kpi.pos .val{color:var(--green)} .kpi.neg .val{color:var(--red)}
.kpi .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
/* card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:17px 18px;margin-bottom:16px}
.card h3{font-size:15px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h3 .tag{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--muted);text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
/* cash runway */
.runway-big{font-size:34px;font-weight:900;letter-spacing:-1px;margin:2px 0 10px}
.runway-big small{font-size:15px;color:var(--muted);font-weight:800}
.runway-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:10px}
.runway-set{display:flex;align-items:center;gap:13px;cursor:pointer}
.rset-ic{font-size:26px;flex:none}
.rset-t{font-size:14.5px;font-weight:800}
.rset-s{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.rset-arrow{margin-left:auto;font-size:24px;color:var(--muted);flex:none}
.renew-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.renew-row:last-child{border-bottom:none}
.linkbtn{background:none;border:none;color:var(--teal);font-weight:800;font-family:inherit;cursor:pointer;font-size:12px;padding:3px 4px}
/* table */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-size:11.5px;font-weight:700;padding:7px 8px;border-bottom:1px solid var(--border)}
td{padding:9px 8px;border-bottom:1px solid var(--border);color:var(--ink2)}
tr:last-child td{border-bottom:none}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pos{color:var(--green)} .neg{color:var(--red)}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.pill.g{background:var(--green-dim);color:var(--green)} .pill.r{background:var(--red-dim);color:var(--red)} .pill.a{background:var(--amber-dim);color:var(--amber)}
/* per-class P&L cards */
.pnl-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:13px;margin-bottom:10px}
.pnl-card:last-child{margin-bottom:0}
.pnl-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pnl-name{font-size:14px;font-weight:800;min-width:0}
.pnl-time{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px}
.pnl-net{font-size:21px;font-weight:900;white-space:nowrap;display:flex;align-items:center;gap:7px}
.pnl-net.pos{color:var(--green)} .pnl-net.neg{color:var(--red)}
.pnl-meta{display:flex;gap:13px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:10px}
.pnl-be{font-size:12px;font-weight:700;margin-top:9px;padding-top:9px;border-top:1px dashed var(--border)}
/* mini rows (PT / LTV) */
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:11px 12px;margin-bottom:8px}
.mrow:last-child{margin-bottom:0}
.mrow .l{min-width:0}
.mrow .l .t{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .l .s{font-size:11px;color:var(--muted);margin-top:2px}
.mrow .r{text-align:right;white-space:nowrap}
/* chart */
.legend{display:flex;gap:16px;font-size:11.5px;color:var(--ink2);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.catrow{display:flex;align-items:center;gap:10px;padding:6px 0}
.catrow .nm{width:96px;font-size:12.5px;color:var(--ink2);flex:none}
.catrow .track{flex:1;height:9px;background:var(--surface2);border-radius:6px;overflow:hidden}
.catrow .fill{height:100%;border-radius:6px}
.catrow .amt{width:74px;text-align:right;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.empty{color:var(--muted);text-align:center;padding:26px;font-size:13px}
.foot{color:var(--muted);font-size:11.5px;text-align:center;margin-top:18px;line-height:1.7}
.fin{background:var(--surface2);border:1.5px solid var(--border2);color:var(--ink);border-radius:9px;padding:10px 11px;font-size:14px;font-family:inherit;outline:none}
.fin:focus{border-color:var(--teal)}
.vd{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:6px}
.vd:hover{color:var(--red)}
.voidbtn{background:var(--red-dim);border:1px solid rgba(255,107,107,.4);color:var(--red);border-radius:9px;font-size:12px;font-weight:800;padding:0 12px;font-family:inherit;cursor:pointer;min-height:40px;min-width:44px}
.voidbtn:active{transform:scale(.95)}
.bar-mini{height:6px;border-radius:4px;background:var(--border);overflow:hidden;margin-top:4px}
.bar-mini>i{display:block;height:100%;border-radius:4px}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--border2);border-top-color:var(--teal);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
/* bottom tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(15,23,32,.97);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{flex:1;background:none;border:none;color:var(--muted);font-family:inherit;padding:9px 0 8px;min-height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-size:11px;font-weight:700}
.tabbar button .i{font-size:20px;line-height:1}
.tabbar button.on{color:var(--teal)}
/* FAB + 記賬 sheet */
.fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom,0px));z-index:44;width:56px;height:56px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--teal),var(--teal-d));color:#04252a;font-size:30px;font-weight:800;box-shadow:0 8px 24px rgba(47,185,201,.42);cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.fab:active{transform:scale(.94)}
#scrim{position:fixed;inset:0;background:rgba(4,8,13,.6);z-index:50;display:none;align-items:flex-end;justify-content:center}
#scrim.on{display:flex}
.sheet{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--border);border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow-y:auto;animation:up .22s cubic-bezier(.2,.9,.3,1.1)}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{font-size:17px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.sheet p.hint{color:var(--muted);font-size:12.5px;margin:-6px 0 14px;line-height:1.5}
.seg{display:flex;gap:8px;margin-bottom:14px}
.seg button{flex:1;background:var(--surface2);border:1.5px solid var(--border2);color:var(--ink2);border-radius:11px;padding:12px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;min-height:44px}
.seg button.on{background:var(--teal-dim);border-color:var(--teal);color:var(--teal)}
.amtbox{text-align:center;margin:6px 0 12px}
.amtbox .amt{font-size:40px;font-weight:900;letter-spacing:-1px}
.amtbox .amt small{font-size:20px;color:var(--muted);font-weight:800}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px}
.keys button{background:var(--surface2);border:1px solid var(--border2);color:var(--ink);border-radius:11px;padding:15px 0;font-size:20px;font-weight:700;cursor:pointer;font-family:inherit;min-height:52px}
.keys button:active{background:var(--border2)}
.divider{height:1px;background:var(--border);margin:14px -4px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}
.fld input,.fld select{width:100%;background:var(--surface2);border:1.5px solid var(--border2);color:var(--ink);border-radius:10px;padding:12px;font-size:15px;font-family:inherit;outline:none}
.catchips{display:flex;gap:7px;flex-wrap:wrap}
.catchips button{background:var(--surface2);border:1.5px solid var(--border2);color:var(--ink2);border-radius:20px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;min-height:40px}
.catchips button.on{background:var(--teal);border-color:var(--teal);color:#04252a}
.catchips button.sug{border-color:var(--teal);border-style:dashed;color:var(--teal)}
.catsug{font-size:12px;color:var(--ink2);margin-top:8px;min-height:14px}
.srow{display:flex;gap:9px;margin-top:8px}
.srow button{border:none;border-radius:12px;padding:14px 10px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;min-height:50px}
.srow .btn-cancel{flex:0 0 auto;background:none;border:1px solid var(--border2)!important;color:var(--muted)}
.srow .btn-again{flex:1;background:var(--surface2);border:1.5px solid var(--teal)!important;color:var(--teal)}
.srow .btn-save{flex:1.4;background:linear-gradient(120deg,var(--teal),var(--teal-d));color:#04252a}
.btn-primary{background:linear-gradient(120deg,var(--teal),var(--teal-d));color:#04252a}
.btn-ghost{background:var(--surface2);border:1px solid var(--border2)!important;color:var(--ink2)}
#toast{position:fixed;bottom:calc(var(--nav-h) + 26px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);border:1px solid var(--border2);color:var(--ink);padding:11px 18px;border-radius:24px;font-size:14px;z-index:60;opacity:0;transition:.25s;pointer-events:none;display:flex;align-items:center;gap:10px}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#toast button{background:none;border:none;color:var(--teal);font-weight:800;cursor:pointer;font-family:inherit;font-size:14px}
.led-day{margin:16px 0 6px;font-size:12px;color:var(--muted);font-weight:700;display:flex;justify-content:space-between}
.led{display:flex;align-items:center;gap:11px;padding:11px 12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:7px}
.led .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:15px;flex:none}
.led .m{flex:1;min-width:0}
.led .m .t{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.led .m .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.led .a{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{display:inline-block;font-size:9.5px;font-weight:800;padding:1px 5px;border-radius:5px;background:var(--surface2);color:var(--muted);margin-left:5px;vertical-align:1px}
/* 財務報表 */
.rpthead{text-align:center;font-weight:800;font-size:15px;margin:6px 0 14px;line-height:1.6}
.rpthead span{color:var(--teal);font-size:13px}
.rpt{width:100%;border-collapse:collapse;font-size:14px}
.rpt td{padding:8px 6px;border-bottom:1px solid var(--border)}
.rpt tr.sec td{font-weight:800;color:var(--ink);padding-top:14px;border-bottom:2px solid var(--border2);font-size:13px;letter-spacing:.3px}
.rpt tr.tot td{font-weight:800;border-top:1px solid var(--border);border-bottom:none;background:var(--surface2)}
.rpt tr.net td{font-weight:900;font-size:17px;border-top:2px solid var(--border2);border-bottom:none;padding-top:11px}
.mut{color:var(--muted)}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* 頂部橫向 nav（desktop 用；mobile 隱藏，改用底部 tab bar） */
.topnav{display:none}
.topbar-sp{display:none}
.topnav button{background:none;border:none;color:var(--ink2);font-family:inherit;font-size:14px;font-weight:700;padding:9px 13px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.topnav button:hover{background:var(--surface2);color:var(--ink)}
.topnav button.on{background:var(--teal-dim);color:var(--teal)}
.topnav .ti{font-size:15px}
/* dashboard 多欄容器（desktop 生效；mobile 為單欄 block，維持原順序原間距） */
.dash-top,.dash-grid{display:block}
/* ─────────── DESKTOP ≥1024px：善用闊芒、頂部 nav、表格 ─────────── */
@media(min-width:1024px){
  :root{--nav-h:0px}
  body{padding-bottom:40px}
  .tabbar{display:none!important}
  .top h1{flex:none}
  .topnav{display:flex;gap:2px;margin-left:10px}
  .topbar-sp{display:block;flex:1}
  .fab{bottom:26px;right:26px}
  .scope.sticky{top:57px}
  /* Hero + 現金跑道 並排 */
  .dash-top{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch;margin-bottom:16px}
  .dash-top>.hero,.dash-top>.card{margin-bottom:0;height:100%}
  .hero{padding:22px 24px}
  .hero-net{font-size:46px}
  .hero-r svg{width:190px;height:88px}
  .hero-r .mut{font-size:12px}
  /* 分析區 2 欄 dashboard grid，闊卡 span 2 */
  .dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;grid-auto-flow:row dense}
  .dash-grid>.card{margin-bottom:0}
  .dash-grid>.span2{grid-column:1 / -1}
  .kpis{margin-bottom:16px}
}
@media(min-width:1280px){
  .dash-grid{grid-template-columns:1fr 1fr 1fr}
  .dash-grid>.span2{grid-column:span 2}
}

<body>
<div id="app"></div>

<script>
const CFG={ API:'https://script.google.com/macros/s/AKfycbxBTLCdxWx5JzwaC4qQPKo8-fz0f0QXdZb_3zXuoK89ZVvpDaKi-_XI8RqPJ8YdBb8/exec' };
let FP='', DATA=null, SCOPE='month', PICK='';   // FP=財務密碼; SCOPE: week|month|year|all ; PICK: 具體桶(YYYY-Www/YYYY-MM/YYYY)
const $=id=>document.getElementById(id);
const fmt0=n=>'$'+Math.round(n||0).toLocaleString('en-US');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function todayISO(){ return (DATA&&DATA.today)||new Date().toISOString().slice(0,10); }

/* ── 期數(雙月)→ 兩個月曆月 YYYY-MM ── */
function periodMonths(period){
  const m=String(period||'').match(/(\d{4})\s*(\d{1,2})\s*[-–]\s*(\d{1,2})/);
  if(!m) return [];
  const y=+m[1]; return [m[2],m[3]].map(x=>y+'-'+String(+x).padStart(2,'0'));
}
/* ── 通用日期分桶：週(ISO YYYY-Www) / 月(YYYY-MM) / 年(YYYY) ── */
function isoWeek(dateStr){ const d=new Date(dateStr+'T00:00:00'); const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day); const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  const wk=Math.ceil(((t-y0)/86400000+1)/7); return t.getUTCFullYear()+'-W'+String(wk).padStart(2,'0'); }
function bucketOf(dateStr,gran){ const d=(dateStr||'').slice(0,10); if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) return null;
  return gran==='week'?isoWeek(d):(gran==='year'?d.slice(0,4):d.slice(0,7)); }
function periodRange(period){ const m=String(period||'').match(/(\d{4})\s*(\d{1,2})\s*[-–]\s*(\d{1,2})/); if(!m) return null;
  const y=+m[1], m1=+m[2], m2=+m[3]; const last=new Date(y,m2,0).getDate();
  return [y+'-'+String(m1).padStart(2,'0')+'-01', y+'-'+String(m2).padStart(2,'0')+'-'+String(last).padStart(2,'0')]; }
function bucketsInRange(a,b,gran){ const out=[], d=new Date(a+'T00:00:00Z'), end=new Date(b+'T00:00:00Z');   // UTC 建構配合 toISOString，免時區令 9/1→8/31 多幽靈桶
  let guard=0; while(d<=end && guard++<400){ const k=bucketOf(d.toISOString().slice(0,10),gran); if(k&&out.indexOf(k)<0) out.push(k); d.setUTCDate(d.getUTCDate()+(gran==='week'?7:(gran==='year'?300:28))); }
  // 保證覆蓋到 end 桶
  const ek=bucketOf(b,gran); if(ek&&out.indexOf(ek)<0) out.push(ek); return out; }
/* 按 gran 分桶彙總（收入/支出逐筆按日期；場租按期攤落該期嘅桶）*/
function aggregateGran(gran){
  const B={}; const mk=k=>{ if(!B[k]) B[k]={inPaid:0,inDue:0,exp:0,catIn:{},catEx:{}}; return B[k]; };
  (DATA.income||[]).forEach(r=>{
    // 🔒 老闆 2026-09-24：報名課程學費係報名時(8月)一次過預繳成個 9-10 月課程 → 收入按【課程期數嘅月份】攤分
    //   （同場租攤分同一機制），令月度/趨勢/本月睇到嗰期課程收入，唔會全部谷落繳費嗰個月。
    //   只攤報名課程收入(src=EN…)；私訓逐節/私訓套票/器材店訂單/手動收入維持按實際日期。總額不變。
    const enrollRng = /^EN/.test(String(r.src||'')) ? periodRange(r.period) : null;
    const enrollBks = enrollRng ? bucketsInRange(enrollRng[0], enrollRng[1], gran) : null;
    if(enrollBks && enrollBks.length){
      const each=r.amt/enrollBks.length;
      enrollBks.forEach(k=>{ const o=mk(k); if(r.status==='已收') o.inPaid+=each; else o.inDue+=each; o.catIn[r.cat]=(o.catIn[r.cat]||0)+each; });
    } else {
      const k=bucketOf(r.date,gran); if(!k) return; const o=mk(k);
      if(r.status==='已收') o.inPaid+=r.amt; else o.inDue+=r.amt; o.catIn[r.cat]=(o.catIn[r.cat]||0)+r.amt;
    }
  });
  (DATA.expense||[]).forEach(r=>{ const k=bucketOf(r.date,gran); if(!k) return; const o=mk(k);
    o.exp+=r.amt; o.catEx[r.cat]=(o.catEx[r.cat]||0)+r.amt; });
  Object.keys(DATA.venueByPeriod||{}).forEach(p=>{ const rent=DATA.venueByPeriod[p]||0; if(!rent) return;
    const rng=periodRange(p); if(!rng) return; const bks=bucketsInRange(rng[0],rng[1],gran); if(!bks.length) return;
    const each=rent/bks.length; bks.forEach(k=>{ const o=mk(k); o.exp+=each; o.catEx['場租']=(o.catEx['場租']||0)+each; }); });
  return B;
}
function sumBuckets(B,keys){ const s={inPaid:0,inDue:0,exp:0,catIn:{},catEx:{}};
  keys.forEach(k=>{ const o=B[k]; if(!o) return; s.inPaid+=o.inPaid; s.inDue+=o.inDue; s.exp+=o.exp;
    Object.keys(o.catIn).forEach(c=>s.catIn[c]=(s.catIn[c]||0)+o.catIn[c]);
    Object.keys(o.catEx).forEach(c=>s.catEx[c]=(s.catEx[c]||0)+o.catEx[c]); });
  return s; }
function prevMonthOf(k){ const m=String(k).match(/(\d{4})-(\d{2})/); if(!m) return ''; let y=+m[1], mo=+m[2]-1; if(mo<1){ mo=12; y--; } return y+'-'+String(mo).padStart(2,'0'); }
function avgMonthlyExp(monthB,curKey,n){ const ks=Object.keys(monthB).filter(k=>k<=curKey).sort().slice(-n); if(!ks.length) return 0; const s=ks.reduce((a,k)=>a+(monthB[k].exp||0),0); return s/ks.length; }

/* ── SVG 趨勢圖（收入柱 vs 支出柱 + 淨利折線，負值可見）── */
function trendSVG(B, labelFn, lastN){
  let keys=Object.keys(B).sort(); if(lastN && keys.length>lastN) keys=keys.slice(-lastN);
  if(!keys.length) return '<div class="empty">未有數據</div>';
  const n=keys.length, W=344, H=196, padL=4, padR=30, padB=24, padT=12;
  const plotW=W-padL-padR, plotH=H-padT-padB, bw=plotW/n;
  let maxTop=1, minNet=0;
  keys.forEach(k=>{ const o=B[k], inc=o.inPaid+o.inDue; maxTop=Math.max(maxTop,inc,o.exp); minNet=Math.min(minNet,inc-o.exp); });
  const top=maxTop, bot=minNet<0?minNet*1.06:0, span=(top-bot)||1;
  const y=v=>padT+plotH*(1-(v-bot)/span);
  const zeroY=y(0);
  const kf=v=>{ const a=Math.abs(v); const s=a>=1000?(a/1000).toFixed(a>=10000?0:1)+'k':String(Math.round(a)); return (v<0?'-':'')+s; };
  let grid='';
  const ticks=[top, top/2, 0]; if(bot<0) ticks.push(bot);
  ticks.forEach(t=>{ const yy=y(t); grid+=`<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="#2a3a4d" stroke-width="1" ${t!==0?'stroke-dasharray="3 4"':''}></line><text x="${W-padR+3}" y="${(yy+3).toFixed(1)}" font-size="8" fill="#7d8ea0">${kf(t)}</text>`; });
  let bars='', pts=[];
  keys.forEach((k,i)=>{
    const o=B[k], cx=padL+bw*i, gap=bw*0.18, w=(bw-gap*3)/2;
    const inc=o.inPaid+o.inDue, net=inc-o.exp, yi=y(inc), ye=y(o.exp);
    bars+=`<rect x="${(cx+gap).toFixed(1)}" y="${yi.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0,zeroY-yi).toFixed(1)}" rx="2.5" fill="#2fb9c9"><title>${esc(labelFn(k))} 收入 ${fmt0(inc)}</title></rect>`;
    bars+=`<rect x="${(cx+gap*2+w).toFixed(1)}" y="${ye.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0,zeroY-ye).toFixed(1)}" rx="2.5" fill="#ff6b6b" opacity=".82"><title>${esc(labelFn(k))} 支出 ${fmt0(o.exp)}</title></rect>`;
    const px=cx+bw/2, py=y(net); pts.push([px,py,net]);
    bars+=`<text x="${px.toFixed(1)}" y="${H-padB+14}" text-anchor="middle" font-size="8.5" fill="#7d8ea0">${esc(labelFn(k))}</text>`;
  });
  const poly=`<polyline fill="none" stroke="#3fcf8e" stroke-width="2" points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"></polyline>`;
  const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="${p[2]>=0?'#3fcf8e':'#ff6b6b'}"><title>淨利 ${fmt0(p[2])}</title></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="xMidYMid meet" style="display:block">${grid}${bars}${poly}${dots}</svg>
    <div class="legend"><span><i style="background:#2fb9c9"></i>收入</span><span><i style="background:#ff6b6b"></i>支出</span><span><i style="background:#3fcf8e"></i>淨利（負值可見）</span></div>`;
}
/* 迷你淨利 sparkline */
function sparkline(monthB,n){
  let ks=Object.keys(monthB).sort(); ks=ks.slice(-n); if(ks.length<2) return '';
  const vals=ks.map(k=>monthB[k].inPaid-monthB[k].exp);
  const mn=Math.min(...vals,0), mx=Math.max(...vals,0), rng=(mx-mn)||1;
  const W=96,H=46,pad=5, step=(W-pad*2)/(vals.length-1);
  const y=v=>pad+(H-pad*2)*(1-(v-mn)/rng);
  const pts=vals.map((v,i)=>[pad+step*i,y(v)]);
  const zeroY=y(0), last=vals[vals.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><line x1="${pad}" y1="${zeroY.toFixed(1)}" x2="${W-pad}" y2="${zeroY.toFixed(1)}" stroke="#2a3a4d" stroke-dasharray="2 3"></line>`
    +`<polyline fill="none" stroke="${last>=0?'#3fcf8e':'#ff6b6b'}" stroke-width="2" points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"></polyline>`
    +pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="1.9" fill="${vals[i]>=0?'#3fcf8e':'#ff6b6b'}"></circle>`).join('')
    +`</svg><div class="mut" style="font-size:10px;text-align:center;margin-top:2px">近 ${vals.length} 月淨利</div>`;
}
/* 分類條 */
function catBars(obj,color){
  const ent=Object.entries(obj||{}).filter(([,v])=>Math.abs(v)>0).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
  if(!ent.length) return '<div class="empty">未有</div>';
  const max=Math.max(...ent.map(([,v])=>Math.abs(v)))||1;
  return ent.map(([k,v])=>`<div class="catrow"><div class="nm">${esc(k)}</div>
    <div class="track"><div class="fill" style="width:${Math.max(3,Math.abs(v)/max*100)}%;background:${color}"></div></div>
    <div class="amt" style="${v<0?'color:var(--red)':''}">${fmt0(v)}</div></div>`).join('');
}

/* ── shell：頂欄 / 底 tab / 選單 ── */
const NAV_ITEMS=[['dash','📊','概覽'],['ledger','🧾','賬目'],['report','📈','報表'],['settings','⚙️','設定']];
function navItems(kind){ return NAV_ITEMS.map(([v,i,l])=>`<button class="${VIEW===v?'on':''}" onclick="closeMenu();VIEW='${v}';renderApp()">${kind==='bottom'?`<span class="i">${i}</span>`:`<span class="ti">${i}</span>`}${l}</button>`).join(''); }
function topBar(title, extra){ return `<div class="top noprint"><div class="wrap">
    <h1>📊 INITIATE <span>${esc(title)}</span></h1>

  </div></div>`; }
function navHtml(){ return `<div class="tabbar noprint">${navItems('bottom')}</div>`; }
function isWide(){ try{ return !!(typeof window!=='undefined' && window.matchMedia && window.matchMedia('(min-width:1024px)').matches); }catch(e){ return false; } }
function toggleMenu(e){ if(e&&e.stopPropagation) e.stopPropagation();
  if($('acmenu')){ closeMenu(); return; }
  const m=document.createElement('div'); m.id='acmenu'; m.className='menu';
  m.innerHTML=`<a href="${esc((DATA&&DATA.sheetUrl)||'#')}" target="_blank" rel="noopener" onclick="closeMenu()">🗂 開 Google Sheet</a>
    <button onclick="closeMenu();openPass()">🔒 修改財務密碼</button>
    <button onclick="closeMenu();logout()">🚪 登出</button>`;
  document.body.appendChild(m);
  setTimeout(()=>document.addEventListener('click',closeMenuOnce),0);
}

function closeMenuOnce(){ closeMenu(); document.removeEventListener('click',closeMenuOnce); }

/* ── login / setup ── */
function renderLogin(msg){
  $('app').innerHTML=`<div class="login"><div class="logo">📊</div><h2>會計儀表盤</h2><p>INITIATE SPORTS · 財務總覽</p>
    <input id="pw" type="password" inputmode="numeric" placeholder="財務密碼" autocomplete="off">
    <button onclick="doLogin()" id="lgbtn">登入</button><div class="err" id="lgerr">${msg||''}</div>
    <div style="margin-top:14px"><a href="#" onclick="renderSetup(0);return false" style="font-size:12.5px;color:var(--muted)">🔑 首次設定 / 修改財務密碼</a></div></div>`;
  const pw=$('pw'); pw.focus(); pw.onkeydown=e=>{ if(e.key==='Enter') doLogin(); };
}
async function doLogin(){
  const pw=$('pw').value.trim(); if(!pw){ $('lgerr').textContent='請輸入財務密碼'; return; }
  const b=$('lgbtn'); b.disabled=true; b.innerHTML='<span class="spin"></span> 載入中…'; $('lgerr').textContent='';
  const r=await fetchData(pw);
  if(!r||r.ok===false){ b.disabled=false; b.textContent='登入';
    if(r&&r.needSetup){ renderSetup(1); return; }
    $('lgerr').textContent=(r&&r.err)||'密碼錯誤或載入失敗'; return; }
  FP=pw; try{ sessionStorage.setItem('acct_fp',pw); }catch(e){} DATA=r; SCOPE='month'; PICK=''; VIEW='dash'; renderApp();
}
function renderSetup(firstTime){
  $('app').innerHTML=`<div class="login"><div class="logo">🔑</div><h2>${firstTime?'首次設定財務密碼':'設定 / 修改財務密碼'}</h2>
    <p>用教練密碼授權，設定一個獨立嘅財務密碼</p>
    <input id="cpw" type="password" inputmode="numeric" placeholder="教練密碼（授權用）" autocomplete="off" style="margin-bottom:10px">
    <input id="npw" type="password" inputmode="numeric" placeholder="新財務密碼（至少 4 位）" autocomplete="off">
    <button onclick="doSetup()" id="stbtn">設定</button><div class="err" id="sterr"></div>
    <div style="margin-top:12px"><a href="#" onclick="renderLogin('');return false" style="font-size:12.5px;color:var(--muted)">← 返回登入</a></div></div>`;
  $('cpw').focus();
}
async function doSetup(){
  const cp=$('cpw').value.trim(), np=$('npw').value.trim();
  if(!cp||!np){ $('sterr').textContent='請填教練密碼同新財務密碼'; return; }
  if(np.length<4){ $('sterr').textContent='財務密碼至少 4 位'; return; }
  const b=$('stbtn'); b.disabled=true; b.innerHTML='<span class="spin"></span> 設定中…'; $('sterr').textContent='';
  let r=null; for(let i=0;i<4;i++){ try{
    const res=await fetch(CFG.API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'setAcctPass',coachPass:cp,newPass:np})});
    const t=(await res.text()).trim(); if(t.startsWith('{')){ const j=JSON.parse(t); if(!/unknown action/i.test(String(j.err||''))){ r=j; break; } }
  }catch(e){} await new Promise(x=>setTimeout(x,800*(i+1))); }
  if(!r||r.ok===false){ b.disabled=false; b.textContent='設定'; $('sterr').textContent=(r&&r.err)||'設定失敗（教練密碼啱唔啱？）'; return; }
  renderLogin('✅ 財務密碼已設定，請用新密碼登入');
}
function openPass(){ renderSetup(0); }
async function fetchData(pw){
  for(let i=0;i<4;i++){ try{
    const res=await fetch(CFG.API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'acctData',acctPass:pw})});
    const t=(await res.text()).trim();
    if(t.startsWith('{')){ const j=JSON.parse(t); const em=String((j&&(j.err||j.error))||''); if(!/unknown action/i.test(em)) return j; }
  }catch(e){} await new Promise(r=>setTimeout(r,800*(i+1))); }
  return {ok:false,err:'伺服器繁忙，請再試'};
}
async function refresh(){ const btn=$('rfbtn'); if(btn){ btn.innerHTML='<span class="spin"></span>'; } const r=await fetchData(FP); if(r&&r.ok){ DATA=r; renderApp(); } else if(btn){ btn.textContent='↻'; } }

function weekMonday(w){ const m=String(w).match(/(\d{4})-W(\d{1,2})/); if(!m) return ''; const y=+m[1], wk=+m[2];
  const jan4=new Date(Date.UTC(y,0,4)), day=jan4.getUTCDay()||7, mon1=new Date(jan4); mon1.setUTCDate(jan4.getUTCDate()-(day-1));
  const mon=new Date(mon1); mon.setUTCDate(mon1.getUTCDate()+(wk-1)*7); return mon.toISOString().slice(0,10); }
function weekLabel(w){ const d=weekMonday(w), n=(String(w).match(/W(\d+)/)||[])[1]; return d?('第'+n+'週 ('+d.slice(8,10)+'/'+d.slice(5,7)+'起)'):String(w); }
function weekShort(w){ const d=weekMonday(w); return d?(d.slice(8,10)+'/'+d.slice(5,7)):String(w); }
function granOf(){ return SCOPE==='week'?'week':(SCOPE==='year'?'year':'month'); }

/* ── 概覽 ── */
function renderDash(){
  const gran=granOf(), B=aggregateGran(gran), monthB=aggregateGran('month'), weekB=aggregateGran('week');
  const curMonth=todayISO().slice(0,7), curYear=curMonth.slice(0,4), curWeek=isoWeek(todayISO());
  const cur = SCOPE==='week'?curWeek:(SCOPE==='year'?curYear:curMonth);
  if(SCOPE!=='all' && !PICK) PICK=cur;
  const keys = SCOPE==='all'?Object.keys(B):[PICK];
  const S=sumBuckets(B,keys), inc=S.inPaid+S.inDue, net=S.inPaid-S.exp, netFull=inc-S.exp;
  const scopeLabel = SCOPE==='all'?'全期':(SCOPE==='week'?weekLabel(PICK):(SCOPE==='year'?(PICK+' 年'):(PICK.replace('-','年')+'月')));
  let picker='';
  if(SCOPE==='month'){ const ks=[...new Set(Object.keys(monthB).concat([curMonth]))].sort().reverse();
    picker=`<select onchange="PICK=this.value;renderDash()">${ks.map(k=>`<option value="${k}" ${PICK===k?'selected':''}>${k.replace('-','年')}月</option>`).join('')}</select>`; }
  else if(SCOPE==='year'){ const ys=[...new Set(Object.keys(monthB).map(k=>k.slice(0,4)).concat([curYear]))].sort().reverse();
    picker=`<select onchange="PICK=this.value;renderDash()">${ys.map(y=>`<option value="${y}" ${PICK===y?'selected':''}>${y} 全年</option>`).join('')}</select>`; }
  else if(SCOPE==='week'){ const ks=[...new Set(Object.keys(weekB).concat([curWeek]))].sort().reverse().slice(0,26);
    picker=`<select onchange="PICK=this.value;renderDash()">${ks.map(k=>`<option value="${k}" ${PICK===k?'selected':''}>${weekLabel(k)}</option>`).join('')}</select>`; }
  const trend = SCOPE==='week' ? trendSVG(weekB, weekShort, 8) : trendSVG(monthB, k=>k.slice(2).replace('-','/'), 7);

  let html=topBar('會計儀表盤')+`<div class="wrap">
    <div class="scope sticky">
      <button class="chip ${SCOPE==='week'?'on':''}" onclick="setScope('week')">週</button>
      <button class="chip ${SCOPE==='month'?'on':''}" onclick="setScope('month')">月</button>
      <button class="chip ${SCOPE==='year'?'on':''}" onclick="setScope('year')">年</button>
      <button class="chip ${SCOPE==='all'?'on':''}" onclick="setScope('all')">全期</button>
      ${picker}<div class="sp"></div>
    </div>`;

  // 生意健康帶 + 自動總結
  html+=healthBand(monthB,curMonth,curYear);

  // Hero + 現金跑道（desktop 並排 2 欄；mobile 上下疊）
  html+=`<div class="dash-top"><div class="hero"><div class="hero-l">
    <div class="hero-lab">${esc(scopeLabel)} 淨利（已收 − 支出）</div>

  let s=$('scrim'); if(!s){ s=document.createElement('div'); s.id='scrim'; s.onclick=e=>{ if(e.target===s) closeSheet(); }; document.body.appendChild(s); }
  const cats=(DATA.categories||[]).map(c=>c.name);
  const catList = EXP.kind==='income' ? ['PT加收','現金收入','退款','其他收入'] : (cats.length?cats:['場地租金','器材／制服入貨','宣傳推廣','行政雜費','其他']);
  const sug=(EXP.kind==='expense')?suggestFor(EXP.note):'';
  s.innerHTML=`<div class="sheet">
    <h3>${EXP.kind==='expense'?'🧾 記一筆支出':'💰 記一筆收入'}</h3>
    <div class="seg"><button class="${EXP.kind==='expense'?'on':''}" onclick="EXP.kind='expense';EXP.cat='';renderSheet()">支出</button><button class="${EXP.kind==='income'?'on':''}" onclick="EXP.kind='income';EXP.cat='';renderSheet()">收入</button></div>
    <div class="amtbox"><div class="amt"><small>$</small>${EXP.amt||'0'}</div></div>
    <div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="expKey('${n}')">${n}</button>`).join('')}<button onclick="expKey('c')" style="color:var(--red)">C</button><button onclick="expKey('0')">0</button><button onclick="expKey('b')">⌫</button></div>
    <div class="divider"></div>
    <div class="fld"><label>類別</label><div class="catchips" id="catwrap">${catList.map(c=>`<button class="${EXP.cat===c?'on':((sug===c&&!EXP.cat)?'sug':'')}" onclick="EXP.cat=this.dataset.c;suggestCat(EXP.note);renderSheet()" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div><div class="catsug" id="catsug">${(sug&&EXP.cat!==sug)?`💡 建議分類：<b>${esc(sug)}</b> <button class="linkbtn" onclick="EXP.cat='${esc(sug)}';suggestCat(EXP.note);renderSheet()">採用</button>`:''}</div></div>
    ${EXP.kind==='income'?`<div class="fld"><label>學生 / 對象（可選）</label><input value="${esc(EXP.name||'')}" oninput="EXP.name=this.value" placeholder="例：甘卓熹"></div>`:''}
    <div class="fld"><label>日期</label><input type="date" value="${EXP.date}" onchange="EXP.date=this.value"></div>
    <div class="fld"><label>備註（可選）</label><input value="${esc(EXP.note||'')}" oninput="suggestCat(this.value)" placeholder="打字會自動建議分類，例：租場 / 保險"></div>
    ${EXP.kind==='expense'?`<div class="fld"><label>單據相 / PDF（可選，報稅用）</label>
      ${EXP.receiptFileId?`<div class="mut" style="font-size:12.5px">📎 已附：${esc(EXP.receiptName||'單據')} <button class="vd" onclick="EXP.receiptFileId='';EXP.receiptName='';renderSheet()">移除</button></div>`
        :`<input type="file" accept="image/*,application/pdf" onchange="pickReceipt(this)" style="font-size:12.5px"><div id="rcup" class="mut" style="font-size:11.5px;margin-top:4px"></div>`}</div>`:''}
    <div class="srow"><button class="btn-cancel" onclick="closeSheet()">取消</button><button class="btn-again" onclick="saveExpense(true)">＋再記</button><button class="btn-save" onclick="saveExpense(false)">儲存</button></div>
  </div>`;
  s.classList.add('on');
}
function expKey(k){ if(k==='c') EXP.amt=''; else if(k==='b') EXP.amt=EXP.amt.slice(0,-1); else if((EXP.amt||'').length<7) EXP.amt=(EXP.amt==='0'?'':EXP.amt)+k; renderSheet(); }
async function saveExpense(again){
  const amt=parseInt(EXP.amt||'0',10); if(!amt){ toast('請輸入金額'); return; } if(!EXP.cat){ toast('請揀類別'); return; }
  const kind=EXP.kind, ctx='c'+Date.now()+Math.floor(Math.random()*1000), d=EXP.date, note=EXP.note, nm=EXP.name||'', cat=EXP.cat;
  const rcpt=EXP.receiptFileId||'';
  const body = kind==='expense'
    ? {action:'acctExpenseAdd',acctPass:FP,amount:amt,category:cat,date:d,note:note,receiptFileId:rcpt,clientTxnId:ctx}
    : {action:'acctIncomeAdd',acctPass:FP,amount:amt,category:cat,name:nm,date:d,note:note,status:'已收',clientTxnId:ctx};
  const optim = kind==='expense' ? {date:d,cat:cat,desc:note,amt:amt,period:'',id:'(pending)',classId:'',file:rcpt,_pending:1}
    : {date:d,name:nm,cat:cat,desc:note,period:'',amt:amt,status:'已收',src:'MI',id:'(pending)',_pending:1};
  if(kind==='expense')(DATA.expense=DATA.expense||[]).push(optim); else (DATA.income=DATA.income||[]).push(optim);
  if(again){ EXP={kind:kind,amt:'',cat:'',date:d,note:'',name:'',receiptFileId:'',receiptName:''}; renderSheet(); } else closeSheet();
  renderApp();
  let r=null; for(let i=0;i<4;i++){ try{ const res=await fetch(CFG.API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}); const t=(await res.text()).trim(); if(t.startsWith('{')){ r=JSON.parse(t); if(r.ok||r.dup) break; } }catch(e){} await new Promise(x=>setTimeout(x,700*(i+1))); }
  if(r&&(r.ok||r.dup)){ optim.id=r.id||optim.id; optim._pending=0; toast('已記一筆'+(kind==='expense'?'支出':'收入')+' $'+amt); renderApp(); }
  else { if(kind==='expense') DATA.expense=DATA.expense.filter(x=>x!==optim); else DATA.income=DATA.income.filter(x=>x!==optim); renderApp(); toast('記賬失敗，請再試'); }
}
function renderLedger(){
  const items=[];
  (DATA.income||[]).forEach(r=>items.push({t:'in',date:r.date,name:r.name,cat:r.cat,desc:r.desc,amt:r.amt,status:r.status,manual:(r.src==='MI'),id:r.id,pending:r._pending}));
  (DATA.expense||[]).forEach(r=>items.push({t:'ex',date:r.date,cat:r.cat,desc:r.desc,amt:-r.amt,manual:true,id:r.id,pending:r._pending,file:r.file}));
  items.sort((a,b)=>(b.date||'')<(a.date||'')?-1:((b.date||'')>(a.date||'')?1:0));
  let html=topBar('賬目流水')+`<div class="wrap">`;
  if(!items.length) html+='<div class="empty">未有記錄。撳右下角 ＋ 記第一筆。</div>';
  let lastD='';
  items.forEach(x=>{ if(x.date!==lastD){ lastD=x.date; const day=items.filter(y=>y.date===x.date); const net=day.reduce((a,y)=>a+y.amt,0);
    html+=`<div class="led-day"><span>${dmy(x.date)}</span><span style="color:${net>=0?'var(--green)':'var(--red)'}">${net>=0?'+':''}${fmt0(net)}</span></div>`; }
    const inc=x.amt>=0;
    html+=`<div class="led" style="${x.pending?'opacity:.5':''}"><div class="ic" style="background:${inc?'var(--green-dim)':'var(--red-dim)'};color:${inc?'var(--green)':'var(--red)'}">${inc?'＋':'－'}</div>
      <div class="m"><div class="t">${esc(x.cat||x.desc||'—')}${x.manual?'':'<span class="badge">⚙自動</span>'}${x.pending?'<span class="badge">…</span>':''}</div>
      <div class="s">${esc([x.name,x.desc,(x.status&&x.status!=='已收'?x.status:'')].filter(Boolean).join(' · '))||' '}</div></div>
      <div class="a" style="color:${inc?'var(--green)':'var(--red)'}">${inc?'+':''}${fmt0(x.amt)}</div>
      ${x.file?`<button class="vd" onclick="viewReceipt('${esc(x.file)}')" title="睇單據">📎</button>`:''}
      ${(x.manual&&!x.pending&&x.id&&x.id!=='(pending)')?`<button class="voidbtn" onclick="voidEntry('${x.t}','${esc(x.id)}')" title="作廢">作廢</button>`:''}</div>`; });
  $('app').innerHTML=html+'</div>'+fabHtml()+navHtml();
}
async function voidEntry(t,id){ if(!confirm('確定作廢呢筆？作廢後會保留審計記錄，但唔再計入收支。')) return;
  const action=t==='ex'?'acctExpenseVoid':'acctIncomeVoid';
  if(t==='ex') DATA.expense=(DATA.expense||[]).filter(x=>x.id!==id); else DATA.income=(DATA.income||[]).filter(x=>x.id!==id);
  renderApp();
  let r=null; for(let i=0;i<3;i++){ try{ const res=await fetch(CFG.API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,acctPass:FP,id})}); const tt=(await res.text()).trim(); if(tt.startsWith('{')){ r=JSON.parse(tt); if(r.ok) break; } }catch(e){} await new Promise(x=>setTimeout(x,700)); }
  toast(r&&r.ok?'已作廢':'作廢失敗，刷新後再試'); if(!(r&&r.ok)) refresh();
}
function logout(){ FP=''; DATA=null; VIEW='dash'; try{ sessionStorage.removeItem('acct_fp'); }catch(e){} renderLogin(''); }

/* boot */
(function(){ let p=''; try{ p=sessionStorage.getItem('acct_fp')||''; }catch(e){}
  if(p){ FP=p; renderLogin('載入中…'); fetchData(p).then(r=>{ if(r&&r.ok){ DATA=r; renderApp(); } else renderLogin(''); }); }
  else renderLogin('');
  // 過 1024px 斷點時重繪（換頂部/底部 nav、卡片⇄表格），避免手機↔電腦切換時佈局唔跟
  try{ const mq=window.matchMedia('(min-width:1024px)'); const onmq=()=>{ if(DATA) renderApp(); };
    if(mq.addEventListener) mq.addEventListener('change',onmq); else if(mq.addListener) mq.addListener(onmq); }catch(e){}
})();
</script>
