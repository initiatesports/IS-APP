<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>INITIATE 會計儀表盤</title>
<style>
:root{
  --bg:#0f1720; --surface:#18222e; --surface2:#1f2b39; --border:#2a3a4d; --border2:#35485e;
  --ink:#eef3f8; --ink2:#aebccb; --muted:#7d8ea0;
  --teal:#2fb9c9; --teal-d:#1b8d9b; --navy:#25384d;
  --green:#3fcf8e; --green-dim:rgba(63,207,142,.14);
  --red:#ff6b6b; --red-dim:rgba(255,107,107,.14);
  --amber:#f5c451; --amber-dim:rgba(245,196,81,.14);
  --purple:#a78bfa; --gold:#e6b84c;
  --r:15px; --r-sm:11px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang HK","Noto Sans HK","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:40px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
a{color:var(--teal)}
.num{font-variant-numeric:tabular-nums}
/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(15,23,32,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:13px 0}
.top .wrap{display:flex;align-items:center;gap:12px}
.top h1{font-size:17px;font-weight:800;letter-spacing:.2px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 span{color:var(--teal)}
.tbtn{background:var(--surface2);border:1px solid var(--border2);color:var(--ink2);border-radius:9px;padding:8px 12px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.tbtn:hover{border-color:var(--teal);color:var(--ink)}
/* login */
.login{max-width:360px;margin:16vh auto 0;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:30px 26px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.login .logo{font-size:34px;margin-bottom:6px}
.login h2{font-size:20px;font-weight:900;margin-bottom:4px}
.login p{color:var(--muted);font-size:13px;margin-bottom:20px}
.login input{width:100%;background:var(--surface2);border:1.5px solid var(--border2);color:var(--ink);border-radius:11px;padding:13px 14px;font-size:16px;text-align:center;letter-spacing:.15em;font-family:inherit;outline:none}
.login input:focus{border-color:var(--teal)}
.login button{width:100%;margin-top:12px;background:linear-gradient(120deg,var(--teal),var(--teal-d));color:#04252a;border:none;border-radius:11px;padding:13px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
.login .err{color:var(--red);font-size:12.5px;margin-top:10px;min-height:16px}
/* scope tabs */
.scope{display:flex;gap:8px;margin:18px 0 14px;flex-wrap:wrap;align-items:center}
.chip{background:var(--surface);border:1.5px solid var(--border2);color:var(--ink2);border-radius:20px;padding:8px 16px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit}
.chip.on{background:var(--teal);border-color:var(--teal);color:#04252a}
.scope select{background:var(--surface);border:1.5px solid var(--border2);color:var(--ink);border-radius:20px;padding:8px 14px;font-size:13.5px;font-weight:700;font-family:inherit;outline:none}
.scope .sp{flex:1}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:860px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px 16px;position:relative;overflow:hidden}
.kpi .lab{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:8px}
.kpi .val{font-size:26px;font-weight:900;letter-spacing:-.5px;line-height:1}
.kpi .val small{font-size:15px;font-weight:800;color:var(--muted)}
.kpi .sub{font-size:11.5px;color:var(--ink2);margin-top:7px}
.kpi.pos .val{color:var(--green)} .kpi.neg .val{color:var(--red)}
.kpi .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
/* card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:17px 18px;margin-bottom:16px}
.card h3{font-size:15px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h3 .tag{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
/* table */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-size:11.5px;font-weight:700;padding:7px 8px;border-bottom:1px solid var(--border)}
td{padding:9px 8px;border-bottom:1px solid var(--border);color:var(--ink2)}
tr:last-child td{border-bottom:none}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.pos{color:var(--green)} .neg{color:var(--red)}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.pill.g{background:var(--green-dim);color:var(--green)} .pill.r{background:var(--red-dim);color:var(--red)} .pill.a{background:var(--amber-dim);color:var(--amber)}
/* chart */
.chart-wrap{overflow-x:auto}
.legend{display:flex;gap:16px;font-size:11.5px;color:var(--ink2);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.catrow{display:flex;align-items:center;gap:10px;padding:6px 0}
.catrow .nm{width:96px;font-size:12.5px;color:var(--ink2);flex:none}
.catrow .track{flex:1;height:9px;background:var(--surface2);border-radius:6px;overflow:hidden}
.catrow .fill{height:100%;border-radius:6px}
.catrow .amt{width:74px;text-align:right;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.empty{color:var(--muted);text-align:center;padding:26px;font-size:13px}
.foot{color:var(--muted);font-size:11.5px;text-align:center;margin-top:18px;line-height:1.7}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--border2);border-top-color:var(--teal);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
/* FAB + 記賬 sheet */
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;width:58px;height:58px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--teal),var(--teal-d));color:#04252a;font-size:30px;font-weight:800;box-shadow:0 8px 24px rgba(47,185,201,.4);cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.fab:active{transform:scale(.94)}
#scrim{position:fixed;inset:0;background:rgba(4,8,13,.6);z-index:50;display:none;align-items:flex-end;justify-content:center}
#scrim.on{display:flex}
.sheet{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--border);border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow-y:auto;animation:up .22s cubic-bezier(.2,.9,.3,1.1)}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{font-size:17px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.seg{display:flex;gap:8px;margin-bottom:14px}
.seg button{flex:1;background:var(--surface2);border:1.5px solid var(--border2);color:var(--ink2);border-radius:11px;padding:11px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--teal-dim,rgba(47,185,201,.16));border-color:var(--teal);color:var(--teal)}
.amtbox{text-align:center;margin:6px 0 14px}
.amtbox .amt{font-size:40px;font-weight:900;letter-spacing:-1px}
.amtbox .amt small{font-size:20px;color:var(--muted);font-weight:800}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.keys button{background:var(--surface2);border:1px solid var(--border2);color:var(--ink);border-radius:11px;padding:15px 0;font-size:20px;font-weight:700;cursor:pointer;font-family:inherit}
.keys button:active{background:var(--border2)}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}
.fld input,.fld select{width:100%;background:var(--surface2);border:1.5px solid var(--border2);color:var(--ink);border-radius:10px;padding:11px 12px;font-size:15px;font-family:inherit;outline:none}
.catchips{display:flex;gap:7px;flex-wrap:wrap}
.catchips button{background:var(--surface2);border:1.5px solid var(--border2);color:var(--ink2);border-radius:20px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.catchips button.on{background:var(--teal);border-color:var(--teal);color:#04252a}
.srow{display:flex;gap:9px;margin-top:6px}
.srow button{flex:1;border:none;border-radius:11px;padding:13px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
.btn-primary{background:linear-gradient(120deg,var(--teal),var(--teal-d));color:#04252a}
.btn-ghost{background:var(--surface2);border:1px solid var(--border2)!important;color:var(--ink2)}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);border:1px solid var(--border2);color:var(--ink);padding:11px 18px;border-radius:24px;font-size:14px;z-index:60;opacity:0;transition:.25s;pointer-events:none;display:flex;align-items:center;gap:10px}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#toast button{background:none;border:none;color:var(--teal);font-weight:800;cursor:pointer;font-family:inherit;font-size:14px}
.led-day{margin:16px 0 6px;font-size:12px;color:var(--muted);font-weight:700;display:flex;justify-content:space-between}
.led{display:flex;align-items:center;gap:11px;padding:11px 12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:7px}
.led .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:15px;flex:none}
.led .m{flex:1;min-width:0}
.led .m .t{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.led .m .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.led .a{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.led .vd{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:4px}
.badge{display:inline-block;font-size:9.5px;font-weight:800;padding:1px 5px;border-radius:5px;background:var(--surface2);color:var(--muted);margin-left:5px;vertical-align:1px}
</style>
</head>
<body>
<div id="app"></div>

<script>
const CFG={ API:'https://script.google.com/macros/s/AKfycbxNikFcB8n34Lyqc-KKC0oIRhn_-35HXmrAo5mEVhGNZ5g21AdUEMFSca408oo0xUw/exec' };
let FP='', DATA=null, SCOPE='month', PICK='';   // FP=財務密碼; SCOPE: week|month|year|all ; PICK: 具體桶(YYYY-Www/YYYY-MM/YYYY)
const $=id=>document.getElementById(id);
const fmt0=n=>'$'+Math.round(n||0).toLocaleString('en-US');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function todayISO(){ return (DATA&&DATA.today)||new Date().toISOString().slice(0,10); }

/* ── 期數(雙月)→ 兩個月曆月 YYYY-MM ── */
function periodMonths(period){
  const m=String(period||'').match(/(\d{4})\s*(\d{1,2})\s*[-–]\s*(\d{1,2})/);
  if(!m) return [];
  const y=+m[1]; return [m[2],m[3]].map(x=>y+'-'+String(+x).padStart(2,'0'));
}
/* ── 通用日期分桶：週(ISO YYYY-Www) / 月(YYYY-MM) / 年(YYYY) ── */
function isoWeek(dateStr){ const d=new Date(dateStr+'T00:00:00'); const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day); const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  const wk=Math.ceil(((t-y0)/86400000+1)/7); return t.getUTCFullYear()+'-W'+String(wk).padStart(2,'0'); }
function bucketOf(dateStr,gran){ const d=(dateStr||'').slice(0,10); if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) return null;
  return gran==='week'?isoWeek(d):(gran==='year'?d.slice(0,4):d.slice(0,7)); }
function periodRange(period){ const m=String(period||'').match(/(\d{4})\s*(\d{1,2})\s*[-–]\s*(\d{1,2})/); if(!m) return null;
  const y=+m[1], m1=+m[2], m2=+m[3]; const last=new Date(y,m2,0).getDate();
  return [y+'-'+String(m1).padStart(2,'0')+'-01', y+'-'+String(m2).padStart(2,'0')+'-'+String(last).padStart(2,'0')]; }
function bucketsInRange(a,b,gran){ const out=[], d=new Date(a+'T00:00:00'), end=new Date(b+'T00:00:00');
  let guard=0; while(d<=end && guard++<400){ const k=bucketOf(d.toISOString().slice(0,10),gran); if(k&&out.indexOf(k)<0) out.push(k); d.setUTCDate(d.getUTCDate()+(gran==='week'?7:(gran==='year'?300:28))); }
  // 保證覆蓋到 end 桶
  const ek=bucketOf(b,gran); if(ek&&out.indexOf(ek)<0) out.push(ek); return out; }
/* 按 gran 分桶彙總（收入/支出逐筆按日期；場租按期攤落該期嘅桶）*/
function aggregateGran(gran){
  const B={}; const mk=k=>{ if(!B[k]) B[k]={inPaid:0,inDue:0,exp:0,catIn:{},catEx:{}}; return B[k]; };
  (DATA.income||[]).forEach(r=>{ const k=bucketOf(r.date,gran); if(!k) return; const o=mk(k);
    if(r.status==='已收') o.inPaid+=r.amt; else o.inDue+=r.amt; o.catIn[r.cat]=(o.catIn[r.cat]||0)+r.amt; });
  (DATA.expense||[]).forEach(r=>{ const k=bucketOf(r.date,gran); if(!k) return; const o=mk(k);
    o.exp+=r.amt; o.catEx[r.cat]=(o.catEx[r.cat]||0)+r.amt; });
  Object.keys(DATA.venueByPeriod||{}).forEach(p=>{ const rent=DATA.venueByPeriod[p]||0; if(!rent) return;
    const rng=periodRange(p); if(!rng) return; const bks=bucketsInRange(rng[0],rng[1],gran); if(!bks.length) return;
    const each=rent/bks.length; bks.forEach(k=>{ const o=mk(k); o.exp+=each; o.catEx['場租']=(o.catEx['場租']||0)+each; }); });
  return B;
}
function sumBuckets(B,keys){ const s={inPaid:0,inDue:0,exp:0,catIn:{},catEx:{}};
  keys.forEach(k=>{ const o=B[k]; if(!o) return; s.inPaid+=o.inPaid; s.inDue+=o.inDue; s.exp+=o.exp;
    Object.keys(o.catIn).forEach(c=>s.catIn[c]=(s.catIn[c]||0)+o.catIn[c]);
    Object.keys(o.catEx).forEach(c=>s.catEx[c]=(s.catEx[c]||0)+o.catEx[c]); });
  return s; }

/* ── SVG 月度趨勢圖（收入柱 vs 支出柱 + 淨利折線）── */
function trendSVG(B, labelFn, lastN){
  let keys=Object.keys(B).sort(); if(lastN && keys.length>lastN) keys=keys.slice(-lastN);
  if(!keys.length) return '<div class="empty">未有數據</div>';
  const W=Math.max(560, keys.length*74), H=210, padL=8, padR=8, padB=34, padT=14;
  const bw=(W-padL-padR)/keys.length;
  let maxV=1; keys.forEach(k=>{ const o=B[k]; maxV=Math.max(maxV,o.inPaid+o.inDue,o.exp); });
  const y=v=>padT+(H-padT-padB)*(1-v/maxV);
  let bars='', line='', pts=[];
  keys.forEach((k,i)=>{
    const o=B[k], cx=padL+bw*i, gap=bw*0.16, w=(bw-gap*3)/2;
    const inc=o.inPaid+o.inDue, net=inc-o.exp;
    bars+=`<rect x="${cx+gap}" y="${y(inc)}" width="${w}" height="${H-padB-y(inc)}" rx="3" fill="#2fb9c9"></rect>`;
    bars+=`<rect x="${cx+gap*2+w}" y="${y(o.exp)}" width="${w}" height="${H-padB-y(o.exp)}" rx="3" fill="#ff6b6b" opacity=".85"></rect>`;
    const px=cx+bw/2, py=y(Math.max(0,net)); pts.push([px,py]);
    bars+=`<text x="${px}" y="${H-padB+15}" text-anchor="middle" font-size="10" fill="#7d8ea0">${esc(labelFn(k))}</text>`;
  });
  line='<polyline fill="none" stroke="#3fcf8e" stroke-width="2.2" points="'+pts.map(p=>p[0]+','+p[1]).join(' ')+'"></polyline>'
     + pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#3fcf8e"></circle>`).join('');
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="xMidYMid meet" style="min-width:${W}px">${bars}${line}</svg></div>
    <div class="legend"><span><i style="background:#2fb9c9"></i>收入</span><span><i style="background:#ff6b6b"></i>支出</span><span><i style="background:#3fcf8e"></i>淨利</span></div>`;
}
/* 分類條 */
function catBars(obj,color){
  const ent=Object.entries(obj||{}).filter(([,v])=>Math.abs(v)>0).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));
  if(!ent.length) return '<div class="empty">未有</div>';
  const max=Math.max(...ent.map(([,v])=>Math.abs(v)))||1;
  return ent.map(([k,v])=>`<div class="catrow"><div class="nm">${esc(k)}</div>
    <div class="track"><div class="fill" style="width:${Math.max(3,Math.abs(v)/max*100)}%;background:${color}"></div></div>
    <div class="amt" style="${v<0?'color:var(--red)':''}">${fmt0(v)}</div></div>`).join('');
}

/* ── render ── */
function renderLogin(msg){
  $('app').innerHTML=`<div class="login"><div class="logo">📊</div><h2>會計儀表盤</h2><p>INITIATE SPORTS · 財務總覽</p>
    <input id="pw" type="password" inputmode="numeric" placeholder="財務密碼" autocomplete="off">
    <button onclick="doLogin()" id="lgbtn">登入</button><div class="err" id="lgerr">${msg||''}</div>
    <div style="margin-top:14px"><a href="#" onclick="renderSetup(0);return false" style="font-size:12.5px;color:var(--muted)">🔑 首次設定 / 修改財務密碼</a></div></div>`;
  const pw=$('pw'); pw.focus(); pw.onkeydown=e=>{ if(e.key==='Enter') doLogin(); };
}
async function doLogin(){
  const pw=$('pw').value.trim(); if(!pw){ $('lgerr').textContent='請輸入財務密碼'; return; }
  const b=$('lgbtn'); b.disabled=true; b.innerHTML='<span class="spin"></span> 載入中…'; $('lgerr').textContent='';
  const r=await fetchData(pw);
  if(!r||r.ok===false){ b.disabled=false; b.textContent='登入';
    if(r&&r.needSetup){ renderSetup(1); return; }
    $('lgerr').textContent=(r&&r.err)||'密碼錯誤或載入失敗'; return; }
  FP=pw; try{ sessionStorage.setItem('acct_fp',pw); }catch(e){} DATA=r; SCOPE='month'; PICK=''; VIEW='dash'; renderApp();
}
function renderSetup(firstTime){
  $('app').innerHTML=`<div class="login"><div class="logo">🔑</div><h2>${firstTime?'首次設定財務密碼':'設定 / 修改財務密碼'}</h2>
    <p>用教練密碼授權，設定一個獨立嘅財務密碼</p>
    <input id="cpw" type="password" inputmode="numeric" placeholder="教練密碼（授權用）" autocomplete="off" style="margin-bottom:10px">
    <input id="npw" type="password" inputmode="numeric" placeholder="新財務密碼（至少 4 位）" autocomplete="off">
    <button onclick="doSetup()" id="stbtn">設定</button><div class="err" id="sterr"></div>
    <div style="margin-top:12px"><a href="#" onclick="renderLogin('');return false" style="font-size:12.5px;color:var(--muted)">← 返回登入</a></div></div>`;
  $('cpw').focus();
}
async function doSetup(){
  const cp=$('cpw').value.trim(), np=$('npw').value.trim();
  if(!cp||!np){ $('sterr').textContent='請填教練密碼同新財務密碼'; return; }
  if(np.length<4){ $('sterr').textContent='財務密碼至少 4 位'; return; }
  const b=$('stbtn'); b.disabled=true; b.innerHTML='<span class="spin"></span> 設定中…'; $('sterr').textContent='';
  let r=null; for(let i=0;i<4;i++){ try{
    const res=await fetch(CFG.API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'setAcctPass',coachPass:cp,newPass:np})});
    const t=(await res.text()).trim(); if(t.startsWith('{')){ const j=JSON.parse(t); if(!/unknown action/i.test(String(j.err||''))){ r=j; break; } }
  }catch(e){} await new Promise(x=>setTimeout(x,800*(i+1))); }
  if(!r||r.ok===false){ b.disabled=false; b.textContent='設定'; $('sterr').textContent=(r&&r.err)||'設定失敗（教練密碼啱唔啱？）'; return; }
  renderLogin('✅ 財務密碼已設定，請用新密碼登入');
}
function openPass(){ renderSetup(0); }
async function fetchData(pw){
  for(let i=0;i<4;i++){ try{
    const res=await fetch(CFG.API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'acctData',acctPass:pw})});
    const t=(await res.text()).trim();
    if(t.startsWith('{')){ const j=JSON.parse(t); const em=String((j&&(j.err||j.error))||''); if(!/unknown action/i.test(em)) return j; }
  }catch(e){} await new Promise(r=>setTimeout(r,800*(i+1))); }
  return {ok:false,err:'伺服器繁忙，請再試'};
}
async function refresh(){ const btn=$('rfbtn'); if(btn){ btn.innerHTML='<span class="spin"></span>'; } const r=await fetchData(FP); if(r&&r.ok){ DATA=r; renderApp(); } else if(btn){ btn.textContent='↻ 刷新'; } }

function weekMonday(w){ const m=String(w).match(/(\d{4})-W(\d{1,2})/); if(!m) return ''; const y=+m[1], wk=+m[2];
  const jan4=new Date(Date.UTC(y,0,4)), day=jan4.getUTCDay()||7, mon1=new Date(jan4); mon1.setUTCDate(jan4.getUTCDate()-(day-1));
  const mon=new Date(mon1); mon.setUTCDate(mon1.getUTCDate()+(wk-1)*7); return mon.toISOString().slice(0,10); }
function weekLabel(w){ const d=weekMonday(w), n=(String(w).match(/W(\d+)/)||[])[1]; return d?('第'+n+'週 ('+d.slice(8,10)+'/'+d.slice(5,7)+'起)'):String(w); }
function weekShort(w){ const d=weekMonday(w); return d?(d.slice(8,10)+'/'+d.slice(5,7)):String(w); }
function granOf(){ return SCOPE==='week'?'week':(SCOPE==='year'?'year':'month'); }
function renderDash(){
  const gran=granOf(), B=aggregateGran(gran), monthB=aggregateGran('month'), weekB=aggregateGran('week');
  const curMonth=todayISO().slice(0,7), curYear=curMonth.slice(0,4), curWeek=isoWeek(todayISO());
  const cur = SCOPE==='week'?curWeek:(SCOPE==='year'?curYear:curMonth);
  if(SCOPE!=='all' && !PICK) PICK=cur;
  const keys = SCOPE==='all'?Object.keys(B):[PICK];
  const S=sumBuckets(B,keys), inc=S.inPaid+S.inDue, net=S.inPaid-S.exp, netFull=inc-S.exp;
  const Y=sumBuckets(monthB, Object.keys(monthB).filter(k=>k.slice(0,4)===curYear)), ytdNet=Y.inPaid-Y.exp;
  const scopeLabel = SCOPE==='all'?'全期':(SCOPE==='week'?weekLabel(PICK):(SCOPE==='year'?(PICK+' 年'):(PICK.replace('-','年')+'月')));
  let picker='';
  if(SCOPE==='month'){ const ks=[...new Set(Object.keys(monthB).concat([curMonth]))].sort().reverse();
    picker=`<select onchange="PICK=this.value;renderDash()">${ks.map(k=>`<option value="${k}" ${PICK===k?'selected':''}>${k.replace('-','年')}月</option>`).join('')}</select>`; }
  else if(SCOPE==='year'){ const ys=[...new Set(Object.keys(monthB).map(k=>k.slice(0,4)).concat([curYear]))].sort().reverse();
    picker=`<select onchange="PICK=this.value;renderDash()">${ys.map(y=>`<option value="${y}" ${PICK===y?'selected':''}>${y} 全年</option>`).join('')}</select>`; }
  else if(SCOPE==='week'){ const ks=[...new Set(Object.keys(weekB).concat([curWeek]))].sort().reverse().slice(0,26);
    picker=`<select onchange="PICK=this.value;renderDash()">${ks.map(k=>`<option value="${k}" ${PICK===k?'selected':''}>${weekLabel(k)}</option>`).join('')}</select>`; }
  const trend = SCOPE==='week' ? trendSVG(weekB, weekShort, 12) : trendSVG(monthB, k=>k.slice(2).replace('-','/'), 18);

  let html=`<div class="top"><div class="wrap">
    <h1>📊 INITIATE <span>會計儀表盤</span></h1>
    <button class="tbtn" onclick="VIEW='ledger';renderApp()">🧾 賬目</button>
    <button class="tbtn" id="rfbtn" onclick="refresh()">↻</button>
    <a class="tbtn" href="${esc(DATA.sheetUrl||'#')}" target="_blank" rel="noopener">🗂</a>
    <button class="tbtn" onclick="openPass()">🔒</button>
    <button class="tbtn" onclick="logout()">登出</button>
  </div></div><div class="wrap">
  <div class="scope">
    <button class="chip ${SCOPE==='week'?'on':''}" onclick="setScope('week')">週度</button>
    <button class="chip ${SCOPE==='month'?'on':''}" onclick="setScope('month')">月度</button>
    <button class="chip ${SCOPE==='year'?'on':''}" onclick="setScope('year')">年度</button>
    <button class="chip ${SCOPE==='all'?'on':''}" onclick="setScope('all')">全期</button>
    ${picker}
    <div class="sp"></div>
  </div>`;

  // KPI
  html+=`<div class="kpis">
    <div class="kpi"><div class="bar" style="background:var(--teal)"></div><div class="lab">${esc(scopeLabel)} 收入（已收）</div><div class="val num">${fmt0(S.inPaid)}</div><div class="sub">連待收共 ${fmt0(inc)}</div></div>
    <div class="kpi"><div class="bar" style="background:var(--red)"></div><div class="lab">${esc(scopeLabel)} 支出</div><div class="val num">${fmt0(S.exp)}</div><div class="sub">含自動場租</div></div>
    <div class="kpi ${net>=0?'pos':'neg'}"><div class="bar" style="background:${net>=0?'var(--green)':'var(--red)'}"></div><div class="lab">${esc(scopeLabel)} 淨利（已收−支出）</div><div class="val num">${fmt0(net)}</div><div class="sub">全收後預計 ${fmt0(netFull)}</div></div>
    <div class="kpi ${ytdNet>=0?'pos':'neg'}"><div class="bar" style="background:var(--gold)"></div><div class="lab">${esc(curYear)} 年累計淨利 (YTD)</div><div class="val num">${fmt0(ytdNet)}</div><div class="sub">收入 ${fmt0(Y.inPaid)} · 支出 ${fmt0(Y.exp)}</div></div>
  </div>`;

  // 趨勢
  html+=insightsCard();
  html+=`<div class="card"><h3>📈 ${SCOPE==='week'?'週度':'月度'}趨勢<span class="tag">收入 · 支出 · 淨利</span></h3>${trend}</div>`;

  // 分類
  html+=`<div class="grid2">
    <div class="card"><h3>💰 收入分類<span class="tag">${esc(scopeLabel)}</span></h3>${catBars(S.catIn,'linear-gradient(90deg,#2fb9c9,#1b8d9b)')}</div>
    <div class="card"><h3>🧾 支出分類<span class="tag">${esc(scopeLabel)}</span></h3>${catBars(S.catEx,'linear-gradient(90deg,#ff6b6b,#c0392b)')}</div>
  </div>`;

  // 應收
  html+=receivablesCard();
  // 逐班盈虧
  html+=`<div class="card"><h3>🏫 逐班盈虧<span class="tag">本報名期</span></h3>${pnlTable()}</div>`;

  // 私訓
  html+=ptSection(S);

  // 家庭 LTV
  html+=`<div class="card"><h3>👨‍👩‍👧 家庭價值 LTV<span class="tag">累計已收</span></h3>${ltvTable()}</div>`;

  html+=`<div class="foot">數據即時由報名記錄／收據／私訓（逐節＋預付套票）自動彙總；支出＋場租由會計明細表帶入。<br>場地費＝康文署費率自動計；改「場租設定」分頁即重算。每晚 23:00 自動刷新。撳右下角 ＋ 即可 in-app 記賬。</div></div>`;
  $('app').innerHTML=html+fabHtml();
}
function insightsCard(){
  const ins=(DATA.insights||[]); if(!ins.length) return '';
  const col={red:'var(--red)',amber:'var(--amber)',info:'var(--teal)'};
  const rows=ins.map((x,i)=>`<div style="display:flex;gap:11px;align-items:flex-start;padding:9px 0;${i<ins.length-1?'border-bottom:1px solid var(--border)':''}">
    <div style="font-size:19px;flex:none">${x.icon||'•'}</div>
    <div style="flex:1;min-width:0"><div style="font-weight:800;font-size:14px;color:${col[x.level]||'var(--ink)'}">${esc(x.title)}</div>
    <div style="font-size:12.5px;color:var(--ink2);margin-top:2px;line-height:1.5">${esc(x.detail||'')}</div></div></div>`).join('');
  return `<div class="card" style="border-color:var(--border2)"><h3>🔔 財務洞察 <span class="tag">要跟進</span></h3>${rows}</div>`;
}
function receivablesCard(){
  const due=(DATA.income||[]).filter(r=>r.status && r.status!=='已收' && r.amt>0);
  if(!due.length) return '';
  const byName={}; due.forEach(r=>{ const k=r.name||r.desc||'—'; byName[k]=(byName[k]||0)+r.amt; });
  const rows=Object.entries(byName).sort((a,b)=>b[1]-a[1]);
  const tot=rows.reduce((a,r)=>a+r[1],0);
  return `<div class="card"><h3>📥 應收（未收）<span class="tag">共 ${fmt0(tot)}</span></h3>
    <table><thead><tr><th>學生 / 項目</th><th class="n">金額</th></tr></thead><tbody>${
      rows.slice(0,25).map(([n,v])=>`<tr><td>${esc(n)}</td><td class="n" style="font-weight:800;color:var(--amber)">${fmt0(v)}</td></tr>`).join('')
    }</tbody></table></div>`;
}
function pnlTable(){
  const p=DATA.classPnL||[]; if(p.length<2) return '<div class="empty">未有已核實報名</div>';
  const rows=p.slice(1);
  return `<table><thead><tr><th>班別</th><th class="n">人數</th><th class="n">學費收入</th><th class="n">場租</th><th class="n">淨利</th><th>狀態</th></tr></thead><tbody>${
    rows.map(r=>{ const net=Number(r[6])||0; return `<tr><td>${esc(r[1])}<br><span style="color:var(--muted);font-size:11px">${esc(r[2])}</span></td><td class="n">${r[3]}</td><td class="n">${fmt0(r[4])}</td><td class="n neg">${fmt0(r[5])}</td><td class="n ${net>=0?'pos':'neg'}" style="font-weight:800">${fmt0(net)}</td><td>${net>=0?'<span class="pill g">賺</span>':'<span class="pill r">蝕</span>'}</td></tr>`; }).join('')
  }</tbody></table>`;
}
function ptSection(S){
  const inc=(DATA.income||[]).filter(r=>r.cat==='私訓'||r.cat==='私訓套票');
  if(!inc.length) return '';
  const pkg=inc.filter(r=>r.cat==='私訓套票'), sess=inc.filter(r=>r.cat==='私訓');
  const pkgT=pkg.reduce((a,r)=>a+r.amt,0), sessPaid=sess.filter(r=>r.status==='已收').reduce((a,r)=>a+r.amt,0), sessDue=sess.filter(r=>r.status!=='已收').reduce((a,r)=>a+r.amt,0);
  return `<div class="card"><h3>⭐ 私人訓練<span class="tag">套票 ${fmt0(pkgT)} · 逐節已收 ${fmt0(sessPaid)}${sessDue?(' · 待收 '+fmt0(sessDue)):''}</span></h3>
    <table><thead><tr><th>日期</th><th>學員</th><th>項目</th><th class="n">金額</th><th>狀態</th></tr></thead><tbody>${
      inc.slice().sort((a,b)=>(b.date||'')<(a.date||'')?-1:1).slice(0,30).map(r=>`<tr><td>${dmy(r.date)}</td><td>${esc(r.name)}</td><td>${esc(r.desc)}</td><td class="n" style="font-weight:700">${fmt0(r.amt)}</td><td>${r.status==='已收'?'<span class="pill g">已收</span>':'<span class="pill a">待收</span>'}</td></tr>`).join('')
    }</tbody></table></div>`;
}
function ltvTable(){
  const l=DATA.familyLTV||[]; if(l.length<2) return '<div class="empty">未有數據</div>';
  const rows=l.slice(1).slice(0,15);
  return `<table><thead><tr><th>家庭（學生）</th><th class="n">報名期數</th><th>本期</th><th class="n">累計 LTV</th></tr></thead><tbody>${
    rows.map(r=>`<tr><td>${esc(r[1])}</td><td class="n">${r[2]}</td><td>${esc(r[3])}</td><td class="n" style="font-weight:800;color:var(--gold)">${fmt0(r[4])}</td></tr>`).join('')
  }</tbody></table>`;
}
function dmy(s){ const m=String(s||'').match(/(\d{4})-(\d{2})-(\d{2})/); return m?`${m[3]}/${m[2]}/${m[1]}`:(s||'—'); }
function setScope(s){ SCOPE=s; PICK=''; renderDash(); }
/* ── 記賬 + 賬目 + toast (MVP) ── */
let VIEW='dash', EXP=null, TOASTt=null, TOAST_UNDO=null;
function fabHtml(){ return `<button class="fab" onclick="openExpense()" title="記賬">＋</button>`; }
function renderApp(){ if(VIEW==='ledger') renderLedger(); else renderDash(); }
function toast(msg){ let el=$('toast'); if(!el){ el=document.createElement('div'); el.id='toast'; document.body.appendChild(el); }
  el.textContent=msg; el.classList.add('on'); clearTimeout(TOASTt); TOASTt=setTimeout(()=>el.classList.remove('on'),2400); }
function openExpense(){ EXP={kind:'expense',amt:'',cat:'',date:todayISO(),note:'',name:'',classId:''}; renderSheet(); }
function closeSheet(){ const s=$('scrim'); if(s) s.classList.remove('on'); }
function renderSheet(){
  let s=$('scrim'); if(!s){ s=document.createElement('div'); s.id='scrim'; s.onclick=e=>{ if(e.target===s) closeSheet(); }; document.body.appendChild(s); }
  const cats=(DATA.categories||[]).map(c=>c.name);
  const catList = EXP.kind==='income' ? ['PT加收','現金收入','退款','其他收入'] : (cats.length?cats:['場地租金','器材／制服入貨','宣傳推廣','行政雜費','其他']);
  s.innerHTML=`<div class="sheet">
    <h3>${EXP.kind==='expense'?'🧾 記一筆支出':'💰 記一筆收入'}</h3>
    <div class="seg"><button class="${EXP.kind==='expense'?'on':''}" onclick="EXP.kind='expense';EXP.cat='';renderSheet()">支出</button><button class="${EXP.kind==='income'?'on':''}" onclick="EXP.kind='income';EXP.cat='';renderSheet()">收入</button></div>
    <div class="amtbox"><div class="amt"><small>$</small>${EXP.amt||'0'}</div></div>
    <div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="expKey('${n}')">${n}</button>`).join('')}<button onclick="expKey('c')" style="color:var(--red)">C</button><button onclick="expKey('0')">0</button><button onclick="expKey('b')">⌫</button></div>
    <div class="fld"><label>類別</label><div class="catchips">${catList.map(c=>`<button class="${EXP.cat===c?'on':''}" onclick="EXP.cat=this.dataset.c;renderSheet()" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div></div>
    ${EXP.kind==='income'?`<div class="fld"><label>學生 / 對象（可選）</label><input value="${esc(EXP.name||'')}" oninput="EXP.name=this.value" placeholder="例：甘卓熹"></div>`:''}
    <div class="fld"><label>日期</label><input type="date" value="${EXP.date}" onchange="EXP.date=this.value"></div>
    <div class="fld"><label>備註（可選）</label><input value="${esc(EXP.note||'')}" oninput="EXP.note=this.value" placeholder="說明"></div>
    <div class="srow"><button class="btn-ghost" onclick="closeSheet()">取消</button><button class="btn-primary" onclick="saveExpense(true)">儲存＋再記</button><button class="btn-primary" onclick="saveExpense(false)">儲存</button></div>
  </div>`;
  s.classList.add('on');
}
function expKey(k){ if(k==='c') EXP.amt=''; else if(k==='b') EXP.amt=EXP.amt.slice(0,-1); else if((EXP.amt||'').length<7) EXP.amt=(EXP.amt==='0'?'':EXP.amt)+k; renderSheet(); }
async function saveExpense(again){
  const amt=parseInt(EXP.amt||'0',10); if(!amt){ toast('請輸入金額'); return; } if(!EXP.cat){ toast('請揀類別'); return; }
  const kind=EXP.kind, ctx='c'+Date.now()+Math.floor(Math.random()*1000), d=EXP.date, note=EXP.note, nm=EXP.name||'', cat=EXP.cat;
  const body = kind==='expense'
    ? {action:'acctExpenseAdd',acctPass:FP,amount:amt,category:cat,date:d,note:note,clientTxnId:ctx}
    : {action:'acctIncomeAdd',acctPass:FP,amount:amt,category:cat,name:nm,date:d,note:note,status:'已收',clientTxnId:ctx};
  const optim = kind==='expense' ? {date:d,cat:cat,desc:note,amt:amt,period:'',id:'(pending)',classId:'',_pending:1}
    : {date:d,name:nm,cat:cat,desc:note,period:'',amt:amt,status:'已收',src:'MI',id:'(pending)',_pending:1};
  if(kind==='expense')(DATA.expense=DATA.expense||[]).push(optim); else (DATA.income=DATA.income||[]).push(optim);
  if(again){ EXP={kind:kind,amt:'',cat:'',date:d,note:'',name:''}; renderSheet(); } else closeSheet();
  renderApp();
  let r=null; for(let i=0;i<4;i++){ try{ const res=await fetch(CFG.API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}); const t=(await res.text()).trim(); if(t.startsWith('{')){ r=JSON.parse(t); if(r.ok||r.dup) break; } }catch(e){} await new Promise(x=>setTimeout(x,700*(i+1))); }
  if(r&&(r.ok||r.dup)){ optim.id=r.id||optim.id; optim._pending=0; toast('已記一筆'+(kind==='expense'?'支出':'收入')+' $'+amt); renderApp(); }
  else { if(kind==='expense') DATA.expense=DATA.expense.filter(x=>x!==optim); else DATA.income=DATA.income.filter(x=>x!==optim); renderApp(); toast('記賬失敗，請再試'); }
}
function renderLedger(){
  const items=[];
  (DATA.income||[]).forEach(r=>items.push({t:'in',date:r.date,name:r.name,cat:r.cat,desc:r.desc,amt:r.amt,status:r.status,manual:(r.src==='MI'),id:r.id,pending:r._pending}));
  (DATA.expense||[]).forEach(r=>items.push({t:'ex',date:r.date,cat:r.cat,desc:r.desc,amt:-r.amt,manual:true,id:r.id,pending:r._pending}));
  items.sort((a,b)=>(b.date||'')<(a.date||'')?-1:((b.date||'')>(a.date||'')?1:0));
  let html=`<div class="top"><div class="wrap"><h1>🧾 <span>賬目流水</span></h1><button class="tbtn" onclick="VIEW='dash';renderApp()">← 概覽</button><button class="tbtn" onclick="refresh()" id="rfbtn">↻</button></div></div><div class="wrap" style="padding-bottom:100px">`;
  if(!items.length) html+='<div class="empty">未有記錄。撳右下角 ＋ 記第一筆。</div>';
  let lastD='';
  items.forEach(x=>{ if(x.date!==lastD){ lastD=x.date; const day=items.filter(y=>y.date===x.date); const net=day.reduce((a,y)=>a+y.amt,0);
    html+=`<div class="led-day"><span>${dmy(x.date)}</span><span style="color:${net>=0?'var(--green)':'var(--red)'}">${net>=0?'+':''}${fmt0(net)}</span></div>`; }
    const inc=x.amt>=0;
    html+=`<div class="led" style="${x.pending?'opacity:.5':''}"><div class="ic" style="background:${inc?'var(--green-dim)':'var(--red-dim)'};color:${inc?'var(--green)':'var(--red)'}">${inc?'＋':'－'}</div>
      <div class="m"><div class="t">${esc(x.cat||x.desc||'—')}${x.manual?'':'<span class="badge">⚙自動</span>'}${x.pending?'<span class="badge">…</span>':''}</div>
      <div class="s">${esc([x.name,x.desc,(x.status&&x.status!=='已收'?x.status:'')].filter(Boolean).join(' · '))||' '}</div></div>
      <div class="a" style="color:${inc?'var(--green)':'var(--red)'}">${inc?'+':''}${fmt0(x.amt)}</div>
      ${(x.manual&&!x.pending&&x.id&&x.id!=='(pending)')?`<button class="vd" onclick="voidEntry('${x.t}','${esc(x.id)}')" title="作廢">✕</button>`:''}</div>`; });
  $('app').innerHTML=html+'</div>'+fabHtml();
}
async function voidEntry(t,id){ if(!confirm('確定作廢呢筆？（會保留審計記錄）')) return;
  const action=t==='ex'?'acctExpenseVoid':'acctIncomeVoid';
  if(t==='ex') DATA.expense=(DATA.expense||[]).filter(x=>x.id!==id); else DATA.income=(DATA.income||[]).filter(x=>x.id!==id);
  renderApp();
  let r=null; for(let i=0;i<3;i++){ try{ const res=await fetch(CFG.API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,acctPass:FP,id})}); const tt=(await res.text()).trim(); if(tt.startsWith('{')){ r=JSON.parse(tt); if(r.ok) break; } }catch(e){} await new Promise(x=>setTimeout(x,700)); }
  toast(r&&r.ok?'已作廢':'作廢失敗，刷新後再試'); if(!(r&&r.ok)) refresh();
}
function logout(){ FP=''; DATA=null; VIEW='dash'; try{ sessionStorage.removeItem('acct_fp'); }catch(e){} renderLogin(''); }

/* boot */
(function(){ let p=''; try{ p=sessionStorage.getItem('acct_fp')||''; }catch(e){}
  if(p){ FP=p; renderLogin('載入中…'); fetchData(p).then(r=>{ if(r&&r.ok){ DATA=r; renderApp(); } else renderLogin(''); }); }
  else renderLogin('');
})();
</script>
