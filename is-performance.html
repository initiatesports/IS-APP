<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#132a3e">
<link rel="manifest" href="is-performance.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="成長中心">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23132a3e'/%3E%3Cpath d='M22 66 L40 44 L54 56 L78 30' fill='none' stroke='%231BAFBD' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='78' cy='30' r='7' fill='%23c79a3e'/%3E%3C/svg%3E">
<title>INITIATE 成長中心</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23132a3e'/%3E%3Cpath d='M22 66 L40 44 L54 56 L78 30' fill='none' stroke='%231BAFBD' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='78' cy='30' r='7' fill='%23c79a3e'/%3E%3C/svg%3E">
<style>
/* ============ INITIATE 成長中心 — 專業運動表現 / 體測 / 報告平台 ============ */
:root{
  --navy:#132a3e; --navy2:#1c3d59; --teal:#1BAFBD; --teal-d:#0f8996; --teal-dd:#0b6b75;
  --ink:#1e2a30; --mut:#6d7c84; --line:#e3eaed; --line2:#eef3f5;
  --bg:#f4f7f8; --panel:#ffffff; --wash:#f4f9fa; --wash2:#eef6f7;
  --gold:#c79a3e; --gold-w:#faf4e6; --up:#1f9d6b; --up-w:#e9f7f0; --down:#d0533f; --flat:#9aa4a9;
  --sh-sm:0 1px 2px rgba(19,42,62,.06),0 1px 3px rgba(19,42,62,.05);
  --sh:0 2px 8px rgba(19,42,62,.07),0 8px 28px rgba(19,42,62,.06);
  --sh-lg:0 10px 40px rgba(19,42,62,.14);
  --r:14px; --r-sm:10px; --r-lg:20px;
  --sans:"PingFang HK","Noto Sans HK","Microsoft JhengHei",-apple-system,system-ui,sans-serif;
  --nav-w:236px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:15px;color:var(--ink)}
a{color:var(--teal-d);text-decoration:none}
/* 基準：任何冇明確尺寸嘅 inline 圖示 = 文字大小（更明確嘅 .nav a svg / .kpi .ic svg 及 inline style 會覆蓋）*/
svg{width:1em;height:1em;flex:none}
.mut svg{vertical-align:-.15em;margin-right:4px}
.btn svg{width:1.05em;height:1.05em;vertical-align:-.15em}
.tnum{font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#cfdae0;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#b7c6ce}

/* ---------- LOGIN ---------- */
#login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1200px 700px at 30% -10%,#1c3d59,#0e2233 60%,#0a1a28);padding:24px}
.login-card{width:100%;max-width:390px;background:rgba(255,255,255,.98);border-radius:var(--r-lg);
  box-shadow:0 30px 80px rgba(0,0,0,.4);padding:38px 34px 30px;text-align:center;animation:pop .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.login-logo{width:60px;height:60px;margin:0 auto 16px;display:block}
.login-card h1{font-size:22px;font-weight:800;color:var(--navy);letter-spacing:.5px}
.login-card .sub{font-size:12.5px;color:var(--mut);margin:6px 0 24px;letter-spacing:2px;text-transform:uppercase;font-weight:700}
.login-card .lede{font-size:13.5px;color:var(--mut);margin-bottom:20px;line-height:1.6}
.field{position:relative;margin-bottom:14px;text-align:left}
.field input{width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:var(--r-sm);
  background:#fbfdfe;transition:.15s;font-size:16px}
.field input:focus{outline:none;border-color:var(--teal);background:#fff;box-shadow:0 0 0 4px rgba(27,175,189,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:var(--r-sm);
  font-weight:700;font-size:15px;transition:.15s;white-space:nowrap}
.btn-primary{background:linear-gradient(120deg,var(--teal),var(--teal-d));color:#fff;box-shadow:0 4px 14px rgba(15,137,150,.3);width:100%}
.btn-primary:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn-primary:active{transform:none}
.login-err{color:var(--down);font-size:13px;margin-top:12px;min-height:18px;font-weight:600}

/* ---------- APP SHELL ---------- */
#app{display:none;height:100%}
.shell{display:grid;grid-template-columns:var(--nav-w) 1fr;height:100%}
/* sidebar */
.side{background:linear-gradient(180deg,var(--navy),#0f2536);color:#e8eef2;display:flex;flex-direction:column;
  padding:20px 14px;position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 20px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:14px}
.brand svg{width:34px;height:34px;flex:none}
.brand .bt{font-size:15.5px;font-weight:800;letter-spacing:.3px;line-height:1.15}
.brand .bt small{display:block;font-size:9.5px;letter-spacing:2.5px;color:#7fd3dc;font-weight:700;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:3px;flex:1}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:11px;color:#b9c7d1;
  font-weight:600;font-size:14.5px;transition:.14s;position:relative}
.nav a svg{width:20px;height:20px;flex:none;stroke-width:1.9}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:linear-gradient(120deg,rgba(27,175,189,.22),rgba(27,175,189,.1));color:#fff}
.nav a.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--teal)}
.side-foot{border-top:1px solid rgba(255,255,255,.08);padding-top:12px;margin-top:8px;font-size:11px;color:#7c8b96}
.side-foot button{color:#9fb0bb;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px;padding:8px;width:100%;border-radius:9px}
.side-foot button:hover{background:rgba(255,255,255,.06);color:#fff}
.side-foot button svg{width:17px;height:17px}
/* main */
.main{overflow-y:auto;overflow-x:hidden;position:relative}
.topbar{position:sticky;top:0;z-index:15;background:rgba(244,247,248,.86);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:16px 30px;display:flex;align-items:center;gap:16px}
.topbar h2{font-size:20px;font-weight:800;color:var(--navy);letter-spacing:.2px}
.topbar .crumb{font-size:12.5px;color:var(--mut);font-weight:600}
.topbar .sp{flex:1}
.sync{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--mut);
  padding:7px 12px;background:#fff;border:1px solid var(--line);border-radius:20px}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--flat)}
.sync.ok .dot{background:var(--up)}.sync.ok{color:var(--up)}
.sync.load .dot{background:var(--gold);animation:pulse 1s infinite}.sync.load{color:var(--gold)}
.sync.err .dot{background:var(--down)}.sync.err{color:var(--down)}
@keyframes pulse{50%{opacity:.35}}
.view{padding:26px 30px 60px;max-width:1240px;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- COMMON UI ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-sm)}
.card-pad{padding:20px 22px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.sec-h h3{font-size:16px;font-weight:800;color:var(--navy)}
.sec-h .ic{width:30px;height:30px;border-radius:9px;background:var(--wash);display:grid;place-items:center;color:var(--teal-d)}
.sec-h .ic svg{width:18px;height:18px;stroke-width:2}
.sec-h .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--wash);color:var(--teal-dd)}
.pill.gold{background:var(--gold-w);color:var(--gold)}
.pill.up{background:var(--up-w);color:var(--up)}
.grid{display:grid;gap:16px}
.kpi-row{grid-template-columns:repeat(4,1fr)}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh-sm);position:relative;overflow:hidden}
.kpi .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;margin-bottom:14px}
.kpi .ic svg{width:21px;height:21px;stroke-width:2}
.kpi .n{font-size:30px;font-weight:800;color:var(--navy);letter-spacing:-.5px;line-height:1}
.kpi .n small{font-size:14px;font-weight:700;color:var(--mut);margin-left:3px}
.kpi .l{font-size:12.5px;color:var(--mut);font-weight:600;margin-top:6px}
.kpi .tr{position:absolute;top:16px;right:16px;font-size:11.5px;font-weight:700}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;
  padding:9px 12px;border-bottom:2px solid var(--line)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line2);font-size:14px}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:.1s}
.tbl tbody tr:hover{background:var(--wash)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;padding:2px 7px;border-radius:7px;font-variant-numeric:tabular-nums}
.chip.up{background:var(--up-w);color:var(--up)}.chip.down{background:#fdeeeb;color:var(--down)}.chip.flat{background:#f0f3f4;color:var(--flat)}
.empty{text-align:center;padding:50px 20px;color:var(--mut)}
.empty svg{width:46px;height:46px;stroke-width:1.5;color:#c3d0d7;margin-bottom:12px}
.empty .t{font-weight:700;color:var(--ink);font-size:15px;margin-bottom:4px}
.avatar{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--teal),var(--teal-d));
  color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.search{position:relative;flex:none}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--mut)}
.search input{padding:9px 14px 9px 35px;border:1.5px solid var(--line);border-radius:20px;background:#fff;width:230px;font-size:14px;transition:.15s}
.search input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(27,175,189,.1)}
.btn-sm{padding:8px 14px;font-size:13.5px;border-radius:9px}
.btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink);font-weight:600}
.btn-ghost:hover{border-color:var(--teal);color:var(--teal-d)}
.btn-teal{background:var(--teal-d);color:#fff;font-weight:700}.btn-teal:hover{background:var(--teal-dd)}
.seg{display:inline-flex;background:#eef3f5;border-radius:10px;padding:3px;gap:2px}
.seg button{padding:7px 14px;font-size:13px;font-weight:700;color:var(--mut);border-radius:8px;transition:.12s}
.seg button.on{background:#fff;color:var(--navy);box-shadow:var(--sh-sm)}

/* toast */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);z-index:200;
  background:var(--navy);color:#fff;padding:13px 22px;border-radius:12px;font-weight:600;font-size:14px;
  box-shadow:var(--sh-lg);opacity:0;transition:.3s;display:flex;align-items:center;gap:10px;pointer-events:none}
#toast.show{transform:translateX(-50%);opacity:1}
#toast.ok{background:#12704a}#toast.err{background:#a5372a}
#toast svg{width:19px;height:19px}

/* modal */
.mask{position:fixed;inset:0;z-index:150;background:rgba:19,42,62,.55;background:rgba(19,42,62,.5);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;padding:20px;animation:fade .2s}
.mask.show{display:flex}
.modal{background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-lg);width:100%;max-width:440px;
  max-height:90vh;overflow:auto;animation:pop .3s}
.modal-h{padding:22px 24px 0;display:flex;align-items:center;gap:12px}
.modal-h h3{font-size:18px;font-weight:800;color:var(--navy);flex:1}
.modal-h .x{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--mut);background:#f2f5f6}
.modal-h .x:hover{background:#e6ebed;color:var(--ink)}
.modal-b{padding:20px 24px 24px}
.lbl{font-size:12.5px;font-weight:700;color:var(--mut);margin-bottom:6px;display:block}
.inp{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:#fbfdfe;font-size:15px;transition:.15s}
.inp:focus{outline:none;border-color:var(--teal);background:#fff;box-shadow:0 0 0 3px rgba(27,175,189,.1)}

/* loading skeleton */
.skel{background:linear-gradient(90deg,#eef3f5 25%,#f6f9fa 50%,#eef3f5 75%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:8px}
@keyframes sh{to{background-position:-200% 0}}

@media (max-width:900px){
  :root{--nav-w:0px}
  .side{position:fixed;left:0;top:0;bottom:0;width:236px;transform:translateX(-100%);transition:.25s;box-shadow:var(--sh-lg)}
  .side.open{transform:none}
  .shell{grid-template-columns:1fr}
  .kpi-row{grid-template-columns:repeat(2,1fr)}
  .view{padding:18px 16px 50px}.topbar{padding:14px 16px}
  .menu-btn{display:grid!important}
  .search input{width:150px}
}
.menu-btn{display:none;width:38px;height:38px;border-radius:10px;place-items:center;background:#fff;border:1px solid var(--line);color:var(--navy)}
.menu-btn svg{width:20px;height:20px}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <div class="login-card">
    <svg class="login-logo" viewBox="0 0 100 100"><rect width="100" height="100" rx="24" fill="#132a3e"/><path d="M22 66 L40 44 L54 56 L78 30" fill="none" stroke="#1BAFBD" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="78" cy="30" r="7" fill="#c79a3e"/></svg>
    <h1>成長中心</h1>
    <div class="sub">Athlete Growth Platform</div>
    <div class="lede">學生成績、體測數據與成長報告<br>統一專業管理平台</div>
    <form id="loginForm" autocomplete="off">
      <div class="field"><input type="password" id="pw" placeholder="教練密碼" autocomplete="current-password"></div>
      <button class="btn btn-primary" type="submit" id="loginBtn">登入</button>
    </form>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="shell">
    <aside class="side" id="side">
      <div class="brand">
        <svg viewBox="0 0 100 100"><rect width="100" height="100" rx="24" fill="#0f2536"/><path d="M22 66 L40 44 L54 56 L78 30" fill="none" stroke="#1BAFBD" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="78" cy="30" r="7" fill="#c79a3e"/></svg>
        <div class="bt">成長中心<small>INITIATE SPORTS</small></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <button id="reloadBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/></svg>重新載入雲端</button>
        <button id="logoutBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>登出</button>
        <div style="padding:8px;font-size:10.5px;line-height:1.5">資料即時同步 IS App Data<br>每次寫入自動備份</div>
      </div>
    </aside>
    <main class="main" id="main">
      <div class="topbar">
        <button class="menu-btn" id="menuBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
        <div><h2 id="pageTitle">概覽</h2></div>
        <div class="sp"></div>
        <div class="sync" id="sync"><span class="dot"></span><span id="syncTxt">已同步</span></div>
      </div>
      <div class="view" id="view"></div>
    </main>
  </div>
</div>

<div id="toast"></div>
<div class="mask" id="mask"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   INITIATE 成長中心 — 前端(單檔)。後端 = #11 parent-portal（現有 /exec，唔改）。
   零數據流失：全份資料常駐記憶體，改動後永遠送「完整資料集」畀 save_*（full-replace
   +後端寫前自動備份+空值防呆+鎖序列化）。零回歸：唔掂後端/其他前端，純新增一頁。
   ═══════════════════════════════════════════════════════════════════════ */
const API='https://script.google.com/macros/s/AKfycbxzzac6FfgGka9220y26AqbCkN4AIMsFwCqB_G-X6tN0-5gzcBIQ60mAU4j-8npduEB/exec';
const APP_VERSION='growth-2026-08-24-v3';
let CP='';                       // 教練密碼（記憶體 + sessionStorage，唔硬寫）
let DATA=null;                   // {performance:[], body:[], settings:[], ...} 原始 load
let PERF={};                     // {name:{metricId:[{date,val,v1,v2,v3}]}}
let BODY={};                     // {name:[{date,height,weight}]}
let SETTINGS={};                 // key→parsed value
let PHOTOS={};                   // name→dataURI
let ROSTER=[];                   // 學生中文名（去重排序）
let CLASSMAP={};                 // name→[cid] （由 settings class_*_students）

/* ---------- Metric 設定（14 項，對齊教練 app 操作命名；全部↑=越大越好）----------
   dual=多次嘗試(v1/v2/v3,val取最佳)。rope2m 依老闆定名「1分鐘跳繩」。 */
const METRICS={
  rope30:{lab:'30秒前繩', short:'前繩', u:'次', grp:'rope', dual:true, leg:'30秒內前繩跳次數 — 速度耐力'},
  bike:  {lab:'30秒單車步', short:'單車', u:'次', grp:'rope', dual:true, leg:'踏單車式擺動跳 — 節奏協調'},
  double:{lab:'二重跳',   short:'二重', u:'次', grp:'rope', dual:true, leg:'一跳過繩兩次 — 爆發力與協調'},
  cross: {lab:'交叉開',   short:'交叉', u:'次', grp:'rope', dual:true, leg:'交叉手臂跳繩 — 協調技術'},
  rope2m:{lab:'1分鐘跳繩', short:'1分鐘', u:'次', grp:'rope', leg:'1 分鐘連續跳 — 心肺耐力'},
  bike2m:{lab:'2分鐘單車步', short:'2分單車', u:'次', grp:'rope', leg:'2 分鐘連續單車步 — 耐力'},
  sj:    {lab:'立定跳遠', short:'跳遠', u:'cm', grp:'fit', leg:'原地雙腳跳遠 — 下肢爆發力'},
  cmj:   {lab:'立定跳高', short:'跳高', u:'cm', grp:'fit', leg:'原地向上跳（CMJ）— 彈跳力'},
  gripR: {lab:'手握力（右）', short:'握右', u:'kg', grp:'fit', leg:'右手最大握力 — 上肢力量'},
  gripL: {lab:'手握力（左）', short:'握左', u:'kg', grp:'fit', leg:'左手最大握力 — 上肢力量'},
  sitreach:{lab:'坐地前伸', short:'前伸', u:'cm', grp:'fit', leg:'坐地體前伸 — 柔軟度'},

/* 把 load 結果正規化成 PERF/BODY/SETTINGS */
function ingest(r){
  PERF={}; BODY={}; SETTINGS={}; PHOTOS={}; CLASSMAP={};
  (r.performance||[]).forEach(x=>{
    const n=String(x.name||'').trim(), m=String(x.metricId||'').trim(); if(!n||!m)return;
    (PERF[n]=PERF[n]||{}); (PERF[n][m]=PERF[n][m]||[]);
    PERF[n][m].push({date:String(x.date||''),val:num(x.val),
      v1:x.v1===''||x.v1==null?null:num(x.v1), v2:x.v2===''||x.v2==null?null:num(x.v2), v3:x.v3===''||x.v3==null?null:num(x.v3)});
  });
  (r.body||[]).forEach(x=>{
    const n=String(x.name||'').trim(); if(!n)return;
    (BODY[n]=BODY[n]||[]).push({date:String(x.date||''),height:num(x.height),weight:num(x.weight)});
  });
  (r.settings||[]).forEach(x=>{
    const k=String(x.key||'');let v=x.value;try{v=JSON.parse(x.value);}catch(e){}
    SETTINGS[k]=v;
    if(k.indexOf('photo_')===0 && k!=='photo_index'){const nm=k.slice(6);if(typeof x.value==='string'&&x.value.indexOf('data:')===0)PHOTOS[nm]=x.value;}
  });
  // 班別 map
  Object.keys(SETTINGS).forEach(k=>{const m=k.match(/^class_(c\d+)_students$/);if(m){let arr=SETTINGS[k];if(Array.isArray(arr))arr.forEach(nm=>{(CLASSMAP[nm]=CLASSMAP[nm]||[]).push(m[1]);});}});
  // 排序每個 series（date asc）+ 去同日重複(取 max)
  Object.keys(PERF).forEach(n=>Object.keys(PERF[n]).forEach(m=>{PERF[n][m]=dedupeSeries(PERF[n][m]);}));
  Object.keys(BODY).forEach(n=>{BODY[n].sort((a,b)=>a.date.localeCompare(b.date));});
  // 學生名冊（perf ∪ body ∪ 班別）
  const set=new Set([...Object.keys(PERF),...Object.keys(BODY)]);
  Object.values(SETTINGS).forEach(()=>{}); Object.keys(CLASSMAP).forEach(n=>set.add(n));
  ROSTER=[...set].filter(Boolean).sort((a,b)=>a.localeCompare(b,'zh-HK'));
}
function dedupeSeries(arr){
  const byDate={};
  arr.forEach(r=>{const d=r.date;if(!byDate[d]||(r.val!=null&&r.val>byDate[d].val))byDate[d]=r;});
  return Object.values(byDate).sort((a,b)=>a.date.localeCompare(b.date));
}
function saveLocal(){try{localStorage.setItem('growth_cache',JSON.stringify({t:Date.now(),data:DATA}));}catch(e){}}

/* ---------- 離線寫入佇列（弱網/斷網照記錄，回網自動同步）---------- */
let PENDING=[];try{PENDING=JSON.parse(localStorage.getItem('growth_pending')||'[]');}catch(e){PENDING=[];}

async function syncOrQueue(action,data){
  try{const r=await apiPost({action,coachPass:CP,data});if(!r||r.ok===false)throw new Error((r&&r.error)||'儲存失敗');
    return {ok:true,r};}
  catch(e){PENDING.push({action,data});savePending();return {ok:false,queued:true,err:e.message};}
}
async function flushPending(){
  if(!PENDING.length||!navigator.onLine||!CP)return 0;
  let done=0;
  while(PENDING.length){const item=PENDING[0];
    try{const r=await apiPost({action:item.action,coachPass:CP,data:item.data});if(r&&r.ok!==false){PENDING.shift();done++;}else break;}
    catch(e){break;}}
  savePending();
  if(done){toast('已同步 '+done+' 項離線記錄','ok');setSync('ok','已同步');}
  return done;
}
window.addEventListener('online',()=>{toast('已重新連線，同步中…');flushPending();});

/* 安全增量寫入（後端 perf_upsert/body_upsert：鎖內讀最新→改指定行→零覆蓋）。
   deltas=[{name,metricId,date,val,v1,v2,v3}] / [{name,date,height,weight}]。同步更新本地。 */
async function upsertPerf(deltas){
  if(!deltas.length)return;
  setSync('load','儲存中…');
  // 先更新本地（樂觀），課堂輸入即時反映
  deltas.forEach(d=>{(PERF[d.name]=PERF[d.name]||{});(PERF[d.name][d.metricId]=PERF[d.name][d.metricId]||[]);
    const arr=PERF[d.name][d.metricId];const i=arr.findIndex(x=>x.date===d.date);
    const rec={date:d.date,val:num(d.val),v1:d.v1!=null?num(d.v1):null,v2:d.v2!=null?num(d.v2):null,v3:d.v3!=null?num(d.v3):null};
    if(i>=0)arr[i]=rec;else arr.push(rec);PERF[d.name][d.metricId]=dedupeSeries(arr);
    if(ROSTER.indexOf(d.name)<0){ROSTER.push(d.name);ROSTER.sort((a,b)=>a.localeCompare(b,'zh-HK'));}});
  saveLocal();
  const res=await syncOrQueue('perf_upsert',deltas);
  if(res.ok)setSync('ok','已儲存 '+new Date().toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit'}));
  else updateSyncBadge();
  return res;
}
async function upsertBody(deltas){
  if(!deltas.length)return;
  setSync('load','儲存中…');
  deltas.forEach(d=>{(BODY[d.name]=BODY[d.name]||[]);const arr=BODY[d.name];const i=arr.findIndex(x=>x.date===d.date);
    const rec={date:d.date,height:d.height!=null?num(d.height):null,weight:d.weight!=null?num(d.weight):null};
    if(i>=0)arr[i]=rec;else arr.push(rec);arr.sort((a,b)=>a.date.localeCompare(b.date));
    if(ROSTER.indexOf(d.name)<0){ROSTER.push(d.name);ROSTER.sort((a,b)=>a.localeCompare(b,'zh-HK'));}});
  saveLocal();
  const res=await syncOrQueue('body_upsert',deltas);
  if(res.ok)setSync('ok','已儲存 '+new Date().toLocaleTimeString('zh-HK',{hour:'2-digit',minute:'2-digit'}));
  else updateSyncBadge();
  return res;
}

/* 班別 */
function classLabel(cid){
  const dz=SETTINGS['class_'+cid+'_dayZh']||'', tm=SETTINGS['class_'+cid+'_time']||'';
  return (dz||cid)+(tm?(' '+tm):'');

/* ═══════════════════ 分析工具 ═══════════════════ */
function series(name,metric){return (PERF[name]&&PERF[name][metric])?PERF[name][metric].filter(r=>r.val!=null):[];}
function bodySeries(name){return (BODY[name]||[]).filter(r=>r.height!=null||r.weight!=null);}
function pb(name,metric){const s=series(name,metric);return s.length?Math.max(...s.map(r=>r.val)):null;}
function latest(name,metric){const s=series(name,metric);return s.length?s[s.length-1]:null;}
function first(name,metric){const s=series(name,metric);return s.length?s[0]:null;}
function improvePct(name,metric){const s=series(name,metric);if(s.length<2)return null;const d=s[s.length-1].val-s[0].val;if(s[0].val===0)return null;return Math.round(d/s[0].val*100);}
function studentMetrics(name){return METRIC_ORDER.filter(m=>series(name,m).length>0);}
function hasAnyData(name){return studentMetrics(name).length>0||bodySeries(name).length>0;}
/* 全體某 metric 最新排行 */
function leaderboard(metric){
  return ROSTER.map(n=>{const l=latest(n,metric);return l?{name:n,val:l.val,date:l.date,pbHit:l.val>=pb(n,metric)}:null;})
    .filter(Boolean).sort((a,b)=>b.val-a.val);
}
/* 成長評級（跟報告：正向 %-mean）*/
function gradeFor(name){
  const imps=[];
  ['rope30','bike','cross','double','rope2m','sj','cmj'].forEach(m=>{const p=improvePct(name,m);if(p!=null&&p>0)imps.push(p);});
  const avg=imps.length?Math.round(imps.reduce((a,b)=>a+b,0)/imps.length):0;
  let grade='B',stars=3;
  if(avg>=40){grade='A';stars=5;}else if(avg>=25){grade='A';stars=4;}
  else if(avg>=15){grade='A-';stars=4;}else if(avg>=8){grade='B+';stars=3;}
  return {grade,stars,avg};
}
function nPB(name){let c=0;studentMetrics(name).forEach(m=>{const s=series(name,m);if(s.length>=2&&s[s.length-1].val>=Math.max(...s.map(r=>r.val)))c++;});return c;}
/* 同齡（同出生年）對比 */
function birthYear(name){const y=(SETTINGS['student_years']||{})[name];return y?Number(y):null;}
function ageOf(name){const y=birthYear(name);return y?(new Date().getFullYear()-y):null;}
function cohortStat(name,metric){
  const y=birthYear(name);if(!y)return null;
  const v=pb(name,metric);if(v==null)return null;
  const peers=ROSTER.filter(n=>birthYear(n)===y).map(n=>({n,v:pb(n,metric)})).filter(x=>x.v!=null).sort((a,b)=>b.v-a.v);
  const total=peers.length;if(total<3)return {age:new Date().getFullYear()-y,total,rank:peers.findIndex(x=>x.n===name)+1,pct:null,small:true};
  const rank=peers.findIndex(x=>x.n===name)+1;
  return {age:new Date().getFullYear()-y,total,rank,pct:Math.round((1-(rank-1)/total)*100),small:false};
}
function cohortBadge(name,metric){const c=cohortStat(name,metric);if(!c)return '';
  if(c.small)return `<span class="pill" title="同齡樣本少（${c.total}人）">同齡 ${c.rank}/${c.total}</span>`;
  const topPct=Math.max(1,Math.round(c.rank/c.total*100));
  const cls=topPct<=25?'gold':(topPct<=50?'up':'');
  const label=c.rank===1?'同齡第一 🥇':('同齡前 '+topPct+'%');
  return `<span class="pill ${cls}" title="${c.age}歲組 · 第 ${c.rank}/${c.total}">${label}</span>`;
}

/* ═══════════════════ 圖表引擎（純 SVG，無依賴）═══════════════════ */
function svgLine(pts,o){ // pts=[[label,val]]
  o=o||{};const W=o.w||280,H=o.h||120,pl=30,pr=14,pt=14,pb=22;
  if(!pts.length)return '';
  const vals=pts.map(p=>p[1]);let mn=Math.min(...vals),mx=Math.max(...vals);
  if(o.goal!=null){mx=Math.max(mx,o.goal);}
  if(mn===mx){mn=mn-1;mx=mx+1;}const pad=(mx-mn)*0.15;mn-=pad;mx+=pad;if(o.zero&&mn>0)mn=0;
  const iw=W-pl-pr,ih=H-pt-pb;
  const X=i=>pl+(pts.length===1?iw/2:iw*i/(pts.length-1));
  const Y=v=>pt+ih-ih*(v-mn)/(mx-mn);
  let grid='';for(let g=0;g<=3;g++){const yv=mn+(mx-mn)*g/3,y=Y(yv);grid+=`<line x1="${pl}" y1="${y.toFixed(1)}" x2="${W-pr}" y2="${y.toFixed(1)}" stroke="#eef3f5"/><text x="${pl-5}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="8.5" fill="#9aa4a9">${round(yv,mx-mn<8?1:0)}</text>`;}
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p[1]).toFixed(1)}`).join('');
  const area=line+`L${X(pts.length-1).toFixed(1)},${(pt+ih).toFixed(1)}L${X(0).toFixed(1)},${(pt+ih).toFixed(1)}Z`;
  let goalLine='';if(o.goal!=null){const gy=Y(o.goal);goalLine=`<line x1="${pl}" y1="${gy.toFixed(1)}" x2="${W-pr}" y2="${gy.toFixed(1)}" stroke="#c79a3e" stroke-width="1.3" stroke-dasharray="4 3"/><text x="${W-pr}" y="${(gy-4).toFixed(1)}" text-anchor="end" font-size="8.5" fill="#c79a3e" font-weight="700">目標 ${o.goal}</text>`;}
  const dots=pts.map((p,i)=>{const last=i===pts.length-1;return `<circle cx="${X(i).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="${last?4:3}" fill="${last?'#c79a3e':'#0f8996'}"/>`+(o.labels!==false?`<text x="${X(i).toFixed(1)}" y="${(Y(p[1])-8).toFixed(1)}" text-anchor="middle" font-size="9" font-weight="700" fill="${last?'#c79a3e':'#0f8996'}">${p[1]}</text>`:'');}).join('');
  const xlab=pts.map((p,i)=>`<text x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="8.5" fill="#9aa4a9">${esc(p[0])}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${grid}${goalLine}<path d="${area}" fill="rgba(27,175,189,.1)"/><path d="${line}" fill="none" stroke="#0f8996" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xlab}</svg>`;
}
function spark(values){if(!values.length)return '';const mx=Math.max(...values,1);return '<span style="display:inline-flex;align-items:flex-end;gap:2px;height:22px">'+values.map((v,i)=>{const h=Math.max(4,Math.round(v/mx*22)),last=i===values.length-1;return `<i style="width:5px;height:${h}px;border-radius:1.5px;background:${last?'#0f8996':'#bfe4e8'};display:inline-block"></i>`;}).join('')+'</span>';}
function radarSVG(axes){ // axes=[{label,first,last,max}]
  const n=axes.length,C=95,R=66;if(n<3)return '';
  const ang=i=>-Math.PI/2+2*Math.PI*i/n;
  const pt=(i,r)=>[C+r*Math.cos(ang(i)),C+r*Math.sin(ang(i))];
  let rings='';for(let g=1;g<=3;g++){const r=R*g/3;rings+=`<polygon points="${axes.map((a,i)=>pt(i,r).map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="#e3eaed"/>`;}
  let spokes='',labels='';axes.forEach((a,i)=>{const[x,y]=pt(i,R);spokes+=`<line x1="${C}" y1="${C}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e3eaed"/>`;const[lx,ly]=pt(i,R+15);labels+=`<text x="${lx.toFixed(1)}" y="${(ly+3).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6d7c84">${esc(a.label)}</text>`;});
  const poly=(key,color,fill,dash)=>{const pts=axes.map((a,i)=>{const v=a[key]==null?0:Math.max(.08,a[key]/(a.max||1));return pt(i,R*Math.min(1,v));});return `<polygon points="${pts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="${fill}" stroke="${color}" stroke-width="2" ${dash?'stroke-dasharray="4 3"':''}/>`;};
  const hasFirst=axes.some(a=>a.first!=null);
  return `<svg viewBox="0 0 190 190" style="width:100%;max-width:220px;height:auto;display:block;margin:0 auto">${rings}${spokes}${hasFirst?poly('first','#c2ccd2','rgba(0,0,0,0)',true):''}${poly('last','#1BAFBD','rgba(27,175,189,.16)')}${labels}</svg>`;
}

async function saveCT(){
  const isBody=CT_METRIC==='height'||CT_METRIC==='weight';
  const entries=Object.entries(CT_STAGED).filter(([n,v])=>v!==''&&!isNaN(parseFloat(v)));
  if(!entries.length)return;
  const btn=$('#ctSave');btn.disabled=true;btn.innerHTML='儲存中…';
  try{
    const pbCount=entries.filter(([n,v])=>{if(isBody)return false;const s=series(n,CT_METRIC).filter(r=>r.date!==CT_DATE);const best=s.length?Math.max(...s.map(r=>r.val)):null;return best==null||parseFloat(v)>best;}).length;
    let res;
    if(isBody){
      const deltas=entries.map(([n,v])=>{const ex=(BODY[n]||[]).find(r=>r.date===CT_DATE)||{};return {name:n,date:CT_DATE,height:CT_METRIC==='height'?parseFloat(v):(ex.height!=null?ex.height:''),weight:CT_METRIC==='weight'?parseFloat(v):(ex.weight!=null?ex.weight:'')};});
      res=await upsertBody(deltas);
    }else{
      const deltas=entries.map(([n,v])=>({name:n,metricId:CT_METRIC,date:CT_DATE,val:parseFloat(v)}));
      res=await upsertPerf(deltas);
    }
    if(res&&res.queued)toast('已記錄 '+entries.length+' 項（離線，回網自動同步）','ok');
    else toast('已儲存 '+entries.length+' 項'+(pbCount?('，'+pbCount+' 人破紀錄 🎉'):''),'ok');
    CT_STAGED={};renderCTBody();
  }catch(e){toast('儲存失敗：'+e.message,'err');}
  btn.disabled=false;btn.innerHTML=ico('check')+'儲存全部';
}

/* 清理成績表同人同項目同日重複行（保留最佳值）*/
async function dedupePerf(){
  const raw=(DATA&&DATA.performance)||[];const groups={};
  raw.forEach(x=>{if(!x.name||!x.metricId||!x.date)return;const k=x.name+'|'+x.metricId+'|'+x.date;(groups[k]=groups[k]||[]).push(num(x.val));});
  const dups=Object.entries(groups).filter(([k,vs])=>vs.length>1);
  if(!dups.length){toast('冇重複紀錄','ok');return;}
  if(!confirm('偵測到 '+dups.length+' 組重複紀錄（同人同項目同日多條），清理後每組只保留最佳值。確定？'))return;
  const delKeys=[],ups=[];
  dups.forEach(([k,vs])=>{const p=k.split('|');delKeys.push({name:p[0],metricId:p[1],date:p[2]});ups.push({name:p[0],metricId:p[1],date:p[2],val:Math.max(...vs.filter(v=>v!=null))});});
  try{setSync('load','清理中…');await apiPost({action:'perf_delete',coachPass:CP,data:delKeys});await apiPost({action:'perf_upsert',coachPass:CP,data:ups});await loadCloud();go(CUR);toast('已清理 '+dups.length+' 組重複','ok');}catch(e){toast('清理失敗：'+e.message,'err');}
}

/* ═══════════════════ B. 成就徽章（前端推算，唔寫#11）═══════════════════ */
const BADGE_DEFS=[
  {id:'cohort1',name:'同齡第一',emoji:'👑',desc:'有項目同齡排名第一'},
  {id:'pb',name:'破個人最佳',emoji:'🏅',desc:'最近測試刷新個人最佳'},
  {id:'streak',name:'連續進步',emoji:'🔥',desc:'有項目連續進步'},
  {id:'century',name:'跳繩百下',emoji:'💯',desc:'30秒前繩達 100+'},
  {id:'allround',name:'全能之星',emoji:'⭐',desc:'5 個以上項目有紀錄'},
  {id:'gradeA',name:'A級成長',emoji:'🎓',desc:'綜合成長評級 A'},
];
function badgeIds(name){
  const out=[];
  if(studentMetrics(name).some(m=>{const c=cohortStat(name,m);return c&&!c.small&&c.rank===1;}))out.push('cohort1');
  if(studentMetrics(name).some(m=>{const s=series(name,m);return s.length>=2&&s[s.length-1].val>=Math.max(...s.map(r=>r.val));}))out.push('pb');
  if(studentMetrics(name).some(m=>{const s=series(name,m);if(s.length<3)return false;let k=0;for(let i=s.length-1;i>0;i--){if(s[i].val>s[i-1].val)k++;else break;}return k>=2;}))out.push('streak');
  if((pb(name,'rope30')||0)>=100)out.push('century');
  if(studentMetrics(name).length>=5)out.push('allround');
  if(gradeFor(name).grade.charAt(0)==='A')out.push('gradeA');
  return out;
}
function badgesFor(name){return badgeIds(name).map(id=>BADGE_DEFS.find(b=>b.id===id)).filter(Boolean);}

/* ═══════════════════ C. 智能教練提示 ═══════════════════ */
function insights(){
  const approach=[],plateau=[],untested=[];
  const cut=(()=>{const d=new Date();d.setDate(d.getDate()-75);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})();
  ROSTER.filter(hasAnyData).forEach(n=>{
    studentMetrics(n).forEach(m=>{const s=series(n,m);
      if(s.length>=2){const best=Math.max(...s.map(r=>r.val)),l=s[s.length-1].val;if(l<best&&l>=best*0.95)approach.push({name:n,metric:m,latest:l,best,gap:round(best-l,1)});}
      if(s.length>=3){const l=s[s.length-1].val,p=s[s.length-3].val;if(l<=p)plateau.push({name:n,metric:m,latest:l,prev:p,date:s[s.length-1].date});}
    });
  });
  activeClasses().forEach(c=>classStudents(c).forEach(n=>{const s=series(n,'rope30');const last=s.length?s[s.length-1].date:null;if(!last||last<cut)untested.push({name:n,cid:c,last});}));
  approach.sort((a,b)=>a.gap-b.gap);
  return {approach,plateau,untested};
}

/* ═══════════════════ A. WhatsApp 成績卡（canvas 生成，可分享）═══════════════════ */
function loadImg(src){return new Promise(res=>{if(!src){res(null);return;}const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src;});}
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
async function makeCard(name,metric){
  const W=1080,H=1350,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  const F="'PingFang HK','Noto Sans HK','Microsoft JhengHei',sans-serif";
  const mt=METRICS[metric]||{lab:metric,u:''};const s=series(name,metric);
  const l=s.length?s[s.length-1].val:null,best=s.length?Math.max(...s.map(r=>r.val)):null;
  const prev=s.length>=2?s[s.length-2].val:null,delta=prev!=null&&l!=null?round(l-prev,1):null;
  const isPB=l!=null&&best!=null&&l>=best;const co=cohortStat(name,metric);
  x.fillStyle='#eef2f4';x.fillRect(0,0,W,H);
  // 頂 navy
  const g=x.createLinearGradient(0,0,W,360);g.addColorStop(0,'#132a3e');g.addColorStop(1,'#1c3d59');x.fillStyle=g;x.fillRect(0,0,W,360);
  // logo
  x.fillStyle='#0f2536';rr(x,64,60,84,84,20);x.fill();x.strokeStyle='#1BAFBD';x.lineWidth=11;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(86,124);x.lineTo(102,106);x.lineTo(114,116);x.lineTo(134,92);x.stroke();x.fillStyle='#c79a3e';x.beginPath();x.arc(134,92,7,0,7);x.fill();
  x.fillStyle='#9fe4ec';x.font='700 30px '+F;x.textBaseline='alphabetic';x.fillText('INITIATE SPORTS',170,100);
  x.fillStyle='#fff';x.font='800 40px '+F;x.fillText('成績報告卡',170,148);
  x.fillStyle='#c5dbe4';x.font='500 26px '+F;x.textAlign='right';x.fillText(dmy(s.length?s[s.length-1].date:todayISO()),W-64,110);x.textAlign='left';
  // 學生相 + 名
  const img=await loadImg(PHOTOS[name]);const cx=150,cy=470,cr=92;
  x.save();x.beginPath();x.arc(cx,cy,cr,0,7);x.closePath();x.clip();
  if(img){const ar=Math.max((cr*2)/img.width,(cr*2)/img.height);x.drawImage(img,cx-img.width*ar/2,cy-img.height*ar/2,img.width*ar,img.height*ar);}
  else{x.fillStyle='#1BAFBD';x.fillRect(cx-cr,cy-cr,cr*2,cr*2);x.fillStyle='#fff';x.font='800 90px '+F;x.textAlign='center';x.textBaseline='middle';x.fillText(initials(name),cx,cy);x.textAlign='left';x.textBaseline='alphabetic';}
  x.restore();x.lineWidth=6;x.strokeStyle='#fff';x.beginPath();x.arc(cx,cy,cr,0,7);x.stroke();
  x.fillStyle='#132a3e';x.font='800 60px '+F;x.fillText(name,270,455);
  x.fillStyle='#6d7c84';x.font='500 30px '+F;x.fillText((ageOf(name)!=null?ageOf(name)+'歲 · ':'')+((CLASSMAP[name]||[]).map(classLabel)[0]||'INITIATE SPORTS'),272,500);
  // 主成績卡
  rr(x,64,600,W-128,300,28);x.fillStyle='#fff';x.fill();
  x.fillStyle='#6d7c84';x.font='700 34px '+F;x.fillText(mt.lab,110,672);
  if(isPB){x.fillStyle='#c79a3e';rr(x,W-320,632,240,58,29);x.fill();x.fillStyle='#fff';x.font='800 30px '+F;x.textAlign='center';x.fillText('🏅 個人最佳',W-200,671);x.textAlign='left';}
  x.fillStyle='#132a3e';x.font='800 170px '+F;const numTxt=l!=null?String(l):'—';x.fillText(numTxt,104,840);const numW=x.measureText(numTxt).width;
  x.fillStyle='#9aa4a9';x.font='600 46px '+F;x.fillText(mt.u,104+numW+22,838);
  // delta + cohort（右下）
  let ry=730;x.textAlign='right';
  if(delta!=null){x.fillStyle=delta>0?'#1f9d6b':(delta<0?'#d0533f':'#9aa4a9');x.font='800 44px '+F;x.fillText((delta>0?'▲ +':delta<0?'▼ ':'')+delta+' 較上次',W-110,ry);ry+=58;}
  if(best!=null){x.fillStyle='#c79a3e';x.font='700 36px '+F;x.fillText('個人最佳 '+best,W-110,ry);ry+=52;}
  if(co&&!co.small){x.fillStyle='#0f8996';x.font='700 34px '+F;x.fillText(co.rank===1?'同齡第一 👑':'同齡前 '+Math.max(1,Math.round(co.rank/co.total*100))+'%',W-110,ry);}
  x.textAlign='left';
  // 徽章
  const bs=badgesFor(name).slice(0,6);
  if(bs.length){x.fillStyle='#6d7c84';x.font='700 30px '+F;x.fillText('本年成就',64,990);
    bs.forEach((b,i)=>{const bx=64+i*168;rr(x,bx,1010,152,120,20);x.fillStyle='#fff';x.fill();x.strokeStyle='#e3eaed';x.lineWidth=2;x.stroke();
      x.font='54px '+F;x.textAlign='center';x.fillText(b.emoji,bx+76,1072);x.fillStyle='#6d7c84';x.font='700 20px '+F;x.fillText(b.name,bx+76,1108);x.textAlign='left';});}
  // 頁尾
  x.fillStyle='#132a3e';rr(x,0,H-120,W,120,0);x.fill();
  x.fillStyle='#fff';x.font='800 30px '+F;x.fillText('AIM HIGH · JUMP HIGH',64,H-58);
  x.fillStyle='#9fe4ec';x.font='500 26px '+F;x.textAlign='right';x.fillText('www.initiatesportshk.com',W-64,H-58);x.textAlign='left';
  return cv;
}
async function shareCard(name,metric){
  if(!series(name,metric).length){toast('呢個學生喺呢個項目未有紀錄','err');return;}
  toast('生成成績卡中…');
  try{const cv=await makeCard(name,metric);
    cv.toBlob(async blob=>{
      const file=new File([blob],name+'_'+(METRICS[metric]?METRICS[metric].short:metric)+'_成績卡.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name+' 成績卡'});return;}catch(e){}}
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;document.body.appendChild(a);a.click();a.remove();
      toast('已儲存成績卡，可分享去 WhatsApp','ok');
    },'image/png');
  }catch(e){toast('生成失敗：'+e.message,'err');}
}
function pickCardMetric(name){
  const mets=studentMetrics(name);if(!mets.length){toast('未有成績','err');return;}
  openModal(`<div class="modal-h"><h3>${esc(name)} · 成績卡</h3><button class="x" onclick="closeModal()">${ico('x')}</button></div>
    <div class="modal-b"><label class="lbl">揀項目生成卡片</label><div style="display:flex;flex-wrap:wrap;gap:8px">${mets.map(m=>`<button class="chipbtn" onclick="closeModal();shareCard('${esc(name)}','${m}')">${esc(METRICS[m].short)}</button>`).join('')}</div>
    <div class="mut" style="font-size:12px;margin-top:14px">生成後可直接分享去 WhatsApp（手機）或儲存圖片。</div></div>
    <style>.chipbtn{padding:9px 15px;font-size:14px;font-weight:700;color:var(--mut);background:#eef3f5;border-radius:9px}.chipbtn:hover{background:var(--teal-d);color:#fff}</style>`);
}

/* ═══════════════════ 啟動 ═══════════════════ */
async function boot(){
  buildNav();
  $('#app').style.display='block';$('#login').style.display='none';
  if(loadLocal()){go('dash');setSync('ok','已載入快取');}
  if(PENDING.length){await flushPending();}          // 上次離線未同步 → 先補交
  try{await loadCloud();go(CUR);}catch(e){
    if(PENDING.length){setSync('err','待同步 '+PENDING.length+' 項');}
    else{setSync('err','離線（用快取）');}
    if(!DATA)toast('雲端載入失敗：'+e.message,'err');go(CUR);}
  updateSyncBadge();
}
$('#loginForm').onsubmit=async e=>{
  e.preventDefault();const pw=$('#pw').value.trim();if(!pw)return;
  const btn=$('#loginBtn');btn.textContent='驗證中…';$('#loginErr').textContent='';
  const ok=await verifyPass(pw);
  if(ok){CP=pw;try{localStorage.setItem('growth_cp',pw);}catch(e){}boot();}
  else{$('#loginErr').textContent='密碼錯誤，請重試';btn.textContent='登入';}
};
$('#logoutBtn').onclick=()=>{if(PENDING.length&&!confirm('仲有 '+PENDING.length+' 項未同步，登出會保留喺本機下次補交。確定登出？'))return;CP='';try{localStorage.removeItem('growth_cp');}catch(e){}location.reload();};
$('#reloadBtn').onclick=async()=>{try{await loadCloud();go(CUR);toast('已重新載入','ok');}catch(e){toast('載入失敗','err');}};
$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
$('#mask').onclick=e=>{if(e.target===$('#mask'))closeModal();};
// auto-login if saved pass (localStorage → 課堂唔使次次登入)
(function(){let p=null;try{p=localStorage.getItem('growth_cp')||sessionStorage.getItem('growth_cp');}catch(e){}if(p){CP=p;$('#pw').value='';boot();}})();
// PWA service worker（只 cache 本 app 自己 HTML 作離線開啟；對其他 IS-APP 頁完全透明，唔攔截）
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('is-performance-sw.js').catch(()=>{});});}

/* modal helpers */
function openModal(html){$('#mask').innerHTML='<div class="modal">'+html+'</div>';$('#mask').classList.add('show');}
function closeModal(){$('#mask').classList.remove('show');$('#mask').innerHTML='';}
</script>
