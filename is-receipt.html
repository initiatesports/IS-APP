<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#28B8C8">
<title>INITIATE SPORTS 出收據（教練端）</title>
<style>
:root{ --teal:#28B8C8; --teal-dark:#1F9DAC; --teal-dim:rgba(40,184,200,0.10); --ink:#1f2a30; --mut:#66757c; --line:#e3e9ec; --bg:#f5f8f9; --ok:#1a9e6a; --warn:#c47f00; --err:#c0392b; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:-apple-system,"PingFang HK","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;}
.wrap{max-width:580px;margin:0 auto;padding:16px 14px 60px;}
header.top{display:flex;align-items:center;gap:10px;padding:6px 2px 12px;}
header.top .dot{width:10px;height:10px;border-radius:50%;background:var(--teal);}
header.top h1{font-size:16px;margin:0;font-weight:800;}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:13px;}
.card h2{font-size:15px;margin:0 0 4px;font-weight:800;}
.hint{font-size:12.5px;color:var(--mut);margin:0 0 12px;}
.fld{margin-bottom:11px;} .fld label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:5px;font-weight:600;}
.fld input,.fld textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink);}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--teal);}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:8px 15px;font-size:14px;font-weight:700;cursor:pointer;color:var(--mut);}
.chip.on{background:var(--teal);color:#fff;border-color:var(--teal);}
.irow{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
.irow input.d{flex:1;} .irow input.a{width:110px;}
.irow .del{background:#fdecea;color:var(--err);border:none;border-radius:8px;width:34px;height:40px;font-size:16px;cursor:pointer;flex-shrink:0;}
.addr{background:#fff;color:var(--teal);border:1.5px dashed var(--teal);border-radius:10px;padding:9px;width:100%;font-weight:700;font-size:13px;cursor:pointer;}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:16px;padding:10px 2px 2px;border-top:1px solid var(--line);margin-top:4px;}
.btn{width:100%;background:var(--teal);color:#fff;border:none;border-radius:11px;font-size:15px;font-weight:800;padding:13px;font-family:inherit;cursor:pointer;margin-top:4px;}
.btn:active{background:var(--teal-dark);} .btn:disabled{opacity:.45;}
.btn.ghost{background:#fff;color:var(--teal);border:1.5px solid var(--teal);}
.msg{font-size:13px;padding:9px 11px;border-radius:9px;margin-top:8px;display:none;}
.msg.err{background:#fdecea;color:var(--err);display:block;} .msg.ok{background:#e8f7ef;color:var(--ok);display:block;} .msg.info{background:var(--teal-dim);color:var(--teal-dark);display:block;}
canvas{width:100%;height:170px;border:1.5px dashed var(--line);border-radius:10px;background:#fff;touch-action:none;display:block;}
.foot{text-align:center;color:var(--mut);font-size:11px;padding:14px 0 4px;}
.pvbanner{background:#fff7ed;border:1px solid #fb923c;color:#9a3412;border-radius:11px;padding:10px 13px;font-size:12.5px;margin-bottom:12px;}
.rlist{border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.rrow{padding:10px 13px;border-bottom:1px solid var(--line);font-size:13px;}
.rrow:last-child{border-bottom:none;}
.rrow b{font-weight:800;}
embed,iframe.pv{width:100%;height:420px;border:1px solid var(--line);border-radius:10px;background:#fff;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><span class="dot"></span><h1>INITIATE SPORTS 出收據</h1></header>
  <div id="app"><div class="hint" style="text-align:center;padding:30px">…</div></div>
  <div class="foot" id="foot"></div>
</div>
<script>
const API4='https://script.google.com/macros/s/AKfycbyNhVCIVKrK4QxRf2jS8xWzH-ST-7hkbcqF-zwLjxQN6b-YWnyJW1aDwQlQWwJfgJPS/exec';
const RECEIPT_VERSION='receipt-2026-08-29-v1';
const app=document.getElementById('app');
const PREVIEW=/[?&]preview=1/.test(location.search);
let CP='';
let PAY='現金繳付';
let SIG={cv:null,ctx:null,has:false,px:0,py:0,drawing:false};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
document.getElementById('foot').textContent='版本 '+RECEIPT_VERSION+(PREVIEW?' · 預覽':'');

async function api(action, body){
  if(PREVIEW){
    if(action==='receiptList') return {ok:true,receipts:[{id:'RC260829001',ts:'2026-08-29 11:00',name:'陳大文',items:'私訓10節套票 $5000',total:5000,pay:'銀行過帳',note:'',coach:'INITIATE SPORTS',url:''}]};
    if(action==='receiptCreate') return {ok:false,err:'🔎 預覽模式：唔會真出收據'};
    return {ok:false,err:'預覽'};
  }
  const ac=new AbortController(); const t=setTimeout(()=>ac.abort(),60000);
  try{ const r=await fetch(API4,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain'},body:JSON.stringify(Object.assign({action,coachPass:CP},body||{})),signal:ac.signal});
    clearTimeout(t); return await r.json();
  }catch(e){ clearTimeout(t); return {ok:false,err:'網絡逾時／中斷'}; }
}

function renderLogin(){
  app.innerHTML=`<div class="card"><h2>教練登入</h2><p class="hint">輸入教練密碼即可出收據。</p>
    <div class="fld"><label>教練密碼</label><input id="cp" type="password" placeholder="密碼" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div class="msg" id="lmsg"></div><button class="btn" onclick="doLogin()">登入 →</button></div>`;
}
async function doLogin(){
  CP=(document.getElementById('cp').value||'').trim();
  const m=document.getElementById('lmsg');
  if(!CP){ m.className='msg err'; m.textContent='請輸入密碼'; return; }
  m.className='msg info'; m.textContent='登入中…';
  const r=await api('receiptList',{});
  if(!r||r.ok===false){ m.className='msg err'; m.textContent=(r&&r.err)||'密碼錯誤'; return; }
  renderMain(r.receipts||[]);
}

function renderMain(receipts){
  PAY='現金繳付';
  app.innerHTML=(PREVIEW?`<div class="pvbanner">🔎 <b>預覽模式</b>：唔會真出收據；示範界面。</div>`:'')+`
  <div class="card">
    <h2>🧾 出收據</h2>
    <p class="hint">填收款對象、項目同繳費方式，簽名後生成 PDF，可下載自行 WhatsApp 畀學員。</p>
    <div class="fld"><label>收款對象姓名 *</label><input id="r_name" placeholder="學員／家長姓名"></div>
    <div class="fld"><label>項目及金額 *</label>
      <div id="items"></div>
      <button class="addr" onclick="addItem()">＋ 加多一項</button>
      <div class="tot"><span>總額</span><span id="tot">$0</span></div></div>
    <div class="fld"><label>繳費方式 *</label>
      <div class="chips" id="pay">${['現金繳付','銀行過帳'].map(x=>`<span class="chip ${PAY===x?'on':''}" data-v="${x}">${x}</span>`).join('')}</div></div>
    <div class="fld"><label>日期</label><input id="r_date" type="date" value="${todayISO()}"></div>
    <div class="fld"><label>備註（選填）</label><input id="r_note" placeholder="如：私訓 10 節套票、期數等"></div>
    <div class="fld"><label>收款人簽名 *</label>
      <canvas id="sig"></canvas>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><span class="hint" style="margin:0">喺上面簽名。</span>
        <button class="btn ghost" style="width:auto;padding:6px 12px;font-size:12.5px;margin:0" onclick="clearSig()">清除重簽</button></div></div>
    <div class="msg" id="rmsg"></div>
    <button class="btn" id="genbtn" onclick="genReceipt()">生成收據 PDF</button>
  </div>
  <div id="result"></div>
  ${receipts&&receipts.length?`<div class="card"><h2>🗂️ 最近收據（${receipts.length}）</h2><div class="rlist">${receipts.slice(0,20).map(r=>`<div class="rrow"><b>${esc(r.name)}</b> · $${r.total} · ${esc(r.pay)} <span style="color:var(--mut)">· ${esc(String(r.ts).slice(0,10))} · ${esc(r.id)}</span><br><span style="color:var(--mut)">${esc(r.items)}</span></div>`).join('')}</div></div>`:''}`;
  ITEMS=[]; addItem();
  app.querySelectorAll('#pay .chip').forEach(c=>c.onclick=()=>{ PAY=c.getAttribute('data-v'); app.querySelectorAll('#pay .chip').forEach(x=>x.classList.toggle('on',x.getAttribute('data-v')===PAY)); });
  initSig();
}

let ITEMS=[];
function addItem(){ ITEMS.push({desc:'',amt:''}); drawItems(); }
function delItem(i){ ITEMS.splice(i,1); if(!ITEMS.length) ITEMS.push({desc:'',amt:''}); drawItems(); }
function drawItems(){
  const box=document.getElementById('items'); if(!box) return;
  box.innerHTML=ITEMS.map((it,i)=>`<div class="irow">
    <input class="d" data-i="${i}" data-k="desc" placeholder="項目描述（如：私訓 10 節套票）" value="${esc(it.desc)}">
    <input class="a" data-i="${i}" data-k="amt" inputmode="numeric" placeholder="金額" value="${esc(it.amt)}">
    ${ITEMS.length>1?`<button class="del" onclick="delItem(${i})">✕</button>`:''}</div>`).join('');
  box.querySelectorAll('input').forEach(inp=>inp.oninput=()=>{ const i=+inp.getAttribute('data-i'), k=inp.getAttribute('data-k'); ITEMS[i][k]=inp.value; if(k==='amt') updTot(); });
  updTot();
}
function updTot(){ const t=ITEMS.reduce((s,x)=>s+(Number(x.amt)||0),0); const el=document.getElementById('tot'); if(el) el.textContent='$'+t; }

function initSig(){
  const cv=document.getElementById('sig'); if(!cv) return;
  const rect=cv.getBoundingClientRect(); cv.width=rect.width*2; cv.height=rect.height*2;
  const ctx=cv.getContext('2d'); ctx.scale(2,2); ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.strokeStyle='#1f2a30';
  SIG={cv,ctx,has:false,px:0,py:0,drawing:false};
  const pos=e=>{ const r=cv.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return [t.clientX-r.left, t.clientY-r.top]; };
  const start=e=>{ e.preventDefault(); SIG.drawing=true; [SIG.px,SIG.py]=pos(e); };
  const move=e=>{ if(!SIG.drawing)return; e.preventDefault(); const [x,y]=pos(e); ctx.beginPath(); ctx.moveTo(SIG.px,SIG.py); ctx.lineTo(x,y); ctx.stroke(); [SIG.px,SIG.py]=[x,y]; SIG.has=true; };
  const end=()=>{ SIG.drawing=false; };
  cv.onmousedown=start; cv.onmousemove=move; window.addEventListener('mouseup',end);
  cv.ontouchstart=start; cv.ontouchmove=move; cv.ontouchend=end;
}
function clearSig(){ if(SIG.cv){ SIG.ctx.clearRect(0,0,SIG.cv.width,SIG.cv.height); SIG.has=false; } }

async function genReceipt(){
  const g=id=>(document.getElementById(id).value||'').trim();
  const m=document.getElementById('rmsg'), btn=document.getElementById('genbtn');
  const name=g('r_name');
  const items=ITEMS.map(x=>({desc:(x.desc||'').trim(),amt:Number(x.amt)||0})).filter(x=>x.desc||x.amt>0);
  if(!name){ m.className='msg err'; m.textContent='請填收款對象姓名。'; return; }
  if(!items.length){ m.className='msg err'; m.textContent='請至少填一個項目及金額。'; return; }
  if(!SIG.has){ m.className='msg err'; m.textContent='請喺簽名格簽名。'; return; }
  const sig=SIG.cv.toDataURL('image/png');
  m.className='msg info'; m.textContent='生成中…'; btn.disabled=true; btn.textContent='生成中…';
  const r=await api('receiptCreate',{name,items,payMethod:PAY,date:g('r_date'),note:g('r_note'),signImg:sig});
  btn.disabled=false; btn.textContent='生成收據 PDF';
  if(!r||r.ok===false){ m.className='msg err'; m.textContent=(r&&r.err)||'生成失敗'; return; }
  m.className='msg ok'; m.textContent='收據 '+r.id+' 已生成並存底 ✓（下方可預覽／下載）';
  const dataUri='data:application/pdf;base64,'+r.pdfBase64;
  document.getElementById('result').innerHTML=`<div class="card"><h2>✅ ${esc(r.id)}　$${r.total}</h2>
    <a class="btn" href="${dataUri}" download="${esc(r.filename)}" style="display:block;text-align:center;text-decoration:none">⬇️ 下載 PDF（再 WhatsApp 畀學員）</a>
    <iframe class="pv" src="${dataUri}" style="margin-top:10px"></iframe></div>`;
  document.getElementById('result').scrollIntoView({behavior:'smooth'});
}

if(PREVIEW){ CP='(預覽)'; renderMain([{id:'RC260829001',ts:'2026-08-29',name:'陳大文',items:'私訓10節套票 $5000',total:5000,pay:'銀行過帳',note:'',coach:'',url:''}]); }
else renderLogin();
</script>
</body>
</html>
