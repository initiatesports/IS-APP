<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#28B8C8">
<title>INITIATE SPORTS 恆常班報名</title>
<style>
:root{ --teal:#28B8C8; --teal-dark:#1F9DAC; --teal-dim:rgba(40,184,200,0.10); --ink:#1f2a30; --mut:#66757c; --line:#e3e9ec; --bg:#f5f8f9; --ok:#1a9e6a; --warn:#c47f00; --err:#c0392b; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:-apple-system,"PingFang HK","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 60px;}
header.top{display:flex;align-items:center;gap:10px;padding:6px 2px 14px;}
header.top .dot{width:10px;height:10px;border-radius:50%;background:var(--teal);}
header.top h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.3px;}
header.top .sub{font-size:12px;color:var(--mut);margin-left:auto;}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.03);}
.card h2{font-size:16px;margin:0 0 4px;font-weight:800;}
.card h2 em{font-style:normal;color:var(--teal);}
.card .hint{font-size:12.5px;color:var(--mut);margin:0 0 14px;}
.steps{display:flex;gap:5px;margin:0 0 14px;}
.steps .s{flex:1;height:4px;border-radius:2px;background:var(--line);}
.steps .s.on{background:var(--teal);}
.fld{margin-bottom:12px;}
.fld label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:5px;font-weight:600;}
.fld input,.fld select,.fld textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:11px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink);}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--teal);}
.row2{display:flex;gap:10px;} .row2 .fld{flex:1;}
.btn{width:100%;background:var(--teal);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:800;padding:14px;font-family:inherit;cursor:pointer;margin-top:4px;}
.btn:active{background:var(--teal-dark);} .btn:disabled{opacity:.45;}
.btn.ghost{background:#fff;color:var(--teal);border:1.5px solid var(--teal);}
.btn.sm{padding:10px;font-size:14px;width:auto;}
.navbtns{display:flex;gap:10px;margin-top:6px;} .navbtns .btn{margin-top:0;}
.banner{background:var(--teal-dim);border:1px solid var(--teal);border-radius:12px;padding:12px 14px;font-size:13.5px;color:var(--teal-dark);margin-bottom:14px;font-weight:600;}
.course{display:flex;align-items:flex-start;gap:11px;border:1.5px solid var(--line);border-radius:13px;padding:13px;margin-bottom:10px;cursor:pointer;transition:.12s;}
.course.on{border-color:var(--teal);background:var(--teal-dim);}
.course input{margin-top:3px;width:20px;height:20px;accent-color:var(--teal);flex-shrink:0;}
.course .cn{font-weight:800;font-size:15px;}
.course .cm{font-size:12.5px;color:var(--mut);margin-top:2px;}
.course .cp{margin-left:auto;text-align:right;font-weight:800;color:var(--teal-dark);font-size:14px;white-space:nowrap;}
.quote{border:1.5px solid var(--line);border-radius:13px;overflow:hidden;}
.quote .q{display:flex;justify-content:space-between;padding:11px 14px;font-size:14px;border-bottom:1px solid var(--line);}
.quote .q.dim{color:var(--mut);} .quote .q.credit{color:var(--ok);}
.quote .q.net{font-weight:800;font-size:17px;background:var(--teal-dim);border-bottom:none;}
.pvlist{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px;}
.pvrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px solid var(--line);}
.pvrow:last-child{border-bottom:none;}
.pvk{font-size:12.5px;color:var(--mut);font-weight:600;flex-shrink:0;max-width:42%;}
.pvv{display:flex;align-items:center;gap:8px;flex:1;justify-content:flex-end;text-align:right;min-width:0;}
.pvtext{font-size:14px;font-weight:600;overflow-wrap:anywhere;}
.pvedit{background:none;border:none;color:var(--teal);font-size:12.5px;font-weight:700;cursor:pointer;padding:2px 4px;flex-shrink:0;white-space:nowrap;}
.pvv input,.pvv select{width:100%;padding:8px 10px;border:1.5px solid var(--teal);border-radius:9px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink);}
.cd-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.cd-title{font-size:18px;font-weight:800;color:var(--ink);}
.cd-sum{font-size:13.5px;color:var(--teal-dark);background:var(--teal-dim);border-radius:11px;padding:11px 13px;margin:10px 0 4px;line-height:1.55;font-weight:600;}
.cd-body{margin-top:6px;}
.cd-sec{padding:11px 0;border-bottom:1px solid var(--line);}
.cd-sec:last-child{border-bottom:none;}
.cd-h{font-size:14px;font-weight:800;margin:0 0 6px;color:var(--ink);}
.cd-p{font-size:13px;color:#3a464c;line-height:1.6;margin:0;}
.cd-ul{margin:0;padding-left:18px;}
.cd-ul li{font-size:13px;color:#3a464c;line-height:1.55;margin-bottom:4px;}
.terms{max-height:230px;overflow-y:auto;border:1px solid var(--line);border-radius:11px;padding:12px;font-size:12.5px;color:#3a464c;background:#fafcfc;margin-bottom:12px;}
.terms p{margin:0 0 9px;} .terms p b{color:var(--ink);}
.chk{display:flex;align-items:flex-start;gap:9px;font-size:13.5px;margin-bottom:12px;}
.cbox{border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px;}
.cbox .chk{margin-bottom:0;}
.uopt{display:flex;align-items:flex-start;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;cursor:pointer;}
.uopt.on{border-color:var(--teal);background:var(--teal-dim);}
.uopt input{margin-top:3px;width:18px;height:18px;accent-color:var(--teal);flex-shrink:0;}
.usize{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px;}
.usize button{border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px;font-family:inherit;font-size:12px;cursor:pointer;line-height:1.25;text-align:center;}
.usize button.on{border-color:var(--teal);background:var(--teal-dim);color:var(--teal-dark);font-weight:700;}
.usize button b{display:block;font-size:13px;}
.chk input{width:20px;height:20px;accent-color:var(--teal);margin-top:1px;flex-shrink:0;}
.sumline{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;border-bottom:1px dashed var(--line);}
.sumline .k{color:var(--mut);}
.msg{font-size:13px;padding:10px 12px;border-radius:10px;margin-top:10px;display:none;}
.msg.err{background:#fdecea;color:var(--err);display:block;} .msg.ok{background:#e8f7ef;color:var(--ok);display:block;}
.done{text-align:center;padding:20px 6px;}
.done .big{font-size:44px;} .done h2{margin:8px 0 6px;} .done .rid{font-weight:800;color:var(--teal-dark);font-size:20px;letter-spacing:1px;margin:6px 0;}
.pill{display:inline-block;background:var(--teal-dim);color:var(--teal-dark);font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;margin-left:6px;}
.foot{text-align:center;font-size:11px;color:#9aa7ac;margin-top:18px;}
.socials{display:flex;gap:8px;justify-content:center;margin-top:6px;flex-wrap:wrap;}
.social{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1.5px solid var(--teal);border-radius:20px;color:var(--teal);font-weight:700;font-size:12.5px;text-decoration:none;background:#fff;}
.social:active{background:var(--teal-dim);}
.load{text-align:center;color:var(--mut);padding:40px 0;font-size:14px;}
.jersey{width:100%;max-width:100%;border-radius:12px;border:1px solid var(--line);margin:2px 0 6px;display:block;}
.uchartwrap{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;}
.uchartwrap>summary{font-weight:700;color:var(--teal-dark);cursor:pointer;font-size:13px;list-style:revert;}
.uchartscroll{overflow-x:auto;margin-top:8px;-webkit-overflow-scrolling:touch;}
.uctitle{font-weight:700;font-size:12px;color:var(--teal-dark);margin:8px 0 4px;}
table.uchart{border-collapse:collapse;font-size:11px;min-width:520px;}
table.uchart th,table.uchart td{border:1px solid #dde7e9;padding:4px 6px;text-align:center;white-space:nowrap;}
table.uchart thead th{background:var(--teal);color:#fff;}
table.uchart td.rl{background:var(--teal-dim);color:var(--teal-dark);font-weight:700;text-align:left;position:sticky;left:0;}
</style>
</head>

var COURSE_DETAIL={
  'cf':{summary:'把握 3–6 歲動作發展黃金期，用遊戲為孩子打好一生受用嘅運動根基 —— 移動、穩定、操控三大基礎動作技能。',sections:[{icon:'🎯',h:'課程理念',p:'3 至 6 歲係兒童基礎動作技能（FMS）發展嘅關鍵窗口，亦係公認嘅「動作學習黃金期」。呢個階段大腦同神經系統對動作刺激特別敏感，今日打好嘅根基，會直接影響孩子日後跑、跳、接、投嘅自信同能力。INITIATE 相信運動要由「成功感」同「開心」開始 —— 我哋以遊戲化教學為核心，唔催谷、唔操練，讓幼兒喺玩樂中自然掌握身體素養（physical literacy），愛上郁動，為將來任何一項運動鋪好路。'},{icon:'🔬',h:'運動科學根據：點解 3–6 歲唔可以錯過？',list:['動作黃金期：幼兒神經系統髓鞘化快速發展，呢個階段學到嘅動作模式會刻進「肌肉記憶」，事半功倍','FMS 三大類別：國際公認嘅基礎動作技能分為移動（Locomotor）、穩定（Stability）、操控（Manipulative），係所有專項運動嘅共同地基','LTAD 發展模型：長期運動員發展理論指出，6 歲前應以多元、遊戲化嘅動作經驗為主，太早專項化反而窒礙發展','身體素養（Physical Literacy）：及早建立「識郁、想郁、敢郁」嘅能力同自信，係孩子一生保持活躍嘅最強預測因素','窗口一去不返：基礎動作技能若喺童年冇打好，長大後追返嘅難度會大幅增加']},{icon:'🧩',h:'學員會學到（FMS 三大類動作，循序漸進）',list:['移動技能 Locomotor：跑、跳、單腳跳、雙腳跳、踏步、閃避、爬行','穩定技能 Stability：靜態與動態平衡、轉身、扭動、伸展、定型','操控技能 Manipulative：拋、接、踢、滾、拍、擲等手腳並用動作','身體與空間覺知：上下左右前後、快慢高低，控制自己身體嘅位置','遊戲中嘅規則感：輪流、等待、聽指令、與人合作','對運動嘅正面情感：覺得郁動係開心、好玩、想再嚟']},{icon:'🪜',h:'發展里程碑（依年齡循序推進）',list:['3–4 歲　建立期：穩定站、跑、雙腳原地跳；學識聽從簡單指令，敢於嘗試','4–5 歲　協調期：單腳平衡、連續跳、拋接大球、閃避跑，動作開始有節奏','5–6 歲　整合期：動作組合連貫、手腳並用、接細球、跳過矮障礙，準備銜接專項運動','每位孩子步伐不同，教練按個別發展階段調整，唔比較、唔標籤，只睇自己嘅進步']},{icon:'🌱',h:'對孩子嘅三重成長：身・腦・心',list:['身：協調、平衡、敏捷、肌力全面發展，打好運動根基','腦：專注、聽指令、空間感、動作記憶與反應','心：由完成動作建立自信，敢試敢跌、唔怕失敗，享受群體樂趣']},{icon:'👤',h:'適合對象',list:['3–6 歲幼兒，有冇運動底子都啱','首次接觸結構化運動嘅小朋友','怕醜、唔夠自信、想建立膽量同專注嘅孩子','精力旺盛、需要正面渠道發揮嘅小朋友']},{icon:'⭐',h:'點解揀 INITIATE 幼兒啟蒙',list:['依 FMS 三大類別＋LTAD 原則系統編排，唔係散玩，每個遊戲都有發展目標','師生比例 1:8，4 人成班，教練照顧到每個小朋友嘅發展步伐','PRE & POST 動作發展評估報告，成長用數據睇得見','全程遊戲化設計，孩子玩得開心又自然掌握技能','室內外場地交替，多元環境刺激感官與適應力','唔催谷、唔比較，先建立成功感同運動興趣']},{icon:'❓',h:'家長常見問題',list:['我個小朋友坐唔定／好怕醜，得唔得？—— 正正最啱，課程用遊戲降低門檻，教練專門幫慢熱、怕醜嘅孩子慢慢投入。','3 歲會唔會太細？—— 唔會，呢個階段正正係動作黃金期，我哋按年齡設計難度，安全為先。','冇運動底子跟唔跟到？—— 完全零基礎設計，由最基本郁動開始，唔會落後。','會唔會好悶淨係做操？—— 全程遊戲化，孩子當係玩，但每個遊戲背後都有動作發展目標。']},{icon:'🏫',h:'一堂係點上嘅？',list:['見面熱身：律動、追逐、關節活動，喚醒身體同專注','移動技能站：跑、跳、閃避等遊戲，練 Locomotor','穩定與操控站：平衡、拋接、踢滾等分站輪流玩','綜合遊戲：把動作串成小挑戰或合作遊戲，鞏固所學','放鬆總結：伸展、平復情緒、鼓勵每個小朋友，設下堂小目標']},{icon:'🎬',h:'重點技能點教（以「雙手接球」為例）',list:['動作要領：眼睛望實個球、雙手張開成籃形、球到手時輕輕收緩衝','分解練習：由滾地球接起 → 大球近距離拋接 → 慢慢加距離同縮細個球','常見錯誤 → 糾正：閉埋眼／用身體攔（怕球）→ 先用軟波、大波建立信心，教練近距離慢拋','進階挑戰：邊行邊接、拋高自接、二人互拋、接後即拋出']},{icon:'📈',h:'評估與成長追蹤',list:['PRE & POST 動作發展評估：入學與階段後對照移動、穩定、操控三大範疇','觀察式紀錄：教練記低每個孩子嘅專注、參與同動作質素','影片／相片回饋：畀家長睇得見孩子嘅進步','定期成長報告：用數據同觀察，清楚交代孩子喺邊度進步咗']},{icon:'🏆',h:'學員成就',list:['一屆屆幼兒由怕醜、唔敢郁，變到主動投入、敢於嘗試','系統化 FMS 訓練，見證孩子動作質素同自信逐步提升','打好基礎後順利銜接跳繩、田徑、球類等專項課程']},{icon:'📋',h:'上課安排',list:['師生比例 1:8，4 人成班，小班照顧每個發展步伐','附專屬 PRE & POST 動作發展數據成長報告','室內外場地交替訓練','時間及最新班別歡迎 WhatsApp 6331 7403 查詢']}]},
  'c1':{summary:'由一條繩開始，跳出協調、節奏與自信 —— 香港少數設 14 級章別考核嘅系統化花式跳繩課程。',sections:[{icon:'🎯',h:'課程理念',p:'花式跳繩門檻低、變化無限，一條繩、一個空間就玩得出千變萬化，係少數可以隨時隨地練習嘅運動。INITIATE SPORTS 相信運動應該由「成功感」開始 —— 以由淺入深嘅花式進程，配合音樂、遊戲同團隊合作，讓孩子喺不知不覺間打好基本功，建立對運動嘅長遠興趣同紀律，愈跳愈有自信。'},{icon:'🔬',h:'點解跳繩係小朋友嘅黃金運動？',list:['雙側協調：左右手同步搖繩、雙腳規律起跳，強化左右腦連結與神經肌肉控制','高效帶氧：短時間跳繩已達顯著心肺訓練效果，安全又慳位','骨骼發展：規律彈跳刺激骨質密度，正值成長期嘅孩子尤其受用','大腦活化：節奏、計數、動作編排同步進行，訓練專注力、工作記憶與反應','情緒調節：帶氧運動釋放壓力，好動嘅孩子有正面渠道發揮精力']},{icon:'🧩',h:'學員會學到（三階段循序漸進）',list:['入門：正確握繩與搖繩節奏、雙腳併跳、連續跳與呼吸配合','基礎：開合跳、前後跳、左右跳、單腳交替等步法變化','花式：交叉跳、回環、側擺等手腳協調動作，逐步串連成套路','速度與耐力：限時計次跳、間歇跳，提升心肺與爆發力','進階挑戰：多重跳（雙搖）、組合連招','團體合作：雙人繩、長繩、交互繩等團隊玩法']},{icon:'🌈',h:'彩虹章別成長階梯',p:'課程配合 INITIATE 自家設計嘅 14 級彩虹章別考核制度（Level 1–7 彩虹章 ＋ Level 8–14 進階技術考核）。每一級都有清晰嘅動作與速度指標，孩子睇得見自己嘅進步，學得更有方向同動力；表現出色者更可銜接進階班、參加公開比賽。'},{icon:'🌱',h:'對孩子嘅三重成長：身・腦・心',list:['身：心肺、肌耐力、協調與敏捷全面提升','腦：專注力、節奏感、反應與動作記憶','心：由克服動作建立自信、堅毅同永不放棄嘅態度']},{icon:'👤',h:'適合對象',list:['幼稚園高班至小學階段、想打好運動基礎嘅孩子','好動或精力旺盛、需要正面渠道發揮嘅小朋友','零基礎完全歡迎，由一條繩開始循序漸進']},{icon:'⭐',h:'點解揀 INITIATE 花式跳繩',list:['香港少數設 14 級章別考核嘅系統化課程，升級目標清晰','融入 S&C 體能元素，唔止識跳，更打好全身運動根基','PRE & POST 數據化能力評估，成長睇得見','小班教學、4 人成班，教練因材施教','屢獲比賽佳績，備戰有門路','由淺入深、遊戲化教學，先建立成功感']},{icon:'❓',h:'家長常見問題',list:['冇任何基礎得唔得？—— 完全冇問題，課程專為零基礎孩子由淺入深設計。','跳繩會唔會傷膝頭？—— 教練會教正確落地與緩衝技巧，並融入體能訓練減低受傷風險。','要唔要自備繩？—— 我哋有專業拍子繩／膠繩，亦可 WhatsApp 查詢選購。','考章係點運作？—— 教練定期評估，達標即可升級，孩子有清晰目標。']},{icon:'🏫',h:'一堂係點上嘅？',list:['熱身與繩性遊戲：活動關節、建立節奏感','技術重點：教練示範＋分解，逐個糾正動作','花式進程：由基礎串連到新花式挑戰','體能環節：融入 S&C 力量、速度與協調訓練','放鬆與總結：伸展、覆盤，設定下堂目標']},{icon:'🎬',h:'重點動作點教（以「交叉跳」為例）',list:['動作要領：手腕帶動搖繩、交叉點對準身體中線、保持穩定節奏','分解練習：原地擺繩定位 → 慢速交叉 → 連續交叉','常見錯誤 → 糾正：手臂張太開／繩打腳 → 收窄交叉幅度、放慢搖繩再加速','進階串連：交叉與開合、回環組合成花式套路']},{icon:'📈',h:'評估與成長追蹤',list:['PRE & POST 能力測試：速度、耐力、花式數據化紀錄','影片回饋：拍低動作，等孩子睇得見、改得快','章別考核：達標即升級，進度一目了然','定期成長報告：家長清楚掌握孩子進步']},{icon:'🏆',h:'學員成就',list:['學員屢獲各區及公開賽事佳績','系統化章別制度，見證孩子逐級突破','由「識跳」到考章、參賽，成長路線清晰']},{icon:'📋',h:'上課安排',list:['師生比例 1:12，4 人成班','配合彩虹章別考核計劃，定期評估進度','時間及最新班別歡迎 WhatsApp 6331 7403 查詢']}]},
  'jump-adv':{summary:'比賽導向嘅精英深造訓練 —— 由「識跳」邁向「跳得專、跳得精」。',sections:[{icon:'🎯',h:'課程理念',p:'INITIATE SPORTS 一直致力以專業、系統化嘅方式培養青少年運動員。踏入新學年，我哋喺現有興趣班之上，正式開設花式跳繩進階班，為有志向、有潛質嘅學員提供比賽導向嘅深造訓練，協助佢哋由「識跳」邁向「跳得專、跳得精」。'},{icon:'🆚',h:'進階班同興趣班有咩分別？',p:'興趣班著重培養興趣同基本功；進階班則係精英路線——訓練強度、動作難度同技術要求都會提升，並以參加公開賽事、爭取佳績為目標。'},{icon:'🧩',h:'系統鑽研範疇',list:['速度項目：30 秒、3 分鐘耐力速度，強化步頻與節奏','花式串連（Freestyle）：多搖（雙搖、三搖）、交叉變化、開合、轉體等動作組合與編排','交互繩・車輪（Wheel / Interactions）：雙人及團體高階配合技術','力量與體操元素：融入體操、地板及爆發力動作（如俯撐、倒立、翻騰等），提升動作觀賞性與難度分','雙人、團體及花樣大繩（Double Dutch）：培養默契與臨場協作']},{icon:'✅',h:'入選要求',list:['確保出席率（若入選後經常請假、未能參與訓練，將會移除名額）','30 秒單車步達 40 下或以上','30 秒前繩跳達 95 下或以上','能做到連續二重跳或更高難度的花式','訓練中展現認真學習態度，遵守課堂規則、尊重隊友','對花式跳繩有熱誠、願意投入額外練習','有意參加公開比賽、追求自我突破']},{icon:'⏱',h:'訓練時長',p:'每次訓練 2 小時（後續有機會加至每次 3 小時）。'},{icon:'📋',h:'報名查詢',list:['2026 年 10 月開始（需技術遴選及教練批准）；師生比例 1:12，4 人成班；名額有限','時間及最新班別歡迎 WhatsApp 6331 7403 查詢']}]},
  'c3':{summary:'綜合體能引擎＋田徑專項＋球類共通根基，一次過打好 —— 力量、速度、敏捷、協調、手眼反應樣樣兼顧，直接對接小學體育科呈分試同各類球類運動。',sections:[{icon:'🎯',h:'課程理念',p:'好多家長問：「呢個班係打波定跑步？」答案係 —— 樣樣都幫到手。本課程三條腿走：一係跨運動共通嘅「體能引擎」（力量、速度、敏捷、協調、平衡），二係被譽為「運動之母」嘅田徑專項（跑、跳、擲），三係融入唔同球類嘅共通基礎能力（手眼協調、拋接、追蹤來球、腳步移動、反應變向）。底子打得好，孩子學羽毛球、籃球、匹克球、乒乓、網球都快人一步；跑跳擲技術扎實，再加上球類底層根基，喺小學體育堂同新推行嘅體育科呈分試更加得心應手。一個課程，同時顧好通用底子、田徑技術同球類共通能力。'},{icon:'🔬',h:'運動科學根據',list:['動作 ABC：LTAD 模型指出敏捷（Agility）、平衡（Balance）、協調（Coordination）係 6 歲後身體最適合密集打磨嘅能力，錯過就難補','速度敏捷黃金期：兒童神經系統發展快，呢階段練起步、加速、變向，效率遠高於青春期後','田徑係運動之母：走、跑、跳、擲係幾乎所有運動嘅根基，速度、力量、協調全部由此而來','技能遷移：手眼協調、追蹤來球、腳步變向係跨球類嘅共通底層能力，練好一次，任何一種球類都學得快','唔好太早專項化：先建立全面體能引擎，再談專項，先至行得遠、少受傷','以自身體重為主嘅安全肌力：適齡、循序漸進，建立核心與關節控制，唔傷發育']},{icon:'🎓',h:'對接學校體育科（呈分試）',p:'本課程核心係全面提升孩子嘅體能同運動表現 —— 力量、速度、敏捷、協調、耐力。而由 2026/27 學年起，香港中小學體育科被納入校內呈分評估，體育科考核一般圍繞體能同基本運動動作；換言之，孩子喺呢度打好嘅體適能同運動技能，除咗令日常運動表現更出色，同時亦可以應用喺體育科嘅評估同測試之中，令佢更有信心、更揮灑自如。（我哋只按官方公布嘅大方向理解，唔會就分數比重或考核細節作任何假設，一切以學校最新指引為準。）'},{icon:'🧩',h:'學員會學到（三大板塊，環環相扣）',list:['【綜合體能】力量：自身體重為主嘅安全肌力，建立核心控制','【綜合體能】速度：起步、加速、煞停、變向嘅跑動技巧','【綜合體能】敏捷與協調：快速反應、閃避、手腳並用嘅複合動作','【綜合體能】平衡：靜態與動態平衡，預防受傷','【田徑專項】跑：正確跑姿、擺臂、加速與衝線','【田徑專項】起跑：站立式與蹲踞式起跑，訓練起動爆發','【田徑專項】跳：立定跳遠、跳遠助跑與起跳','【田徑專項】擲：擲球等投擲動作嘅全身發力與協調','【球類基礎】手眼協調：拋接、拍球、目標命中嘅基本控球感','【球類基礎】追蹤來球：判斷來球嘅方向、距離同速度，及早移位','【球類基礎】腳步移動：預備姿勢、側移、上前後撤同變向煞停','【球類基礎】反應變向：聽聲／睇訊號快速起動，模擬球場攻守轉換']},{icon:'🏀',h:'球類共通能力（唔被單一運動定義）',list:['唔綁死一種球：我哋唔係專攻某一項球類，而係練好所有球類都用得着嘅底層能力','手眼協調：拋接、拍擊、擋擊等控球感，係打乒乓、羽毛球、網球嘅共通根基','追蹤與判斷來球：訓練眼睛追波、預判落點，反應快人一步','腳步與重心：預備站姿、快速側移、變向煞停 —— 籃球、匹克球、羽毛球都靠呢套','反應與變向：聽訊號起動、急停轉向，模擬真實比賽嘅攻守節奏','學一種通、種種通：打好共通根基，孩子日後揀邊種球類都上手特別快']},{icon:'🪜',h:'能力進程（由根基到專項應用）',list:['第一階　動作根基：學識正確嘅跑、跳、落地力學，打好安全底子','第二階　體能引擎：力量、速度、敏捷、協調同步提升，動作更有力更快','第三階　專項技術：把體能轉化落田徑跑跳擲，同球類共通嘅手眼、腳步能力','第四階　實戰應用：計時、量距、球類小遊戲挑戰個人紀錄，對接校隊、體育科呈分試同比賽','進程按個人能力推進，教練針對強弱項調整，唔一刀切']},{icon:'🌱',h:'對孩子嘅三重成長：身・腦・心',list:['身：力量、速度、爆發、耐力全面提升，動作質素更佳、受傷更少','腦：反應、判斷、追蹤來球、專注同目標感喺挑戰紀錄中鍛鍊','心：喺突破個人紀錄中培養毅力、自律同永不放棄']},{icon:'👤',h:'適合對象',list:['6 歲或以上、想全面打好運動底子嘅孩子','想為小學體育堂同新推行嘅體育科呈分試提早準備嘅學生','想打好各類球類（籃球／羽毛球／匹克球／乒乓／網球）共通底子嘅小朋友','已玩開某項運動、想加強整體體能同速度嘅小朋友','想為校隊或田徑比賽做準備嘅學生']},{icon:'⭐',h:'點解揀 INITIATE 綜合運動體能＋田徑',list:['體能引擎＋田徑專項＋球類共通能力三合一，通用底子同運動表現兼得','緊貼體育科呈分試大方向備課，幫孩子喺校內體育評估更有信心','融入 S&C 體能訓練，依 LTAD 發展原則編排，安全為先','PRE & POST 體能數據成長報告，進步睇得見','小班教學，針對每個孩子強弱項調整姿勢','鼓勵表現出色學員參與比賽，實戰中成長','室內外場地交替，貼近實戰']},{icon:'❓',h:'家長常見問題',list:['呢個班有冇教跳繩？—— 冇。本課程專注綜合運動體能、田徑同球類共通基礎，唔包括花式跳繩教學；想學跳繩嘅同學，可以報我哋嘅「花式跳繩班」。','同純田徑班有咩分別？—— 我哋除咗教田徑跑跳擲，仲打好背後嘅體能引擎，並融入跨球類嘅手眼、腳步、反應能力，令孩子學任何運動都更快上手、更少受傷。','唔係球類班，點解會練球類？—— 我哋唔專攻單一種球，而係練跨球類共通嘅手眼協調、腳步同反應，令孩子日後學羽毛球、籃球、匹克球等任何一種球都快人一步。','幫唔幫到體育科呈分試？—— 幫到，課程針對體育科核心嘅體適能、跑跳投接同球類基本能力打底；我哋只跟官方大方向，考核細節一律以學校最新指引為準。','細個練肌力會唔會傷身？—— 唔會，全部以自身體重為主、適齡循序漸進，安全第一。','冇運動底子跟唔跟到？—— 課程由基本動作起步，因材施教，零基礎都跟得上。']},{icon:'🏫',h:'一堂係點上嘅？',list:['動態熱身：關節活動、跑姿律動，啟動身體','體能環節：力量、速度、敏捷、協調嘅 S&C 訓練','田徑技術：起跑、跑姿、跳躍或投擲，逐個分解糾正','球類共通練習：拋接、追波、腳步變向嘅趣味小遊戲，打好跨球類反應','專項練習或挑戰：計時、量距，鞏固技術','放鬆總結：伸展、覆盤，設定下堂目標']},{icon:'🎬',h:'重點動作點教（以「加速跑起動」為例）',list:['動作要領：身體前傾、有力擺臂（手肘約九十度）、前腳掌著地、步步加速','分解練習：原地高抬膝擺臂 → 前傾牆壁推撐 → 短距離起動衝刺','常見錯誤 → 糾正：起跑即挺直身、腳跟落地拖慢速度 → 強調前傾角度同前腳掌著地，用標誌桶做起動距離','進階串連：反應起動（聽聲／睇手勢先起）、變向加速、接力交棒 —— 同樣係球場搶位嘅底層能力']},{icon:'📈',h:'評估與成長追蹤',list:['PRE & POST 體能測試：速度、爆發、敏捷、協調數據化紀錄','田徑成績紀錄：短跑計時、立定跳遠量距，對照個人紀錄','球類基礎能力觀察：手眼協調、追球反應、腳步移動嘅進步紀錄','影片回饋：拍低跑跳同控球動作，睇得見、改得快','定期成長報告：家長清楚掌握孩子體能、技術同球類底子進步']},{icon:'🏆',h:'學員成就',list:['喺綜合體能、田徑同球類基礎全面打好底子','系統化訓練，見證孩子速度、爆發同動作質素逐步提升','由打好體能底子到對接校隊、體育科呈分試同各類球類，成長路線清晰']},{icon:'📋',h:'上課安排',list:['師生比例 1:12，4 人成班','新學員入學前作簡單能力評估','時間及最新班別歡迎 WhatsApp 6331 7403 查詢']}]},
  'c2':{summary:'跑、跳、擲，運動之母 —— 以正確技術同安全為先，為孩子打開一生運動嘅大門。',sections:[{icon:'🎯',h:'課程理念',p:'田徑被譽為「運動之母」，因為走、跑、跳、擲係幾乎所有運動嘅根基，速度、力量、協調同平衡都由此而來。INITIATE 以正確姿勢同安全為先，用遊戲化嘅訓練讓孩子掌握最核心嘅基本動作 —— 唔止為田徑打底，更為將來各項運動同體育學習奠定扎實根基。跑得快、跳得遠、擲得準唔係天生，而係練得出。'},{icon:'🔬',h:'運動科學根據',list:['運動之母：跑、跳、擲係人類最基本嘅運動模式，練好呢啲，其他運動都遷移得到','速度與敏捷黃金期：兒童神經發展快，童年練起跑、加速、變向，效率遠高於長大後','爆發力發展：跳躍與投擲訓練刺激快縮肌與神經肌肉協調，建立爆發力','呈分試高度相關：跑、跳項目正正係小學體育課程同呈分試常考內容','安全跑跳落地力學：教正確著地與緩衝，減低生長期關節與軟組織受傷風險']},{icon:'🧩',h:'學員會學到（跑・跳・擲三大範疇）',list:['跑嘅技術：正確跑姿、擺臂、加速與衝線','起跑與反應：站立式／蹲踞式起跑，訓練起動爆發','跳嘅項目：立定跳遠、跳遠助跑與起跳','擲嘅項目：擲球等投擲動作嘅發力與全身協調','體能基礎：敏捷、爆發力、核心穩定與步法','障礙與綜合練習：跨越、急停變向']},{icon:'🪜',h:'能力進程（由基本動作到項目技術）',list:['第一階　基本動作：掌握正確跑姿、擺臂同安全落地','第二階　項目入門：分別學識起跑、跳遠、投擲嘅基本技術','第三階　技術打磨：改善步伐、節奏同發力細節，動作更有效率','第四階　紀錄挑戰：計時、量距，向個人紀錄同校際／公開比賽進發','進程按個人能力推進，教練細心糾正姿勢，唔追速成']},{icon:'🌱',h:'對孩子嘅三重成長：身・腦・心',list:['身：速度、爆發力、肌耐力、協調同平衡全面提升','腦：專注、目標感、節奏與反應喺挑戰紀錄中鍛鍊','心：喺突破個人紀錄中培養毅力、專注同永不放棄']},{icon:'👤',h:'適合對象',list:['小一或以上、想打好體能同運動基礎嘅孩子','喜歡跑跳、精力充沛嘅小朋友','想為校隊或體育呈分試做準備嘅學生','零基礎歡迎，由基本跑跳學起']},{icon:'⭐',h:'點解揀 INITIATE 田徑',list:['涵蓋跑、跳、擲三大範疇，全面而均衡','由基本動作到項目技術，循序漸進，安全為先','融入 S&C 體能元素，唔止練技術，更打好全身根基','PRE & POST 數據化表現評估，成長睇得見','小班教學，教練細心逐個糾正姿勢','鼓勵表現出色學員參與各區及公開比賽，實戰中成長']},{icon:'❓',h:'家長常見問題',list:['冇任何基礎得唔得？—— 完全冇問題，課程由最基本嘅跑跳動作教起。','幫唔幫到呈分試？—— 直接幫到，跑、跳項目正正係呈分試常考內容。','跑跳會唔會容易受傷？—— 教練會教正確落地與緩衝，並融入體能訓練減低受傷風險。','小朋友唔算跑得快，啱唔啱讀？—— 啱，速度係練得出嘅，我哋由技術同體能兩方面幫佢提升。']},{icon:'🏫',h:'一堂係點上嘅？',list:['動態熱身：跑姿律動、關節活動，啟動身體','技術重點：起跑、跑姿、跳躍或投擲，教練示範＋分解','分項練習：逐個項目練習，即時糾正動作','體能環節：融入敏捷、爆發、核心嘅 S&C 訓練','挑戰與總結：計時／量距、伸展覆盤，設下堂目標']},{icon:'🎬',h:'重點動作點教（以「立定跳遠」為例）',list:['動作要領：屈膝下蹲、雙臂向後擺、蹬地同時用力向前上方擺臂、落地屈膝緩衝','分解練習：原地擺臂預備 → 只練起跳騰空 → 加落地緩衝 → 完整連貫','常見錯誤 → 糾正：唔識用手擺（淨用腳）／落地企直撞膝 → 教「手帶身跳」、落地即屈膝軟著陸，用標誌線做目標','進階挑戰：連續立定跳、加距離目標、接助跑跳遠']},{icon:'📈',h:'評估與成長追蹤',list:['PRE & POST 表現測試：短跑計時、立定跳遠量距等數據化紀錄','個人紀錄追蹤：每次量度對照自己過往成績，睇得見進步','影片回饋：拍低跑跳動作，等孩子睇得見、改得快','定期成長報告：家長清楚掌握孩子表現進步']},{icon:'🏆',h:'學員成就',list:['由基本跑跳到掌握田徑技術，逐級打好根基','系統化訓練，見證孩子速度、爆發同技術逐級突破','由基本跑跳到對接校隊、呈分試同比賽，路線清晰']},{icon:'📋',h:'上課安排',list:['師生比例 1:12，4 人成班','時間及最新班別歡迎 WhatsApp 6331 7403 查詢']}]},
  'badminton':{summary:'節奏明快、攻守全面 —— 由握拍到有來有往嘅對打，以系統化技術進程配合數據化評估，帶小朋友一步步打穩羽毛球根基，愈打愈有信心。',sections:[{icon:'🎯',h:'課程理念',p:'羽毛球一拍一步都講求協調、判斷同專注，係公認最啱兒童入門嘅球類運動之一。INITIATE SPORTS 相信技術要由「正確」開始 —— 我哋唔急住叫小朋友大力扣殺，而係先打好握拍、揮拍同步法呢啲底層功夫，再循序漸進帶佢哋進入有來有往嘅對打樂趣。當基本功夠紮實，孩子就會自然享受到「接到、打到、贏到」嘅成功感，愈打愈投入。'},{icon:'🔬',h:'點解羽毛球係小朋友嘅黃金運動？',list:['全身協調：揮拍、跨步、轉腰同蹬地一氣呵成，訓練上下肢與軀幹嘅連動控制','快速反應：羽毛球飛行速度快、球路多變，逼小朋友即時判斷同出手，鍛鍊神經反射','敏捷移位：前後左右不停啟動同煞停，強化腳步、方向轉換同身體控制','心肺耐力：一局波跑跑跳跳，係高效又有趣嘅帶氧運動','空間與判斷力：睇球路、估落點，訓練預判同臨場決策','專注紀律：每一球都要盯實嚟球，長期練習自然培養專注同耐性']},{icon:'🧩',h:'學員會學到（三階段循序漸進）',list:['入門：正確握拍（正手／反手轉換）、基本準備姿勢、原地揮拍定型','基礎：正手高遠球、發高遠球與發短球、上網與後退嘅基本步法','進階擊球：吊球、平抽擋、反手過渡，逐步加入落點控制','步法系統：米字步、交叉步、蹬跨步，練到「腳到手到」','多球餵球：教練連續餵球，密集重複同一動作，快速建立擊球手感','實戰對打：一對一與雙打情境，學走位、補位同攻守轉換']},{icon:'🪜',h:'技術進程里程碑',p:'羽毛球冇章別制度，但我哋為孩子設定清晰嘅「技術進程里程碑」：由第一階段「握對拍、揮到全揮」，到第二階段「發到高遠球、連續對拉唔失手」，再到第三階段「用得出吊球、平抽，識得打落空位」。每個里程碑都有具體、睇得見嘅動作指標，教練會逐項評估，等小朋友清楚知道自己去到邊、下一步練咩，學得更有方向同動力。'},{icon:'🌱',h:'對孩子嘅三重成長：身・腦・心',list:['身：手眼協調、敏捷、心肺與全身協調同步提升','腦：判斷球路、預判落點、臨場應變嘅運動智慧','心：由接到一球到贏到一分，建立自信、抗逆同永不放棄']},{icon:'👤',h:'適合對象',list:['小學一年級或以上、對羽毛球有興趣嘅孩子','零基礎完全歡迎，由握拍與揮拍第一步開始','已有少少底子、想加強步法同實戰對打嘅學員','想提升反應、協調同專注力嘅小朋友']},{icon:'⭐',h:'點解揀 INITIATE 羽毛球',list:['融入 S&C 體能元素，唔止識打波，更打好敏捷、力量同心肺根基','PRE & POST 數據化能力評估，擊球穩定度同體能成長睇得見','多球餵球高密度訓練，同一動作反覆打，手感建立得快','小班教學、4 人成班，教練貼身糾正每個揮拍細節','由正確姿勢入手，減低運動受傷風險','由淺入深、先建立成功感，孩子愈打愈鍾意']},{icon:'❓',h:'家長常見問題',list:['完全冇打過得唔得？—— 得，課程專為零基礎設計，由握拍揮拍逐步教起。','打羽毛球會唔會容易受傷？—— 我哋著重正確姿勢同熱身，並融入體能訓練強化關節與落地控制，大幅降低受傷風險。','要唔要自備球拍？—— 建議自備個人球拍；初學可先用場地公用拍，選購歡迎 WhatsApp 查詢建議。','小朋友好怕醜、唔夠反應快得唔得？—— 小班加多球餵球，每個孩子都有足夠練習量，教練按程度調節，慢慢建立信心。']},{icon:'🏫',h:'一堂係點上嘅？（每節 120 分鐘）',list:['熱身與步法活化：關節活動、米字步腳步遊戲，開啟身體','技術重點：教練示範＋分解，逐個糾正握拍與揮拍','多球餵球：連續餵球密集練習當堂重點擊球','對打應用：把技術帶入一對一或雙打情境','體能環節：融入 S&C 敏捷、力量與協調訓練','放鬆與總結：伸展、覆盤，設定下堂目標']},{icon:'🎬',h:'重點動作點教（以「正手高遠球」為例）',list:['動作要領：側身準備、非持拍手指向嚟球、揮拍時轉腰蹬地、擊球點喺頭頂前上方、擊球後隨勢揮落','分解練習：原地徒手揮拍定型 → 高拋自打感受擊球點 → 教練餵高球連續打','常見錯誤 → 糾正：手臂太僵冇轉腰（球唔夠遠）→ 提醒用腰帶動、放鬆手腕加速；擊球點太低太後 → 提早側身站位、喺頭頂前擊球','進階串連：高遠球接吊球做落點變化，練習「一樣動作、唔同輕重」嘅假動作']},{icon:'📈',h:'評估與成長追蹤',list:['PRE & POST 能力測試：擊球穩定度、步法、敏捷與體能數據化紀錄','技術進程里程碑：逐項評估達標情況，進度一目了然','影片回饋：拍低揮拍與步法，等孩子睇得見、改得快','定期成長報告：家長清楚掌握孩子每階段進步']},{icon:'🏆',h:'學員成就',list:['學員由零基礎到打得出穩定對拉，實戰信心明顯提升','系統化技術里程碑，見證孩子逐階突破','表現出色者可獲教練推薦銜接進階訓練或校隊備戰']},{icon:'📋',h:'上課安排',list:['師生比例 1:6，4 人成班，確保足夠餵球與練習時間','每節 120 分鐘，技術、對打與體能兼備','附技術進程里程碑評估，定期檢視進度','時間及最新班別歡迎 WhatsApp 6331 7403 查詢']}]},
  'gym':{summary:'翻滾、倒立、一字馬 —— 由學識「控制自己身體」開始，用系統化動作進程同數據評估，為孩子打好一生受用嘅運動根基。',sections:[{icon:'🎯',h:'課程理念',p:'基礎體操係所有運動嘅根 —— 一個識得控制自己身體嘅孩子，之後學任何運動都快人一步。INITIATE SPORTS 相信體操唔係表演雜技，而係最扎實嘅「身體教育」：透過翻滾、倒立、平衡同柔韌訓練，幫孩子建立身體覺知、力量同協調，同時喺一次次挑戰動作嘅過程中，培養專注、耐性同勇氣。安全永遠擺第一，我哋只會喺孩子準備好嘅時候，先帶佢去下一步。'},{icon:'🔬',h:'點解體操係小朋友嘅黃金運動？',list:['身體覺知：翻滾、倒立逼孩子感受身體喺空間嘅位置，建立本體感覺','核心力量：幾乎每個體操動作都要用核心穩定身體，練出真正嘅「中軸力量」','柔韌度：成長期關節柔軟，係練一字馬、橋式、壓腿嘅黃金時機','平衡與控制：定型、平衡動作訓練神經肌肉控制，動作更穩更靚','安全落地：學識點樣滾、點樣卸力，跌倒識保護自己，係一生受用嘅能力','專注與勇氣：面對倒立、翻滾要克服恐懼，練成一次就多一分自信']},{icon:'🧩',h:'學員會學到（三階段循序漸進）',list:['入門：安全落地與滾動、前滾翻、後滾翻、基本身體定型','基礎：側手翻、牆邊倒立、橋式、壓腿與柔韌伸展','控制：平衡木行走、單腳站立、定點支撐與靜態定型','核心與力量：爬行、跳躍、撐體等自身體重訓練','柔韌進程：一字馬、大字馬循序漸進，安全拉開幅度','動作串連：把單一動作組合成流暢嘅體操序列']},{icon:'🪜',h:'動作進程',p:'體操冇章別制度，但我哋為每類動作設計咗清晰嘅「動作進程」：以前滾翻為例，由「抱膝滾動感受節奏」→「低頭團身完成前滾翻」→「滾完企返起身唔用手」→「連續前滾翻接其他動作」。倒立、一字馬、側手翻各有自己嘅分階梯級。教練會按孩子實際掌握程度逐級推進，達到一級先解鎖下一級，唔催谷、唔跳步，等每個孩子都喺安全同有成功感嘅前提下進步。'},{icon:'🌱',h:'對孩子嘅三重成長：身・腦・心',list:['身：柔韌、核心、上下肢力量與平衡全面發展','腦：身體覺知、空間感、動作記憶與專注力','心：克服恐懼、勇於嘗試，建立自信同堅毅']},{icon:'👤',h:'適合對象',list:['5 歲或以上、想打好運動基礎嘅孩子','想改善柔韌度、協調或平衡嘅初學者','為其他運動（跳繩、球類、田徑）建立身體底子嘅學員','零基礎完全歡迎，由安全滾動開始學起']},{icon:'⭐',h:'點解揀 INITIATE 體操',list:['融入 S&C 體能元素，柔韌之外更練力量與控制','PRE & POST 數據化能力評估，柔韌與核心進步睇得見','清晰動作進程，逐級解鎖，孩子有明確目標','小班教學、4 人成班，教練貼身保護與糾正','安全至上：完善軟墊、保護輔助與分解教學','正面鼓勵、唔催谷，先建立成功感再挑戰難度']},{icon:'❓',h:'家長常見問題',list:['做體操會唔會好易受傷？—— 安全係我哋首要考慮，全程有軟墊、保護輔助同教練貼身保護，動作亦會拆細一步步教，準備好先進階。','我小朋友身體好硬、完全劈唔到一字馬得唔得？—— 完全冇問題，柔韌係練返嚟嘅，教練會用安全嘅漸進伸展，逐少拉開，唔會夾硬撳。','幾歲可以開始？—— 5 歲或以上就啱，呢個階段關節柔軟、學動作快，係打底嘅好時機。','冇任何底子得唔得？—— 得，課程由最基本嘅安全滾動同身體定型教起，零基礎完全歡迎。']},{icon:'🏫',h:'一堂係點上嘅？',list:['熱身與關節活動：全身活化、柔韌喚醒，預備身體','技術重點：教練示範＋分解，逐個保護同糾正動作','動作進程：由當前級數挑戰下一個梯級','核心與力量：融入 S&C 撐體、爬行、跳躍訓練','柔韌環節：安全漸進伸展，逐少拉開幅度','放鬆與總結：伸展、覆盤，設定下堂目標']},{icon:'🎬',h:'重點動作點教（以「前滾翻」為例）',list:['動作要領：蹲低、雙手撐地、低頭收下巴、後腦唔掂地、以後頸到背嘅弧線滾動、抱膝團身順勢企起','分解練習：抱膝前後滾動感受節奏 → 斜墊上完成前滾翻 → 平地前滾翻 → 滾完唔用手企身','常見錯誤 → 糾正：頭頂直接撳落地（頸唔安全）→ 強調收下巴、用後頸滾；身體散唔團身（滾唔起身）→ 提醒抱實膝頭、團緊個身','進階串連：連續前滾翻，或前滾翻接跳起定型，練習動作之間嘅流暢銜接']},{icon:'📈',h:'評估與成長追蹤',list:['PRE & POST 能力測試：柔韌度、核心力量、平衡與動作質素數據化紀錄','動作進程評估：逐個動作紀錄達到嘅梯級，進度清晰','影片回饋：拍低動作，等孩子睇得見自己嘅線條同進步','定期成長報告：家長清楚掌握孩子每階段成長']},{icon:'🏆',h:'學員成就',list:['學員由怕跌怕倒立，到穩定完成翻滾、倒立與柔韌動作','系統化動作進程，見證孩子逐級突破','紮實嘅身體底子，成為孩子日後學各類運動嘅本錢']},{icon:'📋',h:'上課安排',list:['師生比例 1:8，4 人成班，確保安全保護與個別指導','完善軟墊與保護輔助，安全至上','附動作進程評估，定期檢視柔韌與核心進度','時間及最新班別歡迎 WhatsApp 6331 7403 查詢']}]},
  'pickleball':{summary:'羽毛球、乒乓球同網球嘅精華合體 —— 球速慢、規則易上手，小朋友幾堂就對打得起，喺策略同落點之中愈打愈醒目。',sections:[{icon:'🎯',h:'課程理念',p:'匹克球（Pickleball）用輕巧球拍同帶孔膠球，喺較細嘅場地上進行，球速比網球慢、彈跳可控，係全球增長最快嘅運動之一。INITIATE SPORTS 揀匹克球做入門球類，正正因為佢「低門檻、高天花」—— 孩子唔使好大力氣就打得到波，好快建立成功感；但要打得叻，就要學識控制落點、讀對手、同拍檔走位，係一項「用腦多過用蠻力」嘅運動。我哋由持拍手感開始，循序漸進帶孩子由「掂到波」去到「有來有往嘅對打」，喺樂趣中打好協調、判斷同運動禮儀。'},{icon:'🔬',h:'點解匹克球適合小朋友？',list:['球速慢、反應窗口長：初學者有足夠時間判斷來球、調整腳步，成功率高，唔易挫敗','手眼協調：追蹤來球、對準拍面、控制力度一氣呵成，強化視覺與神經肌肉連結','細場地、多變向：頻繁嘅起動、煞停、側移訓練敏捷度同下肢控制','策略思維：落點、節奏、廚房區站位涉及即時決策，訓練專注力同判斷','雙打社交：大部分以雙打進行，孩子要同拍檔溝通、補位、輪流上手，培養合作同禮讓']},{icon:'🧩',h:'學員會學到（三階段循序漸進）',list:['入門：認識球拍、膠球同場地，掌握基本握拍、拍面控制同「掂到波、送到位」嘅手感','基礎：下手發球與接發球、正手與反手落地擊球、學識「雙彈規則」（發球同接發球各要先落地一次）','控制：截擊（Volley）、輕擋放小球（Dink）、控制落點深淺，開始理解快慢節奏轉換','策略：廚房區（非截擊區，近網約兩米內不可截擊）嘅站位同過渡、雙打分工同補位','實戰：計分對打、模擬比賽情境，學識選擇進攻定過渡、讀對手空位']},{icon:'🪜',h:'技術進程里程碑',p:'匹克球冇章別制度，但我哋為孩子設定清晰嘅「技術進程里程碑」：由第一階段「掂到波、穩定送球過網」，到第二階段「發球接發都入界、能連續對打唔失手」，再到第三階段「識得放小球、控落點、識廚房區站位同雙打補位」。每個里程碑都有具體、睇得見嘅指標，教練逐項評估，等孩子清楚知道自己去到邊、下一步練咩，學得更有方向同動力。'},{icon:'🌱',h:'對孩子嘅三重成長：身・腦・心',list:['身：手眼協調、敏捷、心肺同下肢控制全面提升','腦：落點判斷、節奏掌握、臨場決策同專注力','心：由成功感建立自信，由雙打學識溝通、合作同運動禮儀']},{icon:'👤',h:'適合對象',list:['小一或以上、對新興球類有興趣嘅孩子','想試一項易上手、有策略性、又唔會太劇烈嘅運動','零基礎完全歡迎，幾堂內就掌握到基本對打','已玩開羽毛球或乒乓，想擴闊球類技術嘅學員']},{icon:'⭐',h:'點解揀 INITIATE 匹克球',list:['專為兒童設計嘅循序進程，由手感到對打逐步建立，唔急功','融入 S&C 體能元素：敏捷、煞停、核心穩定同時練，唔止識打波','PRE & POST 數據化評估，控球、發球、對打表現睇得見進步','小班教學、4 人成班，教練逐個手把手糾正拍面同腳步','重點拆解廚房區等核心規則，孩子唔止識打，仲識點解咁打','以雙打對打為主，趣味互動，建立團隊同社交']},{icon:'❓',h:'家長常見問題',list:['完全冇打過波得唔得？—— 得，匹克球正正以易上手見稱，球速慢、場地細，零基礎孩子通常幾堂內就對打得起。','同羽毛球、網球有咩分別？—— 場地更細、球速更慢、用膠球同短拍，規則簡單啲，對力量要求低，特別適合初學嘅小朋友。','要唔要自備球拍？—— 建議自備個人球拍；初學可先用場地公用器材，選購歡迎 WhatsApp 查詢建議。','會唔會好劇烈、容易受傷？—— 匹克球屬中低衝擊運動，加上我哋每堂有熱身同體能環節教正確煞停落地，受傷風險相對低。']},{icon:'🏫',h:'一堂係點上嘅？',list:['熱身與敏捷遊戲：活動關節、練起動同煞停，建立球感','技術重點：教練示範＋分解，逐個糾正握拍、拍面同腳步','餵球練習：教練多球餵送，密集練同一動作，快速建立肌肉記憶','規則與策略：帶入廚房區、雙彈規則同走位，喺情境中理解','對打時段：分組雙打或計分小賽，將所學即場運用','放鬆與總結：伸展、覆盤，設定下堂目標']},{icon:'🎬',h:'重點動作點教（以「下手發球」為例）',list:['動作要領：接觸點喺腰部以下、拍頭低於手腕，由下而上向斜前方送球，過網並落入對角發球區','分解練習：先定點托球感受拍面 → 慢速下手送球過網 → 加入落點目標（深近底線）','常見錯誤 → 糾正：接觸點過高（犯規）→ 提醒拍頭與手腕位置、放慢確認；力度過大出界 → 收力、用「送」多過「打」，先求穩定過網','進階：控制發球深淺與左右落點，逼對手退後，為之後上網搶廚房區線製造優勢']},{icon:'📈',h:'評估與成長追蹤',list:['PRE & POST 能力測試：控球、發球成功率、對打回合數數據化紀錄','影片回饋：拍低動作，等孩子睇得見拍面同腳步問題，改得快','技術進程檢視：發球、正反手、截擊、廚房區走位逐項評估','定期成長報告：家長清楚掌握孩子進步同下階段目標']},{icon:'🏆',h:'學員成就',list:['學員由零基礎到能穩定對打，享受一項全新運動嘅樂趣','部分學員將匹克球技術遷移到羽毛球、網球等其他球類','系統化進程，見證孩子由手感到策略逐步突破']},{icon:'📋',h:'上課安排',list:['可自組班別・4 人起即可成班（未設固定恆常時段，歡迎組班）','師生比例 1:6，確保足夠觸球同指導時間','由手感、規則到雙打對打，循序漸進，定期評估進度','時間及最新班別歡迎 WhatsApp 6331 7403 查詢']}]},
  'tt':{summary:'公認最鍛鍊大腦同反射神經嘅運動 —— 由握拍到快速來回對打，喺零點幾秒之間練出專注、判斷同手眼協調。',sections:[{icon:'🎯',h:'課程理念',p:'乒乓球講求瞬間反應，來球速度快、旋轉變化多，係公認最能鍛鍊大腦同反射神經嘅運動之一。INITIATE SPORTS 相信技術要建基於正確動作，所以我哋由握拍、站位同揮拍軌跡開始打好根基，透過大量多球餵球建立穩定手感，再循序漸進帶孩子進入快速來回嘅對打樂趣。喺安全、有趣、由淺入深嘅環境中，孩子唔止學識打波，更練出專注、冷靜同臨場判斷。'},{icon:'🔬',h:'點解乒乓球係小朋友嘅腦力運動？',list:['極速反應：來球往往喺零點幾秒內到達，逼大腦同神經系統高速處理，係反射神經嘅絕佳訓練','手眼協調：準確追蹤高速兼帶旋轉嘅來球、對準拍面回擊，強化視覺與精細動作連結','專注與短時記憶：連續回合要記住節奏同對手習慣，訓練持續專注同工作記憶','精細動作控制：手腕同前臂嘅細微調節決定旋轉同落點，鍛鍊小肌肉控制','情緒調節：快節奏中保持冷靜、輸波唔急，培養抗逆同自我管理']},{icon:'🧩',h:'學員會學到（三階段循序漸進）',list:['入門：直拍／橫拍握法、基本站位同準備姿勢，建立正確揮拍軌跡','基礎：正手攻球、反手推擋，配合多球餵球練穩定命中同節奏','發接球：認識上旋、下旋等基本旋轉，學識發球同判斷來球旋轉去接發','步法：併步、跳步等基本移動，練習到位擊球同重心轉換','控制與變化：控制落點深淺左右、快慢節奏轉換，開始有意識調動對手','實戰：對打與計分練習，學習選擇進攻、相持定過渡，讀對手弱點']},{icon:'🪜',h:'技術進程里程碑',p:'乒乓球冇章別制度，但我哋為孩子設定清晰嘅「技術進程里程碑」：由第一階段「握對拍、揮拍定型、正手打得到波」，到第二階段「正手攻同反手推都穩定、能連續對拉唔失手」，再到第三階段「發到旋轉球、接得住發球、識得控落點調動對手」。每個里程碑都有具體、睇得見嘅指標，教練逐項評估，等孩子清楚知道自己去到邊、下一步練咩，學得更有方向同動力。'},{icon:'🌱',h:'對孩子嘅三重成長：身・腦・心',list:['身：手眼協調、精細動作、敏捷同全身連動','腦：反應速度、專注力、旋轉判斷同臨場決策','心：快節奏中保持冷靜，輸贏之間建立抗逆同自信']},{icon:'👤',h:'適合對象',list:['小一或以上、想加強反應同專注力嘅孩子','鍾意快節奏、動腦筋球類運動嘅小朋友','零基礎完全歡迎，由握拍開始學起','想打好正確動作、提升現有水平嘅學員']},{icon:'⭐',h:'點解揀 INITIATE 乒乓球',list:['著重正確動作根基，唔求快、先求對，避免積成難改嘅壞習慣','多球餵球高密度訓練，同一動作大量重複，快速建立肌肉記憶','融入 S&C 體能元素：敏捷、核心同下肢穩定同步練','PRE & POST 數據化評估，攻球命中、對打回合睇得見進步','小班教學、4 人成班，教練逐個糾正握拍、揮拍同步法','由淺入深、著重實戰對打，學以致用，培養比賽感覺']},{icon:'❓',h:'家長常見問題',list:['完全冇基礎得唔得？—— 得，課程專為零基礎孩子由握拍開始由淺入深設計。','乒乓球會唔會好難、好易灰心？—— 我哋用多球餵球先建立成功命中嘅手感，再慢慢加難度，孩子有成功感先有興趣。','要唔要自備球拍？—— 建議自備個人球拍；初學可先用場地公用器材，選購歡迎 WhatsApp 查詢建議。','細路仔玩乒乓有咩好處？—— 除咗運動，佢對反應、專注同手眼協調嘅鍛鍊尤其突出，對學習專注亦有幫助。']},{icon:'🏫',h:'一堂係點上嘅？',list:['熱身與反應遊戲：活動關節、練起動同手眼反應','技術重點：教練示範＋分解，逐個糾正握拍、揮拍同站位','多球餵球：教練連續餵球，密集練同一動作，建立穩定手感','發接球與步法：帶入旋轉判斷同移動，喺練習中理解','對打時段：分組相持或計分小賽，將所學即場運用','放鬆與總結：伸展、覆盤，設定下堂目標']},{icon:'🎬',h:'重點動作點教（以「正手攻球」為例）',list:['動作要領：側身站位、重心由右腳轉向左腳，前臂由腰側向前上方揮出，喺來球上升期擊球，觸球一刻收前臂加速','分解練習：徒手揮拍定型 → 定點多球慢速攻固定落點 → 加快節奏同連續回合','常見錯誤 → 糾正：純用手臂唔轉腰（發力散、易失準）→ 提醒轉腰蹬腿帶動；擊球點太遲（打到下降球，出界或落網）→ 提早準備、喺上升期迎球；拍面過開球飛高 → 微微前傾拍面壓住球','進階：加入落點變化同節奏快慢，練習連續正手相持中調動對手，再過渡到正反手轉換']},{icon:'📈',h:'評估與成長追蹤',list:['PRE & POST 能力測試：攻球命中率、連續對打回合數數據化紀錄','影片回饋：拍低動作，等孩子睇得見揮拍同步法問題，改得快','技術進程檢視：握拍、攻球、推擋、發接球、步法逐項評估','定期成長報告：家長清楚掌握孩子進步同下階段目標']},{icon:'🏆',h:'學員成就',list:['學員由握拍零基礎到能穩定來回對打，享受快節奏樂趣','系統化進程，見證孩子反應同專注力明顯提升','由基本攻推到發接球同步法，成長路線清晰']},{icon:'📋',h:'上課安排',list:['可自組班別・4 人起即可成班（未設固定恆常時段，歡迎組班）','師生比例 1:6，確保足夠球檯時間同個別指導','以多球餵球同實戰對打為主，循序漸進，定期評估進度','時間及最新班別歡迎 WhatsApp 6331 7403 查詢']}]},
  'basketball':{summary:'唔止教「點樣入波」—— 由運球、傳球、投籃到防守同團隊戰術，喺比賽情境中學識閱讀球場、同隊友並肩，打好基本功同運動品格。',sections:[{icon:'🎯',h:'課程理念',p:'籃球係一項結合技術、體能同團隊智慧嘅運動。INITIATE SPORTS 嘅籃球課唔止教孩子「點樣入波」，更著重打好正確基本功 —— 運球、傳接、投籃、防守缺一不可；同時透過大量比賽情境，讓孩子學會閱讀球場、同隊友溝通合作，喺享受運動之餘學識堅持、承擔同尊重對手。我哋深信好嘅基本功同運動品格，比一時嘅勝負更能陪孩子行得遠。'},{icon:'🔬',h:'點解籃球係小朋友嘅全面運動？',list:['多重協調：運球嘅手、走位嘅腳、觀察嘅眼要同時運作，強化全身協調同神經控制','爆發與敏捷：起動、煞停、轉身、彈跳頻繁交替，訓練下肢爆發力同敏捷度','心肺耐力：攻守往返嘅跑動係天然嘅間歇帶氧訓練，提升心肺同耐力','空間與決策：要即時判斷傳球、切入定投籃，訓練空間感、專注同臨場決策','團隊智慧：籃球係五人運動，孩子要學識補位、掩護、輪流上手，培養溝通、合作同領導']},{icon:'🧩',h:'學員會學到（三階段循序漸進）',list:['入門：正確運球姿勢、左右手運球、低運球控制，同基本接球手型','基礎：胸前傳球、地板傳球、傳接時機，正確投籃姿勢（BEEF：平衡、視線、手肘、隨球）','投籃與上籃：定點投籃、罰球姿勢、上籃步法（兩步節奏）同籃下終結','防守基礎：防守站姿、滑步、卡位籃板同一對一防守概念','腳步與身體控制：急停跳投、轉身、變向過人、保護球','戰術意識：透過三對三、五對五小型比賽學走位、掩護、快攻同基本配合']},{icon:'🪜',h:'技術進程里程碑',p:'籃球冇章別制度，但我哋為孩子設定清晰嘅「技術進程里程碑」：由第一階段「運到波唔甩、雙手都控到、傳接得穩」，到第二階段「投籃姿勢正確、定點入到波、行到兩步上籃」，再到第三階段「識防守走位、喺三對三五對五中做到掩護同快攻配合」。每個里程碑都有具體、睇得見嘅指標，教練逐項評估，等孩子清楚知道自己去到邊、下一步練咩，學得更有方向同動力。'},{icon:'🌱',h:'對孩子嘅三重成長：身・腦・心',list:['身：手眼協調、敏捷、爆發力同心肺耐力全面提升','腦：空間感、閱讀球場、臨場判斷同專注','心：團隊合作、溝通、抗逆同承擔，喺勝負中建立品格']},{icon:'👤',h:'適合對象',list:['小一或以上、鍾意球類同團體活動嘅孩子','想打好籃球基本功嘅初學者','希望提升體能、協調、專注同社交嘅學員','零基礎完全歡迎，由運球一步步建立']},{icon:'⭐',h:'點解揀 INITIATE 籃球',list:['重視基本功多過一時勝負，由分解動作到實戰演練，根基打得穩','融入 S&C 體能元素：爆發、敏捷、核心同落地緩衝同步練，減低受傷風險','PRE & POST 數據化評估，運球、投籃、體能表現睇得見進步','比賽情境教學，喺三對三、五對五中吸收戰術，玩樂中學走位','注重運動精神同紀律，培養溝通、合作同尊重對手','教練分工照顧不同程度，因材施教']},{icon:'❓',h:'家長常見問題',list:['完全冇打過籃球得唔得？—— 得，課程由運球等最基本動作開始，零基礎孩子一樣跟得上。','個仔／個女唔夠高，打籃球會唔會蝕底？—— 呢個階段最緊要係基本功、協調同球場意識，高度並非決定因素，反而早打好技術更有優勢。','籃球會唔會好容易撞傷？—— 我哋每堂有熱身同體能環節，教正確煞停、落地同保護動作，並按年齡控制對抗強度，安全為先。','要唔要自備籃球？—— 建議自備個人籃球；初學可先用場地公用球，選購合適球號歡迎 WhatsApp 查詢。']},{icon:'🏫',h:'一堂係點上嘅？',list:['熱身與敏捷遊戲：活動關節、練起動煞停同球感','技術重點：教練示範＋分解，逐個糾正運球、傳球或投籃動作','分組操練：運球過樁、傳接、投籃上籃輪流練，密集重複建立肌肉記憶','體能環節：融入 S&C 爆發、敏捷同核心訓練','比賽情境：三對三或五對五小賽，將技術同戰術即場運用','放鬆與總結：伸展、覆盤，設定下堂目標']},{icon:'🎬',h:'重點動作點教（以「兩步上籃」為例）',list:['動作要領：以慣用手（右手）為例，運球切入後「右腳、左腳」兩步節奏，最後一步左腳單腳起跳，右手高舉將球輕貼籃板送入籃框','分解練習：原地徒手「右左起跳」定步 → 定點行兩步放籃 → 加運球切入 → 加防守干擾','常見錯誤 → 糾正：起跳步序亂（兩步變走步）→ 慢速數「一、二、跳」定型；用力扔球撞板 → 提醒用「放」多過「掟」，手指柔和撥球；起跳時望地下 → 提醒眼望籃板目標點','進階：加入反手上籃、低手上籃同對抗下終結，練習兩邊手上籃']},{icon:'📈',h:'評估與成長追蹤',list:['PRE & POST 能力測試：運球、投籃命中、敏捷同體能數據化紀錄','影片回饋：拍低動作，等孩子睇得見姿勢同腳步問題，改得快','技術進程檢視：運球、傳接、投籃、上籃、防守逐項評估','定期成長報告：家長清楚掌握孩子進步同下階段目標']},{icon:'🏆',h:'學員成就',list:['學員由零基礎到能喺小型比賽中運用基本技術同戰術','喺群體運動中建立自信、團隊精神同社交','系統化進程，見證孩子由分解動作到實戰逐步突破']},{icon:'📋',h:'上課安排',list:['可自組班別・4 人起即可成班（未設固定恆常時段，歡迎組班）','師生比例 1:12，設固定分組操練確保觸球同練習時間','由基本功到比賽情境，循序漸進，定期評估進度','時間及最新班別歡迎 WhatsApp 6331 7403 查詢']}]},
  'tennis':{summary:'優雅而講求技術 —— 由握拍到有來有往嘅對拉，用系統化技術進程同數據評估，帶孩子喺安全環境打穩網球根基。',sections:[{icon:'🎯',h:'課程理念',p:'網球係一項優雅而全面嘅運動，一拍一步都講求協調、步法同專注。INITIATE SPORTS 相信網球要由「正確」打起 —— 我哋唔急住叫孩子大力抽擊，而係先打好握拍、揮拍同步法呢啲底層功夫，再循序漸進帶佢哋進入有來有往嘅對拉樂趣。當基本功夠紮實，孩子自然享受到把球穩定打過網、同對手你來我往嘅成功感，愈打愈投入。'},{icon:'🔬',h:'點解網球係小朋友嘅黃金運動？',list:['全身協調：揮拍、跨步、轉腰同蹬地連成一線，訓練上下肢與軀幹連動','步法移位：網球場大、球路遠，不停啟動、煞停同調整位置，練出敏捷同重心控制','判斷與預判：睇對手拍面同球路估落點，訓練空間感同臨場決策','心肺耐力：跑動加揮拍，係高效又持久嘅帶氧運動','手眼協調：喺移動中準確擊中嚟球，強化追蹤同出手時機','專注與情緒：一分一分咁打，訓練專注、耐性同面對得失嘅心理素質']},{icon:'🧩',h:'學員會學到（三階段循序漸進）',list:['入門：正確握拍（正手／反手）、準備姿勢、原地揮拍定型','基礎：正手與反手底線抽擊、把球穩定打過網','發球與截擊：基本發球動作、上網截擊基礎','步法系統：分腿墊步、側併步、調整步，練到「腳到手到」','多球餵球：教練連續餵球，密集重複同一動作，快速建立手感','對拉應用：由定點對拉到移動中對拉，逐步加入落點控制']},{icon:'🪜',h:'技術進程里程碑',p:'網球冇章別制度，但我哋為孩子設定清晰嘅「技術進程里程碑」：由第一階段「握對拍、揮到全揮、把球打過網」，到第二階段「正反手都穩定對拉唔失手、發到球入界」，再到第三階段「識得控落點、上網截擊、移動中打」。每個里程碑都有具體、睇得見嘅動作指標，教練逐項評估，等孩子清楚知道自己去到邊、下一步練咩，學得更有方向。'},{icon:'🌱',h:'對孩子嘅三重成長：身・腦・心',list:['身：手眼協調、敏捷、步法與全身協調同步提升','腦：判斷球路、預判落點、臨場應變嘅運動智慧','心：由把球打過網到贏到一分，建立自信、專注同抗逆']},{icon:'👤',h:'適合對象',list:['小學一年級或以上、對網球有興趣嘅孩子','零基礎完全歡迎，由握拍與揮拍第一步開始','已有少少底子、想加強步法同對拉嘅學員','想提升協調、專注同全身運動能力嘅小朋友']},{icon:'⭐',h:'點解揀 INITIATE 網球',list:['融入 S&C 體能元素，唔止識打波，更打好步法、敏捷同心肺根基','PRE & POST 數據化能力評估，擊球穩定度同體能成長睇得見','多球餵球高密度訓練，同一動作反覆打，手感建立得快','小班教學，教練貼身糾正每個揮拍與步法細節','由正確姿勢入手，減低運動受傷風險','由淺入深、先建立成功感，孩子愈打愈鍾意']},{icon:'❓',h:'家長常見問題',list:['完全冇打過得唔得？—— 得，課程專為零基礎設計，由握拍揮拍逐步教起。','打網球會唔會容易受傷？—— 我哋著重正確姿勢同熱身，並融入體能訓練強化步法與落地控制，大幅降低受傷風險。','要唔要自備球拍？—— 建議自備個人球拍；初學可先用場地公用拍，選購歡迎 WhatsApp 查詢建議。','小朋友體力唔夠、追唔到球得唔得？—— 小班加多球餵球，教練會按程度調整球嘅遠近同節奏，每個孩子都追得到、打得到，慢慢建立信心。']},{icon:'🏫',h:'一堂係點上嘅？',list:['熱身與步法活化：關節活動、分腿墊步腳步遊戲，開啟身體','技術重點：教練示範＋分解，逐個糾正握拍與揮拍','多球餵球：連續餵球密集練習當堂重點擊球','對拉應用：把技術帶入定點或移動中對拉','體能環節：融入 S&C 敏捷、步法與協調訓練','放鬆與總結：伸展、覆盤，設定下堂目標']},{icon:'🎬',h:'重點動作點教（以「正手抽擊」為例）',list:['動作要領：側身準備、非持拍手指向嚟球、由後向前揮拍、擊球時轉腰蹬地、擊球點喺身體前方腰腹高度、擊球後隨勢揮向對角','分解練習：原地徒手揮拍定型 → 教練近距離手餵慢球 → 定點多球連續打 → 移動中接球打','常見錯誤 → 糾正：淨用手臂唔轉腰（球冇力又易散）→ 提醒用腰帶動、蹬地發力；擊球點太後太貼身 → 提早側身、上前迎球喺身前擊出','進階串連：正手與反手交替對拉，練習落點變化同移動中擊球']},{icon:'📈',h:'評估與成長追蹤',list:['PRE & POST 能力測試：擊球穩定度、步法、敏捷與體能數據化紀錄','技術進程里程碑：逐項評估達標情況，進度一目了然','影片回饋：拍低揮拍與步法，等孩子睇得見、改得快','定期成長報告：家長清楚掌握孩子每階段進步']},{icon:'🏆',h:'學員成就',list:['學員由零基礎到打得出穩定對拉，實戰信心明顯提升','系統化技術里程碑，見證孩子逐階突破','紮實嘅步法與擊球底子，為日後打得更深行遠鋪路']},{icon:'📋',h:'上課安排',list:['2026 年 9–10 月試行班（星期六 18:00–20:00）','師生比例 1:6，4 人成班（場地安排歡迎 WhatsApp 查詢）','以技術、對拉與體能兼備嘅系統化課程編排','附技術進程里程碑評估，定期檢視進度','時間及最新班別歡迎 WhatsApp 6331 7403 查詢']}]},
  'c4':{summary:'一對一度身訂造，由前香港隊運動員親自帶領，讓孩子在最適合自己嘅節奏中，把每項運動能力練到位。',sections:[{icon:'🎯',h:'課程理念',p:'每個孩子嘅身體條件、學習速度同興趣都唔一樣，倒模式嘅小組課未必啱得晒。私人訓練由前香港隊運動員、具香港中文大學運動科學背景嘅專業教練親自帶領，先了解孩子嘅強項與弱點，再為佢設計專屬路線。全程一對一貼身觀察，把基礎打得紮實，讓進步睇得見、學得開心。'},{icon:'🔬',h:'點解一對一進步特別快？',list:['專注度最高：全堂只跟你孩子一個，冇等候、冇分心，每分鐘都用得着','即時糾錯：動作一有代償或發力錯誤，教練即場捉到即場改，唔會養成壞習慣','敏感期把握：兒童及青少年正值協調、速度與神經肌肉發展黃金期，針對性刺激事半功倍','度身進度：由淺入深、按孩子能力調整難度，唔會太易悶親、太難嚇親']},{icon:'🧩',h:'可訓練嘅範疇',list:['花式跳繩：由基本跳法到花式技巧、速度與耐力','全面體能：心肺、爆發力、核心穩定、敏捷','田徑基礎：跑、跳、擲嘅正確姿勢與技術','體操元素：柔軟度、平衡、身體控制與空間感','球類敏捷反應：腳步、變向、手眼協調','肌力與協調：適齡、安全咁建立力量根基']},{icon:'🧭',h:'個人化流程（評估→計劃→訓練→追蹤）',list:['評估：首堂做動作篩查與基礎能力測試，睇清孩子強弱項','計劃：按目標（校隊／比賽／升學體育／打好基礎）度身訂造路線','訓練：逐堂針對性練習，即時糾正動作細節','追蹤：定期 PRE & POST 數據對比，家長清楚睇到成長']},{icon:'🌱',h:'孩子會得到嘅成效',list:['集中火力改善某一項能力，進度比小組更快','一對一即時糾正動作，減少日後運動傷害','內向或未夠投入嘅孩子，能喺專注環境重拾信心','由淺入深建立對運動嘅興趣與成就感','提升專注力、自律同身體自信']},{icon:'👤',h:'適合對象',list:['想集中改善某項運動能力嘅兒童及青少年','喺小組課堂較難投入、需要更多個別關注嘅孩子','想為校隊、比賽或升學體育做準備嘅學生','初次接觸運動、想有人由零開始貼身帶嘅孩子']},{icon:'⭐',h:'點解揀 INITIATE',list:['前香港隊運動員、香港中文大學運動科學背景，理論與實戰兼備','持 NASM 國際認證私人教練及 S&C 體能表現教練資格','PRE & POST 數據化能力評估，成長睇得見','度身訂造每一堂，唔走倒模式教學']},{icon:'❓',h:'常見問題',list:['完全零基礎得唔得？—— 得，一對一正正最啱由零開始，教練會由最基本動作慢慢帶。','孩子有舊患或姿勢問題得唔得？—— 教練具 NKT × SCS 資格，可即場評估動作代償，安全範圍內調整訓練，需要時建議求醫。','大約幾耐見到效果？—— 動作質素通常數堂內已有改善；體能與能力數據多數 8 至 12 堂見到明顯進步，因人而異。','可唔可以兩個一齊上？—— 可選 1 對 2（例如兄弟姊妹或朋友），3 人或以上小組歡迎查詢。']},{icon:'🏫',h:'一堂係點上嘅？',list:['動態熱身：活動關節、喚醒身體，減低受傷風險','技術重點：教練示範＋分解，逐個動作糾正','專項訓練：針對當堂目標嘅能力集中練習','體能環節：融入 S&C 力量、速度與協調訓練','放鬆與覆盤：伸展、總結，設定下堂目標']},{icon:'🎬',h:'重點訓練示例（以「落地緩衝」為例）',list:['動作要領：屈膝屈髖、腳掌前中段先着地、膝蓋對準腳尖唔內夾','分解練習：原地小跳落地定格 → 由矮台跳落 → 加入方向變化','常見錯誤 → 糾正：膝蓋內扣／硬直落地 → 提示「坐低吸震」、放慢節奏再加速','應用：跳繩、跳遠、球類急停變向都用得着，係防受傷嘅根基']},{icon:'📈',h:'評估與進度追蹤',list:['PRE & POST 能力測試：速度、爆發、協調等數據化紀錄','影片回饋：拍低動作，等孩子睇得見、改得快','階段目標：逐堂設定小目標，累積成大進步','定期成長回顧：家長清楚掌握孩子每一步進展']},{icon:'📋',h:'上課安排',list:['一對一私人訓練；可選 1 對 2 小組','如需 3 人或以上小組歡迎查詢','時間靈活，歡迎 WhatsApp 6331 7403 預約／查詢']}]},
  'fit-adult':{summary:'科學化肌力配合高效體能循環，成人有系統咁增肌塑形、燃脂減重，附飲食指導，練出力量與健康體態。',sections:[{icon:'🎯',h:'課程理念',p:'專為成人而設嘅小組體能班。都市人普遍久坐、代謝下降、肌肉悄悄流失，靠亂做 cardio 或跟片練往往練唔到重點又易傷。INITIATE 以科學化肌力訓練配合高效體能循環，由前香港隊運動員、具運動科學背景嘅教練親自帶，有系統咁增肌塑形、燃脂減重，再附上飲食指導，令你嘅努力真正睇到成果。'},{icon:'🔬',h:'訓練科學根據',list:['漸進式超負荷：逐步增加重量、次數或難度，係肌肉持續生長嘅核心原則','增肌提代謝：肌肉係身體嘅「燃脂引擎」，肌肉量上升，基礎代謝跟住升，躺住都燒得多','阻力訓練對抗肌肉流失：成人約 30 歲後肌肉逐年遞減，規律阻力訓練係最有效嘅逆轉方法','高效體能循環（EPOC）：高強度間歇令運動後仍持續耗能，慳時間又燒脂','動作模式先行：先建立正確發力與姿勢，力量先加得安全、加得上']},{icon:'🧩',h:'訓練內容',list:['肌力訓練：深蹲、髖鉸鏈、推、拉、負重行走等基礎動作，漸進加負荷','增肌塑形：針對主要肌群嘅容量安排，練出線條與緊緻感','高強度體能循環：燃脂減重、強化心肺','核心與體態：強化軀幹穩定，改善圓肩寒背等常見都市體態','正確發力與呼吸：減低受傷風險，練得準先練得耐']},{icon:'🧭',h:'個人化流程（評估→計劃→訓練→追蹤）',list:['評估：動作篩查、體能與體態基線紀錄，了解你嘅起點與目標','計劃：按增肌／減脂／體態目標，安排訓練量與強度','訓練：小班內按個人狀況微調重量與動作變化，人人有人盯','追蹤：定期重測與體態對比，數據話你知有冇進步']},{icon:'🍽',h:'飲食指導',list:['日常飲食大原則：熱量與蛋白質點樣配合增肌或減脂目標','實用建議：外食、返工繁忙點揀先食得啱','訓練與飲食配合：練前練後點食令效果事半功倍','可持續為先：唔靠捱餓極端節食，建立長遠都跟到嘅習慣']},{icon:'🌱',h:'你會得到',list:['增肌減脂、體態更緊緻結實','體能、力量與耐力全面提升','改善姿勢、紓緩久坐帶嚟嘅繃緊與痛症風險','精神、睡眠與日常活動質素改善','建立一套可持續嘅運動與飲食習慣']},{icon:'👤',h:'適合對象',list:['想增肌減脂、改善體態嘅成人','工作忙、想用最少時間練到最多嘅都市人','久坐少動、想安全重新開始運動嘅初學者','想有人盯住動作、練得準又唔傷嘅人士']},{icon:'⭐',h:'點解揀 INITIATE',list:['前香港隊運動員、香港中文大學運動科學背景，訓練有理論根據','持 NASM 國際認證私人教練及 S&C 體能表現教練資格，評估、訓練到飲食一條龍','師生比例 1:8，4 人成班，動作有人盯、練得準','附飲食指導，令訓練事半功倍']},{icon:'❓',h:'常見問題',list:['完全零基礎、好耐冇運動得唔得？—— 完全歡迎，教練會由最基本動作與輕負荷開始，循序漸進。','女生練力量會唔會變得好粗壯？—— 唔會，女生天生激素令肌肉難以大幅增大，阻力訓練主要令線條更緊緻結實。','有舊患或關節唔舒服得唔得？—— 得，教練具 NKT × SCS 資格，可即場評估並調整動作，痛症明顯者會建議先求醫。','大約幾耐見效？—— 體能與力量通常 4 至 6 星期已有感覺；體態改變多數 8 至 12 星期較明顯，配合飲食效果更佳。']},{icon:'🏫',h:'一堂係點上嘅？',list:['動態熱身：喚醒目標肌群、活動關節','技術教學：講解當堂主要動作嘅要領與發力','主課訓練：漸進式肌力訓練，教練逐個調整重量與姿勢','體能循環：高強度間歇，燃脂兼強心肺','放鬆伸展：緩和身體、覆盤重點，交代練後注意事項']},{icon:'🎬',h:'重點訓練示例（以「髖鉸鏈／硬拉」為例）',list:['動作要領：背脊保持中立、以推臀向後帶動軀幹前傾，重量壓喺腳跟中段','分解練習：徒手髖鉸鏈感受發力 → 輕負荷定型 → 逐步加重','常見錯誤 → 糾正：彎腰圓背／用腰硬扯 → 提示「屁股向後坐、胸口向前」，先減重量練對再加','好處：練到臀腿與後鏈力量，改善姿勢，日常搬嘢彎身都更安全']},{icon:'📈',h:'評估與進度追蹤',list:['訓練紀錄：定期紀錄力量、重量與次數，睇得見進步','體態對比：定期紀錄，睇得見改變','負荷紀錄：追蹤重量與次數，確保持續漸進','階段回顧：按數據調整訓練與飲食方向']},{icon:'📋',h:'上課安排 function fmtCourseSections(secs){

    return '<div class="cd-sec"><h4 class="cd-h">'+(s.icon||'')+' '+esc(s.h)+'</h4>'+body+'</div>';
  }).join('');
}
/* 括號平衡掃描：由 marker（如 "COURSE_ITEMS=["）起，尊重字串，搵到配對嘅收括號，回傳完整 [..]/{..} 字面量。
   唔怕內部有 []{} 或字串內括號，比 regex 穩陣。 */
function extractLiteral(src, marker){
  var start=src.indexOf(marker); if(start<0) return null;
  var i=start+marker.length-1, depth=0, inStr=false, q='', esc=false;
  for(; i<src.length; i++){ var c=src[i];
    if(inStr){ if(esc)esc=false; else if(c==='\\')esc=true; else if(c===q)inStr=false; continue; }
    if(c==='"'||c==="'"||c==='`'){ inStr=true; q=c; continue; }
    if(c==='['||c==='{') depth++;
    else if(c===']'||c==='}'){ depth--; if(depth===0) return src.slice(start+marker.length-1, i+1); }
  }
  return null;
}
/* 自動同步官網課程介紹：開頁讀 index.html（同源）嘅 COURSE_ITEMS/COURSE_DETAIL 覆蓋內置 fallback。
   官網一改、報名頁下次開就跟住改；官網零改動。任何失敗＝用內置 fallback，永不空白。 */
async function loadOfficialCourses(){
  try{
    var r=await fetch('index.html?_='+Date.now(),{cache:'no-store'}); if(!r.ok) return;
    var html=await r.text();
    var it=extractLiteral(html,'COURSE_ITEMS=['), dt=extractLiteral(html,'COURSE_DETAIL={');
    if(it){ var items=(0,eval)('('+it+')'); if(Array.isArray(items)){ items=items.filter(function(c){return c&&c.id&&c.name;}); if(items.length) COURSE_ITEMS=items; } }
    if(dt){ var det=(0,eval)('('+dt+')'); if(det&&typeof det==='object'&&Object.keys(det).length) COURSE_DETAIL=det; }
  }catch(e){ /* 保留內置 fallback */ }
}

async function doIdentify(){
  if(PREVIEW){
    const _pt=(new URLSearchParams(location.search).get('tier')||'').toLowerCase();
    if(_pt==='old'||_pt==='舊生'){   // 舊生預覽：借測試用「示範學員」身份，令揀課同費用頁都顯示舊生價（quote 亦用此名）
      apiPost({action:'enrollIdentify', name:'示範學員', last4:'1234'}, 20000).then(res=>{
        S.family={name:'示範學員',phone:'00000000',last4:'1234',isOld:true,tier:'舊生（示範）'}; S.isNew=false;
        S.oldPrices=(res&&res.oldPrices)||null; S.profile={}; S.courses=[]; S.quote=null; S.payImg=''; S.credit={remaining:0,summer:0,referral:0}; renderProfileScreen();
      }).catch(()=>{ S.family={name:'示範學員',phone:'00000000',last4:'1234',isOld:true,tier:'舊生（示範）'}; S.isNew=false; S.oldPrices=null; S.profile={}; S.courses=[]; renderProfileScreen(); });
      return;
    }
    S.family={name:'預覽用戶',phone:'00000000',last4:'0000',isOld:false,tier:'新生'}; S.isNew=true; S.oldPrices=null; S.profile={}; S.courses=[]; S.quote=null; S.payImg=''; S.credit={remaining:0,summer:0,referral:0}; renderProfileScreen(); return; }
  const name=document.getElementById('li_name').value.trim();
  const phone=(document.getElementById('li_phone').value||'').replace(/\D/g,'');
  const msg=document.getElementById('li_msg');
  if(!name||!phone){ msg.className='msg err'; msg.textContent='請先填學生中文全名同家長手提電話。'; return; }
  if(phone.length<8){ msg.className='msg err'; msg.textContent='請填完整 8 位手提電話。'; return; }
  const last4=phone.slice(-4);
  const btn=document.getElementById('li_go'); btn.disabled=true; btn.textContent='核對中…';
  let res; try{ res=await apiPost({action:'enrollIdentify', name, last4}); }   // POST：last4(等同密碼)+姓名唔好經 GET query 入伺服器 log
  catch(e){ btn.disabled=false; btn.textContent='下一步'; msg.className='msg err'; msg.textContent='連線逾時，請再試。'; return; }
  btn.disabled=false; btn.textContent='下一步';
  if(!res||res.ok===false){ msg.className='msg err'; msg.textContent=(res&&res.err)||'核對失敗，請確認姓名同電話。'; return; }
  S.family={name, phone, last4, isOld:!!res.isOld, tier:res.tier||'新生'};
  S.isNew=!res.known;
  S.oldPrices=res.oldPrices||null;   // 舊生價 map（只有已驗證舊生先攞到；新生為 null）→ 課程卡/收費一覽用呢個顯示舊生價
  S.profile=res.profile||null;
  if(S.isNew){ S.profile=S.profile||{}; if(!S.profile['聯絡電話']) S.profile['聯絡電話']=phone; }   // 新生：登入已畀電話，後續預填唔使再入
  S.courses=[]; S.quote=null; S.payImg='';   // 換學生時清空上一位嘅揀選
  S.credit={remaining:res.creditRemaining||0, summer:res.summer||0, referral:res.referral||0};
  renderProfileScreen();   // 登入後 → 先填/核對資料，再顯示收費（老闆調序）
}

    const _myP=_isOld?((S.oldPrices&&S.oldPrices[c.id])||c.price):c.price;

/* 手寫簽名板：支援滑鼠＋觸控；toDataURL 出 PNG 畀後端嵌入合約 PDF */
let _sig={draw:false,has:false,ctx:null,cv:null,w:0,h:0};
function setupSigPad(_retry){
  const cv=document.getElementById('sigpad'); if(!cv) return;
  const rect=cv.getBoundingClientRect(); const ratio=window.devicePixelRatio||1;
  if(rect.width<50){ if(!_retry) requestAnimationFrame(()=>setupSigPad(true)); return; }   // layout 未 ready → 下一幀重試（防 0 闊度爛簽名板）
  cv.width=Math.round(rect.width*ratio); cv.height=Math.round(rect.height*ratio);
  const ctx=cv.getContext('2d'); ctx.scale(ratio,ratio); ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#0f2233';
  _sig={draw:false,has:false,ctx,cv,w:rect.width,h:rect.height};
  const pos=e=>{ const r=cv.getBoundingClientRect(); const t=(e.touches&&e.touches[0])?e.touches[0]:e; return {x:t.clientX-r.left,y:t.clientY-r.top}; };
  const start=e=>{ e.preventDefault(); _sig.draw=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); };
  const move=e=>{ if(!_sig.draw) return; e.preventDefault(); const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); _sig.has=true; };
  const end=()=>{ _sig.draw=false; };
  cv.addEventListener('mousedown',start); cv.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
  cv.addEventListener('touchstart',start,{passive:false}); cv.addEventListener('touchmove',move,{passive:false}); cv.addEventListener('touchend',end);
  if(S.signImg){ const img=new Image(); img.onload=()=>{ ctx.drawImage(img,0,0,_sig.w,_sig.h); _sig.has=true; }; img.src=S.signImg; }
}
function clearSig(){ if(_sig.ctx&&_sig.cv) _sig.ctx.clearRect(0,0,_sig.cv.width,_sig.cv.height); _sig.has=false; S.signImg=''; }
function sigDataUrl(){ return (_sig.has&&_sig.cv)?_sig.cv.toDataURL('image/png'):''; }

      <button class="btn ghost sm" onclick="renderTerms()">返回</button>
      <button class="btn" id="py_go">${isOpen?'確認提交報名':'預覽完成（開放後可提交）'}</button>
    </div>
  </div>`;
  S._payFree = free||allWait;
  const pf=document.getElementById('py_file');
  if(pf) pf.onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader(); rd.onload=()=>{ S.payImg=rd.result;
      const th=document.getElementById('py_thumb'); if(th) th.innerHTML='✓ 已附上截圖（'+esc(f.name)+'）· 可重新選擇';
    }; rd.readAsDataURL(f);
  };
  document.getElementById('py_go').onclick=submitEnroll;
}
async function submitEnroll(){
  if(PREVIEW){ const m=document.getElementById('py_msg'); if(m){ m.className='msg'; m.textContent='（預覽模式）唔會真提交報名。'; } return; }
  const msg=document.getElementById('py_msg'), btn=document.getElementById('py_go');
  if(!S.cfg.open){ msg.className='msg err'; msg.textContent='報名將於 8 月中開放，暫時未可提交。（你已可預覽整個流程）'; return; }
  if(!S._payFree && (((S.quote&&S.quote.net)>0)||uniformCost()>0) && !S.payImg){ msg.className='msg err'; msg.textContent='請先上載付款截圖。'; return; }
  btn.disabled=true; btn.textContent='提交中…';
  if(!S.clientToken) S.clientToken='ct_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);   // 防重複：逾時重撳用同一 token
  const q=S.quote||{};
  const coursesTxt=(q.courses||[]).map(c=>esc(c.sport)+(c.day&&c.day!=='待定'?('|'+c.day+' '+c.time):'')).join('、');
  let res;
  try{
    res=await apiPost({ action:'enrollConfirm', name:S.family.name, last4:S.family.last4,
      courses:coursesTxt, courseIds:S.courses.join(','), period:q.period||S.cfg.period,
      phone:(S.profile&&S.profile['聯絡電話'])||'', clientToken:S.clientToken,
      feeBase:q.base||0, voucher:q.credit||0, referral:0, promo:0, feeNet:q.net||0,
      uniformOpt:(S.uniform&&S.uniform.opt)||0, uniformSize:(S.uniform&&S.uniform.size)||'', uniformCost:uniformCost(),
      gearItems:JSON.stringify(gearItemsClient()),
      payImg:S.payImg, parentEmail:(S.profile&&S.profile['電郵'])||'', signEn:S.signEn, signId:S.signId,
      signImg:S.signImg||'', notesAgreed:S.notesAgreed?'1':'', photoConsent:(S.photoConsent===false?'0':'1'), agree:'同意' }, 30000);
  }catch(e){ btn.disabled=false; btn.textContent='確認提交報名'; msg.className='msg err'; msg.innerHTML='網絡逾時／中斷。你嘅報名<b>可能已提交</b>——請用「查詢我報名狀態」查看，切勿以為失敗而重複提交（就算再交都唔會重複收費）。'; return; }
  btn.disabled=false; btn.textContent='確認提交報名';
  if(!res||res.ok===false){ msg.className='msg err'; msg.textContent=(res&&res.err)||'提交失敗，請再試或 WhatsApp 6331 7403。'; return; }
  renderDone(res);
}
/* ════ 完成 ════ */
function renderDone(res){
  clearDraft(); S.clientToken='';   // 完成即清草稿+token
  const dedup = res.dedupe ? `<div class="banner" style="margin-top:12px">ℹ️ 呢個報名之前已經提交過，冇重複收費。</div>` : '';
  const wl = res.waitlisted ? `<div class="banner" style="margin-top:12px">⚠️ 以下課程已滿，你已加入<b>候補</b>（暫免付費，有位轉正先通知）：${esc((res.fullCourses||[]).join('、'))}。</div>` : '';
  const last4=S.family&&S.family.last4;
  app.innerHTML=`
  <div class="card done">
    <div class="big">${res.waitlisted?'📝':'✅'}</div>
    <h2>${res.waitlisted?'報名已收到（部分候補）':'報名已收到！'}</h2>
    <div class="rid">${esc(res.id||'')}</div>
    ${dedup}${wl}
    <p class="hint">我哋已收到你嘅報名${res.dedupe?'':'及付款截圖'}，會盡快核實，確認後以電郵通知。開課詳情、請假補堂會另行通知。多謝報名 INITIATE SPORTS！</p>
    ${(S.profile&&S.profile['電郵'])?`<p class="hint" style="color:var(--teal-dark)">📧 一封<b>含合約 PDF</b>嘅確認電郵已即時發送到 <b>${esc(S.profile['電郵'])}</b>（如收唔到請檢查垃圾郵件，或 WhatsApp 我哋補發）。</p>`:''}
    <a class="btn" style="margin-top:14px;display:block;text-decoration:none;box-sizing:border-box" href="${waLink('報名確認 '+esc(res.id||'')+'：'+esc((S.family&&S.family.name)||''))}" target="_blank">WhatsApp 查詢 / 傳收據</a>
    <button class="btn ghost" style="margin-top:10px" onclick="reportAnother()">➕ 再報一位學生（免重新輸入電話）</button>
  </div>`;
}
// 多子女：保留家長電話，只換學生
function reportAnother(){
  const phone=(S.family&&S.family.phone)||'';
  S.family=null; S.profile=null; S.courses=[]; S.quote=null; S.payImg=''; S.isNew=false; S.agree=false; S.signEn=''; S.signId=''; S.clientToken='';
  S.uniform=null; S.notesAgreed=false; S.signImg=''; S.photoConsent=undefined;   // 清乾淨:第二個小朋友唔會沿用上一位嘅制服選項/尺碼(防被預設買制服多收$160+錯碼)
  renderLogin();
  const el=document.getElementById('li_phone'); if(el) el.value=phone;
  const nm=document.getElementById('li_name'); if(nm) nm.focus();
}
boot();
</script>
