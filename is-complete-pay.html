<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
<title>INITIATE SPORTS · 完成報名付款</title>
<style>
  :root{ --navy:#12324f; --teal:#0f8996; --ink:#1b2830; --muted:#7a8a99; --line:#e3e9ee; --bg:#f4f7f9; --gold:#c8a44d; --red:#c0392b; --green:#1f9d55; }
  *{box-sizing:border-box}
  body{ margin:0; font-family:'PingFang HK','Microsoft JhengHei','Noto Sans HK',Arial,sans-serif; color:var(--ink); background:var(--bg); font-size:15px; line-height:1.6; }
  .wrap{ max-width:560px; margin:0 auto; padding:16px 14px 60px; }
  .head{ text-align:center; padding:18px 0 10px; }
  .head .en{ font-family:Georgia,serif; letter-spacing:2px; color:var(--navy); font-weight:700; font-size:20px; }
  .head .sub{ color:var(--muted); font-size:13px; margin-top:2px; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-top:14px; }
  h2{ font-size:15px; margin:0 0 10px; color:var(--navy); }
  .row{ display:flex; justify-content:space-between; gap:10px; padding:5px 0; font-size:14.5px; }
  .row .k{ color:var(--muted); } .row .v{ font-weight:600; text-align:right; }
  .amt{ font-size:26px; font-weight:800; color:var(--teal); }
  .fps{ background:#f0f7f8; border:1px solid #cfe6e9; border-radius:10px; padding:12px 14px; margin-top:10px; font-size:14.5px; }
  .fps b{ font-size:18px; color:var(--navy); letter-spacing:1px; }
  .terms{ height:150px; overflow:auto; border:1px solid var(--line); border-radius:10px; padding:12px; font-size:12.5px; color:#42505c; background:#fbfcfd; white-space:pre-wrap; }
  label.chk{ display:flex; gap:9px; align-items:flex-start; margin-top:12px; font-size:14px; cursor:pointer; }
  input[type=checkbox]{ width:20px; height:20px; margin-top:1px; flex-shrink:0; }
  .in{ width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; font-size:15px; margin-top:6px; }
  .lbl{ font-size:13px; color:var(--muted); margin-top:12px; }
  .up{ margin-top:8px; }
  .btn{ width:100%; padding:14px; border:0; border-radius:12px; background:var(--navy); color:#fff; font-size:16px; font-weight:700; margin-top:16px; cursor:pointer; }
  .btn:disabled{ opacity:.5; }
  .msg{ margin-top:10px; font-size:13.5px; }
  .msg.err{ color:var(--red); } .msg.ok{ color:var(--green); }
  .center{ text-align:center; }
  .big-ok{ text-align:center; padding:30px 10px; }
  .big-ok .ic{ font-size:46px; }
  .mut{ color:var(--muted); font-size:12.5px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><div class="en">INITIATE SPORTS</div><div class="sub">完成報名付款</div></div>
  <div id="app"><div class="card center mut" id="loading">載入中…</div></div>
  <div class="center mut" style="margin-top:18px">查詢請 WhatsApp 6331 7403</div>
</div>
<script>
const API="https://script.google.com/macros/s/AKfycbxNikFcB8n34Lyqc-KKC0oIRhn_-35HXmrAo5mEVhGNZ5g21AdUEMFSca408oo0xUw/exec";
const qs=new URLSearchParams(location.search);
const ID=qs.get('id')||'', TOK=qs.get('t')||'';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let INFO=null, PAYIMG='';
const TERMS_TXT=`收費及退款：學費以「期」為單位（本期共 8 堂）於開課前繳付。報名一經接納，已繳學費恕不退回或轉讓他人；如課程最終未能開班（不足 4 人），已繳學費將全數退還。

個人資料收集聲明（PDPO）：本機構收集學員及家長之個人資料（姓名、出生年月、就讀學校及年級、聯絡電話及電郵、緊急聯絡人、健康狀況、家長證件首 4 位、簽署及付款截圖），僅用於課程報名、編班、出席與補堂管理、繳費核實、安全及通訊用途；妥善保存至課程完結後合理期間即刪除，不會在未經同意下轉交無關第三方（法律要求除外）。家長有權查閱及更正，查詢可 WhatsApp 6331 7403。

健康聲明：本人確認學員身體狀況適合參與相關運動訓練，並已如實告知任何需要注意的健康情況。`;
// 後端 Apps Script 冷啟動時會回一版 Google HTML 錯誤頁（唔係 JSON）→ 重試至暖返（免家長見「連結無效」）。
async function _tryJson(mk, tries){ tries=tries||5; for(let i=0;i<tries;i++){ try{ const r=await mk(); const t=await r.text(); if(t){ try{ return JSON.parse(t); }catch(e){} } }catch(e){} if(i<tries-1) await new Promise(res=>setTimeout(res, 1500*(i+1))); } return null; }
async function apiGet(p){ return _tryJson(()=>fetch(API+'?'+new URLSearchParams(p))); }
async function apiPost(b){ return _tryJson(()=>fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)}), 6); }
function shrink(file,cb){
  if(!file){cb('');return;}
  if(!/^image\//.test(file.type)){ if(file.size>6*1024*1024){cb(null,'檔案太大（上限 6MB）');return;} const r=new FileReader(); r.onload=()=>cb(r.result); r.onerror=()=>cb(null,'讀取失敗'); r.readAsDataURL(file); return; }
  const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{ let M=1600,w=im.width,h=im.height; if(w>M||h>M){ if(w>=h){h=Math.round(h*M/w);w=M;}else{w=Math.round(w*M/h);h=M;} } try{ const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);cb(c.toDataURL('image/jpeg',0.82)); }catch(e){cb(r.result);} }; im.onerror=()=>cb(r.result); im.src=r.result; }; r.onerror=()=>cb(null,'讀取失敗'); r.readAsDataURL(file);
}
function render(){
  const i=INFO;
  $('app').innerHTML=`
  <div class="card">
    <h2>報名詳情</h2>
    <div class="row"><span class="k">學生</span><span class="v">${esc(i.name)}</span></div>
    <div class="row"><span class="k">報讀課程</span><span class="v">${esc(i.course)}</span></div>
    <div class="row"><span class="k">課程期數</span><span class="v">${esc(i.period)}</span></div>
    <div class="row" style="border-top:1px dashed var(--line);margin-top:6px;padding-top:10px"><span class="k">學費</span><span class="v">$${i.base}</span></div>
    ${i.uniform?`<div class="row"><span class="k">制服</span><span class="v">$${i.uniform}</span></div>`:''}
    ${i.gear?`<div class="row"><span class="k">器材</span><span class="v">$${i.gear}</span></div>`:''}
    <div class="row" style="align-items:center;border-top:1px solid var(--line);margin-top:8px;padding-top:12px"><span class="k">應繳總額</span><span class="amt">$${i.amount}</span></div>
  </div>
  <div class="card">
    <h2>1 · 付款</h2>
    <div class="fps">💰 FPS / PayMe：<b>${esc(i.fps)}</b><br><span class="mut">轉賬 $${i.amount} 後，喺下面上載一張付款截圖。</span></div>
    <div class="up"><input type="file" id="pf" accept="image/*,application/pdf" onchange="onFile(this)"><div class="mut" id="fst" style="margin-top:6px">請揀選付款截圖（相片或 PDF）</div></div>
  </div>
  <div class="card">
    <h2>2 · 確認條款</h2>
    <div class="terms">${esc(TERMS_TXT)}</div>
    <label class="chk"><input type="checkbox" id="agree"><span>本人已閱讀並同意上述收費及退款條款、個人資料收集聲明，並確認健康聲明。</span></label>
  </div>
  <div class="card">
    <h2>3 · 簽署</h2>
    <div class="lbl">家長 / 監護人英文全名（作電子簽署）</div>
    <input class="in" id="signEn" placeholder="Full name in English" autocomplete="off">
    <div class="lbl">家長證件號碼首 4 位（英文字母＋首 3 數字，例：A123）</div>
    <input class="in" id="signId" placeholder="例：A123" maxlength="8" autocomplete="off">
    <div class="lbl">家長 / 監護人手寫簽名</div>
    <canvas id="sigpad" style="width:100%;height:160px;border:1.5px dashed var(--line);border-radius:10px;background:#fff;touch-action:none;display:block;margin-top:6px"></canvas>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><span class="mut">請用手指或滑鼠喺上面簽名，作正式報名確認之用</span><button type="button" style="border:1px solid var(--line);background:#eef2f5;color:var(--ink);font-size:13px;padding:4px 12px;border-radius:8px;cursor:pointer" onclick="clearSig()">清除重簽</button></div>
    <button class="btn" id="go" onclick="submitPay()">確認並提交付款</button>
    <div class="msg" id="msg"></div>
  </div>`;
  setupSigPad();
}
/* 手寫簽名板（同 is-enroll 一致）：滑鼠＋觸控；toDataURL PNG 傳後端存證 */
let _sig={draw:false,has:false,ctx:null,cv:null,w:0,h:0};
function setupSigPad(_retry){
  const cv=$('sigpad'); if(!cv) return;
  const rect=cv.getBoundingClientRect(); const ratio=window.devicePixelRatio||1;
  if(rect.width<50){ if(!_retry) requestAnimationFrame(()=>setupSigPad(true)); return; }
  cv.width=Math.round(rect.width*ratio); cv.height=Math.round(rect.height*ratio);
  const ctx=cv.getContext('2d'); ctx.scale(ratio,ratio); ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#0f2233';
  _sig={draw:false,has:false,ctx,cv,w:rect.width,h:rect.height};
  const pos=e=>{ const r=cv.getBoundingClientRect(); const t=(e.touches&&e.touches[0])?e.touches[0]:e; return {x:t.clientX-r.left,y:t.clientY-r.top}; };
  const start=e=>{ e.preventDefault(); _sig.draw=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); };
  const move=e=>{ if(!_sig.draw) return; e.preventDefault(); const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); _sig.has=true; };
  const end=()=>{ _sig.draw=false; };
  cv.addEventListener('mousedown',start); cv.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
  cv.addEventListener('touchstart',start,{passive:false}); cv.addEventListener('touchmove',move,{passive:false}); cv.addEventListener('touchend',end);
}
function clearSig(){ if(_sig.ctx&&_sig.cv) _sig.ctx.clearRect(0,0,_sig.cv.width,_sig.cv.height); _sig.has=false; }
function sigDataUrl(){ return (_sig.has&&_sig.cv)?_sig.cv.toDataURL('image/png'):''; }
function onFile(inp){ const f=inp.files&&inp.files[0]; const st=$('fst'); if(!f){PAYIMG='';return;} st.textContent='處理中…'; shrink(f,(d,e)=>{ if(e){st.textContent=e;st.className='mut';PAYIMG='';return;} PAYIMG=d; st.textContent='已揀：'+f.name; st.style.color='var(--green)'; }); }
async function submitPay(){
  const msg=$('msg'); msg.className='msg';
  if(!PAYIMG){ msg.textContent='請先上載付款截圖'; msg.className='msg err'; return; }
  if(!$('agree').checked){ msg.textContent='請閱讀並勾選同意條款'; msg.className='msg err'; return; }
  const signEn=$('signEn').value.trim(); if(!signEn){ msg.textContent='請填家長英文全名'; msg.className='msg err'; return; }
  const sig=sigDataUrl(); if(!sig){ msg.textContent='請喺簽名格簽名'; msg.className='msg err'; $('sigpad').scrollIntoView({block:'center'}); return; }
  const go=$('go'); go.disabled=true; go.textContent='提交中…';
  let r; try{ r=await apiPost({action:'enrollCompletePayment', id:ID, t:TOK, agree:1, signEn:signEn, signId:$('signId').value.trim(), signImg:sig, payImg:PAYIMG}); }catch(e){ r=null; }
  if(!r||!r.ok){ go.disabled=false; go.textContent='確認並提交付款'; msg.textContent=(r&&r.err)||'提交失敗，請再試一次'; msg.className='msg err'; return; }
  $('app').innerHTML=`<div class="card big-ok"><div class="ic">✅</div><h2 style="margin:10px 0 6px">已收到你的付款截圖！</h2><p>多謝 ${esc(r.name||'')} 家長。我們核實付款後會發出確認電郵，報名即告完成。</p><p class="mut">如課程最終未能開班，已繳學費將全數退還。</p></div>`;
}
(async function(){
  if(!ID||!TOK){ $('app').innerHTML='<div class="card center err msg">連結不完整，請用我們提供的完整連結開啟。</div>'; return; }
  let r; try{ r=await apiGet({action:'enrollRecordInfo', id:ID, t:TOK}); }catch(e){ r=null; }
  if(!r){ $('app').innerHTML='<div class="card center msg err">系統暫時繁忙（正在喚醒），請等約 10 秒後重新整理此頁再試。如持續無法開啟，請 WhatsApp 6331 7403。</div>'; return; }
  if(!r.ok){ $('app').innerHTML=`<div class="card center msg err">${esc(r.err||'連結無效或已失效，請聯絡我們。')}</div>`; return; }
  if(r.alreadyPaid){ $('app').innerHTML=`<div class="card big-ok"><div class="ic">✅</div><h2 style="margin:10px 0 6px">你已完成付款</h2><p>我們已收到 ${esc(r.name)} 的付款截圖，核實後會發確認電郵。多謝支持！</p></div>`; return; }
  INFO=r; render();
})();
</script>
</body>
</html>
